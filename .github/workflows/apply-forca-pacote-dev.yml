name: Aplicar coluna forca_pacote (DEV)

# Cria a coluna produtos.forca_pacote na BD do ambiente desenvolvimento
# e marca o Fino 1000 como "só em lotes de 3 copos".
#
# Usa o secret DATABASE_URL_DEV_ADMIN (role com permissão de DDL).
# Se não estiver definido, cai em DATABASE_URL_DEV (pode falhar com
# "must be owner" — se isso acontecer, define DATABASE_URL_DEV_ADMIN
# como descrito em sync-db-prod-to-dev.yml).

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Escolher BD (admin > app)
        run: |
          if [ -n "${{ secrets.DATABASE_URL_DEV_ADMIN }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_DEV_ADMIN }}" >> $GITHUB_ENV
            echo "Using DATABASE_URL_DEV_ADMIN"
          elif [ -n "${{ secrets.DATABASE_URL_DEV }}" ]; then
            echo "DATABASE_URL=${{ secrets.DATABASE_URL_DEV }}" >> $GITHUB_ENV
            echo "Using DATABASE_URL_DEV (pode falhar se não for owner)"
          else
            echo "::error::Nem DATABASE_URL_DEV_ADMIN nem DATABASE_URL_DEV definidos."
            exit 1
          fi

      - name: Instalar psql
        run: sudo apt-get install -y -qq postgresql-client

      - name: Aplicar coluna e marcar Fino 1000
        env:
          PGSSLMODE: require
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE produtos ADD COLUMN IF NOT EXISTS forca_pacote BOOLEAN NOT NULL DEFAULT FALSE;
          UPDATE produtos SET forca_pacote = TRUE WHERE nome ILIKE 'Fino 1000%' AND qtd_copos_pacote >= 2;
          SELECT 'Resultado:' AS info;
          SELECT nome, qtd_copos_pacote, forca_pacote
            FROM produtos
            WHERE nome ILIKE 'Fino%'
            ORDER BY nome;
          SELECT 'Coluna criada e Fino 1000 actualizado.' AS info;
          SQL
