# Actualiza o schema da BD de PRODUÇÃO para o que o código novo precisa,
# SEM partir o código antigo que ainda está no ar. Duas fases:
#
#   FASE 1 (aditiva) — supabase/reparar_schema_aditivo.sql
#     Só ADD COLUMN/CREATE IF NOT EXISTS com defaults. Segura com o código
#     ANTIGO em produção. É isto que faz o ambiente qualidade (código novo,
#     BD prod) deixar de tropeçar em «column … does not exist».
#
#   FASE 2 (constraints) — supabase/reparar_schema_constraints.sql
#     Troca as unicidades antigas pelas versões por loja. O código antigo
#     usa ON CONFLICT nessas constraints — correr a fase 2 com o código
#     antigo no ar PARTE produção. Só activar «trocar_constraints» DEPOIS
#     de o código novo estar em main/produção.
#
# Ordem recomendada: fase 1 → promover develop→qualidade→main → fase 2.
#
# Idempotente: pode correr-se as vezes que forem precisas.
# Pré-requisito: secret DATABASE_URL_PROD_ADMIN (connection string admin da
# BD de produção). SEM fallback em texto simples — se faltar, o workflow pára.

name: Reparar schema produção

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escreve PRODUCAO para confirmar que sabes que isto altera a BD de produção'
        required: true
        type: string
      trocar_constraints:
        description: 'FASE 2: trocar constraints (SÓ depois do código novo estar em main)'
        required: false
        type: boolean
        default: false

jobs:
  fix:
    name: DDL idempotente em produção
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "PRODUCAO" ]; then
            echo "::error::Confirmação errada. Escreve exactamente PRODUCAO no campo de confirmação."
            exit 1
          fi

      - name: Validar secret
        env:
          DATABASE_URL_PROD_ADMIN: ${{ secrets.DATABASE_URL_PROD_ADMIN }}
        run: |
          if [ -z "${DATABASE_URL_PROD_ADMIN}" ]; then
            echo "::error::Secret DATABASE_URL_PROD_ADMIN em falta. Cria-o em Settings → Secrets com a connection string ADMIN da BD de produção (aproveita para rodar a password antiga, que esteve exposta em texto simples)."
            exit 1
          fi

      - name: Instalar cliente PostgreSQL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - uses: actions/checkout@v4

      - name: 'FASE 1: DDL aditivo (seguro com código antigo)'
        env:
          DATABASE_URL_PROD_ADMIN: ${{ secrets.DATABASE_URL_PROD_ADMIN }}
        run: |
          set -euo pipefail
          eval "$(python3 scripts/ci/pg_env_from_url.py "$DATABASE_URL_PROD_ADMIN")"
          # Sem ON_ERROR_STOP: cada statement é independente.
          psql -f supabase/reparar_schema_aditivo.sql

      - name: 'FASE 2: troca de constraints (só com código novo em main)'
        if: ${{ github.event.inputs.trocar_constraints == 'true' }}
        env:
          DATABASE_URL_PROD_ADMIN: ${{ secrets.DATABASE_URL_PROD_ADMIN }}
        run: |
          set -euo pipefail
          eval "$(python3 scripts/ci/pg_env_from_url.py "$DATABASE_URL_PROD_ADMIN")"
          psql -f supabase/reparar_schema_constraints.sql

      - name: Validar colunas críticas
        env:
          DATABASE_URL_PROD_ADMIN: ${{ secrets.DATABASE_URL_PROD_ADMIN }}
        run: |
          set -euo pipefail
          eval "$(python3 scripts/ci/pg_env_from_url.py "$DATABASE_URL_PROD_ADMIN")"
          psql -v ON_ERROR_STOP=1 <<'SQL'
          SELECT
            (SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema='public' AND table_name='turnos'
                AND column_name='loja_id') AS turnos_loja_id,
            (SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema='public' AND table_name='utilizadores'
                AND column_name='empresa_id') AS utilizadores_empresa_id,
            (SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema='public' AND table_name='turno_entradas'
                AND column_name='produto_nome_livre') AS entradas_produto_nome_livre,
            (SELECT COUNT(*) FROM information_schema.tables
              WHERE table_schema='public' AND table_name='ops_idempotencia') AS tabela_ops_idempotencia,
            (SELECT COUNT(*) FROM information_schema.tables
              WHERE table_schema='public' AND table_name='lojas') AS tabela_lojas;
          SQL
          echo "Se alguma contagem acima for 0, vê os ERRORs nos steps anteriores."
