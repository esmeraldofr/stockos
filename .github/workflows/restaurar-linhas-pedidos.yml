# Restaura as LINHAS históricas dos pedidos (turno_pedido_linhas) a partir
# do backup pg_dump guardado como artefacto por um run do «Reparar schema
# produção». Contexto: a 05/08 um auto-reparo defeituoso apagou a tabela em
# produção; os cabeçalhos (turno_pedidos) sobreviveram — só as linhas
# precisam de voltar.
#
# Seguro por desenho:
#  - NÃO apaga nada; só INSERE.
#  - Ignora linhas de pedidos que já tenham linhas (não duplica os pedidos
#    registados depois da recriação da tabela).
#  - Ignora linhas de pedidos inexistentes (FK).
name: Restaurar linhas de pedidos (backup)

on:
  workflow_dispatch:
    inputs:
      confirmar:
        description: 'Escreve PRODUCAO para confirmar'
        required: true
        type: string
      run_id:
        description: 'Run ID do workflow com o artefacto backup-producao'
        required: true
        default: '30955455093'
        type: string

jobs:
  restore:
    name: Restaurar turno_pedido_linhas
    runs-on: ubuntu-latest
    steps:
      - name: Validar confirmação
        run: |
          if [ "${{ github.event.inputs.confirmar }}" != "PRODUCAO" ]; then
            echo "::error::Escreve exactamente PRODUCAO no campo de confirmação."
            exit 1
          fi

      - name: Descarregar artefacto de backup
        uses: actions/download-artifact@v4
        with:
          name: backup-producao
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Instalar cliente PostgreSQL
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null

      - name: Extrair e restaurar linhas
        env:
          DATABASE_URL_PROD_ADMIN: ${{ secrets.DATABASE_URL_PROD_ADMIN || 'postgresql://postgres.dakleqewbwbryuchlrzm:LKB2DWbWbc60fZXh@aws-1-eu-west-1.pooler.supabase.com:5432/postgres' }}
        run: |
          set -euo pipefail
          gunzip -k backup-producao-*.sql.gz
          SQL=$(ls backup-producao-*.sql | head -1)
          # Cabeçalho do COPY: valida a ordem esperada das colunas
          HEADER=$(grep -m1 '^COPY public\.turno_pedido_linhas ' "$SQL")
          echo "COPY encontrado: $HEADER"
          if ! echo "$HEADER" | grep -q '(id, pedido_id, produto_id, quantidade, qtd_devolvida)'; then
            echo "::error::Ordem de colunas inesperada no backup — restauro abortado por segurança. Header: $HEADER"
            exit 1
          fi
          # Extrai só os dados desta tabela (entre o COPY e o \.)
          awk '/^COPY public\.turno_pedido_linhas /{f=1;next} f&&/^\\\.$/{exit} f' "$SQL" > linhas.tsv
          echo "Linhas no backup: $(wc -l < linhas.tsv)"
          psql "$DATABASE_URL_PROD_ADMIN" -v ON_ERROR_STOP=1 << 'PSQL'
          CREATE TEMP TABLE _restauro (id INTEGER, pedido_id INTEGER, produto_id UUID, quantidade NUMERIC, qtd_devolvida NUMERIC);
          \copy _restauro (id, pedido_id, produto_id, quantidade, qtd_devolvida) FROM 'linhas.tsv'
          INSERT INTO turno_pedido_linhas (pedido_id, produto_id, quantidade, qtd_devolvida)
          SELECT r.pedido_id, r.produto_id, r.quantidade, COALESCE(r.qtd_devolvida, 0)
            FROM _restauro r
           WHERE EXISTS (SELECT 1 FROM turno_pedidos p WHERE p.id = r.pedido_id)
             AND NOT EXISTS (SELECT 1 FROM turno_pedido_linhas t WHERE t.pedido_id = r.pedido_id);
          SELECT COUNT(*) AS linhas_totais,
                 COUNT(DISTINCT pedido_id) AS pedidos_com_linhas
            FROM turno_pedido_linhas;
          PSQL
