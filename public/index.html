async function loadIrregularidadesLista() {
  const ini = val('ir-inicio');
  const fim = val('ir-fim');
  show('irreg-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const [produtos, receitas, histRows] = await Promise.all([
      api('GET', '/produtos?todos=0'),
      api('GET', '/receitas'),
      api('GET', `/historico?inicio=${encodeURIComponent(ini)}&fim=${encodeURIComponent(fim)}`)
    ]);
    if (!histRows.length) {
      show('irreg-content', '<div class="alert alert-error">Sem turnos neste período.</div>');
      return;
    }
    const podeVerDepositos = ['admin','gestor','compras'].includes(S.user?.role);
    /** Cache por data para não chamar /depositos vezes seguidas para o mesmo dia. */
    const depositosCacheByDate = new Map();
    async function getDepositoTurno(dataStr, turnoId) {
      if (!podeVerDepositos) return undefined;
      if (!depositosCacheByDate.has(dataStr)) {
        const p = api('GET', `/depositos?data=${encodeURIComponent(dataStr)}`).catch(() => []);
        depositosCacheByDate.set(dataStr, p);
      }
      const list = await depositosCacheByDate.get(dataStr);
      const arr = Array.isArray(list) ? list : [];
      return arr.find((d) => String(d.turno_id) === String(turnoId)) || null;
    }
    const CHUNK = 6;
    const out = [];
    for (let i = 0; i < histRows.length; i += CHUNK) {
      const chunk = histRows.slice(i, i + CHUNK);
      const part = await Promise.all(
        chunk.map(async (r) => {
          const dataStr = String(r.data).slice(0, 10);
          try {
            const [turnos, vendas, depTurno, equipaReal] = await Promise.all([
              api('GET', `/dia?data=${encodeURIComponent(dataStr)}&turno_id=${encodeURIComponent(r.turno_id)}`),
              api('GET', `/turnos/${r.turno_id}/vendas`),
              getDepositoTurno(dataStr, r.turno_id),
              api('GET', `/turnos/${r.turno_id}/equipa-real`).catch(() => [])
            ]);
            const turno = turnos[0];
            if (!turno) return null;
            const snap = computeIrregularidadesSnapshot(turno, vendas, produtos, receitas, depTurno);
            if (!snap.hasAny) return null;
            return { r, dataStr, snap, equipaReal: Array.isArray(equipaReal) ? equipaReal : [] };
          } catch (_) {
            return null;
          }
        })
      );
      out.push(...part.filter(Boolean));
    }
    if (!out.length) {
      show(
        'irreg-content',
        '<div class="card"><p style="color:#94a3b8;margin:0">Nenhuma irregularidade neste período (caixa alinhado, banco/depósito alinhado, stock, Batata, Coxa e Fino dentro dos critérios).</p></div>'
      );
      return;
    }
    // Fetch decisões em bulk
    const turnoIds = out.map(o => o.r.turno_id).join(',');
    const decisoes = await api('GET', `/irregularidades/decisoes?turno_id=${encodeURIComponent(turnoIds)}`).catch(() => []);
    const decisoesPorTurno = {};
    for (const d of (decisoes || [])) {
      if (!decisoesPorTurno[d.turno_id]) decisoesPorTurno[d.turno_id] = {};
      decisoesPorTurno[d.turno_id][d.categoria] = d;
    }
    const html = out
      .map(({ r, dataStr, snap, equipaReal }) => {
        const title = `${turnoLabel(r.nome)} — ${dateLabelWithWeekday(dataStr)}`;
        const tid = String(r.turno_id);
        const nomesEquipa = (equipaReal || [])
          .map((p) => String(p.utilizador_nome || '').trim())
          .filter(Boolean);
        const equipaLine = nomesEquipa.length
          ? `Trabalharam: ${escapeHtml(nomesEquipa.join(', '))}`
          : 'Trabalharam: — (sem registo na aba Escala)';
        const blocos = renderIrregularidadeBlocos(snap, r.turno_id, decisoesPorTurno[r.turno_id] || {});
        return `
      <div class="card" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px">
          <div>
            <div style="font-weight:700;color:#f1f5f9;font-size:15px">⚠️ ${escapeHtml(title)}</div>
            <div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(dataStr)} · ${r.estado === 'fechado' ? 'Fechado' : 'Aberto'}</div>
            <div style="font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.4">${equipaLine}</div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, async () => { await openTurnoFromIrreg('${dataStr}', '${tid}'); })">Abrir turno</button>
        </div>
        <div>${blocos}</div>
      </div>`;
      })
      .join('');
    show('irreg-content', html);
  } catch (e) {
    show('irreg-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}

function firstDayOfMonthIso(d) {
  const x = new Date(d + 'T12:00:00');
  return new Date(x.getFullYear(), x.getMonth(), 1).toISOString().split('T')[0];
}
function lastDayOfMonthIso(d) {
  const x = new Date(d + 'T12:00:00');
  return new Date(x.getFullYear(), x.getMonth() + 1, 0).toISOString().split('T')[0];
}

function currentMonthIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthFromIso(monthStr) {
  const m = String(monthStr || '').match(/^(\d{4})-(\d{2})$/);
  if (!m) return null;
  const ano = parseInt(m[1], 10);
  const mes = parseInt(m[2], 10);
  if (!Number.isFinite(ano) || mes < 1 || mes > 12) return null;
  const first = new Date(ano, mes - 1, 1);
  const last = new Date(ano, mes, 0);
  const fmt = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  return { inicio: fmt(first), fim: fmt(last) };
}
function shiftMonthIso(monthStr, delta) {
  const m = String(monthStr || '').match(/^(\d{4})-(\d{2})$/);
  if (!m) return currentMonthIso();
  const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

async function loadAssiduidade() {
  const mes = val('as-mes') || currentMonthIso();
  const range = monthFromIso(mes);
  if (!range) {
    show('assiduidade-content', '<div class="alert alert-error">Mês inválido.</div>');
    return;
  }
  const ini = range.inicio;
  const fim = range.fim;
  show('assiduidade-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const data = await api('GET', `/assiduidade?inicio=${encodeURIComponent(ini)}&fim=${encodeURIComponent(fim)}`);
    const rows = (data && data.rows) || [];
    if (!rows.length) {
      show('assiduidade-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem dados de utilizadores activos no período.</p></div>');
      return;
    }
    const sumEsp = rows.reduce((s, r) => s + (Number(r.turnos_esperados ?? r.dias_esperados) || 0), 0);
    const sumTrab = rows.reduce((s, r) => s + (Number(r.turnos_trabalhados ?? r.dias_trabalhados) || 0), 0);
    const sumFalt = rows.reduce((s, r) => s + (Number(r.faltas) || 0), 0);
    const sumHE = rows.reduce((s, r) => s + (Number(r.horas_extra) || 0), 0);
    function turnoAbbr(nome) {
      return { manha: 'M', tarde: 'T', noite: 'N' }[nome] || String(nome || '').slice(0, 1).toUpperCase();
    }
    function dataCurta(iso) {
      if (!iso) return '';
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[3] : String(iso);
    }
    /** Abreviatura do dia da semana — convenção do utilizador: Seg=se, Ter=te, Qua=qa, Qui=qu, Sex=se, Sáb=sa, Dom=do. */
    const DOW_ABBR = ['do', 'se', 'te', 'qa', 'qu', 'se', 'sa']; // index = JS getDay()
    function diaSemanaAbbr(iso) {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return '';
      const dt = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
      const idx = dt.getDay();
      return DOW_ABBR[idx] || '';
    }
    function chipsDetalhe(items, cor) {
      const arr = Array.isArray(items) ? items : [];
      if (!arr.length) return '';
      const titulo = arr.map((it) => `${it.data || ''} · ${it.turno || ''}`).join('\n');
      const txt = arr.map((it) => `${dataCurta(it.data)}${turnoAbbr(it.turno)}${diaSemanaAbbr(it.data)}`).join(', ');
      return `<div title="${escapeHtml(titulo)}" style="margin-top:4px;color:${cor.fg};font-size:11px;font-weight:600;line-height:1.35;text-align:right;font-variant-numeric:tabular-nums;word-break:break-word">${escapeHtml(txt)}</div>`;
    }
    const trs = rows.map((r) => {
      const esperados = Number(r.turnos_esperados ?? r.dias_esperados) || 0;
      const esperadosPassados = Number(r.turnos_esperados_passados ?? esperados) || 0;
      const presencas = Number(r.turnos_trabalhados ?? r.dias_trabalhados) || 0;
      const faltas = Number(r.faltas) || 0;
      const horasExtra = Number(r.horas_extra) || 0;
      const baseTaxa = esperadosPassados > 0 ? esperadosPassados : esperados;
      const taxa = baseTaxa > 0
        ? Math.round((Math.min(presencas, baseTaxa) / baseTaxa) * 100)
        : null;
      const taxaTxt = taxa == null ? '—' : `${taxa}%`;
      const taxaCor = taxa == null ? '#64748b' : (taxa >= 95 ? '#4ade80' : taxa >= 80 ? '#fbbf24' : '#f87171');
      const faltasCor = faltas > 0 ? '#f87171' : '#64748b';
      const heCor = horasExtra > 0 ? '#a78bfa' : '#64748b';
      const faltasChips = chipsDetalhe(r.faltas_detalhe, { bg: 'rgba(248,113,113,0.1)', border: 'rgba(248,113,113,0.35)', fg: '#fca5a5' });
      const heChips = chipsDetalhe(r.horas_extra_detalhe, { bg: 'rgba(167,139,250,0.1)', border: 'rgba(167,139,250,0.35)', fg: '#c4b5fd' });
      return `
        <tr>
          <td style="padding:8px 10px;color:#e2e8f0">
            <div style="font-weight:600">${escapeHtml(r.utilizador_nome || 'Sem nome')}</div>
            <div style="font-size:11px;color:#64748b">${escapeHtml(String(r.utilizador_role || '').toUpperCase())}</div>
          </td>
          <td style="padding:8px 10px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums">${esperados}</td>
          <td style="padding:8px 10px;text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums;font-weight:600">${presencas}</td>
          <td style="padding:8px 10px;text-align:right;vertical-align:top">
            <div style="color:${faltasCor};font-variant-numeric:tabular-nums;font-weight:600">${faltas}</div>
            ${faltasChips}
          </td>
          <td style="padding:8px 10px;text-align:right;vertical-align:top">
            <div style="color:${heCor};font-variant-numeric:tabular-nums;font-weight:600">${horasExtra}</div>
            ${heChips}
          </td>
          <td style="padding:8px 10px;text-align:right;color:${taxaCor};font-variant-numeric:tabular-nums;font-weight:700">${taxaTxt}</td>
        </tr>`;
    }).join('');
    show('assiduidade-content', `
      <div class="card" style="margin-bottom:16px">
        <div class="card-title" style="margin-bottom:10px">Totais do período</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">Turnos esperados</div>
            <div style="font-size:22px;font-weight:700;color:#cbd5e1;margin-top:4px">${sumEsp}</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">Trabalhados</div>
            <div style="font-size:22px;font-weight:700;color:#a5b4fc;margin-top:4px">${sumTrab}</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">Faltas</div>
            <div style="font-size:22px;font-weight:700;color:#f87171;margin-top:4px">${sumFalt}</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px">Horas extra</div>
            <div style="font-size:22px;font-weight:700;color:#a78bfa;margin-top:4px">${sumHE}</div>
          </div>
        </div>
        <p style="margin:12px 0 0;font-size:12px;color:#64748b;line-height:1.45">
          <strong style="color:#94a3b8">Esperados</strong>: turnos em que o funcionário estava na escala (do dia ou, na ausência, template). A regra "1 folga por semana" está implícita na escala. <strong style="color:#94a3b8">Trabalhados</strong>: turnos com presença registada. <strong style="color:#94a3b8">Faltas</strong>: turnos passados em que estava escalado e não foi registada presença — <em>turnos de hoje e futuros não são contados</em>. <strong style="color:#94a3b8">Horas extra</strong>: turnos em que trabalhou sem estar escalado, com hora extra aplicada. <strong style="color:#94a3b8">Assiduidade %</strong>: presenças sobre esperados <em>já passados</em>.
        </p>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Funcionário</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Turnos esperados</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Trabalhados</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Faltas</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Horas extra</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Assiduidade</th>
              </tr>
            </thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </div>
    `);
  } catch (e) {
    show('assiduidade-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}

function audMetodoBadge(m) {
  const bg = { GET: '#1e293b', POST: 'rgba(34,197,94,0.16)', PUT: 'rgba(59,130,246,0.16)', DELETE: 'rgba(248,113,113,0.16)' }[m] || '#1e293b';
  const fg = { GET: '#94a3b8', POST: '#4ade80', PUT: '#60a5fa', DELETE: '#f87171' }[m] || '#94a3b8';
  return `<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:${bg};color:${fg};font-size:10px;font-weight:700;letter-spacing:.04em">${escapeHtml(m)}</span>`;
}

function audStatusBadge(status) {
  const s = parseInt(status, 10) || 0;
  let cor = '#64748b';
  if (s >= 200 && s < 300) cor = '#4ade80';
  else if (s >= 400 && s < 500) cor = '#fb923c';
  else if (s >= 500) cor = '#f87171';
  return `<span style="color:${cor};font-weight:700;font-variant-numeric:tabular-nums">${s || '—'}</span>`;
}

function audPayloadResumo(payload) {
  if (!payload) return '';
  let obj = payload;
  if (typeof payload === 'string') {
    try { obj = JSON.parse(payload); } catch (_) { return ''; }
  }
  if (!obj || typeof obj !== 'object') return '';
  const partes = [];
  for (const [k, v] of Object.entries(obj)) {
    if (v == null || v === '') continue;
    if (Array.isArray(v) || typeof v === 'object') {
      partes.push(`${k}=…`);
    } else {
      const txt = String(v);
      partes.push(`${k}=${txt.length > 50 ? txt.slice(0, 50) + '…' : txt}`);
    }
    if (partes.length >= 4) { partes.push('…'); break; }
  }
  return partes.join(' · ');
}

let _audRows = [];

function audApplyFilter() {
  const hideStock = document.getElementById('aud-hide-stock')?.checked;
  const rows = hideStock
    ? _audRows.filter((r) => r.acao !== 'Stock do turno guardado')
    : _audRows;
  if (!rows.length) {
    show('aud-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem registos no período/filtro' + (hideStock && _audRows.length ? ' (tudo oculto pelo filtro activo)' : '') + '.</p></div>');
    return;
  }
  const trs = rows.map((r) => {
    const payloadResumo = audPayloadResumo(r.payload);
    const detalheLinha = [r.descricao, payloadResumo].filter(Boolean).join(' · ');
    return `
      <tr>
        <td style="padding:8px 10px;color:#94a3b8;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top">${escapeHtml(r.quando_local || '')}</td>
        <td style="padding:8px 10px;color:#e2e8f0;vertical-align:top">
          <div style="font-weight:600">${escapeHtml(r.utilizador_nome || '— anónimo —')}</div>
          <div style="font-size:11px;color:#64748b">${escapeHtml(String(r.utilizador_role || '').toUpperCase())}</div>
        </td>
        <td style="padding:8px 10px;vertical-align:top">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${audMetodoBadge(r.metodo)} ${audStatusBadge(r.status)}</div>
          <div style="font-size:13px;color:#cbd5e1;margin-top:3px;font-weight:500">${escapeHtml(r.acao || '')}</div>
          ${detalheLinha ? `<div style="font-size:11px;color:#64748b;margin-top:2px;line-height:1.35">${escapeHtml(detalheLinha)}</div>` : ''}
          <div style="font-size:10px;color:#475569;margin-top:2px;font-family:monospace">${escapeHtml(r.caminho || '')}</div>
        </td>
      </tr>`;
  }).join('');
  const ocultos = _audRows.length - rows.length;
  show('aud-content', `
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px;white-space:nowrap">Quando</th>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Utilizador</th>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Atividade</th>
            </tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
    </div>
    <p style="margin:10px 0 0;font-size:11px;color:#64748b">A mostrar ${rows.length} registo${rows.length !== 1 ? 's' : ''}${ocultos > 0 ? ` (${ocultos} oculto${ocultos !== 1 ? 's' : ''} pelo filtro)` : ''} — até 300 mais recentes do período.</p>
  `);
}

async function loadAuditoria() {
  const ini = val('aud-inicio');
  const fim = val('aud-fim');
  const horaIni = val('aud-hora-inicio');
  const horaFim = val('aud-hora-fim');
  const q = val('aud-q').trim();
  show('aud-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const params = [];
    if (ini) params.push(`inicio=${encodeURIComponent(ini)}`);
    if (horaIni) params.push(`hora_inicio=${encodeURIComponent(horaIni)}`);
    if (fim) params.push(`fim=${encodeURIComponent(fim)}`);
    if (horaFim) params.push(`hora_fim=${encodeURIComponent(horaFim)}`);
    if (q) params.push(`acao=${encodeURIComponent(q)}`);
    params.push('limit=300');
    const data = await api('GET', `/auditoria?${params.join('&')}`);
    _audRows = (data && data.rows) || [];
    if (!_audRows.length) {
      show('aud-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem registos no período/filtro.</p></div>');
      return;
    }
    audApplyFilter();
  } catch (e) {
    show('aud-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}

/** Próximo número sugerido para a data de emissão: STK-YYYYMMDD-NNN (NNN = ordem no dia). */
function suggestNumeroFaturaArmazem(dataIso, faturas) {
  const day = String(dataIso || '').slice(0, 10);
  const ymd = day.replace(/-/g, '');
  if (!/^\d{8}$/.test(ymd)) {
    const fb = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    return `STK-${fb}-001`;
  }
  const n = (Array.isArray(faturas) ? faturas.length : 0) + 1;
  return `STK-${ymd}-${String(n).padStart(3, '0')}`;
}

function applyFxNumeroSugerido(dataDia, faturas) {
  const el = document.getElementById('fx-numero');
  if (!el || S.page !== 'armazem') return;
  const diaRef = String(dataDia || S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  const sug = suggestNumeroFaturaArmazem(diaRef, faturas);
  const cur = String(el.value || '').trim();
  if (!cur || /^STK-\d{8}-\d{3}$/i.test(cur)) {
    el.value = sug;
  }
}

const armazemInvSaveTimers = Object.create(null);

function armazemInvInputDelegated(e) {
  const t = e.target;

function armazemInvBlurDelegated(e) {

}

function scheduleArmazemInventarioSave(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  clearTimeout(armazemInvSaveTimers[raw]);
  const statusEl = tr.querySelector('.amz-save-status');
  if (statusEl) {
    statusEl.textContent = '…';
    statusEl.style.color = '#94a3b8';
  }
  armazemInvSaveTimers[raw] = setTimeout(() => {
    delete armazemInvSaveTimers[raw];
    saveArmazemInventarioDiaFromRow(tr);
  }, 550);
}

function flushArmazemInventarioSave(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  if (armazemInvSaveTimers[raw]) {
    clearTimeout(armazemInvSaveTimers[raw]);
    delete armazemInvSaveTimers[raw];
  }
  saveArmazemInventarioDiaFromRow(tr);
}

async function saveArmazemInventarioDiaFromRow(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  let produto_id;
  try {
    produto_id = decodeURIComponent(raw);
  } catch (_) {
    return;
  }
  const dataIso = normalizeIsoDateStr(S.date || new Date().toISOString().split('T')[0]);
  const encEl = tr.querySelector('.amz-inp-enc');
  const deixEl = tr.querySelector('.amz-inp-deix');
  const encRaw = String(encEl?.value ?? '').trim();
  const deixRaw = String(deixEl?.value ?? '').trim();
  const encontrado = encRaw === '' ? 0 : parsePtOrIsoNumberString(encRaw);
  const deixado = deixRaw === '' ? 0 : parsePtOrIsoNumberString(deixRaw);
  if (!Number.isFinite(encontrado) || encontrado < 0) {
    return err('armazem-msg', 'Indica um valor válido em «Encontrado».');
  }
  if (!Number.isFinite(deixado) || deixado < 0) {
    return err('armazem-msg', 'Indica um valor válido em «Deixado».');
  }
  const statusEl = tr.querySelector('.amz-save-status');
  try {
    show('armazem-msg', '');
    await api('PUT', '/armazem/inventario-diario', { data: dataIso, produto_id, encontrado, deixado });
    if (statusEl) {
      statusEl.textContent = '✓';
      statusEl.style.color = '#4ade80';
      setTimeout(() => {
        if (statusEl && statusEl.textContent === '✓') statusEl.textContent = '';
      }, 1600);
    }
  } catch (e) {
    if (statusEl) {
      statusEl.textContent = '!';
      statusEl.style.color = '#f87171';
    }
    err('armazem-msg', e.message);
  }
}

function closeCompraLinhaModal() {
  const el = document.getElementById('compra-linha-modal');
  if (el) el.remove();
}

function openEditCompraLinhaModalById(id) {
  const c = (S.armazemComprasRows || []).find((x) => String(x.id) === String(id));
  if (!c) return;
  openEditCompraLinhaModal(c);
}

function openEditCompraLinhaModal(c) {
  closeCompraLinhaModal();
  const produtos = S.produtos || [];
  const prodOpts = produtos
    .map((p) => `<option value="${p.id}" ${String(p.id) === String(c.produto_id) ? 'selected' : ''}>${escapeHtml(p.nome)}</option>`)
    .join('');

  div.innerHTML = `
    <div class="modal" style="max-width:min(520px,96vw)">
      <div class="modal-header">
        <div class="modal-title">Editar linha de compra</div>
        <button type="button" class="modal-close" id="clm-close" aria-label="Fechar">×</button>
      </div>
      <p style="font-size:12px;color:#94a3b8;margin:-8px 0 12px">Fatura: ${escapeHtml(c.fatura_numero || '—')} · ${c.fatura_id ? 'ligada a fatura' : 'sem fatura'}</p>

        <div class="field"><label>Preço unitário (Kz)</label><input id="clm-preco" type="number" min="0.01" step="any" value="${String(c.preco_unitario ?? '')}"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <div class="field"><label>Nº caixas (opcional)</label><input id="clm-caixas" type="number" min="0" step="any" value="${String(c.caixas ?? '')}"/></div>
        <div class="field"><label>Qtd por caixa (opcional)</label><input id="clm-qtdcaixa" type="number" min="0" step="any" value="${String(c.qtd_por_caixa ?? '')}"/></div>
      </div>
      <div class="field"><label>Fornecedor (linha)</label><input id="clm-forn" type="text" value="${escapeHtml(String(c.fornecedor || ''))}"/></div>
      <div class="field"><label>Notas (opcional)</label><textarea id="clm-notas" rows="2">${escapeHtml(c.notas || '')}</textarea></div>

  });

async function saveEditCompraLinhaFromModal(id) {
  const prod = document.getElementById('clm-prod');
  const qtyIn = document.getElementById('clm-qty');
  const precoIn = document.getElementById('clm-preco');
  const cx = document.getElementById('clm-caixas');
  const qcx = document.getElementById('clm-qtdcaixa');
  const forn = document.getElementById('clm-forn');
  const notas = document.getElementById('clm-notas');
  try {
    const payload = {
      produto_id: prod.value,
      quantidade: parseFloat(qtyIn.value),
      caixas: parseFloat(cx.value) || 0,
      qtd_por_caixa: parseFloat(qcx.value) || 0,
      preco_unitario: parseFloat(precoIn.value),
      fornecedor: (forn && forn.value) || '',
      notas: (notas && notas.value) || ''
    };
    await api('PUT', '/armazem/compras/' + id, payload);
    closeCompraLinhaModal();
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch (e) {
    alert(e.message || String(e));
  }
}

async function deleteCompraLinhaArmazem(ev, id) {
  if (!confirm('Remover esta linha de compra? O inventário será recalculado.')) return;
  await runAction(ev, async () => {
    try {
      const r = await api('DELETE', '/armazem/compras/' + id);
      if (r.fatura_deleted) alert('Última linha removida: o cabeçalho da fatura foi também removido.');
      await refreshArmazemFundos();
      await loadArmazemData();
    } catch (e) {
      alert(e.message || String(e));
    }
  });
}

async function refreshArmazemFundos() {
  const banner = document.getElementById('armazem-fundos-banner');
  const list = document.getElementById('armazem-libertacoes-list');
  const data = String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  try {
    const [saldoInfo, saidas] = await Promise.all([
      api('GET', '/armazem/saldo?data=' + encodeURIComponent(data)),
      api('GET', '/armazem/saidas-dia?data=' + encodeURIComponent(data))
    ]);
    S.armazemSaldoDia = parseFloat(saldoInfo.saldo) || 0;
    if (banner) {
      banner.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-bottom:8px">
        <span style="color:#94a3b8">Libertado: <strong style="color:#e2e8f0">${fmt(saldoInfo.total_libertacoes)}</strong></span>
        <span style="color:#94a3b8">Faturas (dia): <strong style="color:#e2e8f0">${fmt(saldoInfo.total_faturas)}</strong></span>
        <span style="color:#94a3b8">Saldo disponível: <strong style="color:${S.armazemSaldoDia >= 0 ? '#4ade80' : '#f87171'}">${fmt(saldoInfo.saldo)}</strong></span>
      </div>`;
    }
    if (list) {
      const rows = saldoInfo.libertacoes || [];
      if (!rows.length) {
        list.innerHTML = '<div style="font-size:12px;color:#64748b">Sem libertações neste dia.</div>';
      } else {
        list.innerHTML = `<div class="table-wrap"><table style="font-size:12px">
          <thead><tr><th>Valor</th><th>Notas</th><th></th></tr></thead>
          <tbody>${rows.map(l => `<tr>
            <td style="color:#fbbf24">${fmt(l.valor)}</td>
            <td>${l.notas || '—'}</td>
            <td><button type="button" class="btn btn-ghost btn-sm" onclick="deleteLibertacaoArmazem(event, ${l.id})">Remover</button></td>
          </tr>`).join('')}</tbody></table></div>`;
      }
    }
    const sel = document.getElementById('fx-turno-saida');
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = '<option value="">— Nenhuma / outra origem —</option>' +
        (saidas || []).map(s => `<option value="${s.id}">${fmt(s.valor)} — ${turnoLabel(s.turno_nome)} — ${(s.descricao || '').slice(0, 40)}</option>`).join('');
      if (cur && sel.querySelector(`option[value="${cur}"]`)) sel.value = cur;
    }
    updateFaturaExcessoUI();
  } catch (e) {
    if (banner) banner.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    S.armazemSaldoDia = 0;
    updateFaturaExcessoUI();
  }
}

async function submitLibertacaoArmazem() {
  const data = String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  const valor = parseFloat(document.getElementById('lib-valor')?.value);
  const notas = val('lib-notas');
  if (!valor || valor <= 0) {
    show('armazem-msg', '<div class="alert alert-error">Indica um valor positivo para a libertação.</div>');
    return;
  }
  try {
    await api('POST', '/armazem/libertacoes', { data, valor, notas });
    document.getElementById('lib-valor').value = '';
    document.getElementById('lib-notas').value = '';
    show('armazem-msg', '');
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch (e) {
    show('armazem-msg', `<div class="alert alert-error">${e.message}</div>`);
  }
}

async function deleteLibertacaoArmazem(ev, id) {
  if (!confirm('Remover esta libertação?')) return;
  await runAction(ev, async () => {
    try {
      await api('DELETE', '/armazem/libertacoes/' + id);
      await refreshArmazemFundos();
      await loadArmazemData();
    } catch (e) {
      show('armazem-msg', `<div class="alert alert-error">${e.message}</div>`);
    }
  });
}

function computeFaturaTotalEstimado() {
  let sum = 0;
  document.querySelectorAll('#fatura-linhas-body .fatura-linha').forEach(line => {
    const sel = line.querySelector('.af-prod');
    if (!sel || !sel.value) return;
    const caixasNum = parseFloat(line.querySelector('.af-caixas')?.value) || 0;
    const qtdPor = parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0;
    const qtyRaw = parseFloat(line.querySelector('.af-qty')?.value);
    const qty = (caixasNum > 0 && qtdPor > 0) ? (caixasNum * qtdPor) : qtyRaw;
    const pu = parseFloat(line.querySelector('.af-preco')?.value);
    if (qty > 0 && pu > 0) sum += qty * pu;
  });
  return sum;
}

function updateFaturaExcessoUI() {
  const wrap = document.getElementById('fx-excesso-wrap');
  if (!wrap) return;
  const t = computeFaturaTotalEstimado();
  const saldo = S.armazemSaldoDia != null ? S.armazemSaldoDia : 0;
  if (t > saldo + 0.01) {
    wrap.style.display = '';
  } else {
    wrap.style.display = 'none';
    const j = document.getElementById('fx-justificacao');
    const s = document.getElementById('fx-turno-saida');
    if (j) j.value = '';
    if (s) s.value = '';
  }
}

function renderArmazemProdutoOptions(sel, selectedValue, term, includeNovo) {
  const showNovo = includeNovo !== false;
  const q = (term || '').trim().toLowerCase();
  const filtrados = (S.produtos || []).filter(p => p.ativo && (!q || String(p.nome || '').toLowerCase().includes(q)));
  sel.innerHTML = '<option value="">— Seleciona —</option>' + (showNovo ? '<option value="__novo__">+ Novo produto</option>' : '') +
    filtrados.map(p => `<option value="${p.id}" data-medicao="${p.tipo_medicao || 'unidade'}">${p.nome} (${medicaoSigla(p.tipo_medicao)})</option>`).join('');
  if (selectedValue && sel.querySelector(`option[value="${selectedValue}"]`)) sel.value = selectedValue;
}

function bindArmazemProdutoFilterOnLine(sel, indicatorEl) {
  if (!sel || sel.dataset.filterBinded) return;
  sel.dataset.filterBinded = '1';
  const updateInd = () => {
    if (!indicatorEl) return;
    const q = sel._filterBuf || '';
    indicatorEl.textContent = q ? `Filtro: ${q}` : 'Filtro vazio (digita para procurar, Esc limpa)';
  };
  sel._filterBuf = '';
  updateInd();
  sel.addEventListener('keydown', function(e) {
    const key = e.key || '';
    if (key === 'Escape') {
      sel._filterBuf = '';
      renderArmazemProdutoOptions(sel, sel.value || '', '', true);
      toggleFaturaLinhaNovo(sel);
      updateInd();
      return;
    }
    if (key === 'Backspace') {
      e.preventDefault();
      sel._filterBuf = (sel._filterBuf || '').slice(0, -1);
      renderArmazemProdutoOptions(sel, '', sel._filterBuf, true);
      toggleFaturaLinhaNovo(sel);
      updateInd();
      return;
    }
    if (key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      sel._filterBuf = (sel._filterBuf || '') + key;
      renderArmazemProdutoOptions(sel, '', sel._filterBuf, true);
      if (sel.options.length > 0) sel.selectedIndex = 0;
      toggleFaturaLinhaNovo(sel);
      updateInd();
    }
  });
  sel.addEventListener('blur', function() {
    sel._filterBuf = '';
    renderArmazemProdutoOptions(sel, sel.value || '', '', true);
    toggleFaturaLinhaNovo(sel);
    updateInd();
  });
}

function toggleFaturaLinhaNovo(sel) {
  const line = sel.closest('.fatura-linha');
  if (!line) return;
  const wrap = line.querySelector('.af-novo-wrap');
  const qty = line.querySelector('.af-qty');
  if (!wrap || !qty) return;
  const isNovo = sel.value === '__novo__';
  wrap.style.display = isNovo ? '' : 'none';
  const med = isNovo
    ? (line.querySelector('.af-medicao')?.value || 'unidade')
    : (sel.options[sel.selectedIndex]?.getAttribute('data-medicao') || 'unidade');
  qty.placeholder = `Qtd (${medicaoSigla(med)})`;
  const medSel = line.querySelector('.af-medicao');
  if (medSel && !medSel.dataset.binded) {
    medSel.dataset.binded = '1';
    medSel.addEventListener('change', () => toggleFaturaLinhaNovo(sel));
  }
}

function toggleFaturaLinhaCaixa(chk) {
  const line = chk.closest('.fatura-linha');
  if (!line) return;
  const fields = line.querySelector('.af-caixa-fields');
  const precoCaixaWrap = line.querySelector('.af-caixa-preco-wrap');
  const qty = line.querySelector('.af-qty');
  const precoUnit = line.querySelector('.af-preco');
  const on = !!chk.checked;
  if (fields) fields.style.display = on ? 'grid' : 'none';
  if (precoCaixaWrap) precoCaixaWrap.style.display = on ? '' : 'none';
  if (qty) qty.disabled = on;
  if (precoUnit) precoUnit.readOnly = on;
  if (on && qty) qty.value = '';
  if (!on && precoUnit) precoUnit.value = '';
  syncFaturaLinhaPrecoUnit(line);
}

function syncFaturaLinhaPrecoUnit(line) {
  const check = line.querySelector('.af-modo-caixa');
  const precoUnit = line.querySelector('.af-preco');
  if (!check || !precoUnit || !check.checked) return;
  const precoCaixa = parseFloat(line.querySelector('.af-preco-caixa')?.value) || 0;
  const qtdPorCaixa = parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0;
  if (precoCaixa > 0 && qtdPorCaixa > 0) {
    precoUnit.value = (precoCaixa / qtdPorCaixa).toFixed(2);
  } else {
    precoUnit.value = '';
  }
}

function bindFaturaLinhaCaixaInputs(line) {
  ['af-preco-caixa', 'af-qtd-caixa', 'af-caixas'].forEach(cls => {
    const el = line.querySelector('.' + cls);
    if (!el || el.dataset.binded) return;
    el.dataset.binded = '1';
    el.addEventListener('input', () => { syncFaturaLinhaPrecoUnit(line); updateFaturaExcessoUI(); });
  });
}

function initFaturaLinha(line) {
  const sel = line.querySelector('.af-prod');
  const ind = line.querySelector('.af-prod-filter-indicator');
  if (sel) {
    renderArmazemProdutoOptions(sel, '', '', true);
    bindArmazemProdutoFilterOnLine(sel, ind);
    sel.addEventListener('change', () => { toggleFaturaLinhaNovo(sel); updateFaturaExcessoUI(); });
    toggleFaturaLinhaNovo(sel);
  }
  bindFaturaLinhaCaixaInputs(line);
  updateFaturaExcessoUI();
}

function removeFaturaLinha(btn) {
  const line = btn.closest('.fatura-linha');
  if (line) line.remove();
}

function addFaturaLinha() {
  const wrap = document.getElementById('fatura-linhas-body');

async function submitFaturaArmazem() {
  const msg = document.getElementById('fatura-form-msg');
  const linhas = [];
  try {
    document.querySelectorAll('#fatura-linhas-body .fatura-linha').forEach(line => {
      const sel = line.querySelector('.af-prod');
      if (!sel || !sel.value) return;
      const payload = {
        quantidade: parseFloat(line.querySelector('.af-qty')?.value),
        caixas: parseFloat(line.querySelector('.af-caixas')?.value) || 0,
        qtd_por_caixa: parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0,
        preco_unitario: parseFloat(line.querySelector('.af-preco')?.value),
        notas: ''
      };
      if (sel.value === '__novo__') {
        payload.novo_produto = {
          nome: (line.querySelector('.af-nome')?.value || '').trim(),
          categoria: line.querySelector('.af-categoria')?.value || 'outro',
          tipo_medicao: line.querySelector('.af-medicao')?.value || 'unidade',
          preco: parseFloat(line.querySelector('.af-preco-venda')?.value) || 0
        };
        if (!payload.novo_produto.nome) throw new Error('Numa linha com «Novo produto», o nome é obrigatório.');
      } else {
        payload.produto_id = sel.value;
      }
      const caixasNum = payload.caixas;
      const qtdPor = payload.qtd_por_caixa;
      const qtyEff = (caixasNum > 0 && qtdPor > 0) ? (caixasNum * qtdPor) : payload.quantidade;
      const pu = payload.preco_unitario;
      if (!qtyEff || qtyEff <= 0 || !pu || pu <= 0) {
        throw new Error('Em cada linha com produto seleccionado, indique quantidade (ou caixas) e preço unitário válidos.');
      }
      linhas.push(payload);
    });
    if (!linhas.length) {
      if (msg) msg.innerHTML = '<div class="alert alert-error">Adicione pelo menos uma linha com produto, quantidade e preço.</div>';
      return;
    }
  } catch (err) {
    if (msg) msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    return;
  }
  try {
    const fotoInp = document.getElementById('fx-foto-fatura');
    if (!fotoInp || !fotoInp.files || !fotoInp.files[0]) {
      if (msg) msg.innerHTML = '<div class="alert alert-error">Anexa a foto da fatura (JPEG, PNG ou WebP).</div>';
      return;
    }
    const fotoB64 = await fileToDataUrl(fotoInp.files[0]);
    const totalEst = computeFaturaTotalEstimado();
    const saldo = S.armazemSaldoDia != null ? S.armazemSaldoDia : 0;
    const selF = document.getElementById('fx-fornecedor-id');
    const vForn = selF ? selF.value : '';
    let fornecedor_id = '';
    let fornecedorTxt = '';
    if (vForn === 'livre') {
      fornecedorTxt = val('fx-fornecedor-livre');
    } else if (vForn && /^\d+$/.test(vForn)) {
      fornecedor_id = vForn;
    }
    const payload = {
      numero_fatura: val('fx-numero'),
      fornecedor: fornecedorTxt,
      data_emissao: String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10),
      notas: val('fx-notas'),
      linhas,
      foto_fatura_base64: fotoB64
    };
    if (fornecedor_id) payload.fornecedor_id = fornecedor_id;
    if (!fornecedor_id && fornecedorTxt) {
      const ocrNif = val('fx-ocr-fornecedor-nif');
      const ocrTel = val('fx-ocr-fornecedor-tel');
      const ocrEmail = val('fx-ocr-fornecedor-email');
      const ocrMorada = val('fx-ocr-fornecedor-morada');
      if (ocrNif || ocrTel || ocrEmail || ocrMorada) {
        payload.novo_fornecedor = { nome: fornecedorTxt, nif: ocrNif, telefone: ocrTel, email: ocrEmail, morada: ocrMorada };
      }
    }
    if (totalEst > saldo + 0.01) {
      payload.justificacao_excesso = val('fx-justificacao');
      const ts = val('fx-turno-saida');
      if (ts) payload.turno_saida_id = parseInt(ts, 10);
    }
    await api('POST', '/armazem/faturas', payload);
    if (msg) msg.innerHTML = '<div class="alert alert-success">Fatura registada com sucesso.</div>';
    document.getElementById('fx-numero').value = '';
    const selR = document.getElementById('fx-fornecedor-id');
    if (selR) selR.value = '';
    const livR = document.getElementById('fx-fornecedor-livre');
    if (livR) {
      livR.value = '';
      livR.style.display = 'none';
    }
    ['fx-ocr-fornecedor-nif','fx-ocr-fornecedor-tel','fx-ocr-fornecedor-email','fx-ocr-fornecedor-morada'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    const ocrWrap = document.getElementById('fx-ocr-contacto-wrap');
    if (ocrWrap) ocrWrap.style.display = 'none';
    document.getElementById('fx-notas').value = '';
    const jf = document.getElementById('fx-justificacao');
    if (jf) jf.value = '';
    const ts = document.getElementById('fx-turno-saida');
    if (ts) ts.value = '';
    document.getElementById('fatura-linhas-body').innerHTML = '';
    addFaturaLinha();
    if (fotoInp) fotoInp.value = '';
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch(e) {
    if (msg) msg.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

async function resizeImageForOcr(file, maxDim = 1800, quality = 0.85) {
  const dataUrl = await fileToDataUrl(file);
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = dataUrl;
  });
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

async function analisarOcrFatura() {
  const inp = document.getElementById('ocr-fatura-file');
  const msg = document.getElementById('ocr-fatura-msg');
  const btn = document.getElementById('ocr-fatura-btn');
  if (!inp || !inp.files || !inp.files[0]) { if (msg) msg.textContent = 'Escolhe uma imagem.'; return; }
  if (btn) btn.disabled = true;
  if (msg) msg.textContent = '⏳ A processar fatura…';
  try {
    const provider = document.querySelector('input[name="ocr-metodo"]:checked')?.value || 'claude';
    const b64 = await resizeImageForOcr(inp.files[0]);
    const data = await api('POST', '/armazem/ocr-fatura', { foto_base64: b64, provider });
    // Transferir a foto carregada para o input «Foto da fatura» — fica anexada quando o utilizador gravar.
    try {
      const fxFoto = document.getElementById('fx-foto-fatura');
      if (fxFoto && typeof DataTransfer !== 'undefined') {
        const dt = new DataTransfer();
        dt.items.add(inp.files[0]);
        fxFoto.files = dt.files;
      }
    } catch (_) { /* navegadores antigos: utilizador anexa manualmente */ }
    aplicarOcrAoFormulario(data);
    fecharOcrFatura();
    const fMsg = document.getElementById('fatura-form-msg');
    const avisos = (data.linhas || []).filter(l => l.aviso).length;
    const novosForn = data.fornecedor && !data.fornecedor.match ? 1 : 0;
    const novosProd = (data.linhas || []).filter(l => !l.match).length;
    const metodoLabel = provider === 'mindee' ? 'Método B' : 'Método A';
    if (fMsg) {
      fMsg.innerHTML = `<div class="alert alert-success">Fatura analisada (${metodoLabel}). Revê os campos antes de gravar.${
        novosForn ? ' 🆕 Fornecedor novo será criado.' : ''
      }${novosProd ? ` 🆕 ${novosProd} produto(s) novo(s) serão criados.` : ''}${
        avisos ? ` ⚠️ ${avisos} linha(s) com aviso.` : ''
      }</div>`;
    }
  } catch (e) {
    if (msg) msg.textContent = '⚠️ ' + e.message;
    if (btn) btn.disabled = false;
  }
}

function aplicarOcrAoFormulario(data) {
  const f = data.fornecedor || {};
  const selF = document.getElementById('fx-fornecedor-id');
  const livF = document.getElementById('fx-fornecedor-livre');
  const ocrWrap = document.getElementById('fx-ocr-contacto-wrap');
  if (selF) {
    if (f.match && f.match.id) {
      selF.value = String(f.match.id);
      if (livF) { livF.value = ''; livF.style.display = 'none'; }
      if (ocrWrap) ocrWrap.style.display = 'none';
    } else {
      selF.value = 'livre';
      if (livF) { livF.style.display = ''; livF.value = String(f.nome || ''); }
      if (ocrWrap) ocrWrap.style.display = '';
      const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = String(v || ''); };
      set('fx-ocr-fornecedor-nif', f.nif);
      set('fx-ocr-fornecedor-tel', f.telefone);
      set('fx-ocr-fornecedor-email', f.email);
      set('fx-ocr-fornecedor-morada', f.morada);
    }
    selF.dispatchEvent(new Event('change'));
  }
  const num = document.getElementById('fx-numero');
  if (num && data.numero_fatura) num.value = data.numero_fatura;
  const body = document.getElementById('fatura-linhas-body');
  if (body) body.innerHTML = '';
  for (const l of (data.linhas || [])) {
    addFaturaLinha();
    const lastLine = body && body.lastElementChild;
    if (!lastLine) continue;
    const sel = lastLine.querySelector('.af-prod');
    if (l.match && l.match.id && sel) {
      renderArmazemProdutoOptions(sel, String(l.match.id), '', true);
      sel.value = String(l.match.id);
      toggleFaturaLinhaNovo(sel);
    } else if (sel) {
      renderArmazemProdutoOptions(sel, '__novo__', '', true);
      sel.value = '__novo__';
      toggleFaturaLinhaNovo(sel);
      const nomeEl = lastLine.querySelector('.af-nome');
      if (nomeEl) nomeEl.value = String(l.descricao || '');
      const medSel = lastLine.querySelector('.af-medicao');
      if (medSel && l.tipo_medicao_detectado) medSel.value = l.tipo_medicao_detectado;
      const catSel = lastLine.querySelector('.af-categoria');
      if (catSel) catSel.value = 'ingredientes';
    }
    const qtyEl = lastLine.querySelector('.af-qty');
    if (qtyEl && l.quantidade) qtyEl.value = String(l.quantidade);
    const pEl = lastLine.querySelector('.af-preco');
    if (pEl && l.preco_unit) pEl.value = String(l.preco_unit);
    if (l.aviso) {
      const av = document.createElement('div');
      av.style.cssText = 'margin-top:6px;padding:6px 8px;background:#451a03;color:#fb923c;border-radius:6px;font-size:11px';
      av.textContent = '⚠️ ' + l.aviso;
      lastLine.appendChild(av);
    }
  }
  if (typeof updateFaturaExcessoUI === 'function') updateFaturaExcessoUI();
}

function renderProdutos() {

  const todos = S.produtos || [];

    sem_stock: todos.filter(p => p.em_stock_turno === false).length
  };
  let lista = todos;
  if (filtro === 'vendemos') lista = todos.filter(p => p.vendavel);
  else if (filtro === 'ingrediente') lista = todos.filter(p => p.is_ingrediente);
  else if (filtro === 'consumivel') lista = todos.filter(p => !p.vendavel && !p.is_ingrediente);

  const chip = (id, label, count) => `

      ${chip('vendemos','Vendemos', contagem.vendemos)}
      ${chip('ingrediente','Ingredientes', contagem.ingrediente)}
      ${chip('consumivel','Consumíveis', contagem.consumivel)}
      ${chip('sem_stock','Sem stock', contagem.sem_stock)}
    </div>`;

  const menu   = lista.filter(p => p.categoria==='menu');
  const comida = lista.filter(p => p.categoria==='ingredientes');
  const bebida = lista.filter(p => p.categoria==='bebida');
  const outro  = lista.filter(p => !['menu','ingredientes','bebida'].includes(p.categoria));

  function badgesAll(p) {
    const tags = tagsProduto(p);
    return tags.map(t => {
      if (t === 'vendemos') return '<span style="font-size:10px;background:#14532d;color:#86efac;padding:1px 5px;border-radius:4px">vendemos</span>';
      if (t === 'ingrediente') return '<span style="font-size:10px;background:#3f2d01;color:#fcd34d;padding:1px 5px;border-radius:4px">ingrediente</span>';
      return '<span style="font-size:10px;background:#334155;color:#cbd5e1;padding:1px 5px;border-radius:4px">consumível</span>';
    }).join(' ');
  }

  function prodList(items, label) {
    if (!items.length) return '';
    return `
      <div class="card">
        <div class="card-title">${label}</div>
        ${items.map(p => `
          <div class="produto-row">
            <div class="produto-info">
              <div class="produto-nome" style="${!p.ativo?'color:#64748b;text-decoration:line-through':''}">${p.nome} ${badgesAll(p)}${p.venda_avulso ? ' <span style="font-size:10px;background:#1e3a5f;color:#60a5fa;padding:1px 5px;border-radius:4px">avulso</span>' : ''}${p.venda_por_copo && parseFloat(p.kg_por_copo) > 0 ? ' <span style="font-size:10px;background:#14532d;color:#86efac;padding:1px 5px;border-radius:4px">por copo</span>' : ''}${p.em_stock_turno === false ? ' <span style="font-size:10px;background:#422006;color:#fdba74;padding:1px 5px;border-radius:4px">sem stock</span>' : ''}</div>
              <div class="produto-meta">${p.preco > 0 ? fmt(p.preco) : 'Sem preço'} · ${p.tipo_medicao === 'peso' ? 'Peso' : 'Unidade'} · #${p.ordem}</div>
            </div>
            ${isAdmin ? `
            <div class="produto-actions">
              <button class="btn btn-ghost btn-sm" data-edit-id="${p.id}">Editar</button>
            </div>` : ''}
          </div>`).join('')}
      </div>`;
  }

  const corpo = lista.length === 0
    ? '<div class="text-center" style="padding:32px;color:#64748b">Nenhum produto nesta categoria.</div>'
    : prodList(menu,'🍽️ Menu') +
      prodList(comida,'🧂 Ingredientes') +
      prodList(bebida,'🥤 Bebidas') +
      prodList(outro,'📦 Outros');

  show('prod-list', chips + corpo);

  const root = document.getElementById('prod-list');
  root.onclick = function(e) {
    const chipBtn = e.target.closest('[data-filtro]');
    if (chipBtn) { setProdutoFiltro(chipBtn.getAttribute('data-filtro')); return; }
    const btn = e.target.closest('[data-edit-id]');
    if (btn) showProdutoForm(btn.getAttribute('data-edit-id'));
  };
}

    const pl = document.getElementById('p-preco-label');

  function toggleAvulso() {
    const cat = document.getElementById('p-cat').value;

    const cat = document.getElementById('p-cat')?.value;

    if (cat === 'outro') {

        st.checked = false;
        st.disabled = true;

      if (st) st.disabled = false;

      sec.style.display = 'none';

  document.getElementById('p-cat').addEventListener('change', () => {
    toggleAvulso();

  document.getElementById('btn-modal-close').addEventListener('click', closeProdutoModal);

function payloadProdutoCopo() {
  const cat = val('p-cat');
  const copo = cat === 'bebida' && document.getElementById('p-venda-copo')?.checked;
  return {
    venda_por_copo: !!copo,
    kg_por_copo: copo ? parseFloat(val('p-kg-copo')) || 0 : 0,
    preco_copos_pacote: copo ? parseFloat(val('p-preco-pacote')) || 0 : 0,
    qtd_copos_pacote: copo ? parseInt(val('p-qtd-pacote'), 10) || 0 : 0
  };
}

async function createProduto() {
  try {
    await api('POST','/produtos',{
      nome:val('p-nome'),
      preco:parseFloat(val('p-preco'))||0,
      tipo_medicao:val('p-medicao'),
      categoria:val('p-cat'),
      venda_avulso:document.getElementById('p-avulso')?.checked||false,
      vendavel:!!document.getElementById('p-vendavel')?.checked,
      em_stock_turno:!!document.getElementById('p-stock-turno')?.checked,
      ...payloadProdutoCopo()
    });
    closeProdutoModal();
    suc('prod-msg','Produto criado!');
    setTimeout(()=>show('prod-msg',''),2000);
    await loadProdutos();
  } catch(e) { err('prod-form-msg',e.message); }
}

async function saveProduto(id) {
  try {
    const copo = readProdutoCopoFields();
    const med = copo.venda_por_copo && copo.kg_por_copo > 0 ? 'peso' : val('p-medicao');
    const cat = val('p-cat');
    await api('PUT',`/produtos/${id}`,{
      nome: val('p-nome'), preco: parseFloat(val('p-preco'))||0,
      tipo_medicao: med,
      categoria: cat, ordem: parseInt(val('p-ordem'))||0,
      ativo: val('p-ativo')==='true',
      venda_avulso: document.getElementById('p-avulso')?.checked||false,
      vendavel: !!document.getElementById('p-vendavel')?.checked,
      em_stock_turno: !!document.getElementById('p-stock-turno')?.checked,
      ...payloadProdutoCopo()
    });
    closeProdutoModal();
    suc('prod-msg','Produto actualizado!');
    setTimeout(()=>show('prod-msg',''),2000);
    await loadProdutos();
  } catch(e) { err('prod-form-msg',e.message); }
}

async function loadReceita(produtoId) {
  try {
    const [receita, todos] = await Promise.all([
      api('GET', `/receitas/${produtoId}`),
      api('GET', '/produtos?todos=1')
    ]);
    const outros = todos.filter(p => p.id !== produtoId);
    // Preencher select de componentes
    const sel = document.getElementById('r-comp');
    if (sel) {
      sel.innerHTML = outros.map(p =>
        `<option value="${p.id}">${p.nome} (${p.categoria})</option>`
      ).join('');
    }
    // Listar componentes actuais
    const listEl = document.getElementById('receita-list');
    if (!listEl) return;
    if (!receita.length) {
      listEl.innerHTML = '<span style="color:#64748b;font-size:13px">Sem componentes. Adicione abaixo.</span>';
      return;
    }
    listEl.innerHTML = receita.map(r =>
      `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1e293b">
        <span style="font-size:13px">${r.componente_nome}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span style="font-size:13px;color:#94a3b8">×${fmtNum(r.quantidade)}</span>
          <button type="button" class="btn btn-ghost btn-sm" style="color:#ef4444" onclick="runAction(event, () => deleteReceita('${r.id}','${produtoId}'))">✕</button>
        </span>
      </div>`
    ).join('');
  } catch(e) {
    const el = document.getElementById('receita-msg');
    if (el) el.innerHTML = `<span style="color:#ef4444">${e.message}</span>`;
  }
}

async function addReceita(produtoId) {
  const compId = document.getElementById('r-comp')?.value;
  const qty = parseFloat(document.getElementById('r-qty')?.value) || 1;
  if (!compId) { alert('Seleccione um componente primeiro.'); return; }
  try {
    await api('POST', '/receitas', { produto_id: produtoId, componente_id: compId, quantidade: qty });
    await loadReceita(produtoId);
  } catch(e) {
    alert('Erro ao adicionar: ' + e.message);
  }
}

async function deleteReceita(receitaId, produtoId) {
  try {
    await api('DELETE', `/receitas/${receitaId}`);
    await loadReceita(produtoId);
  } catch(e) { alert(e.message); }
}

async function loadFaltasProdutosSelect() {
  try {
    const produtos = S.produtos && S.produtos.length ? S.produtos : (await api('GET', '/produtos'));
    S.produtos = produtos;
    const dl = document.getElementById('falta-produtos-datalist');
    if (!dl) return;
    // O datalist aceita qualquer texto livre; só os <option> alimentam o autocomplete.
    dl.innerHTML = produtos.filter(p => p.ativo)
      .map(p => `<option value="${escapeHtml(p.nome)}" data-id="${p.id}"></option>`).join('');
    const inp = document.getElementById('falta-produto-nome');
    const hint = document.getElementById('falta-produto-hint');
    if (inp && hint) {
      inp.addEventListener('input', () => {
        const v = inp.value.trim();
        if (!v) { hint.textContent = 'Escolhe da lista ou escreve um nome livre se não estiver registado.'; hint.style.color = '#64748b'; return; }
        const match = (S.produtos || []).find(p => p.ativo && String(p.nome).toLowerCase() === v.toLowerCase());
        if (match) { hint.textContent = '✓ Produto encontrado: ' + match.nome; hint.style.color = '#4ade80'; }
        else { hint.textContent = '✏️ Será reportado como nome livre (não existe na lista)'; hint.style.color = '#fbbf24'; }
      });
    }
  } catch (e) { /* ignora — o input fica sem autocomplete mas continua a aceitar texto livre */ }
}

function getMondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00Z');
  const day = d.getUTCDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setUTCDate(d.getUTCDate() + diff);
  return d.toISOString().split('T')[0];
}

const FACEAPI_CDN = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
const MODELS_URL  = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
let faceApiLoaded = false;
let faceApiLoading = false;
let presencaStream = null;
let presencaLoop = null;
let presencaFaceApi = null;
let presencaDescriptors = [];   // [{id, nome, descriptor: Float32Array}]
let presencaLocked = false;     // evita processar frames enquanto animação de confirmação

async function loadFaceApi() {
  if (faceApiLoaded) return presencaFaceApi;
  if (faceApiLoading) { await new Promise(r => setTimeout(r, 200)); return loadFaceApi(); }
  faceApiLoading = true;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = FACEAPI_CDN;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Falha ao carregar face-api.js'));
    document.head.appendChild(s);
  });
  presencaFaceApi = window.faceapi;
  const fa = presencaFaceApi;
  if (fa.tf?.setBackend) await fa.tf.setBackend('webgl').catch(() => fa.tf.setBackend('cpu').catch(() => {}));
  if (fa.tf?.ready) await fa.tf.ready();
  await Promise.all([
    fa.nets.tinyFaceDetector.loadFromUri(MODELS_URL),
    fa.nets.faceLandmark68Net.loadFromUri(MODELS_URL),
    fa.nets.faceRecognitionNet.loadFromUri(MODELS_URL),
  ]);
  faceApiLoaded = true;
  faceApiLoading = false;
  return fa;
}

async function loadPresencaDescriptors() {
  try {
    const data = await fetch('/api/face-descriptors').then(r => r.json());
    presencaDescriptors = data.map(u => {
      const raw = typeof u.descriptor === 'string' ? JSON.parse(u.descriptor) : u.descriptor;
      return { id: u.id, nome: u.nome, descriptor: new Float32Array(raw) };
    });
  } catch(e) { console.warn('[presenca] descritores:', e.message); }
}

async function carregarPerfilAssiduidade(targetUid) {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  const inicio = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const fim = `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  const mesLabel = new Date(y, m, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });
  try {
    const qs = targetUid ? `&utilizador_id=${targetUid}` : '';
    const d = await api('GET', `/me/assiduidade?inicio=${inicio}&fim=${fim}${qs}`);
    const esp = d.turnos_esperados_passados || 0;
    const trab = d.turnos_trabalhados || 0;
    const faltas = d.faltas || 0;
    const taxa = esp > 0 ? Math.round(trab / esp * 100) : (trab > 0 ? 100 : 0);
    const cor = taxa >= 90 ? '#4ade80' : taxa >= 70 ? '#facc15' : '#f87171';
    const falhasHtml = (d.faltas_detalhe || []).slice(0, 5).map(f =>
      `<div style="font-size:12px;color:#94a3b8;padding:2px 0">${f.data} · ${f.turno}</div>`
    ).join('');
    show('perfil-assiduidade', `
      <div class="card">
        <div class="card-title">📊 Assiduidade — ${mesLabel}</div>
        <div style="display:flex;gap:16px;margin-bottom:12px">
          <div style="flex:1;text-align:center">
            <div style="font-size:28px;font-weight:700;color:${cor}">${taxa}%</div>
            <div style="font-size:11px;color:#64748b">Taxa</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-size:22px;font-weight:700;color:#f1f5f9">${trab}/${esp}</div>
            <div style="font-size:11px;color:#64748b">Turnos</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-size:22px;font-weight:700;color:${faltas>0?'#f87171':'#4ade80'}">${faltas}</div>
            <div style="font-size:11px;color:#64748b">Faltas</div>
          </div>
        </div>
        ${faltas > 0 ? `<div style="border-top:1px solid #1e293b;padding-top:8px"><div style="font-size:12px;color:#64748b;margin-bottom:4px">Faltas registadas:</div>${falhasHtml}</div>` : ''}
      </div>`);
  } catch(e) { show('perfil-assiduidade', `<div class="alert alert-error">${e.message}</div>`); }
}

async function carregarPerfilPresencas(targetUid) {
  try {
    const qs = targetUid ? `?utilizador_id=${targetUid}` : '';
    const lista = await api('GET', `/me/presencas${qs}`);
    if (!lista.length) {
      show('perfil-presencas', `<div class="card"><div class="card-title">📷 Presenças Biométricas</div><div style="color:#64748b;font-size:13px;padding:8px 0">Nenhum registo nos últimos 60 dias.</div></div>`);
      return;
    }
    const rows = lista.slice(0, 30).map(p => {
      const dt = new Date(p.criado_em);
      const dataStr = dt.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' });
      const horaStr = dt.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
      const icone = p.tipo === 'entrada' ? '✅' : '🚪';
      const cor = p.tipo === 'entrada' ? '#4ade80' : '#f87171';
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1e293b">
        <div style="font-size:13px;color:#cbd5e1">${icone} <span style="color:${cor};font-weight:600">${p.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span></div>
        <div style="font-size:12px;color:#64748b">${dataStr} ${horaStr}</div>
      </div>`;
    }).join('');
    show('perfil-presencas', `
      <div class="card">
        <div class="card-title">📷 Presenças Biométricas</div>
        ${rows}
      </div>`);
  } catch(e) { show('perfil-presencas', `<div class="alert alert-error">${e.message}</div>`); }
}

  render(`
    <div id="header">
      <div id="header-h1" style="font-size:18px;font-weight:700;color:#f1f5f9">📷 Presença</div>
    </div>
    <div id="content">
      <div id="presenca-screen">
        <div id="presenca-video-wrap">
          <video id="presenca-video" autoplay muted playsinline></video>
          <canvas id="presenca-canvas"></canvas>
        </div>
        <div id="presenca-status">A carregar modelos…</div>
        <div id="presenca-result">
          <div class="p-nome" id="p-nome"></div>
          <div class="p-sub" id="p-sub"></div>
          <div class="presenca-btns">
            <button class="btn-entrada" onclick="registarPresenca('entrada')">✅ Entrada</button>
            <button class="btn-saida"   onclick="registarPresenca('saida')">🚪 Saída</button>

        </div>
        <div id="presenca-confirm"></div>

async function openPresencaModal() {
  render(`
    <div id="presenca-screen" style="min-height:100vh">
      <div style="display:flex;align-items:center;gap:12px;padding:12px 0 4px;width:100%;max-width:400px">
        <button class="btn btn-ghost btn-sm" onclick="draw()">‹ Voltar</button>
        <span style="font-size:17px;font-weight:700;color:#f1f5f9">📷 Presença</span>
      </div>
      <div id="presenca-video-wrap">
        <video id="presenca-video" autoplay muted playsinline></video>
        <canvas id="presenca-canvas"></canvas>
      </div>
      <div id="presenca-status">A carregar modelos…</div>
      <div id="presenca-result">
        <div class="p-nome" id="p-nome"></div>
        <div class="p-sub" id="p-sub"></div>
        <div class="presenca-btns">
          <button class="btn-entrada" onclick="registarPresenca('entrada')">✅ Entrada</button>
          <button class="btn-saida"   onclick="registarPresenca('saida')">🚪 Saída</button>
        </div>
      </div>
      <div id="presenca-confirm"></div>
    </div>
  `);
  iniciarPresencaCamera();
}

async function iniciarPresencaCamera() {
  pararPresencaCamera();
  const statusEl = () => document.getElementById('presenca-status');
  try {
    const fa = await loadFaceApi();
    if (statusEl()) statusEl().textContent = 'A aceder à câmara…';
    presencaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    const video = document.getElementById('presenca-video');
    if (!video) { pararPresencaCamera(); return; }
    video.srcObject = presencaStream;
    await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    const canvas = document.getElementById('presenca-canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    await loadPresencaDescriptors();
    if (statusEl()) statusEl().textContent = presencaDescriptors.length
      ? 'Coloca o rosto em frente à câmara…'
      : '⚠️ Nenhuma face registada. Vai a Admin → Gerir Faces.';
    const opts = new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 });
    presencaLoop = setInterval(async () => {
      const v = document.getElementById('presenca-video');
      if (!v || !presencaDescriptors.length || presencaLocked) return;
      const st = statusEl();
      try {
        const det = await fa.detectSingleFace(v, opts).withFaceLandmarks().withFaceDescriptor();
        if (!det) { if (st) st.textContent = 'Coloca o rosto em frente à câmara…'; return; }
        if (st) st.textContent = '🔍 A identificar…';
        const matcher = new fa.FaceMatcher(
          presencaDescriptors.map(u => new fa.LabeledFaceDescriptors(u.id + '|' + u.nome, [u.descriptor])),
          0.6
        );
        const match = matcher.findBestMatch(det.descriptor);
        if (match.label !== 'unknown') {
          const [uid, nome] = match.label.split('|');
          mostrarResultadoPresenca(uid, nome, match.distance);
        } else {
          if (st) st.textContent = '❓ Rosto não reconhecido';
        }
      } catch(e) { if (st) st.textContent = '⚠️ ' + e.message; }
    }, 900);
  } catch(e) {
    if (statusEl()) statusEl().textContent = '⚠️ Câmara não disponível: ' + e.message;
  }
}

function mostrarResultadoPresenca(uid, nome, distancia) {
  presencaLocked = true;
  clearInterval(presencaLoop);
  const result = document.getElementById('presenca-result');
  const statusEl = document.getElementById('presenca-status');
  if (!result) return;
  document.getElementById('p-nome').textContent = nome;
  document.getElementById('p-sub').textContent = `Reconhecido (${Math.round((1 - distancia) * 100)}% confiança)`;
  result.style.display = 'block';
  if (statusEl) statusEl.textContent = '';
  result._uid = uid;
  result._nome = nome;
}

async function registarPresenca(tipo) {
  const result = document.getElementById('presenca-result');
  if (!result) return;
  const uid = result._uid;
  const nome = result._nome;
  try {
    await fetch('/api/presencas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ utilizador_id: uid, tipo }),
    }).then(r => r.json());
    const label = tipo === 'entrada' ? '✅ Entrada registada' : '🚪 Saída registada';
    const confirm = document.getElementById('presenca-confirm');
    result.style.display = 'none';
    if (confirm) {
      confirm.style.display = 'block';
      confirm.innerHTML = `<div style="font-size:20px;font-weight:700;color:#4ade80">${label}</div>
        <div style="color:#94a3b8;margin-top:4px">${nome}</div>
        <div style="color:#475569;font-size:12px;margin-top:4px">${new Date().toLocaleTimeString('pt-PT')}</div>`;
    }
    setTimeout(() => retomarPresencaCamera(), 3000);
  } catch(e) {
    alert('Erro: ' + e.message);
    retomarPresencaCamera();
  }
}

function retomarPresencaCamera() {
  presencaLocked = false;
  const result = document.getElementById('presenca-result');
  const confirm = document.getElementById('presenca-confirm');
  const statusEl = document.getElementById('presenca-status');
  if (result) result.style.display = 'none';
  if (confirm) { confirm.style.display = 'none'; confirm.innerHTML = ''; }
  if (statusEl) statusEl.textContent = 'Coloca o rosto em frente à câmara…';
  const fa = presencaFaceApi;
  if (!fa || !presencaStream) return;
  const opts = new fa.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  presencaLoop = setInterval(async () => {
    const v = document.getElementById('presenca-video');
    if (!v || !presencaDescriptors.length || presencaLocked) return;
    try {
      const det = await fa.detectSingleFace(v, opts).withFaceLandmarks().withFaceDescriptor();
      if (!det) return;
      const matcher = new fa.FaceMatcher(
        presencaDescriptors.map(u => new fa.LabeledFaceDescriptors(u.id + '|' + u.nome, [u.descriptor]))
      );
      const match = matcher.findBestMatch(det.descriptor);
      if (match.distance < 0.5) mostrarResultadoPresenca(match.label.split('|')[0], match.label.split('|')[1], match.distance);
    } catch(e) { /* silent */ }
  }, 900);
}

function pararPresencaCamera() {
  clearInterval(presencaLoop);
  if (presencaStream) { presencaStream.getTracks().forEach(t => t.stop()); presencaStream = null; }
  presencaLocked = false;
}

// Parar câmara ao navegar para outra página
const _origNavigate = navigate;
window.navigate = async function(page, params) {
  if (page !== 'presenca') pararPresencaCamera();
  return _origNavigate(page, params);
};

// ── FACE BIOMÉTRICA NO PERFIL ────────────────────────────────

function desenharPerfilFace(u) {
  const mount = document.getElementById('perfil-faces-mount');
  if (!mount) return;
  const hasFace = !!u.has_face;
  mount.innerHTML = `
    <div class="card">
      <div class="card-title" style="margin-bottom:12px">🪪 Face Biométrica</div>
      ${u.face_foto_url ? `<img src="${escapeHtml(u.face_foto_url)}" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 12px;border:2px solid #1e3a5f">` : ''}
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="font-size:14px;color:${hasFace ? '#4ade80' : '#94a3b8'}">
          ${hasFace ? '✅ Face registada' : '⬜ Sem face registada'}
        </div>
        <div style="display:flex;gap:8px">
          <button class="btn btn-ghost btn-sm" onclick="enrollFace('${u.id}','${escapeHtml(u.nome)}')">
            ${hasFace ? 'Atualizar' : 'Registar'}
          </button>
          ${hasFace ? `<button class="btn btn-ghost btn-sm" style="color:#f87171" onclick="removeFace('${u.id}')">Remover</button>` : ''}
        </div>
      </div>
    </div>`;
}

let enrollStream = null;
let enrollCapturing = false;

async function enrollFace(uid, nome) {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px';
  modal.innerHTML = `
    <div style="color:#f1f5f9;font-size:18px;font-weight:700">Registar face — ${escapeHtml(nome)}</div>
    <div class="face-enroll-wrap">
      <video id="enroll-video" autoplay muted playsinline></video>
    </div>
    <div id="enroll-status" style="color:#94a3b8;font-size:14px">A carregar câmara…</div>
    <div style="display:flex;gap:12px">
      <button class="btn btn-primary" id="enroll-capture-btn" disabled onclick="captureEnrollFace('${uid}')">📸 Capturar</button>
      <button class="btn btn-ghost" onclick="closeEnrollModal()">Cancelar</button>
    </div>`;
  document.body.appendChild(modal);
  window._enrollModal = modal;
  try {
    const fa = await loadFaceApi();
    enrollStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    const video = document.getElementById('enroll-video');
    video.srcObject = enrollStream;
    await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    document.getElementById('enroll-status').textContent = 'Posiciona o rosto no centro e clica Capturar.';
    document.getElementById('enroll-capture-btn').disabled = false;
  } catch(e) {
    document.getElementById('enroll-status').textContent = 'Erro: ' + e.message;
  }
}

async function captureEnrollFace(uid) {
  if (enrollCapturing) return;
  enrollCapturing = true;
  const statusEl = document.getElementById('enroll-status');
  const btn = document.getElementById('enroll-capture-btn');
  if (btn) btn.disabled = true;
  if (statusEl) statusEl.textContent = 'A processar…';
  try {
    const fa = presencaFaceApi;
    const video = document.getElementById('enroll-video');
    const opts = new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 });
    const det = await fa.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
    if (!det) {
      if (statusEl) statusEl.textContent = '⚠️ Nenhuma face detectada. Ajusta a posição.';
      if (btn) btn.disabled = false;
      enrollCapturing = false;
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const foto_base64 = canvas.toDataURL('image/jpeg', 0.85);
    await api('PUT', `/utilizadores/${uid}/face-descriptor`, { descriptor: Array.from(det.descriptor), foto_base64 });
    if (statusEl) statusEl.textContent = '✅ Face registada com sucesso!';
    setTimeout(() => { closeEnrollModal(); navigate('perfil'); }, 1200);
  } catch(e) {
    if (statusEl) statusEl.textContent = 'Erro: ' + e.message;
    if (btn) btn.disabled = false;
    enrollCapturing = false;
  }
}

async function removeFace(uid) {
  if (!confirm('Remover face registada?')) return;
  try {
    await api('DELETE', `/utilizadores/${uid}/face-descriptor`, null);
    navigate('perfil');
  } catch(e) { alert('Erro: ' + e.message); }
}

function closeEnrollModal() {
  if (enrollStream) { enrollStream.getTracks().forEach(t => t.stop()); enrollStream = null; }
  enrollCapturing = false;
  if (window._enrollModal) { window._enrollModal.remove(); window._enrollModal = null; }
}
