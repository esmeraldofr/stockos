function parseCaixaInputRaw(id) {
  const raw = String(document.getElementById(id)?.value ?? '').trim();
  if (raw === '') return null;
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : null;
}
function parseCaixaTriploFromInputs() {
  const tpa = parseCaixaInputRaw('c-tpa');
  const tr = parseCaixaInputRaw('c-transf');
  const d = parseCaixaInputRaw('c-din');
  if (tpa === null || tr === null || d === null) return NaN;
  return tpa + tr + d;
}
function nomeVendaBebidaLegivel(pid, nomeCatalogo) {
  const raw = String(nomeCatalogo || '').trim();
  const n = raw.replace(/\s*\(copos\)\s*$/i, '').trim();
  const uuidSolo = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  const produtoUuid = /^Produto\s+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if (!n) return 'Bebida';
  if (uuidSolo.test(n)) return 'Bebida';
  if (produtoUuid.test(n)) return 'Bebida';
  if (/^Produto\s+[0-9a-f-]{36}/i.test(n)) return 'Bebida';
  return n;
}
function fmtStockNumberAttr(v) {
  if (v === '' || v === null || v === undefined) return '0';
  const n = typeof v === 'number' && Number.isFinite(v) ? v : parsePtOrIsoNumberString(String(v));
  if (!Number.isFinite(n)) return '0';
  return String(Math.round(n * 1000) / 1000);
}
function stockNumberInputBlur(el) {
  const pid = el.getAttribute('data-stock-pid');
  const field = el.getAttribute('data-stock-field');
  if (!pid || !field) return;
  const raw = String(el.value ?? '').trim();
  if ((field === 'encontrado' || field === 'deixado') && raw === '') {
    el.value = '';
    el.classList.remove('stock-caixa-required-missing');
    updateStock(pid, field, '');
    return;
  }
  let n = parseFloat(raw);
  if (!Number.isFinite(n) || raw === '') n = 0;
  const row = S.turnoData?.stock?.find((s) => prodIdKey(s.produto_id) === prodIdKey(pid));
  const kgBarril = getFinoBarrilRecipienteKgFromRow(row);
  if (S.turnoCanEdit && kgBarril != null && (field === 'encontrado' || field === 'deixado') && n === 0) {
    n = kgBarril;
  }
  if (field === 'encontrado' && row) {
    const prev = row.prev_deixado;
    if (prev !== null && prev !== undefined) {
      const prevNum = parseFloat(prev);
      if (Number.isFinite(prevNum) && Math.abs(n - prevNum) >= 0.001) {
        const nom = String(row.produto_nome || '').trim() || 'Produto';
        const med = medicaoSigla(row.tipo_medicao || 'unidade');
        alert(`Encontrado (${fmtNum(n)} ${med}) é diferente de T. anterior (${fmtNum(prevNum)} ${med}).\n\n${nom}`);
      }
    }
  }
  el.value = String(Math.round(n * 1000) / 1000);
  el.classList.remove('stock-caixa-required-missing');
  updateStock(pid, field, el.value);
}
function caixaInputBlur(el) {
  if (!el || el.disabled) return;
  if (el.getAttribute('data-caixa-req') === '1' && String(el.value).trim() === '') {
    calcCaixa();
    return;
  }
  if (String(el.value).trim() === '') {
    el.value = '0';
    calcCaixa();
  }
}

function parseEncontradoFromRow(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : parseFloat(v);
  return Number.isFinite(n) ? n : null;
}
function fmtStockEncontradoAttr(v) {
  if (v === '' || v === null || v === undefined) return '';
  const n = typeof v === 'number' && Number.isFinite(v) ? v : parsePtOrIsoNumberString(String(v));
  if (!Number.isFinite(n)) return '';
  return String(Math.round(n * 1000) / 1000);
}
function vendidoQtyFromStockParts(enc, ent, dei) {
  const e = enc === null || enc === undefined || enc === '' ? NaN : parseFloat(enc);
  if (!Number.isFinite(e)) return NaN;
  const d = dei === null || dei === undefined || dei === '' ? NaN : parseFloat(dei);
  if (!Number.isFinite(d)) return NaN;
  return Math.max(0, e + (parseFloat(ent) || 0) - d);
}

/** Linha de stock do turno para um produto: `stockBuf` (editável) ou fallback a `S.turnoData.stock`. */
function getStockLineForProduto(pid) {
  const k = prodIdKey(pid);
  if (!k) return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
  if (stockBuf[k] != null) return stockBuf[k];
  const row = (S.turnoData?.stock || []).find(s => prodIdKey(s.produto_id) === k);
  if (row) {
    return {
      encontrado: parseEncontradoFromRow(row.encontrado),
      entrada: parseFloat(row.entrada) || 0,
      deixado: parseEncontradoFromRow(row.deixado),
      fechados: parseFloat(row.fechados) || 0
    };
  }
  return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
}

/** Bebidas por unidade: linhas a partir do stock do turno (API), não só do catálogo /produtos. */
function forEachBebidaUnidadeVendidaLinha(cb) {
  const copo = new Set((bebidaCopoProdIds || []).map((id) => prodIdKey(id)).filter(Boolean));
  for (const s of S.turnoData?.stock || []) {
    if (s.categoria !== 'bebida') continue;
    const pid = prodIdKey(s.produto_id);
    if (!pid) continue;
    if (isFinoBarrilNome(s.produto_nome)) continue;
    if (isFinoBarrilNome(vendasProdNomes[pid])) continue;
    if (copo.has(pid)) continue;
    const b = getStockLineForProduto(pid);
    let vend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    if (!Number.isFinite(vend)) continue;
    if (vend <= 0 && parseFloat(s.vendido) > 0) vend = Math.max(0, parseFloat(s.vendido));
    if (vend <= 0) continue;
    const nome = s.produto_nome || vendasProdNomes[pid] || 'Bebida';
    let unit = parseFloat(s.preco) || 0;
    if (!unit) unit = parseFloat(vendasProdPrecos[pid]) || parseFloat(vendasProdPrecos[s.produto_id]) || 0;
    const valSnap = s.valor != null && s.valor !== '' ? parseFloat(s.valor) : NaN;
    const sub = !Number.isNaN(valSnap) ? valSnap : vend * unit;
    cb({ pid, s, vend, nome, unit, sub });
  }
}

function calcMenuQty(prodId) {
  const recipe = receitasBuf[prodIdKey(prodId)] || [];
  if (!recipe.length) return null;
  let min = Infinity;
  for (const comp of recipe) {
    const b = stockBuf[prodIdKey(comp.componente_id)] || { encontrado: null, entrada: 0, deixado: null };
    const vendido = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    if (!Number.isFinite(vendido)) return null;
    min = Math.min(min, vendido / parseFloat(comp.quantidade));
  }
  return min === Infinity ? 0 : Math.floor(min);
}

function calcStandaloneQty(prodId) {
  const pk = prodIdKey(prodId);
  const b = stockBuf[pk] || { encontrado: null, entrada: 0, deixado: null };
  const total = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
  if (!Number.isFinite(total)) return 0;
  const totalN = Math.max(0, total);
  let comboUsage = 0;
  for (const [menuProdId, recipe] of Object.entries(receitasBuf)) {
    const comp = recipe.find((r) => prodIdKey(r.componente_id) === pk);
    if (comp) comboUsage += (calcMenuQty(menuProdId) || 0) * comp.quantidade;
  }
  return Math.max(0, totalN - comboUsage);
}

function refreshMenuQtys() {
  for (const prodId of menuProdIds) {
    const el = document.getElementById(`venda-qty-${prodId}`);
    if (!el || document.activeElement === el) continue;
    const v = Math.max(0, Math.round((vendasBuf[prodIdKey(prodId)] || 0) * 1000) / 1000);
    if (el.tagName === 'INPUT') el.value = String(v);
    else el.textContent = String(v);
  }
  for (const prodId of bebidaCopoProdIds) {
    const el = document.getElementById(`venda-qty-${prodId}`);
    if (!el || document.activeElement === el) continue;
    const v = Math.max(0, Math.floor(vendasBuf[prodIdKey(prodId)] || 0));
    if (el.tagName === 'INPUT') el.value = String(v);
    else el.textContent = String(v);
  }
  for (const prodId of bebidaCopoProdIds) {
    const el = document.getElementById(`venda-qty-${prodId}`);
    if (el) el.textContent = String(vendasBuf[prodId] || 0);
  }
  for (const prodId of bebidaProdIds) {
    const el = document.getElementById(`venda-qty-${prodId}`);
    const pid = String(prodId);
    const b = getStockLineForProduto(prodId);
    let qty = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    if (!Number.isFinite(qty)) qty = 0;
    else qty = Math.max(0, qty);
    const rowSt = (S.turnoData?.stock || []).find(r => String(r.produto_id) === pid);
    if (qty <= 0 && rowSt && parseFloat(rowSt.vendido) > 0) qty = Math.max(0, parseFloat(rowSt.vendido));
    if (el) el.textContent = fmtNum(qty);
  }
  for (const prodId of avulsoProdIds) {
    const el = document.getElementById(`venda-qty-${prodId}`);
    if (el) el.textContent = fmtNum(calcStandaloneQty(prodId));
  }
  refreshVendasTotal();
}

/** Mesma soma que o «Total Vendas» / resumo (Kz). */
function getTotalVendasTurnoKz() {
  let total = 0;
  for (const prodId of menuProdIds) {
    const k = prodIdKey(prodId);
    total += (vendasBuf[k] || 0) * (vendasProdPrecos[prodId] || 0);
  }
  for (const prodId of avulsoProdIds) {
    total += calcStandaloneQty(prodId) * (vendasProdPrecos[prodId] || 0);
  }
  for (const prodId of bebidaCopoProdIds) {
    const cfg = bebidaCopoCfg[prodId];
    if (!cfg) continue;
    const copos = vendasBuf[prodId] || 0;
    total += precoVendaCopos(copos, cfg.preco, cfg.qtdPacote, cfg.precoPacote);
  }
  forEachBebidaUnidadeVendidaLinha(({ sub }) => {
    total += sub;
  });
  return total;
}

function getTotalGeradoCaixaKz() {
  return parseCaixaTriploFromInputs();
}

function refreshVendasTotal() {
  const total = getTotalVendasTurnoKz();
  const elTot = document.getElementById('vendas-total-geral');
  if (elTot) elTot.textContent = fmt(total);
  renderIrregularidadesTurno();
}

/** Referência fixa: três áreas de responsabilidade em cada turno (UI apenas).

function turnoAreasTrabalhoHtml() {

  <div class="turno-areas-grid">${cells}</div>
</div>`;
}

async function navTurno(dir) {
  const idx = TURNO_ORDER.indexOf(S.turnoData?.nome);
  let nextIdx = idx + dir;
  let nextDate = S.date;

  if (nextIdx < 0) {
    // vai ao dia anterior
    const d = new Date(S.date + 'T12:00:00');
    d.setDate(d.getDate() - 1);
    nextDate = d.toISOString().split('T')[0];
    nextIdx = TURNO_ORDER.length - 1;
  } else if (nextIdx >= TURNO_ORDER.length) {
    // vai ao próximo dia
    const d = new Date(S.date + 'T12:00:00');
    d.setDate(d.getDate() + 1);
    nextDate = d.toISOString().split('T')[0];
    nextIdx = 0;
  }

  const all = await api('GET', `/dia?data=${nextDate}&resumo=1`);
  const t = all.find(x => x.nome === TURNO_ORDER[nextIdx]);
  if (!t) return;
  S.date = nextDate;
  S.turnoId = t.id;
  await loadTurno();
  persistUiState();
}

async function loadTurno() {
  clearTurnoAutosaveTimers();
  turnoMsgStickyErr = null;
  const mySeq = ++loadTurnoSeq;
  const myTurnoId = S.turnoId;
  const myDate = S.date;
  try {
    const turnos = await api('GET', `/dia?data=${myDate}&turno_id=${encodeURIComponent(myTurnoId)}`);
    if (mySeq !== loadTurnoSeq) return;
    const turno = turnos.find(t => String(t.id) === String(myTurnoId));
    if (!turno) { show('turno-content','<div class="alert alert-error">Turno não encontrado</div>'); return; }

    S.turnoData = turno;
    S.turnoDeposito = undefined;
    S.turnoDecisoes = {};
    if (turno.estado === 'fechado' && ['admin','gestor','compras'].includes(S.user?.role)) {
      try {
        const deps = await api('GET', `/depositos?data=${encodeURIComponent(myDate)}`);
        if (mySeq !== loadTurnoSeq) return;
        const found = (Array.isArray(deps) ? deps : []).find((d) => String(d.turno_id) === String(myTurnoId));
        S.turnoDeposito = found || null;
      } catch (_) {
        S.turnoDeposito = undefined;
      }
    }
    try {
      const decs = await api('GET', `/irregularidades/decisoes?turno_id=${encodeURIComponent(myTurnoId)}`);
      if (mySeq !== loadTurnoSeq) return;
      const map = {};
      for (const d of (decs || [])) map[d.categoria] = d;
      S.turnoDecisoes = map;
    } catch (_) { S.turnoDecisoes = {}; }
    stockBuf = {};
    turno.stock.forEach((s) => {
      const sid = prodIdKey(s.produto_id);
      if (!sid) return;
      stockBuf[sid] = {
        encontrado: parseEncontradoFromRow(s.encontrado),
        entrada: parseFloat(s.entrada)||0,
        deixado: parseEncontradoFromRow(s.deixado),
        fechados: parseFloat(s.fechados)||0
      };
    });
    caixaBuf = {
      tpa: parseEncontradoFromRow(turno.caixa?.tpa),
      transferencia: parseEncontradoFromRow(turno.caixa?.transferencia),
      dinheiro: parseEncontradoFromRow(turno.caixa?.dinheiro),
      saida: parseFloat(turno.caixa?.saida) || 0
    };

    document.getElementById('turno-title').textContent =
      `${turnoLabel(turno.nome)} — ${dateLabelWithWeekday(S.date)}`;

    const turnoMsgEl = document.getElementById('turno-msg');
    if (turnoMsgEl) {
      if (turno.estado === 'aberto' && turnoAbertoAntesDoHorarioOficial(S.date, turno.nome)) {
        const sm = TURNO_INICIO_MINUTES[turno.nome];
        const hi = sm != null ? `${String(Math.floor(sm / 60)).padStart(2, '0')}:${String(sm % 60).padStart(2, '0')}` : '';
        turnoMsgEl.innerHTML = `<div class="alert alert-warn" style="margin:0 0 10px;font-size:12px">Este turno foi aberto antes do horário oficial (início às ${hi} em Angola). Fecha o turno e volta a abrir após essa hora, ou contacta a gerência.</div>`;
      } else {
        turnoMsgEl.innerHTML = '<span class="turno-msg-spacer">&nbsp;</span>';
        turnoMsgEl.className = 'turno-msg';
      }
    }

    const isAberto = turno.estado === 'aberto';
    const canEdit  = isAberto;
    S.turnoCanEdit = canEdit;

    const finoBarrilAjustadoRecipiente = aplicarFinoBarrilZeroParaRecipienteKg(turno, canEdit);

    const isAdminUser = S.user?.role === 'admin';
    const reabrirBtn = !isAberto && isAdminUser
      ? `<button type="button" class="btn btn-ghost btn-sm" style="margin-left:8px" onclick="reabrirTurno(event, '${turno.id}')">Reabrir</button>`

let vendasBuf = {};
/** Última resposta GET /turnos/:id/vendas — necessário para linhas de copos na fatura. */
let lastVendasApiRows = [];
/** HTML do card «Resumo de vendas» (só na aba Registos; não duplicar em Vendas). */
let lastResumoVendasCardHtml = '';

/**
 * Linhas de fatura alinhadas ao resumo de vendas / total do turno.
 * @returns {{ lines: Array<{ desc: string, detalhe: string, subFmt: string }>, total: number }}
 */
function collectFaturaVendasLinhas() {
  const lines = [];
  let total = 0;
  for (const prodId of menuProdIds) {
    const k = prodIdKey(prodId);
    const qty = vendasBuf[k] || 0;
    if (qty <= 0) continue;
    const unit = parseFloat(vendasProdPrecos[prodIdKey(prodId)] ?? vendasProdPrecos[prodId]) || 0;
    const nome = vendasProdNomes[k] || 'Menu';
    const sub = qty * unit;
    total += sub;
    lines.push({
      desc: nome,
      detalhe: unit > 0 ? `${fmtNum(qty)} × ${fmt(unit)}` : `${fmtNum(qty)}`,
      subFmt: fmt(sub)
    });
  }
  for (const v of lastVendasApiRows) {
    const isCopo = !!v.venda_por_copo && parseFloat(v.kg_por_copo) > 0;
    if (!isCopo) continue;
    if (isFinoBarrilNome(v.produto_nome)) continue;
    const pid = prodIdKey(v.produto_id);
    if (!pid) continue;
    const copos = parseFloat(v.quantidade) || 0;
    if (copos <= 0) continue;
    const cfgBase = bebidaCopoCfg[pid];
    const preco = cfgBase ? cfgBase.preco : parseFloat(v.preco) || 0;
    const qtdPacote = cfgBase ? cfgBase.qtdPacote : parseInt(v.qtd_copos_pacote, 10) || 0;
    const precoPacote = cfgBase ? cfgBase.precoPacote : parseFloat(v.preco_copos_pacote) || 0;
    const sub = precoVendaCopos(copos, preco, qtdPacote, precoPacote);
    total += sub;
    const nomeLinha = cfgBase ? cfgBase.nome : nomeVendaBebidaLegivel(pid, v.produto_nome);
    lines.push({
      desc: `${nomeLinha} (copos)`,
      detalhe: `${fmtNum(copos)} copos`,
      subFmt: fmt(sub)
    });
  }
  for (const prodId of avulsoProdIds) {
    const qty = calcStandaloneQty(prodId);
    if (qty <= 0) continue;
    const unit = parseFloat(vendasProdPrecos[prodIdKey(prodId)] ?? vendasProdPrecos[prodId]) || 0;
    const k = prodIdKey(prodId);
    const nome = vendasProdNomes[k] || 'Produto';
    const sub = qty * unit;
    total += sub;
    lines.push({
      desc: nome,
      detalhe: unit > 0 ? `${fmtNum(qty)} × ${fmt(unit)}` : `${fmtNum(qty)}`,
      subFmt: fmt(sub)
    });
  }
  forEachBebidaUnidadeVendidaLinha(({ vend, nome, unit, sub }) => {
    total += sub;
    const mid = unit > 0 ? `${fmtNum(vend)} × ${fmt(unit)}` : `${fmtNum(vend)}`;
    lines.push({
      desc: nome,
      detalhe: mid,
      subFmt: fmt(sub)
    });
  });
  return { lines, total };
}

function buildFaturaVendaDocumentHtml(docRef, lines, total) {
  const rowsHtml = lines
    .map(
      (l) =>

function pedidoBalcaoLogoLoadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Falha ao carregar imagem.'));
    img.src = src;
  });
}

/** Converte uma imagem (data URL) em bytes ESC/POS GS v 0 (raster monocromático). */
async function pedidoBalcaoImageToEscPosRaster(dataUrl) {
  const img = await pedidoBalcaoLogoLoadImage(dataUrl);
  const MAX_W = 384; // 58 mm @ ~203 dpi
  const MAX_H = 200;
  let scale = 1;
  if (img.width > MAX_W) scale = MAX_W / img.width;
  if (img.height * scale > MAX_H) scale = MAX_H / img.height;
  let w = Math.max(8, Math.floor(img.width * scale));
  let h = Math.max(1, Math.floor(img.height * scale));
  w = w - (w % 8); // múltiplo de 8
  if (w < 8) w = 8;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);
  const id = ctx.getImageData(0, 0, w, h);
  const data = id.data;
  // Grayscale para Float32 (com alfa contra branco)
  const gray = new Float32Array(w * h);
  for (let i = 0, j = 0; i < data.length; i += 4, j++) {
    const a = data[i + 3] / 255;
    const r = data[i] * a + 255 * (1 - a);
    const g = data[i + 1] * a + 255 * (1 - a);
    const b = data[i + 2] * a + 255 * (1 - a);
    gray[j] = 0.299 * r + 0.587 * g + 0.114 * b;
  }
  // Floyd–Steinberg
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = y * w + x;
      const oldP = gray[idx];
      const newP = oldP < 128 ? 0 : 255;
      gray[idx] = newP;
      const err = oldP - newP;
      if (x + 1 < w) gray[idx + 1] += err * 7 / 16;
      if (y + 1 < h) {
        if (x > 0) gray[idx + w - 1] += err * 3 / 16;
        gray[idx + w] += err * 5 / 16;
        if (x + 1 < w) gray[idx + w + 1] += err * 1 / 16;
      }
    }
  }
  // Empacotar em bits (1 = preto)
  const bytesPerRow = w / 8;
  const raster = new Uint8Array(bytesPerRow * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (gray[y * w + x] < 128) {
        raster[y * bytesPerRow + (x >> 3)] |= 0x80 >> (x & 7);
      }
    }
  }
  // Cabeçalho GS v 0 m xL xH yL yH
  const xL = bytesPerRow & 0xff;
  const xH = (bytesPerRow >> 8) & 0xff;
  const yL = h & 0xff;
  const yH = (h >> 8) & 0xff;
  const header = [0x1d, 0x76, 0x30, 0x00, xL, xH, yL, yH];
  // Construir string latin1 (1 byte por char) para guardar/serializar
  let s = '';
  for (let i = 0; i < header.length; i++) s += String.fromCharCode(header[i]);
  for (let i = 0; i < raster.length; i++) s += String.fromCharCode(raster[i]);
  return s;
}

async function pedidoBalcaoLogoOnFile(input) {
  if (!input || !input.files || !input.files[0]) return;
  const file = input.files[0];
  if (!/^image\//.test(file.type)) {
    alert('Selecione um ficheiro de imagem (PNG, JPG…).');
    input.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    alert('Imagem demasiado grande. Use um ficheiro até 5 MB.');
    input.value = '';
    return;
  }
  try {
    const dataUrl = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ''));
      r.onerror = () => reject(new Error('Não foi possível ler a imagem.'));
      r.readAsDataURL(file);
    });
    const escpos = await pedidoBalcaoImageToEscPosRaster(dataUrl);
    try {
      localStorage.setItem('stockos.pedidoLogoPreview', dataUrl);
      localStorage.setItem('stockos.pedidoLogoEscPos', escpos);
    } catch (e) {
      alert('Logo gerado mas não foi possível guardar (armazenamento cheio).');
    }
    pedidoBalcaoLogoRefreshUI();
  } catch (e) {
    alert('Falha ao processar imagem: ' + (e && e.message ? e.message : e));
  } finally {
    input.value = '';
  }
}

function pedidoBalcaoAsciiFold(s) {
  return String(s == null ? '' : s)
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^\S\n]/g, ' ')
    .replace(/[^\x20-\x7E\n]/g, '?');
}

/**
 * Imprime N caixas hollow (CP437 box-drawing) para riscar \u00e0 medida que entrega
 * cada unidade. Cada caixa ocupa 3 chars \u00d7 3 linhas:
 *   \u250c\u2500\u2510
 *   \u2502 \u2502
 *   \u2514\u2500\u2518
 * Os bytes n\u00e3o passam pelo ASCII fold porque o output \u00e9 concatenado directamente
 * ao body e enviado em Latin-1 \u2192 ESC/POS interpreta como CP437.
 */
function pedidoBalcaoCaixasEntrega(n, w) {
  const W = w || 32;
  const INDENT = '  ';
  // CP437: 0xDA=\u250c 0xC4=\u2500 0xBF=\u2510 0xB3=\u2502 0xC0=\u2514 0xD9=\u2518
  const TOP = '\xDA\xC4\xBF';
  const MID = '\xB3 \xB3';
  const BOT = '\xC0\xC4\xD9';
  const BOX_W = 3;
  const SEP = ' ';
  const available = W - INDENT.length;
  const perRow = Math.max(1, Math.floor((available + SEP.length) / (BOX_W + SEP.length)));
  const lines = [];
  for (let i = 0; i < n; i += perRow) {
    const count = Math.min(perRow, n - i);
    const tops = Array(count).fill(TOP).join(SEP);
    const mids = Array(count).fill(MID).join(SEP);
    const bots = Array(count).fill(BOT).join(SEP);
    lines.push(INDENT + tops);
    lines.push(INDENT + mids);
    lines.push(INDENT + bots);
  }
  return lines.join('\n');
}


function pedidoBalcaoBuildTalaoEscPos(pedido) {
  const W = 32; // 58 mm @ Font A
  const ESC = '\x1B';
  const GS = '\x1D';
  const fold = pedidoBalcaoAsciiFold;
  const padR = (l, r, w = W) => {
    const ll = fold(l);
    const rr = fold(r);
    const sp = Math.max(1, w - ll.length - rr.length);
    return ll + ' '.repeat(sp) + rr;
  };
  const center = (s) => {
    const ss = fold(s);
    const p = Math.max(0, Math.floor((W - ss.length) / 2));
    return ' '.repeat(p) + ss;
  };
  const wrapName = (q, name) => {
    const head = `${q} ${fold(name)}`;
    if (head.length <= W) return head + '\n';
    const lines = [];
    let cur = `${q} `;
    const words = fold(name).split(/\s+/);
    for (const w of words) {
      if ((cur + w).length > W) {
        lines.push(cur.trimEnd());
        cur = '   ' + w + ' ';
      } else {
        cur += w + ' ';
      }
    }
    if (cur.trim()) lines.push(cur.trimEnd());
    return lines.join('\n') + '\n';
  };

  const linhas = pedido.linhas || [];
  let total = 0;
  let body = '';
  for (const ln of linhas) {
    const copo = !!ln.venda_por_copo && parseFloat(ln.kg_por_copo) > 0;
    const nome = ln.produto_nome || 'Item';
    let qtyLabel, sub, unitLine, nUnits;
    if (copo) {
      const copos = Math.floor(parseFloat(ln.quantidade));
      const u = parseFloat(ln.preco) || 0;
      const n = parseInt(ln.qtd_copos_pacote, 10) || 0;
      const pp = parseFloat(ln.preco_copos_pacote) || 0;
      sub = precoVendaCopos(copos, u, n, pp);
      qtyLabel = `${copos}x`;
      // Cada «unidade» de uma bebida com pacote = n copos por dentro,
      // logo o nº de caixas a riscar é copos × n (caixa por copo entregue).
      nUnits = n >= 2 ? copos * n : copos;
      unitLine =
        n >= 2 && pp > 0
          ? `  pac.${n}=${fmt(pp)} | un.${fmt(u)}`
          : `  ${fmt(u)} / copo`;
    } else {
      const q = parseFloat(ln.quantidade) || 0;
      const u = parseFloat(ln.preco) || 0;
      sub = q * u;
      qtyLabel = `${fmtNum(q)}x`;
      nUnits = Math.floor(q);
      unitLine = `  ${fmt(u)} / un.`;
    }
    total += sub;
    body += wrapName(qtyLabel, nome);
    const subFmt = fmt(sub);
    if (fold(unitLine).length + 1 + fold(subFmt).length > W) {
      body += fold(unitLine) + '\n';
      body += padR('', subFmt) + '\n';
    } else {
      body += padR(unitLine, subFmt) + '\n';
    }
    if (nUnits > 0) {
      body += pedidoBalcaoCaixasEntrega(nUnits, W) + '\n';
    }
  }

  const cliente = String(pedido.cliente_nome || '').trim();
  const when = pedido.criado_em
    ? new Date(pedido.criado_em).toLocaleString('pt-PT', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      })
    : '';
  const turnoNome = (S.turnoData && S.turnoData.nome) || '';
  const dataHdr = S.date || '';

  let out = '';
  out += ESC + '@';
  out += ESC + 't' + '\x00'; // codepage CP437 (para os chars de desenho ┌─┐│└─┘)
  out += ESC + 'a' + '\x01';
  const logoBin = pedidoBalcaoLogoGetEscPos();
  if (logoBin) {
    out += logoBin;
    out += '\n';
  }
  out += GS + '!' + '\x11';
  out += 'Tanuma\n';
  out += GS + '!' + '\x00';
  out += '935 049 404\n';
  if (turnoNome) out += fold(`Turno ${turnoNome}`) + '\n';
  out += '\n';
  out += ESC + 'a' + '\x00';
  out += fold(`Pedido #${pedido.id}`) + '\n';
  if (cliente) out += fold(`Mesa/cliente: ${cliente}`) + '\n';
  if (when) out += fold(`Data: ${when}`) + '\n';
  else if (dataHdr) out += fold(`Data: ${dataHdr}`) + '\n';
  out += '-'.repeat(W) + '\n';
  out += body;
  out += '-'.repeat(W) + '\n';
  out += padR('TOTAL', fmt(total)) + '\n';
  out += fold(`Pagamento: ${pedidoTipoPagamentoLabel(pedido.tipo_pagamento)}`) + '\n';
  out += fold(`Entrega:   ${pedidoEntregaLabel(!!pedido.com_entrega)}`) + '\n';
  out += '\n';
  out += ESC + 'a' + '\x01';
  out += 'Obrigado!\n';
  out += '\n\n\n\n';
  out += ESC + 'a' + '\x00';
  return out;
}

function pedidoBalcaoB64Latin1(s) {
  let bin = '';
  for (let i = 0; i < s.length; i++) {
    bin += String.fromCharCode(s.charCodeAt(i) & 0xff);
  }
  try {
    return btoa(bin);
  } catch (_) {
    return '';
  }
}

/** Converte string ESC/POS (com chars 0x00-0xFF) num Uint8Array de bytes. */
function pedidoBalcaoEscPosBytes(s) {
  const arr = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) arr[i] = s.charCodeAt(i) & 0xff;
  return arr;
}

function pedidoBalcaoImprimirTalao(pedido) {
  if (!pedido) return false;
  if (!pedidoBalcaoIsAndroid()) {
    pedidoBalcaoMostrarAjudaImpressao('Esta funcionalidade só está disponível no Android. No iPhone/iPad, usa o botão «Fatura» que abre a vista para imprimir.');
    return false;
  }
  return pedidoBalcaoImprimirRawBT(pedido);
}

function pedidoBalcaoImprimirRawBT(pedido) {
  const text = pedidoBalcaoBuildTalaoEscPos(pedido);
  const b64 = pedidoBalcaoB64Latin1(text);
  if (!b64) return false;
  const url = `rawbt:base64,${b64}`;
  try {
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 800);
  } catch (_) {
    try { window.location.href = url; } catch (__) {}
  }
  return true;
}

/** Modal explicando como configurar a impressão via RawBT. */
function pedidoBalcaoMostrarAjudaImpressao(msgExtra) {
  if (document.getElementById('pedido-print-help-modal')) return;
  const div = document.createElement('div');
  div.id = 'pedido-print-help-modal';

/** Valor da linha e HTML do preço unitário na conta corrente (copos: pacote + resto). */
function pedidoBalcaoValorLinha(o, q) {
  const qty = parseFloat(q);
  if (!o || !Number.isFinite(qty) || qty <= 0) return { line: 0, unitHtml: '—' };
  if (o.grupo === 'BebidaCopo') {
    const u = parseFloat(o.preco) || 0;
    const n = parseInt(o.qtd_copos_pacote, 10) || 0;
    const pp = parseFloat(o.preco_copos_pacote) || 0;
    const line = precoVendaCopos(qty, u, n, pp);
    let unitHtml =
      `<span style="font-weight:600;color:#e2e8f0">${escapeHtml(fmt(u))}</span> <span style="font-size:10px;color:#64748b">/ copo</span>`;
    if (n >= 2 && pp > 0) {
      unitHtml += `<div style="font-size:10px;color:#64748b;margin-top:3px;line-height:1.25">Pacote ${n} copos ${escapeHtml(
        fmt(pp)
      )}</div>`;
    }
    return { line, unitHtml };
  }
  const preco = parseFloat(o.preco) || 0;
  const line = preco * qty;
  const unitHtml = `<span style="font-weight:600;color:#e2e8f0">${escapeHtml(fmt(preco))}</span> <span style="font-size:10px;color:#64748b">/ un.</span>`;
  return { line, unitHtml };
}

function pedidoBalcaoSetFilter(btn) {
  if (!btn || !btn.getAttribute) return;
  const grupo = btn.getAttribute('data-grupo');
  const wrap = btn.closest('.pedidos-balcao-filters');
  if (wrap) wrap.querySelectorAll('button').forEach((b) => b.classList.toggle('pedido-filter--on', b === btn));
  document.querySelectorAll('#pedidos-balcao-mount .pedido-prod-tile').forEach((t) => {
    const g = t.getAttribute('data-grupo');
    const show = grupo === 'all' || g === grupo;
    t.classList.toggle('pedido-tile--hidden', !show);
  });
}

function pedidoBalcaoRefreshDraftLineTotals() {
  const tbody = document.getElementById('pedido-draft-tbody');
  if (!tbody) return;
  const catalog = window.__pedidoProdutosOpts || [];
  const map = {};
  catalog.forEach((o) => {
    map[String(o.id)] = o;
  });
  const draft = window.__pedidoBalcaoDraft || {};
  let sum = 0;
  tbody.querySelectorAll('tr[data-pid]').forEach((tr) => {
    const pid = tr.getAttribute('data-pid');
    const o = map[pid];
    const q = parseFloat(draft[pid]);
    if (!o || !Number.isFinite(q) || q <= 0) return;
    const { line } = pedidoBalcaoValorLinha(o, q);
    sum += line;
    const td = tr.querySelector('.pedido-line-total');
    if (td) td.textContent = fmt(line);
  });
  const totalEl = document.getElementById('pedido-draft-total');
  if (totalEl) totalEl.textContent = fmt(sum);
}

function pedidoBalcaoRecalcDraftTotal() {
  pedidoBalcaoRefreshDraftLineTotals();
}

function pedidoBalcaoDraftQtyInput(inp) {
  if (!inp) return;
  const pid = inp.getAttribute('data-pid');
  let q = parseFloat(inp.value);
  if (!window.__pedidoBalcaoDraft) window.__pedidoBalcaoDraft = {};
  if (Number.isFinite(q) && q > 0) window.__pedidoBalcaoDraft[pid] = q;
  pedidoBalcaoRecalcDraftTotal();
}

function pedidoBalcaoDraftQtyFromInput(inp) {
  if (!inp) return;
  const pid = inp.getAttribute('data-pid');
  let q = parseFloat(inp.value);
  if (!Number.isFinite(q) || q <= 0) {
    if (window.__pedidoBalcaoDraft && pid) delete window.__pedidoBalcaoDraft[pid];
    pedidoBalcaoSyncDraftUI();
    return;
  }
  if (!window.__pedidoBalcaoDraft) window.__pedidoBalcaoDraft = {};
  window.__pedidoBalcaoDraft[pid] = q;
  pedidoBalcaoRecalcDraftTotal();
}

function pedidoBalcaoRemoveLine(pid) {
  if (window.__pedidoBalcaoDraft && pid) delete window.__pedidoBalcaoDraft[String(pid)];
  pedidoBalcaoSyncDraftUI();
}

function pedidoBalcaoSyncDraftUI() {
  const catalog = window.__pedidoProdutosOpts || [];
  const map = {};
  catalog.forEach((o) => {
    map[String(o.id)] = o;
  });
  const tbody = document.getElementById('pedido-draft-tbody');
  const totalEl = document.getElementById('pedido-draft-total');
  if (!tbody) return;
  const draft = window.__pedidoBalcaoDraft || {};
  const entries = Object.entries(draft).filter(([, qty]) => {
    const q = parseFloat(qty);
    return Number.isFinite(q) && q > 0;
  });
  let rows = '';
  let sum = 0;
  for (const [pid, qty] of entries) {
    const o = map[pid];
    if (!o) continue;
    const q = parseFloat(qty);
    const { line, unitHtml } = pedidoBalcaoValorLinha(o, q);
    sum += line;
    const pidAttr = escapeHtml(String(pid));
    rows += `<tr data-pid="${pidAttr}">
      <td style="text-align:right;vertical-align:middle">
        <input type="number" min="0.001" step="any" class="pedido-draft-qty" data-pid="${pidAttr}" value="${escapeHtml(String(q))}"
          oninput="pedidoBalcaoDraftQtyInput(this)" onchange="pedidoBalcaoDraftQtyFromInput(this)"/>
      </td>
      <td style="vertical-align:middle;color:#e2e8f0">${escapeHtml(o.nome)}</td>
      <td class="pedido-line-unit" style="text-align:right;vertical-align:middle;max-width:140px">${unitHtml}</td>
      <td class="pedido-line-total" data-pid="${pidAttr}" style="text-align:right;vertical-align:middle;color:#4ade80;white-space:nowrap;font-weight:700">${escapeHtml(
        fmt(line)
      )}</td>
      <td style="vertical-align:middle">
        <button type="button" class="btn btn-ghost btn-sm" data-pid="${pidAttr}" onclick="pedidoBalcaoRemoveLine(this.getAttribute('data-pid'))" title="Remover">×</button>
      </td>
    </tr>`;
  }
  if (!rows) {
    rows =
      '<tr><td colspan="5" style="color:#64748b;font-size:13px;padding:10px 8px">Toque num artigo na grelha para adicionar.</td></tr>';
  }
  tbody.innerHTML = rows;
  if (totalEl) totalEl.textContent = fmt(sum);
}

function pedidoBalcaoKeypad(v) {
  let inp = document.activeElement;
  if (!inp || !inp.classList || !inp.classList.contains('pedido-draft-qty')) {
    const last = document.querySelector('#pedido-draft-tbody .pedido-draft-qty:last-of-type');
    if (last) {
      last.focus();
      inp = last;
    }
  }
  if (!inp || !inp.classList.contains('pedido-draft-qty')) return;
  if (v === 'bs') inp.value = String(inp.value || '').slice(0, -1);
  else if (v === 'clr') inp.value = '';
  else inp.value = String(inp.value || '') + v;
  pedidoBalcaoDraftQtyInput(inp);
  pedidoBalcaoDraftQtyFromInput(inp);
}

async function registarPedidoBalcao(turnoId) {
  const draft = window.__pedidoBalcaoDraft || {};
  const linhas = [];
  for (const [pid, qty] of Object.entries(draft)) {
    const q = parseFloat(qty);
    if (!Number.isFinite(q) || q <= 0) continue;
    linhas.push({ produto_id: pid, quantidade: q });
  }
  if (!linhas.length) {
    alert('Adicione pelo menos um artigo com quantidade maior que zero.');
    return;
  }
  const cliente = document.getElementById('pedido-cliente-nome')?.value || '';
  const tipoPag =
    document.getElementById('pedido-tipo-pagamento')?.value || 'dinheiro';
  const comEntrega = !!document.getElementById('pedido-com-entrega')?.checked;
  const tid = String(turnoId);
  const idsAntes = new Set(
    (window.__stockosPedidosBalcao || []).map((p) => String(p.id))
  );

  // ⚡ Imprimir ANTES do await para preservar o gesto do utilizador
  // (a Web Share API exige user activation activa e perde-se após await).
  if (pedidoBalcaoAutoPrintEnabled()) {
    const catalog = window.__pedidoProdutosOpts || [];
    const map = {};
    catalog.forEach((o) => { map[String(o.id)] = o; });
    const linhasTalao = linhas.map((ln) => {
      const o = map[String(ln.produto_id)] || {};
      return {
        produto_nome: o.nome || 'Item',
        quantidade: ln.quantidade,
        preco: o.preco,
        venda_por_copo: o.venda_por_copo,
        kg_por_copo: o.kg_por_copo,
        qtd_copos_pacote: o.qtd_copos_pacote,
        preco_copos_pacote: o.preco_copos_pacote
      };
    });
    const proximoId = (window.__stockosPedidosBalcao || [])
      .reduce((m, p) => Math.max(m, Number(p.id) || 0), 0) + 1;
    const pedidoPreview = {
      id: proximoId,
      cliente_nome: cliente,
      tipo_pagamento: tipoPag,
      com_entrega: comEntrega,
      criado_em: new Date().toISOString(),
      linhas: linhasTalao
    };
    try {
      pedidoBalcaoImprimirTalao(pedidoPreview);
    } catch (e) {
      console.warn('Auto-print falhou:', e);
    }
  }

  await api('POST', `/turnos/${tid}/pedidos`, {
    cliente_nome: cliente,
    tipo_pagamento: tipoPag,
    com_entrega: comEntrega,
    linhas
  });
  window.__pedidoBalcaoDraft = {};
  window.__pedidoBalcaoDraftTurnoId = tid;
  await loadVendasMenu(tid, !!S.turnoCanEdit);
}

function closeFaturaVendaModal() {
  document.getElementById('fatura-venda-modal')?.remove();
}

/** Se o browser bloquear pop-ups, abre a mesma fatura num modal (sem alert). */
function openFaturaVendaModal(htmlDoc) {
  closeFaturaVendaModal();
  const div = document.createElement('div');
  div.id = 'fatura-venda-modal';
  div.className = 'modal-overlay';
  div.style.zIndex = '260';
  div.innerHTML = `
    <div class="modal" style="max-width:min(760px,96vw);max-height:92vh;display:flex;flex-direction:column;padding:0;overflow:hidden">
      <div class="modal-header" style="padding:14px 18px;border-bottom:1px solid #334155;flex-shrink:0">
        <div class="modal-title">Documento de venda</div>
        <button type="button" class="modal-close" id="fv-close" aria-label="Fechar">×</button>
      </div>
      <iframe id="fatura-venda-iframe" title="Documento de venda" style="flex:1;min-height:280px;width:100%;border:none;background:#fff"></iframe>
      <div style="padding:12px 18px;border-top:1px solid #334155;display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex-shrink:0">
        <button type="button" class="btn btn-primary btn-sm" id="fv-print">Imprimir</button>
        <button type="button" class="btn btn-ghost btn-sm" id="fv-close2">Fechar</button>
        <span style="font-size:12px;color:#64748b">Vista alternativa — não precisa de janelas emergentes.</span>
      </div>
    </div>`;
  document.body.appendChild(div);
  const iframe = div.querySelector('#fatura-venda-iframe');
  iframe.srcdoc = htmlDoc;
  const stop = (e) => e.stopPropagation();
  div.querySelector('.modal').addEventListener('click', stop);
  div.addEventListener('click', (e) => {
    if (e.target === div) closeFaturaVendaModal();
  });
  document.getElementById('fv-close').addEventListener('click', closeFaturaVendaModal);
  document.getElementById('fv-close2').addEventListener('click', closeFaturaVendaModal);
  document.getElementById('fv-print').addEventListener('click', () => {
    try {
      const win = iframe.contentWindow;
      if (win) {
        win.focus();
        win.print();
      }
    } catch (e) {
      /* silencioso */
    }
  });
}

async function imprimirFaturaVendas() {
  const tid = S.turnoData?.id;

  await loadVendasMenu(tid, !!S.turnoCanEdit);
  const { lines, total } = collectFaturaVendasLinhas();
  if (!lines.length) {

    return;
  }
  const docRef = `V-${String(S.date || '').replace(/-/g, '')}-${S.turnoData.nome}-${tid}`;
  openFaturaDocumentHtml(buildFaturaVendaDocumentHtml(docRef, lines, total));
}

async function loadTurnoResumoTab(turnoId) {
  const mount = document.getElementById('turno-resumo-mount');

async function loadVendasMenu(turnoId, canEdit) {
  try {
    const [prods, vendas, todasReceitas] = await Promise.all([
      api('GET', '/produtos?todos=0'),
      api('GET', `/turnos/${turnoId}/vendas`),
      api('GET', '/receitas')
    ]);
    lastVendasApiRows = Array.isArray(vendas) ? vendas : [];
    const menuProds   = prods.filter(p => p.categoria === 'menu');
    const bebidaProds = prods.filter(p => p.categoria === 'bebida').filter((p) => !isFinoBarrilNome(p.nome));
    const avulsoProds = prods.filter(p => p.venda_avulso && p.categoria !== 'menu' && p.categoria !== 'bebida');
    vendasProdNomes = {};
    prods.forEach((p) => {
      const id = prodIdKey(p.id);
      if (id) vendasProdNomes[id] = p.nome;
    });
    vendasBuf = {};
    vendas.forEach((v) => {
      const pid = prodIdKey(v.produto_id);
      if (!pid) return;
      vendasBuf[pid] = parseFloat(v.quantidade);
      if (v.produto_nome) vendasProdNomes[pid] = v.produto_nome;
    });

    receitasBuf = {};
    todasReceitas.forEach((r) => {
      const mk = prodIdKey(r.produto_id);
      if (!mk) return;
      if (!receitasBuf[mk]) receitasBuf[mk] = [];
      receitasBuf[mk].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
    });

    avulsoProdIds = avulsoProds.map(p => p.id);

    if (!menuProds.length && !bebidaProds.length && !avulsoProds.length) {
      show('vendas-menu-list', '<span style="color:#64748b">Nenhum produto de menu configurado. Adicione produtos com categoria "Menu".</span>');
      await renderPedidosBalcao(turnoId, canEdit, []);
      return;
    }

    const groupHeader = label => `<div style="font-weight:600;color:#64748b;font-size:0.8rem;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">${label}</div>`;

    vendasProdPrecos = {};
    [...menuProds, ...avulsoProds, ...bebidaProds].forEach(p => {
      vendasProdPrecos[p.id] = parseFloat(p.preco) || 0;
    });
    vendas.forEach((v) => {
      const pid = prodIdKey(v.produto_id);
      if (!pid || v.preco == null || v.preco === '') return;
      const u = parseFloat(v.preco) || 0;
      vendasProdPrecos[pid] = u;
      vendasProdPrecos[v.produto_id] = u;

    const btnStyle = 'width:28px;height:28px;border-radius:6px;border:none;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;';

    bebidaCopoCfg = {};
    const bebidaCopoProds = bebidaProds.filter(
      (p) => p.venda_por_copo && parseFloat(p.kg_por_copo) > 0
    );

      (p) => !(p.venda_por_copo && parseFloat(p.kg_por_copo) > 0)

    bebidaCopoProdIds = bebidaCopoProds.map((p) => p.id);
    bebidaProdIds = bebidaOutras.map((p) => p.id);
    bebidaCopoProds.forEach((p) => {
      bebidaCopoCfg[p.id] = {
