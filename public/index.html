/** Secção unificada de movimentos de caixa: entradas (+, verde) e saídas
 *  (−, vermelho) numa só tabela cronológica, com saldo. As saídas vêm de
 *  despesas (turno_saidas) + compras de stock; as entradas de
 *  turno_caixa_entradas. Actualiza o campo "Saída" e os totais do card Caixa. */
function renderCaixaMovimentos(turnoId, canEdit, saidas, entradas, caixaEntradas) {
  const el = document.getElementById('caixa-movimentos-section');
  if (!el) return;
  try {
    const hora = (d) => d ? new Date(d).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }) : '';
    const movimentos = [];
    // Entradas guardadas em turno_saidas marcadas com ENTRADA_MARK nas notas
    // (não precisam de tabela própria — funciona em qualquer BD).
    const isEntradaMarcada = (s) => String(s.notas || '').startsWith(ENTRADA_MARK);
    // Saídas: compras de stock
    (entradas || []).filter(e => e.origem === 'compra' && e.tipo === 'entrada').forEach(e => {
      movimentos.push({ ts: e.criado_em, dir: 'out', desc: `${e.produto_nome || 'Compra'}`, tag: 'compra', valor: parseFloat(e.preco) || 0, notas: e.notas || '' });
    });
    // turno_saidas: separa saídas reais de entradas marcadas
    (saidas || []).forEach(s => {
      if (isEntradaMarcada(s)) {
        movimentos.push({ ts: s.criado_em, dir: 'in', desc: s.descricao || '', tag: '', valor: parseFloat(s.valor) || 0, notas: String(s.notas).slice(ENTRADA_MARK.length) });
      } else {
        movimentos.push({ ts: s.criado_em, dir: 'out', desc: s.descricao || '', tag: '', valor: parseFloat(s.valor) || 0, notas: s.notas || '' });
      }
    });
    // Entradas da tabela dedicada (turno_caixa_entradas), se existir/usada.
    (caixaEntradas || []).forEach(s => {
      movimentos.push({ ts: s.criado_em, dir: 'in', desc: s.descricao || '', tag: '', valor: parseFloat(s.valor) || 0, notas: s.notas || '' });
    });
    movimentos.sort((a, b) => new Date(b.ts || 0) - new Date(a.ts || 0));

    const totalSaidas = movimentos.filter(m => m.dir === 'out').reduce((s, m) => s + m.valor, 0);
    const totalEntradas = movimentos.filter(m => m.dir === 'in').reduce((s, m) => s + m.valor, 0);
    const saldo = totalEntradas - totalSaidas;

    const formHtml = canEdit ? `
      <div class="entradas-form">
        <select id="mc-tipo" class="entradas-qty" style="flex:0 0 96px;cursor:pointer">
          <option value="saida">− Saída</option>
          <option value="entrada">+ Entrada</option>
        </select>
        <input id="mc-desc" type="text" placeholder="Descrição (ex: gasóleo, fundo de caixa)" class="entradas-notas" style="flex:2"/>
        <input id="mc-valor" type="number" min="0.01" step="any" placeholder="Valor" class="entradas-qty"/>
        <input id="mc-notas" type="text" placeholder="Notas (opcional)" class="entradas-notas" style="flex:1.3"/>
        <button type="button" class="btn btn-primary btn-sm" onclick="runAction(event, () => submitMovimentoCaixa('${turnoId}'))">Registar</button>
      </div>
      <div id="mc-form-msg" style="margin-bottom:8px"></div>` : '';

    const rows = movimentos.map(m => {
      const isIn = m.dir === 'in';
      const cor = isIn ? '#4ade80' : '#f87171';
      const sinal = isIn ? '+' : '−';
      const tag = m.tag ? ` <span style="color:#fb923c;font-size:11px">(${escapeHtml(m.tag)})</span>` : '';
      return `<tr>
        <td style="color:#64748b;font-size:12px;white-space:nowrap">${escapeHtml(hora(m.ts))}</td>
        <td style="font-size:13px">${escapeHtml(m.desc)}${tag}</td>
        <td style="text-align:right;font-weight:600;color:${cor};white-space:nowrap">${sinal} ${fmt(m.valor)}</td>
        <td style="color:#94a3b8;font-size:12px">${escapeHtml(m.notas)}</td>
      </tr>`;
    });

    const listaHtml = rows.length === 0
      ? '<div style="color:#475569;font-size:13px;padding:8px 0">Nenhum movimento de caixa neste turno.</div>'
      : `<div class="table-wrap"><table>
          <thead><tr>
            <th style="text-align:left">Hora</th>
            <th style="text-align:left">Descrição</th>
            <th style="text-align:right">Valor</th>
            <th style="text-align:left">Nota</th>
          </tr></thead>
          <tbody>
            ${rows.join('')}
            <tr style="border-top:2px solid #334155">
              <td colspan="2" style="color:#94a3b8;font-size:12px;padding:6px 10px;font-weight:700">Total saídas</td>
              <td style="text-align:right;color:#f87171;font-weight:700">− ${fmt(totalSaidas)}</td><td></td>
            </tr>
            <tr>
              <td colspan="2" style="color:#94a3b8;font-size:12px;padding:6px 10px;font-weight:700">Total entradas</td>
              <td style="text-align:right;color:#4ade80;font-weight:700">+ ${fmt(totalEntradas)}</td><td></td>
            </tr>
            <tr style="border-top:1px solid #334155">
              <td colspan="2" style="color:#cbd5e1;font-size:12px;padding:6px 10px;font-weight:700">Saldo (entradas − saídas)</td>
              <td style="text-align:right;color:${saldo >= 0 ? '#4ade80' : '#f87171'};font-weight:700">${saldo >= 0 ? '+' : '−'} ${fmt(Math.abs(saldo))}</td><td></td>
            </tr>
          </tbody>
        </table></div>`;

    el.innerHTML = formHtml + listaHtml;
    // O campo "Saída" do card Caixa reflete só o dinheiro que saiu;
    // as entradas extra entram no Total Final via __turnoEntradasExtraTotal.
    const cSaida = document.getElementById('c-saida');
    if (cSaida) cSaida.value = totalSaidas.toFixed(2);
    const cEntradas = document.getElementById('c-entradas');
    if (cEntradas) cEntradas.value = totalEntradas.toFixed(2);
    window.__turnoEntradasExtraTotal = totalEntradas;
    const elTG = document.getElementById('c-total-gerado');
    const elTF = document.getElementById('c-total-final');
    if (elTG && elTF) {
      const tg = parseCaixaTriploFromInputs();
      const tf = Number.isFinite(tg) ? tg - totalSaidas + totalEntradas : NaN;
      elTG.textContent = Number.isFinite(tg) ? fmtKzOrEmpty(tg) : '—';
      elTF.textContent = Number.isFinite(tf) ? fmtKzOrEmpty(tf) : '—';
    }
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}

/** Marcador (no campo notas) que distingue uma ENTRADA de caixa guardada na
 *  tabela turno_saidas. Permite registar entradas sem precisar de uma tabela
 *  própria (que a app pode não ter permissão para criar). */
const ENTRADA_MARK = 'ENTRADA::';

async function submitMovimentoCaixa(turnoId) {
  const tipo  = document.getElementById('mc-tipo')?.value || 'saida';
  const desc  = document.getElementById('mc-desc')?.value.trim() || '';
  const valor = parseFloat(document.getElementById('mc-valor')?.value);
  const notas = document.getElementById('mc-notas')?.value.trim() || '';
  const msg   = document.getElementById('mc-form-msg');
  const setErr = (t) => { if (msg) { msg.className = 'alert alert-error'; msg.textContent = t; } };
  if (!desc) { setErr('Descrição obrigatória.'); return; }
  if (!valor || valor <= 0) { setErr('Valor inválido.'); return; }
  try {
    // Entradas e saídas vão ambas para turno_saidas; a entrada leva o
    // marcador nas notas e é tratada como dinheiro que entrou.
    const notasFinal = tipo === 'entrada' ? (ENTRADA_MARK + notas) : notas;
    await apiEscrita('POST', `/turnos/${turnoId}/saidas`, { descricao: desc, valor, notas: notasFinal },
      { tid: turnoId, desc: tipo === 'entrada' ? 'Entrada de caixa' : 'Saída de caixa' });
    ['mc-desc', 'mc-valor', 'mc-notas'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    await loadRegistosMovimentosSection(turnoId, S.turnoData?.stock || [], true);
  } catch (e) {
    setErr(e.message);
  }
}

/** Preenche, no cartão «Áreas de trabalho», quem está escalado para cada área (1–3). */
async function loadTurnoAreasEscalados() {
  const container = document.querySelector('.turno-areas-card');
  if (!container) return;
  const turnoNome = S.turnoData?.nome;
  if (!turnoNome || !S.date) return;
  try {
    const escalaPack = await api(
      'GET',
      `/escala/semana?data_inicio=${encodeURIComponent(S.date)}&data_fim=${encodeURIComponent(S.date)}`
    ).catch(() => ({ semana: [], template: [] }));
    const rowsDia = escalaPack?.semana || [];
    const rowsTemplate = escalaPack?.template || [];
    const listaDia = rowsDia.filter((r) => r.turno === turnoNome);
    const d = new Date(S.date + 'T12:00:00Z');
    const day = d.getUTCDay();
    const diaSemana = day === 0 ? 6 : day - 1;
    const listaTpl = rowsTemplate.filter(
      (r) => Number(r.dia_semana) === diaSemana && r.turno === turnoNome
    );
    const lista = listaDia.length ? listaDia : listaTpl;
    const origem = listaDia.length
      ? 'Escala do dia'
      : (listaTpl.length ? 'Escala template' : '');
    const origEl = document.getElementById('turno-areas-origem');
    if (origEl) origEl.textContent = origem;

    const porArea = { 1: [], 2: [], 3: [], 0: [] };
    lista.forEach((r) => {
      const a = r.area_trabalho != null && r.area_trabalho !== ''
        ? parseInt(r.area_trabalho, 10)
        : NaN;
      const key = Number.isFinite(a) && a >= 1 && a <= 3 ? a : 0;
      porArea[key].push(r);
    });

    AREAS_TRABALHO_META.forEach((area) => {
      const slot = document.getElementById(`turno-area-people--${area.id}`);
      if (!slot) return;
      const pessoas = porArea[area.id] || [];
      if (!pessoas.length) {
        slot.innerHTML = '<span class="turno-area-empty">sem escalados</span>';
        return;
      }
      slot.innerHTML = pessoas.map((r) => {
        const nome = r.utilizador_nome || 'Sem nome';
        const role = r.utilizador_role ? roleDisplay(r.utilizador_role).toUpperCase() : '';
        const tipParts = [];
        if (role) tipParts.push(role);
        if (r.notas) tipParts.push(String(r.notas));
        const tip = tipParts.join(' · ');
        return `<span class="turno-area-person"${tip ? ` title="${escapeHtml(tip)}"` : ''}>${escapeHtml(nome)}</span>`;
      }).join('');
    });
    const semAreaCount = (porArea[0] || []).length;
    if (semAreaCount > 0 && origEl) {
      const nomes = porArea[0]
        .map((r) => r.utilizador_nome || 'Sem nome')
        .join(', ');
      origEl.textContent = `${origem ? origem + ' · ' : ''}Sem área: ${nomes}`;
    }
  } catch(e) {
    const origEl = document.getElementById('turno-areas-origem');
    if (origEl) origEl.textContent = e.message || 'Erro ao carregar áreas';
  }
}

async function loadEscalaTurno() {
  const el = document.getElementById('turno-escala-list');
  if (!el) return;
  el.innerHTML = '<span style="color:#64748b">A carregar...</span>';
  try {
    const turnoNome = S.turnoData?.nome;
    if (!turnoNome || !S.date) {
      el.innerHTML = '<span style="color:#64748b">Turno não selecionado.</span>';
      return;
    }
    const [escalaPack, equipaReal, pessoas, faltasReg, justifs] = await Promise.all([
      api('GET', `/escala/semana?data_inicio=${encodeURIComponent(S.date)}&data_fim=${encodeURIComponent(S.date)}`).catch(() => ({ semana: [], template: [] })),
      api('GET', `/turnos/${S.turnoData.id}/equipa-real`),
      api('GET', '/equipa/pessoas'),
      api('GET', `/turnos/${S.turnoData.id}/faltas`),
      api('GET', `/presencas/justificacoes?turno_id=${encodeURIComponent(S.turnoData.id)}`).catch(() => [])
    ]);
    /** Justificações por (utilizador_id, tipo): falta / hora_extra. */
    const justifByKey = {};
    for (const j of (justifs || [])) {
      justifByKey[`${j.utilizador_id}|${j.tipo}`] = j;
    }
    window._stockosJustifByKey = justifByKey; // usado pelos handlers inline
    const canEdit = !!S.turnoCanEdit;
    /** Presenças biométricas (kiosk) — só admin/gestor têm acesso ao endpoint. */
    const podeVerPresencas = ['admin','gestor'].includes(S.user?.role);
    const presencasByUser = {};
    if (podeVerPresencas && equipaReal.length) {
      try {
        const dProx = addDays(S.date, 1);
        const [pres1, pres2] = await Promise.all([
          api('GET', `/presencas?data=${encodeURIComponent(S.date)}`).catch(() => []),
          // Para turno da noite (23–08) precisamos da madrugada do dia seguinte.
          turnoNome === 'noite' ? api('GET', `/presencas?data=${encodeURIComponent(dProx)}`).catch(() => []) : Promise.resolve([])
        ]);
        for (const p of [...(pres1 || []), ...(pres2 || [])]) {
          const k = String(p.utilizador_id || '');
          if (!k) continue;
          if (!presencasByUser[k]) presencasByUser[k] = { entrada: false, saida: false, entradaEm: null, saidaEm: null };
          if (p.tipo === 'entrada') {
            // Primeira entrada do dia/turno (criado_em é DESC por defeito → guarda a mais antiga).
            presencasByUser[k].entrada = true;
            if (!presencasByUser[k].entradaEm || new Date(p.criado_em) < new Date(presencasByUser[k].entradaEm)) {
              presencasByUser[k].entradaEm = p.criado_em;
            }
          } else if (p.tipo === 'saida') {
            // Última saída.
            presencasByUser[k].saida = true;
            if (!presencasByUser[k].saidaEm || new Date(p.criado_em) > new Date(presencasByUser[k].saidaEm)) {
              presencasByUser[k].saidaEm = p.criado_em;
            }
          }
        }
      } catch (_) {}
    }
    const rowsDia = escalaPack.semana || [];
    const rowsTemplate = escalaPack.template || [];
    const listaDia = rowsDia.filter(r => r.turno === turnoNome);
    const d = new Date(S.date + 'T12:00:00Z');
    const day = d.getUTCDay();
    const diaSemana = day === 0 ? 6 : day - 1; // 0=Seg ... 6=Dom
    const listaTpl = rowsTemplate.filter(r => Number(r.dia_semana) === diaSemana && r.turno === turnoNome);
    const lista = listaDia.length ? listaDia : listaTpl;
    const origem = listaDia.length ? 'escala do dia' : 'escala template';
    const escaladosIds = new Set(lista.map(r => String(r.utilizador_id || '')).filter(Boolean));
    const reaisIds = new Set(equipaReal.map(r => String(r.utilizador_id || '')).filter(Boolean));
    const faltas = lista.filter(r => r.utilizador_id && !reaisIds.has(String(r.utilizador_id)));
    const coberturas = equipaReal.filter(r => r.utilizador_id && !escaladosIds.has(String(r.utilizador_id)));
    const motivoPorFalta = {};
    equipaReal.forEach(r => {
      if (r.cobrindo_utilizador_id && r.motivo_falta) motivoPorFalta[String(r.cobrindo_utilizador_id)] = r.motivo_falta;
    });
    faltasReg.forEach(f => {
      if (f.utilizador_id && f.motivo_falta) motivoPorFalta[String(f.utilizador_id)] = f.motivo_falta;
    });

    const info = `<div style="font-size:11px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">${origem}</div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">Horário: <strong style="color:#cbd5e1">${turnoHorarioLabel(turnoNome)}</strong></div>`;
    const escaladosHtml = lista.length
      ? lista.map((r, i) => {
        const a = r.area_trabalho != null && r.area_trabalho !== '' ? parseInt(r.area_trabalho, 10) : NaN;
        const areaLine = Number.isFinite(a) && a >= 1 && a <= 3
          ? `<div style="font-size:11px;color:#a78bfa;margin-top:3px">${areaTrabalhoAbbr(a)} — ${areaTrabalhoLabel(a)}</div>`
          : '';
        return `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;${i < lista.length - 1 ? 'border-bottom:1px solid #334155;' : ''}">
        <div>
          <div style="font-weight:600;color:#e2e8f0">${r.utilizador_nome || 'Sem nome'}</div>
          <div style="font-size:12px;color:#64748b">${roleDisplay(r.utilizador_role || 'operador').toUpperCase()}</div>
          ${areaLine}
        </div>
        ${r.notas ? `<div style="font-size:12px;color:#94a3b8;text-align:right;max-width:55%">${r.notas}</div>` : '<div style="font-size:12px;color:#475569">—</div>'}
      </div>`;
      }).join('')
      : '<span style="color:#64748b">Sem funcionários escalados para este turno.</span>';

    const fmtHora = (iso) => {
      if (!iso) return '—';
      try {
        return new Date(iso).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', timeZone: 'Africa/Luanda' });
      } catch (_) { return '—'; }
    };
    const reaisHtml = equipaReal.length
      ? equipaReal.map((r, i) => {
        const k = String(r.utilizador_id || '');
        const p = (podeVerPresencas && presencasByUser[k]) ? presencasByUser[k] : null;
        const horaCor = (h) => h ? '#cbd5e1' : '#f87171';
        const horarioLine = podeVerPresencas
          ? `<div style="font-size:12px;color:#94a3b8;margin-top:3px;font-variant-numeric:tabular-nums">⏱ Entrada <strong style="color:${horaCor(p?.entradaEm)}">${fmtHora(p?.entradaEm)}</strong> · Saída <strong style="color:${horaCor(p?.saidaEm)}">${fmtHora(p?.saidaEm)}</strong></div>`
          : '';
        return `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;${i < equipaReal.length - 1 ? 'border-bottom:1px solid #334155;' : ''}">
        <div>
          <div style="font-weight:600;color:#e2e8f0">${r.utilizador_nome || 'Sem nome'}</div>
          <div style="font-size:12px;color:#64748b">${roleDisplay(r.utilizador_role || 'operador').toUpperCase()}</div>
          ${horarioLine}
          ${r.cobrindo_utilizador_nome ? `<div style="font-size:12px;color:#60a5fa;margin-top:2px">Cobrindo: ${r.cobrindo_utilizador_nome}</div>` : ''}
          ${r.motivo_falta ? `<div style="font-size:12px;color:#fbbf24;margin-top:2px">Motivo da falta: ${r.motivo_falta}</div>` : ''}
          ${r.hora_extra ? `<div style="font-size:12px;color:#fbbf24;margin-top:2px">Hora extra aplicada</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${r.notas ? `<div style="font-size:12px;color:#94a3b8;max-width:240px;text-align:right">${r.notas}</div>` : '<div style="font-size:12px;color:#475569">—</div>'}
          ${canEdit ? `<button type="button" class="btn btn-danger btn-sm" onclick="runAction(event, () => removeTurnoPresenca('${S.turnoData.id}','${encodeURIComponent(r.utilizador_id)}'))">Remover</button>` : ''}
        </div>
      </div>
    `;}).join('')
      : '<span style="color:#64748b">Nenhum funcionário registado como presente.</span>';

    const semRegisto = podeVerPresencas
      ? equipaReal.map(r => {
          const k = String(r.utilizador_id || '');
          const p = presencasByUser[k] || { entrada: false, saida: false };
          if (p.entrada && p.saida) return null;
          const missing = [];
          if (!p.entrada) missing.push('entrada');
          if (!p.saida) missing.push('saída');
          return { nome: r.utilizador_nome || 'Sem nome', missing };
        }).filter(Boolean)
      : [];
    const semRegistoLine = semRegisto.length
      ? `<div style="color:#fbbf24;margin-top:6px;line-height:1.5">⚠ Sem registo no kiosk: ${semRegisto.map(s => `${escapeHtml(s.nome)} (sem ${s.missing.join(' e sem ')})`).join(', ')}</div>`
      : '';
    const coberturasHE = equipaReal.filter(r => r.hora_extra && r.utilizador_id);
    const ehAdmin = S.user?.role === 'admin';
    const tid = S.turnoData.id;
    function justifInline(uid, tipo, nome) {
      const j = justifByKey[`${uid}|${tipo}`];
      const safeName = String(nome || 'Sem nome').replace(/'/g, "\\'");
      const safeUid = encodeURIComponent(uid);
      if (!j) {
        return `${escapeHtml(nome)} <button type="button" class="btn btn-ghost btn-sm" style="padding:2px 8px;font-size:11px;margin-left:4px" onclick="runAction(event, () => justificarPresenca('${tid}','${safeUid}','${tipo}','${safeName}'))">Justificar</button>`;
      }
      const corEstado = j.estado === 'aceite' ? '#86efac' : (j.estado === 'rejeitada' ? '#fca5a5' : '#fbbf24');
      const labelEstado = j.estado === 'aceite' ? '✓ Aceite' : (j.estado === 'rejeitada' ? '✗ Rejeitada' : '⏳ Pendente');
      const decAuthor = j.decidido_por_nome ? ` por ${escapeHtml(j.decidido_por_nome)}` : '';
      const obs = j.observacao_admin ? ` — ${escapeHtml(j.observacao_admin)}` : '';
      const adminBtns = (ehAdmin && j.estado === 'pendente')
        ? ` <button type="button" class="btn btn-success btn-sm" style="padding:2px 8px;font-size:11px" onclick="runAction(event, () => decidirJustifPresenca(${j.id}, true))">✓</button> <button type="button" class="btn btn-danger btn-sm" style="padding:2px 8px;font-size:11px" onclick="runAction(event, () => decidirJustifPresenca(${j.id}, false))">✗</button>`
        : '';
      const reJustifBtn = (j.estado !== 'aceite')
        ? ` <button type="button" class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:10px" title="Reescrever (volta a pendente)" onclick="runAction(event, () => justificarPresenca('${tid}','${safeUid}','${tipo}','${safeName}'))">↻</button>`
        : '';
      return `${escapeHtml(nome)} — “${escapeHtml(j.justificacao)}” · <span style="color:${corEstado};font-weight:600">${labelEstado}${decAuthor}</span>${obs}${adminBtns}${reJustifBtn}`;
    }
    const faltasLine = faltas.length
      ? `<div style="color:#fbbf24;line-height:1.55">⚠ Faltas (${faltas.length}):${faltas.map(f => `<div style="margin-left:14px">• ${justifInline(String(f.utilizador_id), 'falta', f.utilizador_nome)}${motivoPorFalta[String(f.utilizador_id)] && !justifByKey[`${f.utilizador_id}|falta`] ? ` <span style="color:#94a3b8">(motivo antigo: ${escapeHtml(motivoPorFalta[String(f.utilizador_id)])})</span>` : ''}</div>`).join('')}</div>`
      : '<div style="color:#4ade80">✓ Sem faltas nos escalados</div>';
    const heLine = coberturasHE.length
      ? `<div style="color:#a78bfa;margin-top:6px;line-height:1.55">⏱ Horas extra (${coberturasHE.length}):${coberturasHE.map(c => `<div style="margin-left:14px">• ${justifInline(String(c.utilizador_id), 'hora_extra', c.utilizador_nome)}</div>`).join('')}</div>`
      : '';
    const coberturasLine = coberturas.length
      ? `<div style="color:#60a5fa;margin-top:6px">↺ Coberturas: ${coberturas.map(c => c.utilizador_nome || 'Sem nome').join(', ')}</div>`
      : '<div style="color:#64748b;margin-top:6px">Sem coberturas registadas</div>';
    const alertaHtml = `
      <div style="margin-top:10px;font-size:12px">
        ${faltasLine}
        ${heLine}
        ${coberturasLine}
        ${semRegistoLine}
      </div>`;

    const addForm = canEdit ? `
      <div class="card mt-16">
        <div class="card-title">➕ Registar quem trabalhou</div>
        <div id="turno-presenca-msg"></div>
        <div class="entradas-form">
          <select id="tp-user" class="entradas-select">
            <option value="">— Funcionário —</option>
            ${pessoas.map(p => `<option value="${p.id}">${p.nome} (${p.role})</option>`).join('')}
            <option value="__ext__">➕ Outro (não está na lista)…</option>
          </select>
          <input id="tp-user-livre" class="entradas-notas" type="text" placeholder="Nome de quem trabalhou" style="display:none"/>
          <select id="tp-cobrindo" class="entradas-select" style="display:none">
            <option value="">— Está cobrindo quem? (opcional) —</option>
            ${lista.filter(r => r.utilizador_id).map(r => `<option value="${r.utilizador_id}">${r.utilizador_nome || r.utilizador_id}</option>`).join('')}
          </select>
          <input id="tp-motivo-falta" class="entradas-notas" type="text" placeholder="Motivo da falta" style="display:none"/>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8">
            <input id="tp-he" type="checkbox" style="width:14px;height:14px"/>
            Aplicar hora extra
          </label>
          <input id="tp-notas" class="entradas-notas" type="text" placeholder="Nota opcional (falta, cobertura, etc.)"/>
          <button type="button" class="btn btn-success btn-sm" onclick="runAction(event, () => addTurnoPresenca('${S.turnoData.id}'))">Registar</button>
        </div>
      </div>` : '';

    el.innerHTML = `
      ${info}
      <div class="card-title" style="margin-bottom:6px">📅 Escalados</div>
      ${escaladosHtml}
      <div id="turno-equipa-real-section">
        <div class="card-title" style="margin:16px 0 6px">✅ Quem realmente trabalhou</div>
        ${reaisHtml}
      </div>
      ${alertaHtml}
      ${addForm}
    `;
    if (canEdit) {
      const userSel = document.getElementById('tp-user');
      const cobSel = document.getElementById('tp-cobrindo');
      const motEl = document.getElementById('tp-motivo-falta');
      const heEl = document.getElementById('tp-he');
      const livreEl = document.getElementById('tp-user-livre');
      const toggleExtra = () => {
        if (!userSel || !cobSel || !heEl || !motEl) return;
        const uid = userSel.value;
        const isExt = uid === '__ext__';
        if (livreEl) {
          livreEl.style.display = isExt ? '' : 'none';
          if (!isExt) livreEl.value = '';
        }
        const naoEscalado = isExt || (!!uid && !escaladosIds.has(String(uid)));
        cobSel.style.display = naoEscalado ? '' : 'none';
        motEl.style.display = naoEscalado ? '' : 'none';
        if (!naoEscalado) motEl.value = '';
      };
      if (userSel) userSel.onchange = toggleExtra;
      toggleExtra();
    }
    renderIrregularidadesTurno();
    loadTurnoAreasEscalados();
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

async function addTurnoPresenca(turnoId) {
  let utilizador_id = val('tp-user');
  const cobrindo_utilizador_id = val('tp-cobrindo');
  const hora_extra = !!document.getElementById('tp-he')?.checked;
  const motivo_falta = val('tp-motivo-falta');
  const notas = val('tp-notas');
  if (!utilizador_id) return err('turno-presenca-msg', 'Seleciona um funcionário');
  // Trabalhador fora da lista de funcionários: regista pelo nome
  // (utilizador_id sintético «ext:<nome>» — sem conta, só presença).
  let ehExterno = false;
  if (utilizador_id === '__ext__') {
    const nomeLivre = val('tp-user-livre').trim();
    if (!nomeLivre) return err('turno-presenca-msg', 'Indica o nome de quem trabalhou');
    utilizador_id = 'ext:' + nomeLivre;
    ehExterno = true;
  }
  const turnoNome = S.turnoData?.nome;
  const d = new Date(S.date + 'T12:00:00Z');
  const day = d.getUTCDay();
  const diaSemana = day === 0 ? 6 : day - 1;
  const template = await api('GET', '/escala/template').catch(() => []);
  const escaladosIds = new Set(template.filter(r => Number(r.dia_semana) === diaSemana && r.turno === turnoNome).map(r => String(r.utilizador_id || '')).filter(Boolean));
  const naoEscalado = ehExterno || !escaladosIds.has(String(utilizador_id));
  // "Cobrindo quem" e "motivo da falta" passam a ser opcionais — antes
  // eram exigidos quando o funcionário não estava escalado.
  try {
    const selU = document.getElementById('tp-user');
    const nomeSel = ehExterno
      ? utilizador_id.slice(4)
      : (selU && selU.selectedOptions && selU.selectedOptions[0] ? selU.selectedOptions[0].textContent.trim() : '');
    const selC = document.getElementById('tp-cobrindo');
    const nomeCob = selC && selC.selectedOptions && selC.selectedOptions[0] && selC.value ? selC.selectedOptions[0].textContent.trim() : null;
    await apiEscrita('POST', `/turnos/${turnoId}/equipa-real`,
      { utilizador_id, cobrindo_utilizador_id: naoEscalado ? (cobrindo_utilizador_id || null) : null, hora_extra, motivo_falta: naoEscalado ? motivo_falta.trim() : '', notas },
      { tid: turnoId, chave: `eqreal:${turnoId}:${utilizador_id}`, desc: 'Quem realmente trabalhou', extra: { nome: nomeSel, cobrindo_nome: nomeCob } });
    show('turno-presenca-msg', '');
    if (document.getElementById('tp-notas')) document.getElementById('tp-notas').value = '';
    await loadEscalaTurno();
  } catch (e) { err('turno-presenca-msg', e.message); }
}

async function removeTurnoPresenca(turnoId, utilizadorIdEncoded) {
  try {
    // Se este registo ainda está na fila offline, basta retirá-lo da fila.
    const uid = decodeURIComponent(utilizadorIdEncoded);
    const fila = escritasOfflineLer();
    const pendente = fila.some((x) => x.chave === `eqreal:${turnoId}:${uid}`);
    if (pendente) {
      escritasOfflineGravar(fila.filter((x) => x.chave !== `eqreal:${turnoId}:${uid}`));
    } else {
      await apiEscrita('DELETE', `/turnos/${turnoId}/equipa-real/${utilizadorIdEncoded}`, {},
        { tid: turnoId, desc: 'Remover de quem trabalhou' });
    }
    await loadEscalaTurno();
  } catch (e) { alert(e.message); }
}

async function registarMotivoFalta(ev, turnoId, utilizadorIdEncoded, nome) {
  const motivo = prompt(`Motivo da falta de ${nome}:`);
  if (!motivo || !motivo.trim()) return;
  await runAction(ev, async () => {
    try {
      await apiEscrita('POST', `/turnos/${turnoId}/faltas`, {
        utilizador_id: decodeURIComponent(utilizadorIdEncoded),
        motivo_falta: motivo.trim()
      }, { tid: turnoId, desc: `Falta — ${nome}` });
      await loadEscalaTurno();
    } catch (e) { alert(e.message); }
  });
}

/** Justificar uma falta ou hora extra de um funcionário (qualquer utilizador autenticado). */
async function justificarPresenca(turnoId, utilizadorIdEncoded, tipo, nome) {
  const label = tipo === 'falta' ? 'falta' : 'hora extra';
  const justAnt = (window._stockosJustifByKey || {})[`${decodeURIComponent(utilizadorIdEncoded)}|${tipo}`];
  const texto = prompt(`Justificação da ${label} de ${nome}:`, justAnt?.justificacao || '');
  if (texto === null) return;
  const t = String(texto || '').trim();
  if (!t) return;
  try {
    const rJ = await apiEscrita('POST', '/presencas/justificacao', {
      turno_id: turnoId,
      utilizador_id: decodeURIComponent(utilizadorIdEncoded),
      tipo,
      justificacao: t
    }, { tid: turnoId, desc: `Justificação — ${nome}` });
    if (rJ && rJ._offline) alert('Justificação guardada neste aparelho — entra no sistema quando a rede voltar.');
    await loadEscalaTurno();
  } catch (e) { alert(e.message); }
}

/** Admin aceita ou rejeita uma justificação. */
async function decidirJustifPresenca(id, aceite) {
  const label = aceite ? 'Aceitar' : 'Rejeitar';
  if (!confirm(`${label} esta justificação?`)) return;
  let observacao = '';
  if (!aceite) {
    const obs = prompt('Observação (opcional):', '');
    if (obs === null) return;
    observacao = String(obs || '').trim();
  }
  try {
    await apiEscrita('POST', '/presencas/justificacao/decisao', { id, aceite, observacao },
      { desc: 'Decisão de justificação' });
    await loadEscalaTurno();
  } catch (e) { alert(e.message); }
}

/** Lê os data-attributes do botão e delega no pagamento (evita problemas
 *  de aspas ao injectar o nome no onclick). */
function pagarComissaoFromBtn(btn) {
  if (!btn || !btn.getAttribute) return;
  const turnoId = btn.getAttribute('data-pc-turno');
  const nome = btn.getAttribute('data-pc-nome');
  const valor = parseFloat(btn.getAttribute('data-pc-valor'));
  return pagarComissaoPromotor(turnoId, nome, valor);
}

/** Cria uma saída de caixa pré-preenchida para pagar a comissão de um
 *  promotor (descrição padronizada com o nome). Recarrega as secções de
 *  saídas e do resumo dos pedidos. */
/** Lê os data-attributes do botão e delega na devolução (evita problemas
 *  de aspas/strings ao injetar IDs no onclick). */
function devolverLinhaFromBtn(btn) {
  if (!btn || !btn.getAttribute) return;
  const turnoId = btn.getAttribute('data-dev-turno');
  const pedidoId = parseInt(btn.getAttribute('data-dev-pedido'), 10);
  const linhaId = parseInt(btn.getAttribute('data-dev-linha'), 10);
  return devolverLinhaPedido(turnoId, pedidoId, linhaId);
}

/** Devolve 1 unidade de uma linha de pedido — chama o endpoint backend
 *  que ajusta stock (turno_vendas), comissão e cria saída de caixa
 *  proporcional ao estorno. */
async function devolverLinhaPedido(turnoId, pedidoId, linhaId) {
  if (!turnoId || !pedidoId || !linhaId) return;
  if (!confirm('Devolver 1 unidade desta linha?\n\n• Stock volta\n• Valor sai da caixa (saída automática)\n• Comissão ajusta')) return;
  try {
    turnoMsgPending('A processar devolução…');
    const resp = await apiEscrita('POST', `/turnos/${turnoId}/pedidos/${pedidoId}/devolver`, { linha_id: linhaId },
      { tid: turnoId, desc: 'Devolução de linha de pedido' });
    turnoMsgOk(resp && resp._offline
      ? 'Devolução guardada neste aparelho (sincroniza sozinha)'
      : `Devolvido · estorno ${fmt(resp.valor_devolvido || 0)}`);
    // Recarrega tudo (pedidos, comissões, caixa).
    try { await loadVendasMenu(turnoId, !!S.turnoCanEdit); } catch (_) {}
    try { await loadRegistosMovimentosSection(turnoId, S.turnoData?.stock || [], !!S.turnoCanEdit); } catch (_) {}
    setTimeout(() => turnoMsgIdle(), 1800);
  } catch (e) {
    turnoMsgErr(e.message);
  }
}

async function pagarComissaoPromotor(turnoId, nome, valor) {
  const v = parseFloat(valor);
  if (!turnoId || !Number.isFinite(v) || v <= 0) return;
  const txt = `Registar saída de caixa para pagar comissão a ${nome}?\n\nValor: ${fmt(v)}`;
  if (!confirm(txt)) return;
  try {
    turnoMsgPending('A registar saída…');
    await apiEscrita('POST', `/turnos/${turnoId}/saidas`, {
      descricao: `Comissão — ${nome}`,
      valor: v,
      notas: 'Pagamento de comissão (gerado a partir do relatório do turno).'
    }, { tid: turnoId, desc: `Pagamento de comissão — ${nome}` });
    turnoMsgOk('Saída registada');
    // Recarrega o resumo dos pedidos (para o relatório de comissões reflectir)
    // e a secção de saídas/entradas.
    try { await loadVendasMenu(turnoId, !!S.turnoCanEdit); } catch (_) {}
    try { await loadRegistosMovimentosSection(turnoId, S.turnoData?.stock || [], !!S.turnoCanEdit); } catch (_) {}
    setTimeout(() => turnoMsgIdle(), 1500);
  } catch (e) {
    turnoMsgErr(e.message);
  }
}

/** Gráfico de linhas (Dinheiro/Transf./TPA/Total) por dia para o período do Histórico. */
function histVendasChartCardHtml(days) {
  if (!days || !days.length) return '';
  const items = days.map((day) => {
    let din = 0, trf = 0, tpa = 0, vendido = 0;
    let geradoM = 0, geradoT = 0, geradoN = 0;
    for (const t of (day.turnos || [])) {
      din += parseFloat(t.caixa_dinheiro) || 0;
      trf += parseFloat(t.caixa_transferencia) || 0;
      tpa += parseFloat(t.caixa_tpa) || 0;
      vendido += parseFloat(t.total_vendas) || 0;
      const tg = parseFloat(t.total_gerado) || 0;
      if (t.nome === 'manha') geradoM += tg;
      else if (t.nome === 'tarde') geradoT += tg;
      else if (t.nome === 'noite') geradoN += tg;
    }
    return { data: String(day.data).slice(0, 10), din, trf, tpa, vendido, geradoM, geradoT, geradoN, total: din + trf + tpa };
  }).sort((a, b) => a.data.localeCompare(b.data));
  const n = items.length;
  const maxVal = items.reduce((m, it) => Math.max(m, it.total, it.vendido, it.geradoM, it.geradoT, it.geradoN), 0) || 1;
  const W = 820, H = 240, padT = 18, padB = 32, padL = 36, padR = 10;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const xAt = (i) => n <= 1 ? padL + chartW / 2 : padL + (i / (n - 1)) * chartW;
  const yAt = (v) => padT + chartH - (v / maxVal) * chartH;
  let svg = '';
  // Linhas-guia horizontais + escala Y
  for (let i = 0; i <= 4; i++) {
    const y = padT + (chartH * i) / 4;
    const v = Math.round((maxVal * (4 - i)) / 4);
    svg += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="#1e293b" stroke-width="1"/>`;
    svg += `<text x="${padL - 4}" y="${y + 3}" fill="#475569" font-size="9" text-anchor="end">${fmtCompact(v)}</text>`;
  }
  /** Catmull-Rom → cubic Bezier para curvas suaves entre pontos. */
  function smoothPath(pts) {
    if (!pts.length) return '';
    if (pts.length === 1) return `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || pts[i + 1];
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
    }
    return d;
  }
  function poly(key, cor, dashed) {
    const pts = items.map((it, i) => ({ x: xAt(i), y: yAt(it[key]) }));
    const dashAttr = dashed ? ' stroke-dasharray="4,3"' : '';
    return `<path d="${smoothPath(pts)}" fill="none" stroke="${cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"${dashAttr}/>`;
  }
  svg += poly('vendido', '#a5b4fc');
  svg += poly('total', '#fbbf24', true);
  svg += poly('geradoM', '#f59e0b');
  svg += poly('geradoT', '#60a5fa');
  svg += poly('geradoN', '#a78bfa');
  // Eixo X
  items.forEach((it, idx) => {
    const showLabel = n <= 16 || idx % Math.ceil(n / 16) === 0;
    if (showLabel) {
      const label = it.data.slice(8, 10) + '/' + it.data.slice(5, 7);
      svg += `<text x="${xAt(idx).toFixed(1)}" y="${H - 10}" fill="#64748b" font-size="10" text-anchor="middle">${label}</text>`;
    }
  });
  // Hot-zone vertical por dia: tooltip multi-linha + click abre Dia.
  items.forEach((it, idx) => {
    const xCenter = xAt(idx);
    const half = n <= 1 ? chartW / 2 : (chartW / (n - 1)) / 2;
    const x0 = Math.max(padL, xCenter - half);
    const x1 = Math.min(W - padR, xCenter + half);
    const tt = [
      it.data,
      `Total vendido ${fmt(it.vendido)}`,
      `Total gerado ${fmt(it.total)}`,
      `Manhã ${fmt(it.geradoM)}`,
      `Tarde ${fmt(it.geradoT)}`,
      `Noite ${fmt(it.geradoN)}`
    ].join('\n');
    svg += `<rect x="${x0.toFixed(1)}" y="${padT}" width="${(x1 - x0).toFixed(1)}" height="${chartH}" fill="transparent" style="cursor:pointer" onclick="runAction(event, async () => { S.date='${it.data}'; await navigate('dia'); })"><title>${escapeHtml(tt)}</title></rect>`;
  });
  return `
    <div class="card" style="margin-bottom:16px">
      <div class="card-title" style="margin-bottom:8px">Vendas por dia</div>
      <div style="display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:#94a3b8;margin-bottom:6px">
        <span><span style="display:inline-block;width:14px;height:2px;background:#a5b4fc;vertical-align:middle;margin-right:4px"></span>Total vendido</span>
        <span><span style="display:inline-block;width:14px;height:0;border-top:2px dashed #fbbf24;vertical-align:middle;margin-right:4px"></span>Total gerado (dia)</span>
        <span><span style="display:inline-block;width:14px;height:2px;background:#f59e0b;vertical-align:middle;margin-right:4px"></span>🌅 Manhã</span>
        <span><span style="display:inline-block;width:14px;height:2px;background:#60a5fa;vertical-align:middle;margin-right:4px"></span>🌤 Tarde</span>
        <span><span style="display:inline-block;width:14px;height:2px;background:#a78bfa;vertical-align:middle;margin-right:4px"></span>🌙 Noite</span>
      </div>
      <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;min-width:${Math.max(320, n * 28)}px;height:${H}px">${svg}</svg>
      </div>
      <div style="font-size:11px;color:#64748b;margin-top:6px">Toca/click sobre um dia para abrir a vista do Dia.</div>
    </div>`;
}

function histVendasProdutosCardHtml(rows) {
  /** Formato fixo a 2 decimais para alinhamento vertical na tabela. */
  const kz2 = (v) => ((parseFloat(v) || 0).toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' Kz');
  const num2 = (v) => (parseFloat(v) || 0).toLocaleString('pt-AO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const list = Array.isArray(rows) ? rows.filter((r) => {
    const q = parseFloat(r.qtd_vendida) || 0;
    const v = parseFloat(r.valor_vendas) || 0;
    return q > 0 || v > 0;
  }) : [];
  const porCat = {};
  let totalQtd = 0;
  let totalValor = 0;
  let totalCusto = 0;
  let totalMargem = 0;
  function custoLinhaProd(r) {
    const q = parseFloat(r.qtd_vendida) || 0;
    const pc = parseFloat(r.preco_compra_ultimo) || 0;
    if (q <= 0 || pc <= 0) return 0;
    return q * pc;
  }
  for (const r of list) {
    let cat = r.categoria || 'outro';
    if (cat === 'bebida' && r.venda_por_copo === true) cat = 'bebida_copo';
    if (!porCat[cat]) porCat[cat] = [];
    porCat[cat].push(r);
    const q = parseFloat(r.qtd_vendida) || 0;
    const v = parseFloat(r.valor_vendas) || 0;
    const custo = custoLinhaProd(r);
    totalQtd += q;
    totalValor += v;
    totalCusto += custo;
    totalMargem += (custo > 0 ? v - custo : 0);
  }
  const ordemCats = ['menu', 'bebida_copo', 'bebida', 'ingredientes', 'outro'];
  // Garantir que «Menu» e «Bebidas (por copo)» aparecem sempre, mesmo sem vendas.
  const catsSempre = ['menu', 'bebida_copo'];
  for (const c of catsSempre) if (!porCat[c]) porCat[c] = [];
  const catsOrdenadas = Object.keys(porCat).sort((a, b) => {
    const ia = ordemCats.indexOf(a);
    const ib = ordemCats.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const secoes = catsOrdenadas.map((cat) => {
    const rowsCat = porCat[cat].sort((a, b) => {
      const qa = parseFloat(a.qtd_vendida) || 0;
      const qb = parseFloat(b.qtd_vendida) || 0;
      if (qb !== qa) return qb - qa;
      return String(a.produto_nome || '').localeCompare(String(b.produto_nome || ''));
    });
    let qCat = 0;
    let vCat = 0;
    let cCat = 0;
    let mCat = 0;
    const trs = rowsCat.map((r) => {
      const q = parseFloat(r.qtd_vendida) || 0;
      const v = parseFloat(r.valor_vendas) || 0;
      const pc = parseFloat(r.preco_compra_ultimo) || 0;
      const custo = custoLinhaProd(r);
      const margem = (custo > 0) ? v - custo : null;
      qCat += q;
      vCat += v;
      cCat += custo;
      if (margem != null) mCat += margem;
      const sigla = r.venda_por_copo === true ? 'copos' : medicaoSigla(r.tipo_medicao || 'unidade');
      const pcCell = pc > 0
        ? `<td style="padding:6px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums">${kz2(pc)}</td>`
        : `<td style="padding:6px 8px;text-align:right;color:#475569;font-size:11px">—</td>`;
      const mgCell = margem != null
        ? (() => {
            const pct = v > 0 ? Math.round((margem / v) * 100) : 0;
            const cor = margem >= 0 ? '#4ade80' : '#f87171';
            return `<td style="padding:6px 8px;text-align:right;color:${cor};font-variant-numeric:tabular-nums">${kz2(margem)} <span style="color:#64748b;font-size:11px">${pct}%</span></td>`;
          })()
        : `<td style="padding:6px 8px;text-align:right;color:#475569;font-size:11px">—</td>`;
      return `
      <tr>
        <td style="padding:6px 8px;color:#e2e8f0">${escapeHtml(r.produto_nome || 'Sem nome')}</td>
        <td style="padding:6px 8px;text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums">${num2(q)} <span style="color:#64748b;font-size:11px">${escapeHtml(sigla)}</span></td>
        <td style="padding:6px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums">${kz2(v)}</td>
        ${pcCell}
        ${mgCell}
        <td style="padding:6px 8px;text-align:right;color:#64748b;font-size:11px">${r.turnos || 0}</td>
      </tr>`;
    }).join('');
    const label = HIST_CAT_LABEL[cat] || cat;
    const trsRender = rowsCat.length ? trs : `
      <tr>
        <td colspan="6" style="padding:8px 10px;color:#475569;font-size:12px;font-style:italic">Sem vendas no período</td>
      </tr>`;
    const pctCat = vCat > 0 && cCat > 0 ? Math.round((mCat / vCat) * 100) : 0;
    return `
      <tr><td colspan="6" class="section-header" style="background:#0f172a;color:#94a3b8;font-size:11px;padding:8px 10px;text-transform:uppercase;letter-spacing:0.06em">${escapeHtml(label)}</td></tr>
      ${trsRender}
      <tr>
        <td style="padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.04em">Subtotal ${escapeHtml(label.toLowerCase())}</td>
        <td style="padding:6px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;font-weight:600">${num2(qCat)}</td>
        <td style="padding:6px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;font-weight:600">${kz2(vCat)}</td>
        <td style="padding:6px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;font-weight:600">${cCat > 0 ? kz2(cCat) : '—'}</td>
        <td style="padding:6px 8px;text-align:right;color:${mCat >= 0 ? '#86efac' : '#fca5a5'};font-variant-numeric:tabular-nums;font-weight:700">${cCat > 0 ? `${kz2(mCat)} <span style="color:#64748b;font-size:11px">${pctCat}%</span>` : '—'}</td>
        <td></td>
      </tr>`;
  }).join('');
  return `
    <div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
      <div style="padding:14px 16px 8px">
        <div class="card-title" style="margin-bottom:4px">🍽️ Quantidade vendida por produto</div>
        <div style="font-size:12px;color:#64748b">Soma de «vendido» por produto em todos os turnos do período (encontrado + entrada − deixado). <strong style="color:#94a3b8">Margem</strong> = valor − (qtd × último preço de compra do armazém); só calcula para produtos com compras registadas.</div>
      </div>
      <div class="table-wrap">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px;color:#94a3b8;font-size:12px">Produto</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Quantidade</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Valor</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px" title="Último preço de compra ao fornecedor por unidade">Compra/un.</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px" title="Valor − Custo (qtd × último preço de compra)">Margem</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Turnos</th>
            </tr>
          </thead>
          <tbody>${secoes}</tbody>
          <tfoot>
            <tr style="border-top:2px solid #334155">
              <td style="padding:10px 8px;color:#f1f5f9;font-weight:700">Total do período</td>
              <td style="padding:10px 8px;text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums;font-weight:700">${num2(totalQtd)}</td>
              <td style="padding:10px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums;font-weight:700">${kz2(totalValor)}</td>
              <td style="padding:10px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums;font-weight:700">${totalCusto > 0 ? kz2(totalCusto) : '—'}</td>
              <td style="padding:10px 8px;text-align:right;color:${totalMargem >= 0 ? '#86efac' : '#fca5a5'};font-variant-numeric:tabular-nums;font-weight:700">${totalCusto > 0 ? `${kz2(totalMargem)} <span style="color:#64748b;font-size:11px">${totalValor > 0 ? Math.round((totalMargem/totalValor)*100) : 0}%</span>` : '—'}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

async function loadHistorico() {
  const ini = val('h-inicio'), fim = val('h-fim');
  show('hist-content','<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const [rows, vendasProdutos] = await Promise.all([
      api('GET', `/historico?inicio=${ini}&fim=${fim}`),
      api('GET', `/historico/vendas-produtos?inicio=${encodeURIComponent(ini)}&fim=${encodeURIComponent(fim)}`).catch(() => [])
    ]);
    if (!rows.length) { show('hist-content','<div class="alert alert-error">Sem dados neste período</div>'); return; }

    let sumVendas = 0, sumGerado = 0, sumFinal = 0;
    for (const r of rows) {
      sumVendas += parseFloat(r.total_vendas) || 0;
      sumGerado += parseFloat(r.total_gerado) || 0;
      sumFinal += parseFloat(r.total_final) || 0;
    }

    const days = [];
    let cur = null;
    for (const r of rows) {
      const d = String(r.data).slice(0, 10);
      if (!cur || cur.data !== d) {
        cur = { data: d, turnos: [] };
        days.push(cur);
      }
      cur.turnos.push(r);
    }

    const ordemTurno = ['manha', 'tarde', 'noite'];
    const rowsHtml = days
      .map((day) => {
        const d = day.data;
        const byNome = {};
        day.turnos.forEach((t) => {
          byNome[t.nome] = t;
        });
        let dayTv = 0;
        let dayTg = 0;
        let dayTf = 0;
        day.turnos.forEach((t) => {
          dayTv += parseFloat(t.total_vendas) || 0;
          dayTg += parseFloat(t.total_gerado) || 0;
          dayTf += parseFloat(t.total_final) || 0;
        });
        const turnosCols = ordemTurno
          .map((nome) => {
            const t = byNome[nome];

async function loadIrregularidadesLista() {
  const ini = val('ir-inicio');
  const fim = val('ir-fim');
  show('irreg-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const [produtos, receitas, histRows] = await Promise.all([
      api('GET', '/produtos?todos=0'),
      api('GET', '/receitas'),
      api('GET', `/historico?inicio=${encodeURIComponent(ini)}&fim=${encodeURIComponent(fim)}`)
    ]);
    if (!histRows.length) {
      show('irreg-content', '<div class="alert alert-error">Sem turnos neste período.</div>');
      return;
    }
    const podeVerDepositos = ['admin','gestor','compras'].includes(S.user?.role);
    /** Cache por data para não chamar /depositos vezes seguidas para o mesmo dia. */
    const depositosCacheByDate = new Map();
    async function getDepositoTurno(dataStr, turnoId) {
      if (!podeVerDepositos) return undefined;
      if (!depositosCacheByDate.has(dataStr)) {
        const p = api('GET', `/depositos?data=${encodeURIComponent(dataStr)}`).catch(() => []);
        depositosCacheByDate.set(dataStr, p);
      }
      const list = await depositosCacheByDate.get(dataStr);
      const arr = Array.isArray(list) ? list : [];
      return arr.find((d) => String(d.turno_id) === String(turnoId)) || null;
    }
    const CHUNK = 6;
    const out = [];
    for (let i = 0; i < histRows.length; i += CHUNK) {
      const chunk = histRows.slice(i, i + CHUNK);
      const part = await Promise.all(
        chunk.map(async (r) => {
          const dataStr = String(r.data).slice(0, 10);
          try {
            const [turnos, vendas, depTurno, equipaReal] = await Promise.all([
              api('GET', `/dia?data=${encodeURIComponent(dataStr)}&turno_id=${encodeURIComponent(r.turno_id)}`),
              api('GET', `/turnos/${r.turno_id}/vendas`),
              getDepositoTurno(dataStr, r.turno_id),
              api('GET', `/turnos/${r.turno_id}/equipa-real`).catch(() => [])
            ]);
            const turno = turnos[0];
            if (!turno) return null;
            const snap = computeIrregularidadesSnapshot(turno, vendas, produtos, receitas, depTurno);
            if (!snap.hasAny) return null;
            return { r, dataStr, snap, equipaReal: Array.isArray(equipaReal) ? equipaReal : [] };
          } catch (_) {
            return null;
          }
        })
      );
      out.push(...part.filter(Boolean));
    }
    if (!out.length) {
      show(
        'irreg-content',
        '<div class="card"><p style="color:#94a3b8;margin:0">Nenhuma irregularidade neste período (caixa, banco, stock, Fino e ingredientes vs menus dentro dos critérios).</p></div>'
      );
      return;
    }
    // Fetch decisões + comentários em bulk
    const turnoIds = out.map(o => o.r.turno_id).join(',');
    const [decisoes, comentarios] = await Promise.all([
      api('GET', `/irregularidades/decisoes?turno_id=${encodeURIComponent(turnoIds)}`).catch(() => []),
      api('GET', `/irregularidades/comentarios?turno_id=${encodeURIComponent(turnoIds)}`).catch(() => [])
    ]);
    const decisoesPorTurno = {};
    for (const d of (decisoes || [])) {
      if (!decisoesPorTurno[d.turno_id]) decisoesPorTurno[d.turno_id] = {};
      decisoesPorTurno[d.turno_id][d.categoria] = d;
    }
    const comentariosPorTurno = {};
    for (const c of (comentarios || [])) {
      if (!comentariosPorTurno[c.turno_id]) comentariosPorTurno[c.turno_id] = {};
      if (!comentariosPorTurno[c.turno_id][c.categoria]) comentariosPorTurno[c.turno_id][c.categoria] = [];
      comentariosPorTurno[c.turno_id][c.categoria].push(c);
    }
    S.irregCache = { out, decisoesPorTurno, comentariosPorTurno };
    renderIrregularidadesListaFromCache();
  } catch (e) {
    show('irreg-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}

function renderIrregularidadesListaFromCache() {
  const cache = S.irregCache;
  if (!cache) return;
  const { out, decisoesPorTurno, comentariosPorTurno } = cache;
  const filtro = S.irregFiltros || { caixa: true, banco: true, stock: true, fino: true, ing: true };
  const sortMode = val('ir-sort') || 'erros';
  const ordered = out.slice();
  if (sortMode === 'erros') {
    ordered.sort((a, b) => {
      const da = (b.snap.numIrr || 0) - (a.snap.numIrr || 0);
      if (da !== 0) return da;
      return String(b.dataStr).localeCompare(String(a.dataStr));
    });
  } else if (sortMode === 'fino') {
    const finoDiff = (s) => Number.isFinite(s?.finoDiffCopos) ? s.finoDiffCopos : -Infinity;
    ordered.sort((a, b) => {
      const da = finoDiff(b.snap) - finoDiff(a.snap);
      if (da !== 0) return da;
      return String(b.dataStr).localeCompare(String(a.dataStr));
    });
  } else {
    ordered.sort((a, b) => String(b.dataStr).localeCompare(String(a.dataStr)));
  }
  const html = ordered
    .map(({ r, dataStr, snap, equipaReal }) => {
      if (filtro[r.nome] === false) return '';
      const decsT = decisoesPorTurno[r.turno_id] || {};
      const filtroEstado = { aceite: filtro.st_aceite !== false, rejeitado: filtro.st_rejeitado !== false, pendente: filtro.st_pendente !== false };
      const blocos = renderIrregularidadeBlocos(snap, r.turno_id, decsT, comentariosPorTurno[r.turno_id] || {}, { filtroTipos: filtro, filtroEstado });
      if (!blocos.trim()) return '';
      const title = `${turnoLabel(r.nome)} — ${dateLabelWithWeekday(dataStr)}`;
      const tid = String(r.turno_id);
      const nomesEquipa = (equipaReal || [])
        .map((p) => String(p.utilizador_nome || '').trim())
        .filter(Boolean);
      const equipaLine = nomesEquipa.length
        ? `Trabalharam: ${escapeHtml(nomesEquipa.join(', '))}`
        : 'Trabalharam: — (sem registo na aba Escala)';
      const tipoDe = (k) => k.startsWith('ing:') ? 'ing' : k;
      const estadoDe = (dec) => !dec ? 'pendente' : (dec.aceite ? 'aceite' : 'rejeitado');
      const catsAll = ['caixa','banco','stock','fino', ...(snap.ingredientesItems || []).map(i => 'ing:' + i.produto_id)];
      const nIrrVisiveis = catsAll.reduce((acc, k) => {
        if (filtro[tipoDe(k)] === false) return acc;
        const hasBlock = (
          (k === 'caixa' && snap.caixaHtml) ||
          (k === 'banco' && snap.bancoHtml) ||
          (k === 'stock' && snap.stockHtml) ||
          (k === 'fino' && snap.finoHtml) ||
          (k.startsWith('ing:') && (snap.ingredientesItems || []).some(i => 'ing:' + i.produto_id === k))
        );
        if (!hasBlock) return acc;
        if (filtroEstado[estadoDe(decsT[k])] === false) return acc;
        return acc + 1;
      }, 0);
      const badge = nIrrVisiveis > 0
        ? `<span style="display:inline-block;padding:2px 8px;background:rgba(251,146,60,0.18);border:1px solid rgba(251,146,60,0.45);border-radius:999px;font-size:11px;font-weight:700;color:#fb923c;margin-left:6px">${nIrrVisiveis} ${nIrrVisiveis === 1 ? 'erro' : 'erros'}</span>`
        : '';
      const finoCopos = Number.isFinite(snap.finoDiffCopos) ? Math.round(snap.finoDiffCopos) : 0;
      const finoBadge = (filtro.fino !== false && finoCopos > 0)
        ? `<span style="display:inline-block;padding:2px 8px;background:rgba(248,113,113,0.18);border:1px solid rgba(248,113,113,0.45);border-radius:999px;font-size:11px;font-weight:700;color:#fca5a5;margin-left:6px">🍺 −${finoCopos} ${finoCopos === 1 ? 'copo' : 'copos'} Fino</span>`
        : '';
      return `
    <div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px">
        <div>
          <div style="font-weight:700;color:#f1f5f9;font-size:15px">⚠️ ${escapeHtml(title)}${badge}${finoBadge}</div>
          <div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(dataStr)} · ${r.estado === 'fechado' ? 'Fechado' : 'Aberto'}</div>
          <div style="font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.4">${equipaLine}</div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, async () => { await openTurnoFromIrreg('${dataStr}', '${tid}'); })">Abrir turno</button>
      </div>
      <div>${blocos}</div>
    </div>`;
    })
    .join('');
  if (!html.trim()) {
    const totaisAtivos = Object.values(S.irregFiltros || {}).filter(Boolean).length;
    const msg = totaisAtivos === 0
      ? 'Selecciona pelo menos um tipo de irregularidade nos filtros acima.'
      : 'Sem irregularidades para mostrar neste período com os filtros actuais.';
    show('irreg-content', `<div class="card"><p style="color:#94a3b8;margin:0">${msg}</p></div>`);
    return;
  }
  show('irreg-content', html);
}

function firstDayOfMonthIso(d) {
  const x = new Date(d + 'T12:00:00');
  return new Date(x.getFullYear(), x.getMonth(), 1).toISOString().split('T')[0];
}
function lastDayOfMonthIso(d) {
  const x = new Date(d + 'T12:00:00');
  return new Date(x.getFullYear(), x.getMonth() + 1, 0).toISOString().split('T')[0];
}

function currentMonthIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
function monthFromIso(monthStr) {
  const m = String(monthStr || '').match(/^(\d{4})-(\d{2})$/);
  if (!m) return null;
  const ano = parseInt(m[1], 10);
  const mes = parseInt(m[2], 10);
  if (!Number.isFinite(ano) || mes < 1 || mes > 12) return null;
  const first = new Date(ano, mes - 1, 1);
  const last = new Date(ano, mes, 0);
  const fmt = (x) => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`;
  return { inicio: fmt(first), fim: fmt(last) };
}
function shiftMonthIso(monthStr, delta) {
  const m = String(monthStr || '').match(/^(\d{4})-(\d{2})$/);
  if (!m) return currentMonthIso();
  const d = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}

async function loadAssiduidade() {
  const mes = val('as-mes') || currentMonthIso();
  const range = monthFromIso(mes);
  if (!range) {
    show('assiduidade-content', '<div class="alert alert-error">Mês inválido.</div>');
    return;
  }
  const ini = range.inicio;
  const fim = range.fim;
  show('assiduidade-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const data = await api('GET', `/assiduidade?inicio=${encodeURIComponent(ini)}&fim=${encodeURIComponent(fim)}`);
    const rows = (data && data.rows) || [];
    if (!rows.length) {
      show('assiduidade-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem dados de utilizadores activos no período.</p></div>');
      return;
    }
    function turnoAbbr(nome) {
      return { manha: 'M', tarde: 'T', noite: 'N' }[nome] || String(nome || '').slice(0, 1).toUpperCase();
    }
    function dataCurta(iso) {
      if (!iso) return '';
      const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
      return m ? m[3] : String(iso);
    }
    /** Abreviatura do dia da semana — convenção do utilizador: Seg=se, Ter=te, Qua=qa, Qui=qu, Sex=se, Sáb=sa, Dom=do. */
    const DOW_ABBR = ['do', 'se', 'te', 'qa', 'qu', 'se', 'sa']; // index = JS getDay()
    function diaSemanaAbbr(iso) {
      const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return '';
      const dt = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
      const idx = dt.getDay();
      return DOW_ABBR[idx] || '';
    }
    function chipsDetalhe(items, cor) {
      const arr = Array.isArray(items) ? items : [];
      if (!arr.length) return '';
      const titulo = arr.map((it) => `${it.data || ''} · ${it.turno || ''}`).join('\n');
      const txt = arr.map((it) => `${dataCurta(it.data)}${turnoAbbr(it.turno)}${diaSemanaAbbr(it.data)}`).join(', ');
      return `<div title="${escapeHtml(titulo)}" style="margin-top:4px;color:${cor.fg};font-size:10px;font-weight:600;line-height:1.4;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:break-word">${escapeHtml(txt)}</div>`;
    }
    const trs = rows.map((r) => {
      const esperados = Number(r.turnos_esperados ?? r.dias_esperados) || 0;
      const esperadosPassados = Number(r.turnos_esperados_passados ?? esperados) || 0;
      const presencas = Number(r.turnos_trabalhados ?? r.dias_trabalhados) || 0;
      const faltas = Number(r.faltas) || 0;
      const horasExtra = Number(r.horas_extra) || 0;
      const baseTaxa = esperadosPassados > 0 ? esperadosPassados : esperados;
      const taxa = baseTaxa > 0
        ? Math.round((Math.min(presencas, baseTaxa) / baseTaxa) * 100)
        : null;
      const taxaTxt = taxa == null ? '—' : `${taxa}%`;
      const taxaCor = taxa == null ? '#64748b' : (taxa >= 95 ? '#4ade80' : taxa >= 80 ? '#fbbf24' : '#f87171');
      const faltasCor = faltas > 0 ? '#f87171' : '#64748b';
      const heCor = horasExtra > 0 ? '#a78bfa' : '#64748b';
      const faltasChips = chipsDetalhe(r.faltas_detalhe, { bg: 'rgba(248,113,113,0.1)', border: 'rgba(248,113,113,0.35)', fg: '#fca5a5' });
      const heChips = chipsDetalhe(r.horas_extra_detalhe, { bg: 'rgba(167,139,250,0.1)', border: 'rgba(167,139,250,0.35)', fg: '#c4b5fd' });
      const trabChips = chipsDetalhe(r.trabalhados_detalhe, { bg: 'rgba(74,222,128,0.1)', border: 'rgba(74,222,128,0.35)', fg: '#86efac' });
      return `
        <tr>
          <td style="padding:8px 10px;color:#e2e8f0;vertical-align:top">
            <div style="font-weight:600">${escapeHtml(r.utilizador_nome || 'Sem nome')}</div>
            <div style="font-size:11px;color:#64748b">${escapeHtml(roleDisplay(r.utilizador_role).toUpperCase())}</div>
          </td>
          <td style="padding:8px 10px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;vertical-align:top">${esperados}</td>
          <td style="padding:8px 10px;text-align:right;vertical-align:top">
            <div style="color:#a5b4fc;font-variant-numeric:tabular-nums;font-weight:600">${presencas}</div>
            ${trabChips}
          </td>
          <td style="padding:8px 10px;text-align:right;vertical-align:top">
            <div style="color:${faltasCor};font-variant-numeric:tabular-nums;font-weight:600">${faltas}</div>
            ${faltasChips}
          </td>
          <td style="padding:8px 10px;text-align:right;vertical-align:top">
            <div style="color:${heCor};font-variant-numeric:tabular-nums;font-weight:600">${horasExtra}</div>
            ${heChips}
          </td>
          <td style="padding:8px 10px;text-align:right;color:${taxaCor};font-variant-numeric:tabular-nums;font-weight:700;vertical-align:top">${taxaTxt}</td>
        </tr>`;
    }).join('');
    show('assiduidade-content', `
      <div class="card" style="margin-bottom:12px">
        <div class="card-title" style="margin-bottom:6px">Nomenclatura das faltas e horas extra</div>
        <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.55">
          Formato de cada etiqueta: <strong style="color:#e2e8f0">&lt;dia do mês&gt;&lt;turno&gt;&lt;dia da semana&gt;</strong>. Exemplo: <code style="background:#1e293b;padding:1px 6px;border-radius:4px;color:#fca5a5">14Nqu</code> = dia 14, turno da <strong style="color:#cbd5e1">Noite</strong>, <strong style="color:#cbd5e1">Quinta</strong>-feira.
          <br><strong style="color:#94a3b8">Turno:</strong> <code style="color:#cbd5e1">M</code> Manhã · <code style="color:#cbd5e1">T</code> Tarde · <code style="color:#cbd5e1">N</code> Noite.
          <br><strong style="color:#94a3b8">Dia da semana:</strong> <code style="color:#cbd5e1">se</code> Seg/Sex · <code style="color:#cbd5e1">te</code> Ter · <code style="color:#cbd5e1">qa</code> Qua · <code style="color:#cbd5e1">qu</code> Qui · <code style="color:#cbd5e1">sa</code> Sáb · <code style="color:#cbd5e1">do</code> Dom.
        </p>
      </div>
      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table style="width:100%;min-width:760px;table-layout:fixed;border-collapse:collapse">
            <colgroup>
              <col style="width:15%"><col style="width:8%"><col style="width:25%"><col style="width:25%"><col style="width:18%"><col style="width:9%">
            </colgroup>
            <thead>
              <tr>
                <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Funcionário</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Esper.</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Trabalhados</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Faltas</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Horas extra</th>
                <th style="text-align:right;padding:8px 10px;color:#94a3b8;font-size:12px">Assid.</th>
              </tr>
            </thead>
            <tbody>${trs}</tbody>
          </table>
        </div>
      </div>
    `);
  } catch (e) {
    show('assiduidade-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}

function audMetodoBadge(m) {
  const bg = { GET: '#1e293b', POST: 'rgba(34,197,94,0.16)', PUT: 'rgba(59,130,246,0.16)', DELETE: 'rgba(248,113,113,0.16)' }[m] || '#1e293b';

  return `<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:${bg};color:${fg};font-size:10px;font-weight:700;letter-spacing:.04em">${escapeHtml(m)}</span>`;
}

function audStatusBadge(status) {
  const s = parseInt(status, 10) || 0;
  let cor = '#64748b';
  if (s >= 200 && s < 300) cor = '#4ade80';
  else if (s >= 400 && s < 500) cor = '#fb923c';
  else if (s >= 500) cor = '#f87171';
  return `<span style="color:${cor};font-weight:700;font-variant-numeric:tabular-nums">${s || '—'}</span>`;
}

function audPayloadResumo(payload) {
  if (!payload) return '';
  let obj = payload;
  if (typeof payload === 'string') {
    try { obj = JSON.parse(payload); } catch (_) { return ''; }
  }
  if (!obj || typeof obj !== 'object') return '';
  const partes = [];
  for (const [k, v] of Object.entries(obj)) {
    if (v == null || v === '') continue;
    if (Array.isArray(v) || typeof v === 'object') {
      partes.push(`${k}=…`);
    } else {
      const txt = String(v);
      partes.push(`${k}=${txt.length > 50 ? txt.slice(0, 50) + '…' : txt}`);
    }
    if (partes.length >= 4) { partes.push('…'); break; }
  }
  return partes.join(' · ');
}

let _audRows = [];

function audApplyFilter() {
  const hideStock = document.getElementById('aud-hide-stock')?.checked;
  const rows = hideStock
    ? _audRows.filter((r) => r.acao !== 'Stock do turno guardado')
    : _audRows;
  if (!rows.length) {
    show('aud-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem registos no período/filtro' + (hideStock && _audRows.length ? ' (tudo oculto pelo filtro activo)' : '') + '.</p></div>');
    return;
  }
  const trs = rows.map((r) => {
    const payloadResumo = audPayloadResumo(r.payload);
    const detalheLinha = [r.descricao, payloadResumo].filter(Boolean).join(' · ');
    return `
      <tr>
        <td style="padding:8px 10px;color:#94a3b8;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap;vertical-align:top">${escapeHtml(r.quando_local || '')}</td>
        <td style="padding:8px 10px;color:#e2e8f0;vertical-align:top">
          <div style="font-weight:600">${escapeHtml(r.utilizador_nome || '— anónimo —')}</div>
          <div style="font-size:11px;color:#64748b">${escapeHtml(roleDisplay(r.utilizador_role).toUpperCase())}</div>
        </td>
        <td style="padding:8px 10px;vertical-align:top">
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${audMetodoBadge(r.metodo)} ${audStatusBadge(r.status)}</div>
          <div style="font-size:13px;color:#cbd5e1;margin-top:3px;font-weight:500">${escapeHtml(r.acao || '')}</div>
          ${detalheLinha ? `<div style="font-size:11px;color:#64748b;margin-top:2px;line-height:1.35">${escapeHtml(detalheLinha)}</div>` : ''}
          <div style="font-size:10px;color:#475569;margin-top:2px;font-family:monospace">${escapeHtml(r.caminho || '')}</div>
        </td>
      </tr>`;
  }).join('');
  const ocultos = _audRows.length - rows.length;
  show('aud-content', `
    <div class="card" style="padding:0;overflow:hidden">
      <div class="table-wrap">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px;white-space:nowrap">Quando</th>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Utilizador</th>
              <th style="text-align:left;padding:8px 10px;color:#94a3b8;font-size:12px">Atividade</th>
            </tr>
          </thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
    </div>
    <p style="margin:10px 0 0;font-size:11px;color:#64748b">A mostrar ${rows.length} registo${rows.length !== 1 ? 's' : ''}${ocultos > 0 ? ` (${ocultos} oculto${ocultos !== 1 ? 's' : ''} pelo filtro)` : ''} — até 300 mais recentes do período.</p>
  `);
}

async function loadAuditoria() {
  const ini = val('aud-inicio');
  const fim = val('aud-fim');
  const horaIni = val('aud-hora-inicio');
  const horaFim = val('aud-hora-fim');
  const q = val('aud-q').trim();
  show('aud-content', '<div class="text-center" style="padding:20px;color:#64748b"><div class="spinner"></div></div>');
  try {
    const params = [];
    if (ini) params.push(`inicio=${encodeURIComponent(ini)}`);
    if (horaIni) params.push(`hora_inicio=${encodeURIComponent(horaIni)}`);
    if (fim) params.push(`fim=${encodeURIComponent(fim)}`);
    if (horaFim) params.push(`hora_fim=${encodeURIComponent(horaFim)}`);
    if (q) params.push(`acao=${encodeURIComponent(q)}`);
    params.push('limit=300');
    const data = await api('GET', `/auditoria?${params.join('&')}`);
    _audRows = (data && data.rows) || [];
    if (!_audRows.length) {
      show('aud-content', '<div class="card"><p style="color:#94a3b8;margin:0">Sem registos no período/filtro.</p></div>');
      return;
    }
    audApplyFilter();
  } catch (e) {
    show('aud-content', `<div class="alert alert-error">${escapeHtml(e.message)}</div>`);
  }
}
