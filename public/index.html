/** Guarda o conteúdo do formulário unificado de Compras como PROFORMA:
 *  mesmas linhas (.fatura-linha), sem foto, sem tocar no saldo/stock. */
async function guardarComoProforma() {
  const msg = document.getElementById('fatura-form-msg');
  const linhas = [];
  let erro = '';
  document.querySelectorAll('#fatura-linhas-body .fatura-linha').forEach((line) => {
    const sel = line.querySelector('.af-prod');
    if (!sel || !sel.value) return;
    if (sel.value === '__novo__') {
      erro = 'Para guardar como proforma escolhe produtos existentes (linhas com «Novo produto» só na compra real).';
      return;
    }
    const modoCaixa = !!line.querySelector('.af-modo-caixa')?.checked;
    if (modoCaixa) {
      const caixas = parseFloat(line.querySelector('.af-caixas')?.value) || 0;
      const qtdPor = parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0;
      const precoCaixa = parseFloat(line.querySelector('.af-preco-caixa')?.value) || 0;
      if (!(caixas > 0) || !(qtdPor > 0) || !(precoCaixa > 0)) {
        erro = 'Nas linhas em caixa indica nº de caixas, qtd por caixa e preço da caixa.';
        return;
      }
      linhas.push({ produto_id: sel.value, caixas, qtd_por_caixa: qtdPor, preco_caixa: precoCaixa });
    } else {
      const q = parseFloat(line.querySelector('.af-qty')?.value);
      const pu = parseFloat(line.querySelector('.af-preco')?.value);
      if (!(q > 0) || !(pu > 0)) {
        erro = 'Em cada linha com produto indica quantidade e preço unitário.';
        return;
      }
      linhas.push({ produto_id: sel.value, quantidade: q, preco_unitario: pu });
    }
  });
  if (erro) { if (msg) msg.innerHTML = `<div class="alert alert-error">${erro}</div>`; return; }
  if (!linhas.length) {
    if (msg) msg.innerHTML = '<div class="alert alert-error">Adiciona pelo menos uma linha com produto, quantidade e preço.</div>';
    return;
  }
  // A proforma guarda o fornecedor como texto.
  const selF = document.getElementById('fx-fornecedor-id');
  let fornecedorTxt = '';
  if (selF) {
    if (selF.value === 'livre') fornecedorTxt = val('fx-fornecedor-livre');
    else if (selF.value) {
      const o = selF.options[selF.selectedIndex];
      fornecedorTxt = o ? o.textContent.trim() : '';
    }
  }
  try {
    const pf = await apiEscrita('POST', '/armazem/proformas', { fornecedor: fornecedorTxt, notas: val('fx-notas'), linhas },
      { desc: 'Proforma de compra' });
    if (msg) {
      msg.innerHTML = pf && pf._offline
        ? '<div class="alert alert-success">🧾 Proforma guardada neste aparelho — entra em «Proformas em curso» quando a rede voltar.</div>'
        : `<div class="alert alert-success">🧾 Proforma #${pf.id} guardada — está em «Proformas em curso»: liberta o valor quando aprovado.</div>`;
    }
    const body = document.getElementById('fatura-linhas-body');
    if (body) { body.innerHTML = ''; addFaturaLinha(); }
    window.__faturaProformaId = null;
    await loadArmazemProformas();
  } catch (e) {
    if (msg) msg.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}

async function loadArmazemProformas() {
  const el = document.getElementById('proformas-list');
  if (!el) return;
  try {
    const list = await api('GET', '/armazem/proformas');
    S.armazemProformas = Array.isArray(list) ? list : [];
    if (!S.armazemProformas.length) {
      el.innerHTML = '<span style="color:#64748b;font-size:13px">Sem proformas em curso — preenche o formulário abaixo e usa «🧾 Guardar como proforma».</span>';
      return;
    }
    el.innerHTML = S.armazemProformas.map((pf) => {
      const badge = pf.estado === 'comprada'
        ? `<span class="badge badge-green" title="${pf.fatura_id ? 'Fatura #' + pf.fatura_id : ''}">✓ Comprada</span>`
        : pf.estado === 'libertada'
          ? '<span class="badge" style="background:#1e3a8a;color:#93c5fd">💰 Valor libertado</span>'
          : '<span class="badge badge-amber">Pendente</span>';
      const linhasTxt = (pf.linhas || []).map((l) => {
        const cx = parseFloat(l.caixas) || 0;
        if (cx > 0) return `${fmtNum(cx)} cx (${fmtNum(l.qtd_por_caixa)}/cx) ${escapeHtml(l.produto_nome || '')}`;
        const isPeso = l.tipo_medicao === 'peso';
        return `${fmtNum(l.quantidade)}${isPeso ? ' kg' : '×'} ${escapeHtml(l.produto_nome || '')}`;
      }).join(' · ');
      const acoes = [];
      if (pf.estado === 'pendente') {
        acoes.push(`<button type="button" class="btn btn-primary btn-sm" title="Cria uma libertação no valor total desta proforma para o dia seleccionado" onclick="runAction(event, () => libertarProforma(${pf.id}))">💰 Libertar valor</button>`);
      }
      if (pf.estado !== 'comprada') {
        acoes.push(`<button type="button" class="btn btn-ghost btn-sm" title="Traz as linhas desta proforma de volta ao formulário de Compras — regista a compra real a partir delas" onclick="runAction(event, () => usarProformaNaFatura(${pf.id}))">📄 Preencher compra</button>`);
      }
      if (pf.estado === 'pendente') {
        acoes.push(`<button type="button" class="btn btn-ghost btn-sm" style="color:#f87171" onclick="runAction(event, () => excluirProforma(${pf.id}))">🗑</button>`);
      }
      return `<div style="border:1px solid #334155;border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#0f172a">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <strong style="color:#e2e8f0">Proforma #${pf.id}</strong>
          ${badge}
          ${pf.fornecedor ? `<span style="color:#94a3b8;font-size:12px">${escapeHtml(pf.fornecedor)}</span>` : ''}
          <span style="margin-left:auto;color:#4ade80;font-weight:700;font-variant-numeric:tabular-nums">${fmt(pf.total_valor)}</span>
        </div>
        ${linhasTxt ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px">${linhasTxt}</div>` : ''}
        ${pf.notas ? `<div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(pf.notas)}</div>` : ''}
        ${acoes.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${acoes.join('')}</div>` : ''}
      </div>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}

async function libertarProforma(id) {
  if (!confirm('Libertar o valor total desta proforma? Cria uma libertação no saldo do armazém para o dia seleccionado.')) return;
  await apiEscrita('POST', `/armazem/proformas/${id}/libertar`, { data: String(S.date || '').slice(0, 10) },
    { desc: 'Libertar valor de proforma' });
  await refreshArmazemFundos();
  await loadArmazemProformas();
}

async function excluirProforma(id) {
  if (!confirm('Eliminar esta proforma pendente?')) return;
  await apiEscrita('DELETE', `/armazem/proformas/${id}`, {}, { desc: 'Eliminar proforma' });
  await loadArmazemProformas();
}

/** Pré-preenche a fatura de compra com as linhas da proforma; ao registar a
 *  fatura, a proforma fica marcada como comprada (proforma_id no payload). */
async function usarProformaNaFatura(id) {
  const pf = (S.armazemProformas || []).find((x) => String(x.id) === String(id));
  if (!pf) { alert('Proforma não encontrada — recarrega a página.'); return; }
  const body = document.getElementById('fatura-linhas-body');
  if (!body) return;
  body.innerHTML = '';
  for (const l of (pf.linhas || [])) {
    addFaturaLinha();
    const row = body.lastElementChild;
    if (!row) continue;
    const sel = row.querySelector('.af-prod');
    if (sel) {
      renderArmazemProdutoOptions(sel, String(l.produto_id), '', true);
      sel.value = String(l.produto_id);
    }
    const cx = parseFloat(l.caixas) || 0;
    const modoSel = row.querySelector('.af-modo');
    if (cx > 0) {
      // Linha em caixa: activa o modo caixa e preenche os campos.
      if (modoSel) { modoSel.value = 'cx'; faturaLinhaModoChange(modoSel); }
      const cs = row.querySelector('.af-caixas'); if (cs) cs.value = cx;
      const qc = row.querySelector('.af-qtd-caixa'); if (qc) qc.value = l.qtd_por_caixa;
      const pc = row.querySelector('.af-preco-caixa');
      if (pc) pc.value = Math.round(((parseFloat(l.valor_total) || 0) / cx) * 100) / 100;
      if (typeof syncFaturaLinhaPrecoUnit === 'function') syncFaturaLinhaPrecoUnit(row);
    } else {
      if (modoSel) { modoSel.value = l.tipo_medicao === 'peso' ? 'kg' : 'un'; faturaLinhaModoChange(modoSel); }
      const q = row.querySelector('.af-qty'); if (q) q.value = l.quantidade;
      const p = row.querySelector('.af-preco'); if (p) p.value = l.preco_unitario;
    }
  }
  const forn = document.getElementById('fx-fornecedor-id');
  const liv = document.getElementById('fx-fornecedor-livre');
  if (pf.fornecedor && forn) {
    const opt = [...forn.options].find((o) => o.textContent.trim().toLowerCase() === pf.fornecedor.trim().toLowerCase());
    if (opt) forn.value = opt.value;
    else { forn.value = 'livre'; if (liv) { liv.style.display = ''; liv.value = pf.fornecedor; } }
  }
  window.__faturaProformaId = pf.id;
  const msg = document.getElementById('fatura-form-msg');
  if (msg) msg.innerHTML = `<div class="alert alert-success">Fatura pré-preenchida da proforma #${pf.id}. Ao registares, a proforma fica marcada como ✓ comprada.</div>`;
  if (typeof updateFaturaExcessoUI === 'function') updateFaturaExcessoUI();
  msg?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/** Próximo número sugerido para a data de emissão: STK-YYYYMMDD-NNN (NNN = ordem no dia). */
function suggestNumeroFaturaArmazem(dataIso, faturas) {
  const day = String(dataIso || '').slice(0, 10);
  const ymd = day.replace(/-/g, '');
  if (!/^\d{8}$/.test(ymd)) {
    const fb = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    return `STK-${fb}-001`;
  }
  const n = (Array.isArray(faturas) ? faturas.length : 0) + 1;
  return `STK-${ymd}-${String(n).padStart(3, '0')}`;
}

function applyFxNumeroSugerido(dataDia, faturas) {
  const el = document.getElementById('fx-numero');
  if (!el || S.page !== 'armazem') return;
  const diaRef = String(dataDia || S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  const sug = suggestNumeroFaturaArmazem(diaRef, faturas);
  const cur = String(el.value || '').trim();
  if (!cur || /^STK-\d{8}-\d{3}$/i.test(cur)) {
    el.value = sug;
  }
}

const armazemInvSaveTimers = Object.create(null);

function armazemInvInputDelegated(e) {
  const t = e.target;
  if (!t || (!t.classList.contains('amz-inp-enc') && !t.classList.contains('amz-inp-deix'))) return;
  scheduleArmazemInventarioSave(t.closest('tr'));
}

function armazemInvBlurDelegated(e) {
  const t = e.target;
  if (!t || (!t.classList.contains('amz-inp-enc') && !t.classList.contains('amz-inp-deix'))) return;
  flushArmazemInventarioSave(t.closest('tr'));
}

function scheduleArmazemInventarioSave(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  clearTimeout(armazemInvSaveTimers[raw]);
  const statusEl = tr.querySelector('.amz-save-status');
  if (statusEl) {
    statusEl.textContent = '…';
    statusEl.style.color = '#94a3b8';
  }
  armazemInvSaveTimers[raw] = setTimeout(() => {
    delete armazemInvSaveTimers[raw];
    saveArmazemInventarioDiaFromRow(tr);
  }, 550);
}

function flushArmazemInventarioSave(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  if (armazemInvSaveTimers[raw]) {
    clearTimeout(armazemInvSaveTimers[raw]);
    delete armazemInvSaveTimers[raw];
  }
  saveArmazemInventarioDiaFromRow(tr);
}

function wireArmazemInventarioAutoSaveOnce() {
  if (S._armazemInvAutoSaveWired) return;
  const invRoot = document.getElementById('armazem-inventario');
  if (!invRoot) return;
  S._armazemInvAutoSaveWired = true;
  invRoot.addEventListener('input', armazemInvInputDelegated);
  invRoot.addEventListener('blur', armazemInvBlurDelegated, true);
}

async function saveArmazemInventarioDiaFromRow(tr) {
  if (!tr) return;
  const raw = tr.getAttribute('data-armazem-prod-id');
  if (!raw) return;
  let produto_id;
  try {
    produto_id = decodeURIComponent(raw);
  } catch (_) {
    return;
  }
  const dataIso = normalizeIsoDateStr(S.date || new Date().toISOString().split('T')[0]);
  const encEl = tr.querySelector('.amz-inp-enc');
  const deixEl = tr.querySelector('.amz-inp-deix');
  const encRaw = String(encEl?.value ?? '').trim();
  const deixRaw = String(deixEl?.value ?? '').trim();
  const encontrado = encRaw === '' ? 0 : parsePtOrIsoNumberString(encRaw);
  const deixado = deixRaw === '' ? 0 : parsePtOrIsoNumberString(deixRaw);
  if (!Number.isFinite(encontrado) || encontrado < 0) {
    return err('armazem-msg', 'Indica um valor válido em «Encontrado».');
  }
  if (!Number.isFinite(deixado) || deixado < 0) {
    return err('armazem-msg', 'Indica um valor válido em «Deixado».');
  }
  const statusEl = tr.querySelector('.amz-save-status');
  try {
    show('armazem-msg', '');
    const rInv = await apiEscrita('PUT', '/armazem/inventario-diario', { data: dataIso, produto_id, encontrado, deixado },
      { chave: `amzinv:${lojaAtivaId()}:${dataIso}:${produto_id}`, desc: 'Inventário do armazém' });
    if (statusEl) {
      statusEl.textContent = rInv && rInv._offline ? '✓⏳' : '✓';
      statusEl.style.color = '#4ade80';
      setTimeout(() => {
        if (statusEl && (statusEl.textContent === '✓' || statusEl.textContent === '✓⏳')) statusEl.textContent = '';
      }, 1600);
    }
  } catch (e) {
    if (statusEl) {
      statusEl.textContent = '!';
      statusEl.style.color = '#f87171';
    }
    err('armazem-msg', e.message);
  }
}

/** Histórico das Faturas / Compras com filtros de data e categoria.
 *  Click numa data → muda S.date e fecha o modal. */
let histArmazemKind = null;
async function abrirHistoricoArmazem(kind) {
  histArmazemKind = kind === 'faturas' ? 'faturas' : 'compras';
  const isFat = histArmazemKind === 'faturas';
  const titulo = isFat ? '📑 Histórico de Faturas' : '🧾 Histórico de Compras';
  let modal = document.getElementById('hist-armazem-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'hist-armazem-modal';
    modal.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.78);z-index:9999;display:flex;align-items:stretch;justify-content:center';
    modal.onclick = (e) => { if (e.target === modal) fecharHistoricoArmazem(); };
    document.body.appendChild(modal);
  }
  modal.style.display = 'flex';

async function recarregarHistoricoArmazem() {
  const body = document.getElementById('hist-armazem-body');
  if (!body || !histArmazemKind) return;
  const isFat = histArmazemKind === 'faturas';
  body.innerHTML = '<div class="text-center" style="padding:32px;color:#64748b"><div class="spinner"></div></div>';
  const dataIni = document.getElementById('hist-data-ini')?.value || '';
  const dataFim = document.getElementById('hist-data-fim')?.value || '';
  const categoria = document.getElementById('hist-categoria')?.value || '';
  const qs = new URLSearchParams();
  qs.set('limit', isFat ? '300' : '500');
  if (dataIni) qs.set('data_inicio', dataIni);
  if (dataFim) qs.set('data_fim', dataFim);
  if (categoria) qs.set('categoria', categoria);
  try {
    const rows = await api('GET', `/armazem/${isFat ? 'faturas' : 'compras'}?${qs.toString()}`);
    if (!Array.isArray(rows) || !rows.length) {
      body.innerHTML = `<div style="color:#64748b;padding:16px 0">Sem ${isFat ? 'faturas' : 'compras'} no intervalo escolhido.</div>`;
      return;
    }
    // Agrupa por data.
    const grupos = new Map();
    for (const r of rows) {
      const d = isFat
        ? String(r.data_emissao || r.criado_em || '').slice(0, 10)
        : String(r.fatura_data_emissao || r.criado_em || '').slice(0, 10);
      if (!d) continue;
      if (!grupos.has(d)) grupos.set(d, []);
      grupos.get(d).push(r);
    }
    const datas = [...grupos.keys()].sort().reverse();
    // Resumo global no topo.
    const totalGeral = rows.reduce(
      (s, r) => s + (parseFloat(isFat ? r.total_valor : r.valor_total) || 0),
      0
    );
    const resumoHtml = `
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:8px 12px;background:#1e293b;border-radius:8px">
        <span style="font-size:12px;color:#94a3b8">${datas.length} dia${datas.length === 1 ? '' : 's'} · ${rows.length} ${isFat ? 'faturas' : 'linhas'}</span>
        <span style="margin-left:auto;font-size:13px;color:#4ade80;font-weight:700">Total: ${fmt(totalGeral)}</span>
      </div>`;
    body.innerHTML = resumoHtml + datas.map((d) => {
      const arr = grupos.get(d);
      const totalKz = arr.reduce(
        (s, r) => s + (parseFloat(isFat ? r.total_valor : r.valor_total) || 0),
        0
      );
      const linhas = isFat
        ? arr.map((f) => `
          <tr>
            <td style="padding:5px 8px;color:#e2e8f0">${escapeHtml(f.numero_fatura || '—')}</td>
            <td style="padding:5px 8px;color:#94a3b8">${escapeHtml(f.fornecedor || f.fornecedor_livre || '—')}</td>
            <td style="padding:5px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums">${fmt(parseFloat(f.total_valor) || 0)}</td>
          </tr>`).join('')
        : arr.map((c) => `
          <tr>
            <td style="padding:5px 8px;color:#e2e8f0">${escapeHtml(c.produto_nome || '—')}</td>
            <td style="padding:5px 8px;text-align:right;color:#94a3b8;font-variant-numeric:tabular-nums">${fmt(parseFloat(c.quantidade) || 0)} ${medicaoSigla(c.tipo_medicao)}</td>
            <td style="padding:5px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums">${fmt(parseFloat(c.preco_unitario) || 0)}</td>
            <td style="padding:5px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums">${fmt(parseFloat(c.valor_total) || 0)}</td>
            <td style="padding:5px 8px;color:#64748b;font-size:11px">${escapeHtml(c.fatura_numero || '—')}</td>
          </tr>`).join('');
      const ths = isFat
        ? '<th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Nº fatura</th><th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Fornecedor</th><th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Total</th>'
        : '<th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Produto</th><th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Qtd</th><th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Unit.</th><th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Total</th><th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase">Fatura</th>';
      return `
        <div class="card" style="margin-bottom:10px;padding:10px 12px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;flex-wrap:wrap">
            <div>
              <div style="font-weight:700;color:#f1f5f9;font-size:14px">${escapeHtml(dateLabelWithWeekday(d))}</div>
              <div style="font-size:11px;color:#64748b">${arr.length} ${isFat ? (arr.length === 1 ? 'fatura' : 'faturas') : (arr.length === 1 ? 'linha' : 'linhas')} · <strong style="color:#4ade80">${fmt(totalKz)}</strong></div>
            </div>
            <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, () => irParaDiaArmazem('${d}'))">Abrir dia →</button>
          </div>
          <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><thead><tr>${ths}</tr></thead><tbody>${linhas}</tbody></table></div>
        </div>`;
    }).join('');
  } catch (e) {
    body.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}

function limparFiltrosHistoricoArmazem() {
  const ini = document.getElementById('hist-data-ini');
  const fim = document.getElementById('hist-data-fim');
  const cat = document.getElementById('hist-categoria');
  if (ini) ini.value = '';
  if (fim) fim.value = '';
  if (cat) cat.value = '';
  return recarregarHistoricoArmazem();
}

function fecharHistoricoArmazem() {
  const m = document.getElementById('hist-armazem-modal');
  if (m) m.style.display = 'none';
}

async function irParaDiaArmazem(data) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) return;
  S.date = data;
  try { persistUiState(); } catch (_) {}
  fecharHistoricoArmazem();
  syncDatePickersAcrossPages();
  await refreshArmazemFundos();
  await loadArmazemData();
}

async function loadArmazemData() {
  try {
    for (const k of Object.keys(armazemInvSaveTimers)) {
      clearTimeout(armazemInvSaveTimers[k]);
      delete armazemInvSaveTimers[k];
    }
    const dataDia = S.date || new Date().toISOString().split('T')[0];
    const q = encodeURIComponent(dataDia);
    const [inventario, compras, produtos, faturas, fornecedores] = await Promise.all([
      api('GET', '/armazem/inventario?data=' + encodeURIComponent(dataDia)),
      api('GET', '/armazem/compras?limit=50&data=' + q),
      api('GET', '/produtos?todos=1'),
      api('GET', '/armazem/faturas?limit=40&data=' + q),
      api('GET', '/fornecedores')

    S.produtos = produtos;
    S.fornecedores = fornecedores;

    if (!inventario.length) {
      show('armazem-inventario', '<div style="color:#64748b">Sem produtos no inventário.</div>');
    } else {
      const diaLabel = dateLabelWithWeekday(dataDia);
      show('armazem-inventario', `<div style="font-size:11px;color:#64748b;margin-bottom:8px">Dia: <strong style="color:#cbd5e1">${diaLabel}</strong></div>
        <div class="table-wrap"><table style="min-width:520px">
        <thead><tr>
          <th>Produto</th>
          <th style="text-align:right">Qtd</th>
          <th style="text-align:right">Encontrado</th>

        <tbody>${inventario.map((i) => {
        const pid = encodeURIComponent(String(i.produto_id));
        const enc = i.armazem_encontrado != null && i.armazem_encontrado !== '' ? parseFloat(i.armazem_encontrado) : 0;
        const deix = i.armazem_deixado != null && i.armazem_deixado !== '' ? parseFloat(i.armazem_deixado) : 0;
        const encStr = Number.isFinite(enc) ? String(enc) : '0';
        const deixStr = Number.isFinite(deix) ? String(deix) : '0';
        return `<tr data-armazem-prod-id="${pid}">
          <td>${escapeHtml(i.produto_nome)} <span style="color:#64748b;font-size:11px">(${medicaoSigla(i.tipo_medicao)})</span></td>
          <td style="text-align:right">${fmtNum(i.quantidade)} ${medicaoSigla(i.tipo_medicao)}</td>
          <td style="text-align:right"><input type="number" min="0" step="any" class="amz-inp-enc" style="width:88px;text-align:right;padding:6px 8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0" value="${encStr}"/></td>
          <td style="text-align:right"><input type="number" min="0" step="any" class="amz-inp-deix" style="width:88px;text-align:right;padding:6px 8px;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0" value="${deixStr}"/></td>
          <td class="amz-save-status" style="font-size:12px;text-align:center;vertical-align:middle;color:#64748b" aria-live="polite"></td>
        </tr>`;
      }).join('')}</tbody></table></div>`);
      wireArmazemInventarioAutoSaveOnce();
    }

    if (!faturas.length) {
      show('armazem-faturas', `<div style="color:#64748b">Nenhuma fatura com data ${dateLabel(dataDia)}.</div>`);
    } else {
      show('armazem-faturas', `<div class="table-wrap"><table>
        <thead><tr><th>Data / hora</th><th>Nº</th><th>Fornecedor</th><th>Foto</th><th style="text-align:right">Total</th><th>Fundos</th></tr></thead>
        <tbody>${faturas.map(f => {
          const exc = (f.justificacao_excesso || '').trim();
          const tag = exc
            ? `<span style="font-size:11px;color:#fbbf24">Acima do saldo</span>`
            : '—';
          const quando = f.criado_em ? dateTimeLabel(f.criado_em) : dateLabel(f.data_emissao);
          const fotoUrl = (f.foto_fatura_url || '').trim();
          const nExtra = parseInt(f.fotos_extra, 10) || 0;
          const fotoCell = (fotoUrl
            ? `<a href="${attrUrl(fotoUrl)}" target="_blank" rel="noopener noreferrer" title="Ver foto"><img src="${attrUrl(fotoUrl)}" alt="" style="max-height:44px;max-width:72px;object-fit:cover;border-radius:6px;border:1px solid #334155;vertical-align:middle"/></a>`
            : '<span style="color:#64748b;font-size:12px">—</span>')
            + (nExtra > 0 ? ` <button type="button" class="btn btn-ghost btn-sm" style="padding:2px 6px;font-size:11px" title="Ver as fotos adicionais desta fatura" onclick="verFotosAnexos('fatura:${f.id}')">+${nExtra} 📷</button>` : '');

    if (!compras.length) {
      show('armazem-compras', `<div style="color:#64748b">Nenhuma linha de compra para ${dateLabel(dataDia)}.</div>`);
    } else {
      show('armazem-compras', `<div class="table-wrap"><table>
        <thead><tr><th>Data / hora</th><th>Fatura</th><th>Produto</th><th>Embalagem</th><th style="text-align:right">Qtd</th><th style="text-align:right">Unit.</th><th style="text-align:right">Total</th>${isAdminArmazem ? '<th style="text-align:right;min-width:140px">Ações</th>' : ''}</tr></thead>
        <tbody>${compras.map(c => `<tr>

          <td style="font-size:11px;color:#64748b">${c.fatura_numero ? c.fatura_numero : '—'}</td>
          <td>${escapeHtml(c.produto_nome)}</td>
          <td style="font-size:12px;color:#94a3b8">${(parseFloat(c.caixas)||0) > 0 && (parseFloat(c.qtd_por_caixa)||0) > 0 ? `${fmtNum(c.caixas)} cx x ${fmtNum(c.qtd_por_caixa)}` : '—'}</td>
          <td style="text-align:right">${fmtNum(c.quantidade)} ${medicaoSigla(c.tipo_medicao)}</td>
          <td style="text-align:right">${fmt(c.preco_unitario)}</td>
          <td style="text-align:right;color:#fbbf24">${fmt(c.valor_total)}</td>
          ${isAdminArmazem ? `<td style="text-align:right;white-space:nowrap">
            <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, () => openEditCompraLinhaModalById(${c.id}))">Editar</button>
            <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, () => deleteCompraLinhaArmazem(event, ${c.id}))">Apagar</button>
          </td>` : ''}
        </tr>`).join('')}</tbody></table></div>`);
    }
    applyFxNumeroSugerido(dataDia, faturas);
    populateFxFornecedorSelect();
  } catch(e) {
    show('armazem-inventario', `<div class="alert alert-error">${e.message}</div>`);
    show('armazem-faturas', `<div class="alert alert-error">${e.message}</div>`);
    show('armazem-compras', `<div class="alert alert-error">${e.message}</div>`);
  }
}

function closeCompraLinhaModal() {
  const el = document.getElementById('compra-linha-modal');
  if (el) el.remove();
}

function openEditCompraLinhaModalById(id) {
  const c = (S.armazemComprasRows || []).find((x) => String(x.id) === String(id));
  if (!c) return;
  openEditCompraLinhaModal(c);
}

function openEditCompraLinhaModal(c) {
  closeCompraLinhaModal();
  const produtos = S.produtos || [];
  const prodOpts = produtos
    .map((p) => `<option value="${p.id}" ${String(p.id) === String(c.produto_id) ? 'selected' : ''}>${escapeHtml(p.nome)}</option>`)
    .join('');
  const div = document.createElement('div');
  div.id = 'compra-linha-modal';
  div.className = 'modal-overlay';
  div.innerHTML = `
    <div class="modal" style="max-width:min(520px,96vw)">
      <div class="modal-header">
        <div class="modal-title">Editar linha de compra</div>
        <button type="button" class="modal-close" id="clm-close" aria-label="Fechar">×</button>
      </div>
      <p style="font-size:12px;color:#94a3b8;margin:-8px 0 12px">Fatura: ${escapeHtml(c.fatura_numero || '—')} · ${c.fatura_id ? 'ligada a fatura' : 'sem fatura'}</p>
      <div class="field"><label>Produto</label><select id="clm-prod">${prodOpts}</select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <div class="field"><label>Quantidade</label><input id="clm-qty" type="number" min="0.001" step="any" value="${String(c.quantidade ?? '')}"/></div>
        <div class="field"><label>Preço unitário (Kz)</label><input id="clm-preco" type="number" min="0.01" step="any" value="${String(c.preco_unitario ?? '')}"/></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
        <div class="field"><label>Nº caixas (opcional)</label><input id="clm-caixas" type="number" min="0" step="any" value="${String(c.caixas ?? '')}"/></div>
        <div class="field"><label>Qtd por caixa (opcional)</label><input id="clm-qtdcaixa" type="number" min="0" step="any" value="${String(c.qtd_por_caixa ?? '')}"/></div>
      </div>
      <div class="field"><label>Fornecedor (linha)</label><input id="clm-forn" type="text" value="${escapeHtml(String(c.fornecedor || ''))}"/></div>
      <div class="field"><label>Notas (opcional)</label><textarea id="clm-notas" rows="2">${escapeHtml(c.notas || '')}</textarea></div>
      <div class="flex gap-8 mt-8">
        <button type="button" class="btn btn-success" id="clm-save">Guardar</button>
        <button type="button" class="btn btn-ghost" id="clm-cancel">Cancelar</button>
      </div>
  </div>`;
  document.body.appendChild(div);
  const stop = (e) => e.stopPropagation();
  div.querySelector('.modal').addEventListener('click', stop);
  div.addEventListener('click', (e) => {
    if (e.target === div) closeCompraLinhaModal();
  });
  document.getElementById('clm-close').addEventListener('click', closeCompraLinhaModal);
  document.getElementById('clm-cancel').addEventListener('click', closeCompraLinhaModal);
  document.getElementById('clm-save').addEventListener('click', () => saveEditCompraLinhaFromModal(c.id));
}

async function saveEditCompraLinhaFromModal(id) {
  const prod = document.getElementById('clm-prod');
  const qtyIn = document.getElementById('clm-qty');
  const precoIn = document.getElementById('clm-preco');
  const cx = document.getElementById('clm-caixas');
  const qcx = document.getElementById('clm-qtdcaixa');
  const forn = document.getElementById('clm-forn');
  const notas = document.getElementById('clm-notas');
  try {
    const payload = {
      produto_id: prod.value,
      quantidade: parseFloat(qtyIn.value),
      caixas: parseFloat(cx.value) || 0,
      qtd_por_caixa: parseFloat(qcx.value) || 0,
      preco_unitario: parseFloat(precoIn.value),
      fornecedor: (forn && forn.value) || '',
      notas: (notas && notas.value) || ''
    };
    await apiEscrita('PUT', '/armazem/compras/' + id, payload, { chave: `amzcompra:${id}`, desc: 'Editar linha de compra' });
    closeCompraLinhaModal();
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch (e) {
    alert(e.message || String(e));
  }
}

async function deleteCompraLinhaArmazem(ev, id) {
  if (!confirm('Remover esta linha de compra? O inventário será recalculado.')) return;
  await runAction(ev, async () => {
    try {
      const r = await apiEscrita('DELETE', '/armazem/compras/' + id, {}, { desc: 'Remover linha de compra' });
      if (r && r.fatura_deleted) alert('Última linha removida: o cabeçalho da fatura foi também removido.');
      await refreshArmazemFundos();
      await loadArmazemData();
    } catch (e) {
      alert(e.message || String(e));
    }
  });
}

async function refreshArmazemFundos() {
  const banner = document.getElementById('armazem-fundos-banner');
  const list = document.getElementById('armazem-libertacoes-list');
  const data = String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  try {
    const [saldoInfo, saidas] = await Promise.all([
      api('GET', '/armazem/saldo?data=' + encodeURIComponent(data)),
      api('GET', '/armazem/saidas-dia?data=' + encodeURIComponent(data))
    ]);
    S.armazemSaldoDia = parseFloat(saldoInfo.saldo) || 0;
    if (banner) {
      banner.innerHTML = `<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin-bottom:8px">
        <span style="color:#94a3b8">Libertado: <strong style="color:#e2e8f0">${fmt(saldoInfo.total_libertacoes)}</strong></span>
        <span style="color:#94a3b8">Faturas (dia): <strong style="color:#e2e8f0">${fmt(saldoInfo.total_faturas)}</strong></span>
        <span style="color:#94a3b8">Saldo disponível: <strong style="color:${S.armazemSaldoDia >= 0 ? '#4ade80' : '#f87171'}">${fmt(saldoInfo.saldo)}</strong></span>
      </div>`;
    }
    if (list) {
      const rows = saldoInfo.libertacoes || [];
      if (!rows.length) {
        list.innerHTML = '<div style="font-size:12px;color:#64748b">Sem libertações neste dia.</div>';
      } else {
        list.innerHTML = `<div class="table-wrap"><table style="font-size:12px">
          <thead><tr><th>Valor</th><th>Notas</th><th></th></tr></thead>
          <tbody>${rows.map(l => `<tr>
            <td style="color:#fbbf24">${fmt(l.valor)}</td>
            <td>${l.notas || '—'}</td>
            <td><button type="button" class="btn btn-ghost btn-sm" onclick="deleteLibertacaoArmazem(event, ${l.id})">Remover</button></td>
          </tr>`).join('')}</tbody></table></div>`;
      }
    }
    const sel = document.getElementById('fx-turno-saida');
    if (sel) {
      const cur = sel.value;
      sel.innerHTML = '<option value="">— Nenhuma / outra origem —</option>' +
        (saidas || []).map(s => `<option value="${s.id}">${fmt(s.valor)} — ${turnoLabel(s.turno_nome)} — ${(s.descricao || '').slice(0, 40)}</option>`).join('');
      if (cur && sel.querySelector(`option[value="${cur}"]`)) sel.value = cur;
    }
    updateFaturaExcessoUI();
  } catch (e) {
    if (banner) banner.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
    S.armazemSaldoDia = 0;
    updateFaturaExcessoUI();
  }
}

async function submitLibertacaoArmazem() {
  const data = String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10);
  const valor = parseFloat(document.getElementById('lib-valor')?.value);
  const notas = val('lib-notas');
  if (!valor || valor <= 0) {
    show('armazem-msg', '<div class="alert alert-error">Indica um valor positivo para a libertação.</div>');
    return;
  }
  try {
    await apiEscrita('POST', '/armazem/libertacoes', { data, valor, notas }, { desc: 'Libertação de fundos' });
    document.getElementById('lib-valor').value = '';
    document.getElementById('lib-notas').value = '';
    show('armazem-msg', '');
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch (e) {
    show('armazem-msg', `<div class="alert alert-error">${e.message}</div>`);
  }
}

async function deleteLibertacaoArmazem(ev, id) {
  if (!confirm('Remover esta libertação?')) return;
  await runAction(ev, async () => {
    try {
      await apiEscrita('DELETE', '/armazem/libertacoes/' + id, {}, { desc: 'Remover libertação' });
      await refreshArmazemFundos();
      await loadArmazemData();
    } catch (e) {
      show('armazem-msg', `<div class="alert alert-error">${e.message}</div>`);
    }
  });
}

function computeFaturaTotalEstimado() {
  let sum = 0;
  document.querySelectorAll('#fatura-linhas-body .fatura-linha').forEach(line => {
    const sel = line.querySelector('.af-prod');
    if (!sel || !sel.value) return;
    const caixasNum = parseFloat(line.querySelector('.af-caixas')?.value) || 0;
    const qtdPor = parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0;
    const qtyRaw = parseFloat(line.querySelector('.af-qty')?.value);
    const qty = (caixasNum > 0 && qtdPor > 0) ? (caixasNum * qtdPor) : qtyRaw;
    const pu = parseFloat(line.querySelector('.af-preco')?.value);
    if (qty > 0 && pu > 0) sum += qty * pu;
  });
  return sum;
}

function updateFaturaExcessoUI() {
  const wrap = document.getElementById('fx-excesso-wrap');
  if (!wrap) return;
  const t = computeFaturaTotalEstimado();
  const saldo = S.armazemSaldoDia != null ? S.armazemSaldoDia : 0;
  if (t > saldo + 0.01) {
    wrap.style.display = '';
  } else {
    wrap.style.display = 'none';
    const j = document.getElementById('fx-justificacao');
    const s = document.getElementById('fx-turno-saida');
    if (j) j.value = '';
    if (s) s.value = '';
  }
}

function renderArmazemProdutoOptions(sel, selectedValue, term, includeNovo) {
  const showNovo = includeNovo !== false;
  const q = (term || '').trim().toLowerCase();
  const filtrados = (S.produtos || []).filter(p => p.ativo && (!q || String(p.nome || '').toLowerCase().includes(q)));
  sel.innerHTML = '<option value="">— Seleciona —</option>' + (showNovo ? '<option value="__novo__">+ Novo produto</option>' : '') +
    filtrados.map(p => `<option value="${p.id}" data-medicao="${p.tipo_medicao || 'unidade'}">${p.nome} (${medicaoSigla(p.tipo_medicao)})</option>`).join('');
  if (selectedValue && sel.querySelector(`option[value="${selectedValue}"]`)) sel.value = selectedValue;
}

function bindArmazemProdutoFilterOnLine(sel, indicatorEl) {
  if (!sel || sel.dataset.filterBinded) return;
  sel.dataset.filterBinded = '1';
  const updateInd = () => {
    if (!indicatorEl) return;
    const q = sel._filterBuf || '';
    indicatorEl.textContent = q ? `Filtro: ${q}` : 'Filtro vazio (digita para procurar, Esc limpa)';
  };
  sel._filterBuf = '';
  updateInd();
  sel.addEventListener('keydown', function(e) {
    const key = e.key || '';
    if (key === 'Escape') {
      sel._filterBuf = '';
      renderArmazemProdutoOptions(sel, sel.value || '', '', true);
      toggleFaturaLinhaNovo(sel);
      updateInd();
      return;
    }
    if (key === 'Backspace') {
      e.preventDefault();
      sel._filterBuf = (sel._filterBuf || '').slice(0, -1);
      renderArmazemProdutoOptions(sel, '', sel._filterBuf, true);
      toggleFaturaLinhaNovo(sel);
      updateInd();
      return;
    }
    if (key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      e.preventDefault();
      sel._filterBuf = (sel._filterBuf || '') + key;
      renderArmazemProdutoOptions(sel, '', sel._filterBuf, true);
      if (sel.options.length > 0) sel.selectedIndex = 0;
      toggleFaturaLinhaNovo(sel);
      updateInd();
    }
  });
  sel.addEventListener('blur', function() {
    sel._filterBuf = '';
    renderArmazemProdutoOptions(sel, sel.value || '', '', true);
    toggleFaturaLinhaNovo(sel);
    updateInd();
  });
}

function toggleFaturaLinhaNovo(sel) {
  const line = sel.closest('.fatura-linha');
  if (!line) return;
  const wrap = line.querySelector('.af-novo-wrap');
  const qty = line.querySelector('.af-qty');
  if (!wrap || !qty) return;
  const isNovo = sel.value === '__novo__';
  wrap.style.display = isNovo ? '' : 'none';
  const med = isNovo
    ? (line.querySelector('.af-medicao')?.value || 'unidade')
    : (sel.options[sel.selectedIndex]?.getAttribute('data-medicao') || 'unidade');
  qty.placeholder = `Qtd (${medicaoSigla(med)})`;
  const medSel = line.querySelector('.af-medicao');
  if (medSel && !medSel.dataset.binded) {
    medSel.dataset.binded = '1';
    medSel.addEventListener('change', () => toggleFaturaLinhaNovo(sel));
  }
}

/** Selector Unidade/Caixa/Peso da linha de compra. A checkbox escondida
 *  .af-modo-caixa continua a comandar a mecânica existente do modo caixa
 *  (campos, sync do preço unitário, colectores). */
function faturaLinhaModoChange(sel) {
  const line = sel.closest('.fatura-linha');
  if (!line) return;
  const modo = sel.value;
  const chk = line.querySelector('.af-modo-caixa');
  if (chk && chk.checked !== (modo === 'cx')) {
    chk.checked = modo === 'cx';
    toggleFaturaLinhaCaixa(chk);
  }
  const qL = line.querySelector('.af-qty-label');
  const pL = line.querySelector('.af-preco-label');
  if (qL) qL.textContent = modo === 'kg' ? 'Peso (kg)' : 'Quantidade';
  if (pL) pL.textContent = modo === 'kg' ? 'Preço por kg (Kz)' : modo === 'cx' ? 'Preço unit. (derivado da caixa)' : 'Preço unitário (Kz)';
  updateFaturaExcessoUI();
}

function toggleFaturaLinhaCaixa(chk) {
  const line = chk.closest('.fatura-linha');
  if (!line) return;
  const fields = line.querySelector('.af-caixa-fields');
  const precoCaixaWrap = line.querySelector('.af-caixa-preco-wrap');
  const qty = line.querySelector('.af-qty');
  const precoUnit = line.querySelector('.af-preco');
  const on = !!chk.checked;
  if (fields) fields.style.display = on ? 'grid' : 'none';
  if (precoCaixaWrap) precoCaixaWrap.style.display = on ? '' : 'none';
  if (qty) qty.disabled = on;
  if (precoUnit) precoUnit.readOnly = on;
  if (on && qty) qty.value = '';
  if (!on && precoUnit) precoUnit.value = '';
  syncFaturaLinhaPrecoUnit(line);
}

function syncFaturaLinhaPrecoUnit(line) {
  const check = line.querySelector('.af-modo-caixa');
  const precoUnit = line.querySelector('.af-preco');
  if (!check || !precoUnit || !check.checked) return;
  const precoCaixa = parseFloat(line.querySelector('.af-preco-caixa')?.value) || 0;
  const qtdPorCaixa = parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0;
  if (precoCaixa > 0 && qtdPorCaixa > 0) {
    precoUnit.value = (precoCaixa / qtdPorCaixa).toFixed(2);
  } else {
    precoUnit.value = '';
  }
}

function bindFaturaLinhaCaixaInputs(line) {
  ['af-preco-caixa', 'af-qtd-caixa', 'af-caixas'].forEach(cls => {
    const el = line.querySelector('.' + cls);
    if (!el || el.dataset.binded) return;
    el.dataset.binded = '1';
    el.addEventListener('input', () => { syncFaturaLinhaPrecoUnit(line); updateFaturaExcessoUI(); });
  });
}

function initFaturaLinha(line) {
  const sel = line.querySelector('.af-prod');
  const ind = line.querySelector('.af-prod-filter-indicator');
  if (sel) {
    renderArmazemProdutoOptions(sel, '', '', true);
    bindArmazemProdutoFilterOnLine(sel, ind);
    sel.addEventListener('change', () => {
      toggleFaturaLinhaNovo(sel);
      // Produto medido a peso → modo kg automático (se ainda não escolhido).
      const opt = sel.options[sel.selectedIndex];
      const med = opt ? opt.getAttribute('data-medicao') : '';
      const modoSel = line.querySelector('.af-modo');
      if (modoSel && med === 'peso' && (modoSel.value === '' || modoSel.value === 'un')) {
        modoSel.value = 'kg';
        faturaLinhaModoChange(modoSel);
      }
      updateFaturaExcessoUI();
    });
    toggleFaturaLinhaNovo(sel);
  }
  bindFaturaLinhaCaixaInputs(line);
  updateFaturaExcessoUI();
}

function removeFaturaLinha(btn) {
  const line = btn.closest('.fatura-linha');
  if (line) line.remove();
}

async function submitFaturaArmazem() {
  const msg = document.getElementById('fatura-form-msg');
  const linhas = [];
  try {
    document.querySelectorAll('#fatura-linhas-body .fatura-linha').forEach(line => {
      const sel = line.querySelector('.af-prod');
      if (!sel || !sel.value) return;
      const payload = {
        quantidade: parseFloat(line.querySelector('.af-qty')?.value),
        caixas: parseFloat(line.querySelector('.af-caixas')?.value) || 0,
        qtd_por_caixa: parseFloat(line.querySelector('.af-qtd-caixa')?.value) || 0,
        preco_unitario: parseFloat(line.querySelector('.af-preco')?.value),
        notas: ''
      };
      if (sel.value === '__novo__') {
        payload.novo_produto = {
          nome: (line.querySelector('.af-nome')?.value || '').trim(),
          categoria: line.querySelector('.af-categoria')?.value || 'outro',
          tipo_medicao: line.querySelector('.af-medicao')?.value || 'unidade',
          preco: parseFloat(line.querySelector('.af-preco-venda')?.value) || 0
        };
        if (!payload.novo_produto.nome) throw new Error('Numa linha com «Novo produto», o nome é obrigatório.');
      } else {
        payload.produto_id = sel.value;
      }
      const caixasNum = payload.caixas;
      const qtdPor = payload.qtd_por_caixa;
      const qtyEff = (caixasNum > 0 && qtdPor > 0) ? (caixasNum * qtdPor) : payload.quantidade;
      const pu = payload.preco_unitario;
      if (!qtyEff || qtyEff <= 0 || !pu || pu <= 0) {
        throw new Error('Em cada linha com produto seleccionado, indique quantidade (ou caixas) e preço unitário válidos.');
      }
      linhas.push(payload);
    });
    if (!linhas.length) {
      if (msg) msg.innerHTML = '<div class="alert alert-error">Adicione pelo menos uma linha com produto, quantidade e preço.</div>';
      return;
    }
  } catch (err) {
    if (msg) msg.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    return;
  }
  try {
    const fotoInp = document.getElementById('fx-foto-fatura');
    if (!fotoInp || !fotoInp.files || !fotoInp.files[0]) {
      if (msg) msg.innerHTML = '<div class="alert alert-error">Anexa a foto da fatura (JPEG, PNG ou WebP) — podes escolher várias.</div>';
      return;
    }
    const fxFiles = Array.from(fotoInp.files);
    const fotoB64 = await comprimirFotoDataUrl(await fileToDataUrl(fxFiles[0]), 1600, 0.8);
    const fotosExtra = [];
    for (const f of fxFiles.slice(1, 12)) {
      fotosExtra.push(await comprimirFotoDataUrl(await fileToDataUrl(f), 1600, 0.8));
    }
    const totalEst = computeFaturaTotalEstimado();
    const saldo = S.armazemSaldoDia != null ? S.armazemSaldoDia : 0;
    const selF = document.getElementById('fx-fornecedor-id');
    const vForn = selF ? selF.value : '';
    let fornecedor_id = '';
    let fornecedorTxt = '';
    if (vForn === 'livre') {
      fornecedorTxt = val('fx-fornecedor-livre');
    } else if (vForn && /^\d+$/.test(vForn)) {
      fornecedor_id = vForn;
    }
    const payload = {
      numero_fatura: val('fx-numero'),
      fornecedor: fornecedorTxt,
      data_emissao: String(S.date || new Date().toISOString().split('T')[0]).slice(0, 10),
      notas: val('fx-notas'),
      linhas,
      foto_fatura_base64: fotoB64
    };
    if (fornecedor_id) payload.fornecedor_id = fornecedor_id;
    if (!fornecedor_id && fornecedorTxt) {
      const ocrNif = val('fx-ocr-fornecedor-nif');
      const ocrTel = val('fx-ocr-fornecedor-tel');
      const ocrEmail = val('fx-ocr-fornecedor-email');
      const ocrMorada = val('fx-ocr-fornecedor-morada');
      if (ocrNif || ocrTel || ocrEmail || ocrMorada) {
        payload.novo_fornecedor = { nome: fornecedorTxt, nif: ocrNif, telefone: ocrTel, email: ocrEmail, morada: ocrMorada };
      }
    }
    if (totalEst > saldo + 0.01) {
      payload.justificacao_excesso = val('fx-justificacao');
      const ts = val('fx-turno-saida');
      if (ts) payload.turno_saida_id = parseInt(ts, 10);
    }
    if (window.__faturaProformaId) payload.proforma_id = window.__faturaProformaId;
    if (fotosExtra.length) payload.fotos_extra_base64 = fotosExtra;
    const rFat = await apiEscrita('POST', '/armazem/faturas', payload, { desc: 'Fatura de compra', timeoutMs: 10000 });
    if (window.__faturaProformaId) {
      window.__faturaProformaId = null;
      loadArmazemProformas().catch(() => {});
    }
    if (msg) msg.innerHTML = rFat && rFat._offline
      ? '<div class="alert alert-success">Fatura guardada neste aparelho — entra no sistema quando a rede voltar.</div>'
      : '<div class="alert alert-success">Fatura registada com sucesso.</div>';
    document.getElementById('fx-numero').value = '';
    const selR = document.getElementById('fx-fornecedor-id');
    if (selR) selR.value = '';
    const livR = document.getElementById('fx-fornecedor-livre');
    if (livR) {
      livR.value = '';
      livR.style.display = 'none';
    }
    ['fx-ocr-fornecedor-nif','fx-ocr-fornecedor-tel','fx-ocr-fornecedor-email','fx-ocr-fornecedor-morada'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    const ocrWrap = document.getElementById('fx-ocr-contacto-wrap');
    if (ocrWrap) ocrWrap.style.display = 'none';
    document.getElementById('fx-notas').value = '';
    const jf = document.getElementById('fx-justificacao');
    if (jf) jf.value = '';
    const ts = document.getElementById('fx-turno-saida');
    if (ts) ts.value = '';
    document.getElementById('fatura-linhas-body').innerHTML = '';
    addFaturaLinha();
    if (fotoInp) fotoInp.value = '';
    await refreshArmazemFundos();
    await loadArmazemData();
  } catch(e) {
    if (msg) msg.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

      <button class="btn btn-primary" id="ocr-fatura-btn" onclick="runAction(event, analisarOcrFatura)">Analisar</button>
      <button class="btn btn-ghost" onclick="fecharOcrFatura()">Cancelar</button>
    </div>`;
  document.body.appendChild(modal);
}

function fecharOcrFatura() {
  const m = document.getElementById('ocr-fatura-modal');
  if (m) m.remove();
}

async function resizeImageForOcr(file, maxDim = 1800, quality = 0.85) {
  const dataUrl = await fileToDataUrl(file);
  const img = await new Promise((resolve, reject) => {
    const i = new Image();
    i.onload = () => resolve(i);
    i.onerror = reject;
    i.src = dataUrl;
  });
  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return canvas.toDataURL('image/jpeg', quality);
}

async function analisarOcrFatura() {
  const inp = document.getElementById('ocr-fatura-file');
  const msg = document.getElementById('ocr-fatura-msg');
  const btn = document.getElementById('ocr-fatura-btn');
  if (!inp || !inp.files || !inp.files[0]) { if (msg) msg.textContent = 'Escolhe uma imagem.'; return; }
  if (btn) btn.disabled = true;
  if (msg) msg.textContent = '⏳ A processar fatura…';
  try {
    const provider = document.querySelector('input[name="ocr-metodo"]:checked')?.value || 'claude';
    const b64 = await resizeImageForOcr(inp.files[0]);
    const data = await api('POST', '/armazem/ocr-fatura', { foto_base64: b64, provider });
    // Transferir a foto carregada para o input «Foto da fatura» — fica anexada quando o utilizador gravar.
    try {
      const fxFoto = document.getElementById('fx-foto-fatura');
      if (fxFoto && typeof DataTransfer !== 'undefined') {
        const dt = new DataTransfer();
        dt.items.add(inp.files[0]);
        fxFoto.files = dt.files;
      }
    } catch (_) { /* navegadores antigos: utilizador anexa manualmente */ }
    aplicarOcrAoFormulario(data);
    fecharOcrFatura();
    const fMsg = document.getElementById('fatura-form-msg');
    const avisos = (data.linhas || []).filter(l => l.aviso).length;
    const novosForn = data.fornecedor && !data.fornecedor.match ? 1 : 0;
    const novosProd = (data.linhas || []).filter(l => !l.match).length;
    const metodoLabel = provider === 'mindee' ? 'Método B' : 'Método A';
    if (fMsg) {
      fMsg.innerHTML = `<div class="alert alert-success">Fatura analisada (${metodoLabel}). Revê os campos antes de gravar.${
        novosForn ? ' 🆕 Fornecedor novo será criado.' : ''
      }${novosProd ? ` 🆕 ${novosProd} produto(s) novo(s) serão criados.` : ''}${
        avisos ? ` ⚠️ ${avisos} linha(s) com aviso.` : ''
      }</div>`;
    }
  } catch (e) {
    if (msg) msg.textContent = '⚠️ ' + e.message;
    if (btn) btn.disabled = false;
  }
}

function aplicarOcrAoFormulario(data) {
  const f = data.fornecedor || {};
  const selF = document.getElementById('fx-fornecedor-id');
  const livF = document.getElementById('fx-fornecedor-livre');
  const ocrWrap = document.getElementById('fx-ocr-contacto-wrap');
  if (selF) {
    if (f.match && f.match.id) {
      selF.value = String(f.match.id);
      if (livF) { livF.value = ''; livF.style.display = 'none'; }
      if (ocrWrap) ocrWrap.style.display = 'none';
    } else {
      selF.value = 'livre';
      if (livF) { livF.style.display = ''; livF.value = String(f.nome || ''); }
      if (ocrWrap) ocrWrap.style.display = '';
      const set = (id, v) => { const e = document.getElementById(id); if (e) e.value = String(v || ''); };
      set('fx-ocr-fornecedor-nif', f.nif);
      set('fx-ocr-fornecedor-tel', f.telefone);
      set('fx-ocr-fornecedor-email', f.email);
      set('fx-ocr-fornecedor-morada', f.morada);
    }
    selF.dispatchEvent(new Event('change'));
  }
  const num = document.getElementById('fx-numero');
  if (num && data.numero_fatura) num.value = data.numero_fatura;
  const body = document.getElementById('fatura-linhas-body');
  if (body) body.innerHTML = '';
  for (const l of (data.linhas || [])) {
    addFaturaLinha();
    const lastLine = body && body.lastElementChild;
    if (!lastLine) continue;
    const sel = lastLine.querySelector('.af-prod');
    if (l.match && l.match.id && sel) {
      renderArmazemProdutoOptions(sel, String(l.match.id), '', true);
      sel.value = String(l.match.id);
      toggleFaturaLinhaNovo(sel);
    } else if (sel) {
      renderArmazemProdutoOptions(sel, '__novo__', '', true);
      sel.value = '__novo__';
      toggleFaturaLinhaNovo(sel);
      const nomeEl = lastLine.querySelector('.af-nome');
      if (nomeEl) nomeEl.value = String(l.descricao || '');
      const medSel = lastLine.querySelector('.af-medicao');
      if (medSel && l.tipo_medicao_detectado) medSel.value = l.tipo_medicao_detectado;
      const catSel = lastLine.querySelector('.af-categoria');
      if (catSel) catSel.value = 'ingredientes';
    }
    const qtyEl = lastLine.querySelector('.af-qty');
    if (qtyEl && l.quantidade) qtyEl.value = String(l.quantidade);
    const pEl = lastLine.querySelector('.af-preco');
    if (pEl && l.preco_unit) pEl.value = String(l.preco_unit);
    if (l.aviso) {
      const av = document.createElement('div');
      av.style.cssText = 'margin-top:6px;padding:6px 8px;background:#451a03;color:#fb923c;border-radius:6px;font-size:11px';
      av.textContent = '⚠️ ' + l.aviso;
      lastLine.appendChild(av);
    }
  }
  if (typeof updateFaturaExcessoUI === 'function') updateFaturaExcessoUI();
}

async function submitFornecedorForm() {
  const nome = val('forn-nome');
  if (!nome) {
    show('fornec-msg', '<div class="alert alert-error">Indica o nome do fornecedor.</div>');
    return;
  }
  const payload = {
    nome,
    nif: val('forn-nif'),
    telefone: val('forn-telefone'),
    email: val('forn-email'),
    morada: val('forn-morada'),
    notas: val('forn-notas')
  };
  try {
    if (window.__fornEditId) {
      const rF = await apiEscrita('PUT', '/fornecedores/' + window.__fornEditId, payload,
        { chave: `forn:${window.__fornEditId}`, desc: 'Actualizar fornecedor' });
      show('fornec-msg', rF && rF._offline
        ? '<div class="alert alert-success">Fornecedor actualizado neste aparelho — sincroniza quando a rede voltar.</div>'
        : '<div class="alert alert-success">Fornecedor actualizado.</div>');
    } else {
      const rF = await apiEscrita('POST', '/fornecedores', payload, { desc: 'Novo fornecedor' });
      show('fornec-msg', rF && rF._offline
        ? '<div class="alert alert-success">Fornecedor guardado neste aparelho — aparece na lista quando a rede voltar.</div>'
        : '<div class="alert alert-success">Fornecedor criado.</div>');
    }

    const b = document.getElementById('forn-btn-submit');

function tagsProduto(p) {
  const tags = [];
  if (p.vendavel) tags.push('vendemos');

  if (!p.vendavel && !p.is_ingrediente) tags.push('consumivel');
  return tags;
}

function renderProdutos() {
  const isAdmin = ['admin', 'gestor', 'compras'].includes(S.user?.role);
  const filtro = S.produtosFiltro || 'todos';
  const filtroCat = S.produtosCategoriaFiltro || 'todas';
  const termo = (S.produtosSearch || '').trim().toLowerCase();
  const todos = S.produtos || [];
  const contagem = {
    todos: todos.length,
    vendemos: todos.filter(p => p.vendavel).length,
    ingrediente: todos.filter(p => p.is_ingrediente).length,
    consumivel: todos.filter(p => !p.vendavel && !p.is_ingrediente).length,
    sem_stock: todos.filter(p => p.em_stock_turno === false).length
  };
  const contCat = {
    todas: todos.length,
    menu: todos.filter(p => p.categoria === 'menu').length,
    ingredientes: todos.filter(p => p.categoria === 'ingredientes').length,
    bebida: todos.filter(p => p.categoria === 'bebida').length,
    outros: todos.filter(p => !['menu','ingredientes','bebida'].includes(p.categoria)).length
  };
  let lista = todos;
  if (filtro === 'vendemos') lista = lista.filter(p => p.vendavel);
  else if (filtro === 'ingrediente') lista = lista.filter(p => p.is_ingrediente);
  else if (filtro === 'consumivel') lista = lista.filter(p => !p.vendavel && !p.is_ingrediente);
  else if (filtro === 'sem_stock') lista = lista.filter(p => p.em_stock_turno === false);
  if (filtroCat !== 'todas') {
    if (filtroCat === 'outros') lista = lista.filter(p => !['menu','ingredientes','bebida'].includes(p.categoria));
    else lista = lista.filter(p => p.categoria === filtroCat);
  }
  if (termo) lista = lista.filter(p => String(p.nome || '').toLowerCase().includes(termo));

  const chip = (id, label, count) => `
    <button type="button" class="prod-chip ${filtro===id?'active':''}" data-filtro="${id}"

  const chipCat = (id, label, count) => `
    <button type="button" class="prod-chip-cat ${filtroCat===id?'active':''}" data-cat="${id}"
      style="padding:6px 12px;border-radius:999px;border:1px solid ${filtroCat===id?'#10b981':'#334155'};background:${filtroCat===id?'#064e3b':'#0f172a'};color:${filtroCat===id?'#a7f3d0':'#94a3b8'};font-size:12px;cursor:pointer;white-space:nowrap">
      ${label} <span style="opacity:.7">${count}</span>
    </button>`;

  const search = `
    <div style="margin-bottom:8px">
      <input type="search" id="prod-search" placeholder="🔍 Procurar produto…" value="${escapeHtml(termo)}"

    </div>`;

  const chips = `
    ${search}

      ${chip('todos','Todos', contagem.todos)}

      ${chipCat('todas','Todas categorias', contCat.todas)}
      ${chipCat('menu','🍽️ Menu', contCat.menu)}
      ${chipCat('ingredientes','🧂 Ingredientes', contCat.ingredientes)}
      ${chipCat('bebida','🥤 Bebidas', contCat.bebida)}
      ${contCat.outros > 0 ? chipCat('outros','📦 Outros', contCat.outros) : ''}
    </div>`;

  const menu   = lista.filter(p => p.categoria==='menu');
  const comida = lista.filter(p => p.categoria==='ingredientes');
  const bebida = lista.filter(p => p.categoria==='bebida');
  const outro  = lista.filter(p => !['menu','ingredientes','bebida'].includes(p.categoria));

  function badgesAll(p) {
    const tags = tagsProduto(p);
    return tags.map(t => {
      if (t === 'vendemos') return '<span style="font-size:10px;background:#14532d;color:#86efac;padding:1px 5px;border-radius:4px">vendemos</span>';
      if (t === 'ingrediente') return '<span style="font-size:10px;background:#3f2d01;color:#fcd34d;padding:1px 5px;border-radius:4px">ingrediente</span>';
      return '<span style="font-size:10px;background:#334155;color:#cbd5e1;padding:1px 5px;border-radius:4px">consumível</span>';
    }).join(' ');
  }

  function prodList(items, label) {
    if (!items.length) return '';
    return `
      <div class="card">
        <div class="card-title">${label}</div>
        ${items.map(p => {
          const av = p.imagem
            ? `<img src="${p.imagem}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;background:#0f172a;border:1px solid #334155;flex-shrink:0"/>`
            : `<div style="width:40px;height:40px;border-radius:50%;background:#1e293b;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;border:1px solid #334155">${escapeHtml(String(p.nome || '?').slice(0, 1).toUpperCase())}</div>`;
          return `
          <div class="produto-row">

              <div class="produto-meta">${p.preco > 0 ? fmt(p.preco) : 'Sem preço'} · ${p.tipo_medicao === 'peso' ? 'Peso' : 'Unidade'} · #${p.ordem}</div>

            </div>` : ''}
          </div>`;
        }).join('')}
      </div>`;
  }

  const corpo = lista.length === 0
    ? '<div class="text-center" style="padding:32px;color:#64748b">Nenhum produto nesta categoria.</div>'
    : prodList(menu,'🍽️ Menu') +
      prodList(comida,'🧂 Ingredientes') +
      prodList(bebida,'🥤 Bebidas') +
      prodList(outro,'📦 Outros');

  // Preserva foco/cursor no input de pesquisa durante o re-render.
  const prevSearch = document.getElementById('prod-search');
  const hadFocus = prevSearch === document.activeElement;
  const selStart = hadFocus ? prevSearch.selectionStart : null;
  show('prod-list', chips + corpo);
  if (hadFocus) {
    const next = document.getElementById('prod-search');
    if (next) {
      next.focus();
      try { next.setSelectionRange(selStart ?? next.value.length, selStart ?? next.value.length); } catch (_) {}
    }
  }

  const root = document.getElementById('prod-list');
  root.onclick = function(e) {
    const chipBtn = e.target.closest('[data-filtro]');
    if (chipBtn) { setProdutoFiltro(chipBtn.getAttribute('data-filtro')); return; }
    const catBtn = e.target.closest('[data-cat]');
    if (catBtn) { setProdutoCategoriaFiltro(catBtn.getAttribute('data-cat')); return; }
    const btn = e.target.closest('[data-edit-id]');
    if (btn) showProdutoForm(btn.getAttribute('data-edit-id'));
  };
}

function closeProdutoModal() {
  const m = document.getElementById('produto-modal');
  if (m) m.remove();
}

      '<div class="field"><label>Imagem (mostrada nos pedidos ao balcão)</label>' +
        '<div style="display:flex;gap:10px;align-items:flex-start">' +
          '<img id="p-imagem-preview" alt="" style="display:none;width:64px;height:64px;border-radius:8px;object-fit:cover;background:#0f172a;border:1px solid #334155"/>' +

  if (pc) pc.value = p && p.comissao_pct != null ? String(parseFloat(p.comissao_pct) || 0) : '0';

  if (p) document.getElementById('p-avulso').checked = !!p.venda_avulso;
  const pv = document.getElementById('p-vendavel');
  if (pv) {
    if (p) pv.checked = !!p.vendavel;
    else pv.checked = true;
  }
  const st = document.getElementById('p-stock-turno');
  if (st) st.checked = p ? p.em_stock_turno !== false : true;
  const pvc = document.getElementById('p-venda-copo');
  if (pvc) pvc.checked = !!(p && p.venda_por_copo && parseFloat(p.kg_por_copo) > 0);
  const pkg = document.getElementById('p-kg-copo');
  if (pkg) pkg.value = p && parseFloat(p.kg_por_copo) > 0 ? p.kg_por_copo : 0.27;
  const ppp = document.getElementById('p-preco-pacote');
  if (ppp) ppp.value = p ? (p.preco_copos_pacote || 0) : 0;
  const pqp = document.getElementById('p-qtd-pacote');
  if (pqp) pqp.value = p ? (p.qtd_copos_pacote || 0) : 0;

    const cat = document.getElementById('p-cat').value;
    const fb = document.getElementById('field-copo-bebida');
    const fd = document.getElementById('field-copo-detalhe');
    const pl = document.getElementById('p-preco-label');
    if (fb) fb.style.display = cat === 'bebida' ? '' : 'none';
    if (cat !== 'bebida' && document.getElementById('p-venda-copo')) document.getElementById('p-venda-copo').checked = false;
    if (fd) fd.style.display = document.getElementById('p-venda-copo')?.checked && cat === 'bebida' ? '' : 'none';

    const cat = document.getElementById('p-cat').value;
    const fa = document.getElementById('field-avulso');
    if (fa) fa.style.display = (cat === 'ingredientes' || cat === 'outro') ? '' : 'none';

  function toggleStockTurnoPorCategoria() {
    const cat = document.getElementById('p-cat')?.value;
    const st = document.getElementById('p-stock-turno');
    const hx = document.getElementById('p-stock-turno-hint-extra');
    if (cat === 'outro') {
      if (st) {
        st.checked = false;
        st.disabled = true;
      }
      if (hx) hx.innerHTML = '<span style="color:#fdba74">Categoria «Outro» não integra a folha de stock do turno.</span>';

      if (st) st.disabled = false;
      if (hx) hx.innerHTML = '';

  const imgFile = document.getElementById('p-imagem-file');
  const imgClear = document.getElementById('btn-imagem-clear');
  const imgMsg = document.getElementById('p-imagem-msg');
  function refreshImagemPreview() {
    const v = imgHidden.value;
    if (v) {
      imgPreview.src = v;
      imgPreview.style.display = '';
      imgClear.style.display = '';
    } else {
      imgPreview.removeAttribute('src');
      imgPreview.style.display = 'none';
      imgClear.style.display = 'none';
    }
  }
  imgHidden.value = (p && p.imagem) ? p.imagem : '';
  refreshImagemPreview();
  imgFile.addEventListener('change', async () => {
    const f = imgFile.files && imgFile.files[0];
    if (!f) return;
    imgMsg.textContent = 'A processar imagem…';
    imgMsg.style.color = '#94a3b8';
    try {
      const dataUrl = await fileToImagemDataUrl(f, 256, 0.82);
      imgHidden.value = dataUrl;
      refreshImagemPreview();
      const kb = Math.round((dataUrl.length * 3) / 4 / 1024);
      imgMsg.textContent = `Pronto (~${kb} KB). Guarda o produto para aplicar.`;
      imgMsg.style.color = '#64748b';
    } catch (e) {
      imgMsg.textContent = e.message || 'Erro a processar imagem';
      imgMsg.style.color = '#f87171';
    } finally {
      imgFile.value = '';
    }
  });
  imgClear.addEventListener('click', () => {
    imgHidden.value = '';
    refreshImagemPreview();
    imgMsg.textContent = 'Imagem removida. Guarda o produto para aplicar.';
    imgMsg.style.color = '#64748b';
  });

  document.getElementById('btn-modal-close').addEventListener('click', closeProdutoModal);
  document.getElementById('btn-modal-cancelar').addEventListener('click', closeProdutoModal);
  document.getElementById('btn-modal-guardar').addEventListener('click', function(ev) {
    runAction(ev, async () => {
      if (isEdit) await saveProduto(p.id); else await createProduto();
    });
  });

  document.getElementById('p-nome').focus();
}

function payloadProdutoCopo() {
  const cat = val('p-cat');
  const copo = cat === 'bebida' && document.getElementById('p-venda-copo')?.checked;
  const qcp = copo ? parseInt(val('p-qtd-pacote'), 10) || 0 : 0;
  return {
    venda_por_copo: !!copo,
    kg_por_copo: copo ? parseFloat(val('p-kg-copo')) || 0 : 0,
    preco_copos_pacote: copo ? parseFloat(val('p-preco-pacote')) || 0 : 0,
    qtd_copos_pacote: qcp,
    forca_pacote: copo && qcp >= 2 && !!document.getElementById('p-forca-pacote')?.checked
  };
}

async function createProduto() {
  try {
    const rP = await apiEscrita('POST','/produtos',{
      nome:val('p-nome'),
      preco:parseFloat(val('p-preco'))||0,
      tipo_medicao:val('p-medicao'),
      categoria:val('p-cat'),
      venda_avulso:document.getElementById('p-avulso')?.checked||false,
      vendavel:!!document.getElementById('p-vendavel')?.checked,
      em_stock_turno:!!document.getElementById('p-stock-turno')?.checked,
      comissao_pct: parseFloat(val('p-comissao')) || 0,
      imagem: val('p-imagem') || null,
      ...payloadProdutoCopo()
    }, { desc: 'Novo produto' });
    closeProdutoModal();
    suc('prod-msg', rP && rP._offline ? 'Produto guardado neste aparelho — aparece na lista quando a rede voltar.' : 'Produto criado!');
    setTimeout(()=>show('prod-msg',''),3000);
    await loadProdutos().catch(() => {});
  } catch(e) { err('prod-form-msg',e.message); }
}

async function saveProduto(id) {
  try {
    const copo = readProdutoCopoFields();
    const med = copo.venda_por_copo && copo.kg_por_copo > 0 ? 'peso' : val('p-medicao');
    const cat = val('p-cat');
    const corpo = {
      nome: val('p-nome'), preco: parseFloat(val('p-preco'))||0,
      tipo_medicao: med,
      categoria: cat, ordem: parseInt(val('p-ordem'))||0,
      ativo: val('p-ativo')==='true',
      venda_avulso: document.getElementById('p-avulso')?.checked||false,
      vendavel: !!document.getElementById('p-vendavel')?.checked,
      em_stock_turno: !!document.getElementById('p-stock-turno')?.checked,
      comissao_pct: parseFloat(val('p-comissao')) || 0,
      imagem: val('p-imagem') || null,
      ...payloadProdutoCopo()
    };
    const rP = await apiEscrita('PUT',`/produtos/${id}`, corpo, { chave: `prod:${id}`, desc: 'Actualizar produto' });
    closeProdutoModal();
    suc('prod-msg', rP && rP._offline ? 'Produto actualizado neste aparelho — sincroniza quando a rede voltar.' : 'Produto actualizado!');
    setTimeout(()=>show('prod-msg',''),3000);
    await loadProdutos().catch(() => {});
  } catch(e) { err('prod-form-msg',e.message); }
}

async function loadReceita(produtoId) {
  try {
    const [receita, todos] = await Promise.all([
      api('GET', `/receitas/${produtoId}`),
      api('GET', '/produtos?todos=1')
    ]);
    const outros = todos.filter(p => p.id !== produtoId);
    // Preencher select de componentes
    const sel = document.getElementById('r-comp');
    if (sel) {
      sel.innerHTML = outros.map(p =>
        `<option value="${p.id}">${p.nome} (${p.categoria})</option>`
      ).join('');
    }
    // Listar componentes actuais
    const listEl = document.getElementById('receita-list');
    if (!listEl) return;
    if (!receita.length) {
      listEl.innerHTML = '<span style="color:#64748b;font-size:13px">Sem componentes. Adicione abaixo.</span>';
      return;
    }
    listEl.innerHTML = receita.map(r =>
      `<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #1e293b">
        <span style="font-size:13px">${r.componente_nome}</span>
        <span style="display:flex;align-items:center;gap:6px">
          <span style="font-size:13px;color:#94a3b8">×${fmtNum(r.quantidade)}</span>
          <button type="button" class="btn btn-ghost btn-sm" style="color:#ef4444" onclick="runAction(event, () => deleteReceita('${r.id}','${produtoId}'))">✕</button>
        </span>
      </div>`
    ).join('');
  } catch(e) {
    const el = document.getElementById('receita-msg');
    if (el) el.innerHTML = `<span style="color:#ef4444">${e.message}</span>`;
  }
}

async function addReceita(produtoId) {
  const compId = document.getElementById('r-comp')?.value;
  const qty = parseFloat(document.getElementById('r-qty')?.value) || 1;
  if (!compId) { alert('Seleccione um componente primeiro.'); return; }
  try {
    await apiEscrita('POST', '/receitas', { produto_id: produtoId, componente_id: compId, quantidade: qty }, { desc: 'Componente de receita' });
    await loadReceita(produtoId);
  } catch(e) {
    alert('Erro ao adicionar: ' + e.message);
  }
}

async function deleteReceita(receitaId, produtoId) {
  try {
    await apiEscrita('DELETE', `/receitas/${receitaId}`, {}, { desc: 'Remover componente de receita' });
    await loadReceita(produtoId);
  } catch(e) { alert(e.message); }
}

async function loadEmpresasPage() {
  const el = document.getElementById('empresas-lista');
  if (!el) return;
  try {
    const emps = await api('GET', '/empresas');
    window.__empresasLista = Array.isArray(emps) ? emps : [];
    S.empresas = window.__empresasLista;
    try { localStorage.setItem('stockos.empresas', JSON.stringify(S.empresas)); } catch (_) {}
    el.innerHTML = window.__empresasLista.map((e) => {
      const ativa = String(e.id) === String(empresaAtivaId());
      const contactos = [
        e.responsavel && `👤 ${escapeHtml(e.responsavel)}`,
        e.telefone && `📞 ${escapeHtml(e.telefone)}`,
        e.email && `✉️ ${escapeHtml(e.email)}`,
        e.nif && `NIF ${escapeHtml(e.nif)}`,
        e.morada && `📍 ${escapeHtml(e.morada)}`
      ].filter(Boolean).join(' · ');
      return `
      <div style="padding:10px 12px;border-radius:10px;background:#0f172a;border:1px solid ${ativa ? 'rgba(74,222,128,0.45)' : '#334155'}">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="flex:1;font-size:14px;font-weight:700;color:#e2e8f0;min-width:140px">🏢 ${escapeHtml(e.nome)}${ativa ? ' <span class="badge badge-green" style="font-size:10px">activa neste aparelho</span>' : ''}</span>
          <span style="font-size:11px;color:#94a3b8">${parseInt(e.lojas_n, 10) >= 0 ? `${e.lojas_n} loja${parseInt(e.lojas_n, 10) === 1 ? '' : 's'}` : ''}</span>
          <button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, () => empresaEditar(${e.id}))">✏️ Editar</button>
          ${!ativa ? `<button type="button" class="btn btn-primary btn-sm" onclick="runAction(event, () => mudarEmpresa(${e.id}))">Entrar →</button>` : ''}
        </div>
        ${contactos ? `<div style="font-size:11px;color:#94a3b8;margin-top:5px;line-height:1.5">${contactos}</div>` : ''}
        ${e.notas ? `<div style="font-size:11px;color:#64748b;margin-top:2px">${escapeHtml(e.notas)}</div>` : ''}
      </div>`;
    }).join('') || '<span style="color:#64748b;font-size:13px">Sem empresas.</span>';
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}
function empresaLimparForm() {
  window.__empresaEditId = null;
  EMPRESA_FORM_CAMPOS.forEach((c) => { const e = document.getElementById('emp-' + c); if (e) e.value = ''; });
  const lj = document.getElementById('emp-loja');
  if (lj) lj.value = '';
  const w = document.getElementById('emp-loja-wrap');
  if (w) w.style.display = '';
  const t = document.getElementById('empresa-form-title');
  if (t) t.textContent = 'Nova empresa';
  const b = document.getElementById('emp-btn-guardar');
  if (b) b.textContent = 'Criar empresa';
  const c = document.getElementById('emp-btn-cancelar');
  if (c) c.style.display = 'none';
}
function empresaEditar(id) {
  const e = (window.__empresasLista || []).find((x) => String(x.id) === String(id));
  if (!e) return;
  window.__empresaEditId = id;
  EMPRESA_FORM_CAMPOS.forEach((c) => { const inp = document.getElementById('emp-' + c); if (inp) inp.value = e[c] || ''; });
  const w = document.getElementById('emp-loja-wrap');
  if (w) w.style.display = 'none'; // lojas gerem-se em Configurações, dentro da empresa
  const t = document.getElementById('empresa-form-title');
  if (t) t.textContent = `Editar empresa — ${e.nome}`;
  const b = document.getElementById('emp-btn-guardar');
  if (b) b.textContent = 'Guardar alterações';
  const cb = document.getElementById('emp-btn-cancelar');
  if (cb) cb.style.display = '';
  document.getElementById('empresa-form-title')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
async function empresaGuardar() {
  const msg = document.getElementById('empresas-msg');
  const setMsg = (t, ok) => { if (msg) msg.innerHTML = `<div class="alert ${ok ? 'alert-success' : 'alert-error'}">${t}</div>`; };
  const body = {};
  EMPRESA_FORM_CAMPOS.forEach((c) => { body[c] = val('emp-' + c); });
  if (!body.nome) { setMsg('Indica o nome da empresa.', false); return; }
  try {
    const editId = window.__empresaEditId;
    let r;
    if (editId) {
      r = await apiEscrita('PUT', `/empresas/${editId}`, body, { chave: `empresa:${editId}`, desc: 'Ficha da empresa' });
      setMsg(r && r._offline ? 'Ficha guardada neste aparelho — sincroniza quando a rede voltar.' : 'Ficha da empresa actualizada.', true);
    } else {
      body.loja_nome = val('emp-loja');
      r = await apiEscrita('POST', '/empresas', body, { desc: `Criar empresa ${body.nome}` });
      setMsg(r && r._offline
        ? 'Empresa guardada neste aparelho — sincroniza quando a rede voltar.'
        : `Empresa «${escapeHtml(body.nome)}» criada${r && r.loja ? ` com a loja «${escapeHtml(r.loja.nome)}»` : ''}. Usa «Entrar →» para trabalhar nela.`, true);
    }
    empresaLimparForm();
    await loadEmpresasPage().catch(() => {});
    refrescarLojas();
  } catch (e) { setMsg('Erro: ' + escapeHtml(e.message), false); }
}

        l.telefone && `📞 ${escapeHtml(l.telefone)}`,

      ].filter(Boolean).join(' · ');
      return `

        <div style="display:flex;align-items:center;gap:8px">

        ${contactos ? `<div style="font-size:11px;color:#94a3b8;margin-top:4px;line-height:1.5">${contactos}</div>` : ''}

    el.innerHTML = `<span style="color:#ef4444;font-size:12px">${escapeHtml(e.message)}</span>`;

function configLimparFormLoja() {

  LOJA_FORM_CAMPOS.forEach((c) => { const e = document.getElementById('lj-' + c); if (e) e.value = ''; });

}
function configEditarLoja(id) {
  const l = (window.__cfgLojas || []).find((x) => String(x.id) === String(id));
  if (!l) return;
  window.__lojaEditId = id;
  LOJA_FORM_CAMPOS.forEach((c) => { const e = document.getElementById('lj-' + c); if (e) e.value = l[c] || ''; });
  const t = document.getElementById('cfg-loja-form-title');
  if (t) t.textContent = `Editar loja — ${l.nome}`;
  const b = document.getElementById('lj-btn-guardar');
  if (b) b.textContent = 'Guardar alterações';

  if (cb) cb.style.display = '';
  document.getElementById('cfg-loja-form')?.scrollIntoView({ block: 'center', behavior: 'smooth' });

async function configGuardarLoja() {
  const msg = document.getElementById('cfg-lojas-msg');
  const body = {};
  LOJA_FORM_CAMPOS.forEach((c) => { body[c] = val('lj-' + c); });
  if (!body.nome) { if (msg) msg.textContent = 'Indica o nome da loja.'; return; }
  try {
    const editId = window.__lojaEditId;
    const r = editId
      ? await apiEscrita('PUT', `/lojas/${editId}`, body, { chave: `loja:${editId}`, desc: 'Ficha da loja' })
      : await apiEscrita('POST', '/lojas', body, { desc: `Criar loja ${body.nome}` });
    if (msg) {
      msg.textContent = r && r._offline
        ? 'Ficha guardada neste aparelho — sincroniza quando a rede voltar.'
        : (editId ? 'Ficha da loja actualizada.' : `Loja «${body.nome}» criada.`);
    }
    configLimparFormLoja();
    await configLojasLoad().catch(() => {});
    refrescarLojas();
  } catch (e) { if (msg) msg.textContent = 'Erro: ' + e.message; }
}
async function configToggleLoja(id, ativar) {
  if (!ativar && String(id) === String(lojaAtivaId())) {
    alert('Esta é a loja activa neste aparelho — muda de loja antes de a desactivar.');
    return;
  }
  if (!confirm(ativar ? 'Reactivar esta loja?' : 'Desactivar esta loja? Deixa de aparecer no selector (os dados ficam guardados).')) return;
  try {
    await apiEscrita('PUT', `/lojas/${id}`, { ativo: !!ativar }, { chave: `lojaativo:${id}`, desc: 'Estado da loja' });
    await configLojasLoad().catch(() => {});
    refrescarLojas();
  } catch (e) { alert(e.message); }
}

async function configTurnosBloqueadosChange() {
  const bloq = [...document.querySelectorAll('input[data-turno-bloq]')]
    .filter((i) => i.checked)
    .map((i) => i.getAttribute('data-turno-bloq'));
  const msg = document.getElementById('cfg-turnos-bloq-msg');
  try {
    if (msg) { msg.style.color = '#64748b'; msg.textContent = 'A guardar…'; }
    const r = await apiEscrita('PUT', '/config/turnos-bloqueados', { bloqueados: bloq },
      { chave: `cfg:turnos-bloqueados:${empresaAtivaId()}`, desc: 'Turnos bloqueados' });
    const saved = r && Array.isArray(r.bloqueados) ? r.bloqueados : bloq;
    S.turnosBloqueados = saved;
    if (msg) msg.textContent = (saved.length
      ? `Bloqueados: ${saved.map((n) => turnoLabel(n)).join(', ')}.`
      : 'Nenhum turno bloqueado — todos podem ser abertos.') + (r && r._offline ? ' (guardado neste aparelho)' : '');
  } catch (e) {
    if (msg) { msg.style.color = '#ef4444'; msg.textContent = 'Erro ao guardar: ' + e.message; }
  }
}

/** Realça a obrigatoriedade da loja fixa conforme o role escolhido. */
function userFormToggleLoja() {
  const role = val('u-role');
  const wrap = document.getElementById('u-loja-wrap');
  if (!wrap) return;
  const lbl = wrap.querySelector('label');
  const fixa = ['operador', 'compras'].includes(role);
  if (lbl) {
    lbl.innerHTML = fixa
      ? 'Loja fixa <span style="font-weight:400;color:#f87171">(obrigatória para este role)</span>'
      : 'Loja fixa <span style="font-weight:400;color:#64748b">(operador / operador de sistema trabalham numa só loja)</span>';
  }
}
