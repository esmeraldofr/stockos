async function deltaVenda(turnoId, prodId, delta) {
  const prev = vendasBuf[prodId] || 0;
  vendasBuf[prodId] = Math.max(0, prev + delta);
  const el = document.getElementById(`venda-qty-${prodId}`);
  if (el) el.textContent = vendasBuf[prodId];
  refreshVendasTotal();
  try {
    await api('POST', `/turnos/${turnoId}/vendas`, { produto_id: prodId, quantidade: vendasBuf[prodId] });
    const cfg = bebidaCopoCfg[prodId];
    if (cfg && cfg.kgPorCopo > 0) {
      if (!stockBuf[prodId]) stockBuf[prodId] = { encontrado:0, entrada:0, deixado:0, fechados:0 };
      const kgAdj = -delta * cfg.kgPorCopo;
      stockBuf[prodId].deixado = Math.max(0, (parseFloat(stockBuf[prodId].deixado) || 0) + kgAdj);
      updateStock(prodId, 'deixado', fmtNum(stockBuf[prodId].deixado));
    }
  } catch(e) {
    vendasBuf[prodId] = prev;
    if (el) el.textContent = vendasBuf[prodId];
    refreshVendasTotal();
    alert('Erro ao registar venda: ' + e.message);
  }
}

async function vendaQtyInputBlur(inp) {
  const prodId = inp.dataset.vendaPid;
  const turnoId = inp.dataset.vendaTurno;
  if (!prodId || !turnoId) return;
  const novaQty = Math.max(0, Math.floor(parseFloat(inp.value) || 0));
  inp.value = novaQty;
  const prev = vendasBuf[prodId] || 0;
  if (novaQty === prev) return;
  const delta = novaQty - prev;
  vendasBuf[prodId] = novaQty;
  refreshVendasTotal();
  try {
    await api('POST', `/turnos/${turnoId}/vendas`, { produto_id: prodId, quantidade: novaQty });
    const cfg = bebidaCopoCfg[prodId];
    if (cfg && cfg.kgPorCopo > 0) {
      if (!stockBuf[prodId]) stockBuf[prodId] = { encontrado:0, entrada:0, deixado:0, fechados:0 };
      const kgAdj = -delta * cfg.kgPorCopo;
      stockBuf[prodId].deixado = Math.max(0, (parseFloat(stockBuf[prodId].deixado) || 0) + kgAdj);
      updateStock(prodId, 'deixado', fmtNum(stockBuf[prodId].deixado));
    }
  } catch(e) {
    vendasBuf[prodId] = prev;
    inp.value = prev;
    refreshVendasTotal();
    alert('Erro ao registar venda: ' + e.message);
  }
}

function updateStock(pid, field, value) {
  const k = prodIdKey(pid);
  if (!k) return;
  if (!stockBuf[k]) stockBuf[k] = { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
  if (field === 'encontrado' || field === 'deixado') {
    const t = String(value ?? '').trim();
    stockBuf[k][field] = t === '' ? null : parseRaw(value);
  } else {
    stockBuf[k][field] = parseRaw(value);
  }
  const inp = document.querySelector(`input[type="number"][data-stock-pid="${k}"][data-stock-field="${field}"]`);
  if (inp && document.activeElement !== inp) {
    const n = stockBuf[k][field];
    inp.value =
      field === 'encontrado' || field === 'deixado' ? fmtStockEncontradoAttr(n) : fmtStockNumberAttr(n);
  }
  const { encontrado: enc, entrada: ent, deixado: dei } = stockBuf[k];
  const prod = S.turnoData?.stock?.find((s) => prodIdKey(s.produto_id) === k);
  const vend = vendidoQtyFromStockParts(enc, ent, dei);
  const ve = document.getElementById(`vend-${k}`);
  const tipoM = prod?.tipo_medicao || 'unidade';
  if (ve) ve.textContent = Number.isFinite(vend) && vend > 0 ? `${fmtNum(vend)} ${medicaoSigla(tipoM)}` : '';
  refreshMenuQtys();
  renderIrregularidadesTurno();
  maybeClearTurnoStickyAfterStockCaixaOk();
  // Auto-save
  autoSaveSchedule();
}

/**
 * Quantidade «vendida» como na aba Vendas: menu/copos/avulso em vendasBuf; resto = enc+entrada−deixado (stock).
 */
function getVendidoRegistadoEmVendas(s) {
  const pid = prodIdKey(s.produto_id);
  if (!pid) return 0;
  if (menuProdIds.length && menuProdIds.some((id) => prodIdKey(id) === pid)) {
    return Math.max(0, parseFloat(vendasBuf[pid]) || 0);
  }
  if (bebidaCopoProdIds.length && bebidaCopoProdIds.includes(pid)) {
    return Math.max(0, parseFloat(vendasBuf[pid]) || 0);
  }
  if (avulsoProdIds.length && avulsoProdIds.some((id) => prodIdKey(id) === pid)) {
    return calcStandaloneQty(pid);
  }
  const b = getStockLineForProduto(pid);
  let vend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
  if (!Number.isFinite(vend)) return 0;
  vend = Math.max(0, vend);
  if (vend <= 0 && parseFloat(s.vendido) > 0) vend = Math.max(0, parseFloat(s.vendido));
  return vend;
}

/** 1 copo Fino = 0,270 kg (barril → copos em irregularidades). */
const KG_FINO_COPO = 0.27;
/** Pesos de referência do barril de Fino. */
const KG_FINO_BARRIL_CHEIO = 61.05; // peso bruto na balança
const KG_FINO_BARRIL_VAZIO = 12.9;  // tara
const KG_FINO_BARRIL_NET = KG_FINO_BARRIL_CHEIO - KG_FINO_BARRIL_VAZIO; // 48,15 kg líquidos por barril novo
function prodNomeNorm(n) {
  return String(n || '').trim().toLowerCase();
}
/** Chave estável para mapas `produto_id` / `componente_id` (SERIAL ou UUID). Evita `parseInt` em UUIDs. */
function prodIdKey(id) {
  if (id == null || id === '') return '';
  const s = String(id).trim();
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) return s.toLowerCase();
  return s;
}
/** Bloco irregularidades Batata: nome legado ou prefixo `Batata Pré-frita …` (ex.: "… stock"). NBSP → espaço. */
function isProdutoBatataIrreg(nome) {
  let bn = String(nome || '')
    .trim()
    .toLowerCase()
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return bn === 'batata pré-frita' || bn.startsWith('batata pré-frita ');
}
/** Ingrediente Coxa nas irregularidades: nome exacto «Coxa» ou prefixo «Coxa …» (ex.: «Coxa stock»). */
function isProdutoCoxaIrreg(nome) {
  let bn = String(nome || '')
    .trim()
    .toLowerCase()
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return bn === 'coxa' || bn.startsWith('coxa ');
}
function resolveProdutoIdPorNomeFromLists(stockArr, produtosArr, nomeNorm) {
  const row = stockArr.find((s) => prodNomeNorm(s.produto_nome) === nomeNorm);
  if (row) return String(row.produto_id);
  const pr = (produtosArr || []).find((p) => prodNomeNorm(p.nome) === nomeNorm);
  return pr ? String(pr.id) : null;
}
/** Peso do recipiente vazio (barril): usa `peso_tara_kg` ou 12,9 kg. */
function getFinoBarrilRecipienteKgFromRow(stockRow) {
  if (!stockRow || prodNomeNorm(stockRow.produto_nome) !== 'fino barril') return null;
  const t = parseFloat(stockRow.peso_tara_kg);
  return Number.isFinite(t) && t > 0 ? t : 12.9;
}
/** Encontrado/Deixado a 0 → peso do recipiente (só turno aberto). */
function aplicarFinoBarrilZeroParaRecipienteKg(turno, canEdit) {
  if (!canEdit || !turno?.stock?.length) return false;
  const row = turno.stock.find((s) => prodNomeNorm(s.produto_nome) === 'fino barril');
  if (!row) return false;
  const kg = getFinoBarrilRecipienteKgFromRow(row);
  if (kg == null) return false;
  const sid = prodIdKey(row.produto_id);
  if (!sid || !stockBuf[sid]) return false;
  let ch = false;
  const encB = stockBuf[sid].encontrado;
  if (encB == null || encB === '' || parseFloat(encB) === 0) {
    stockBuf[sid].encontrado = kg;
    ch = true;
  }
  const deB = stockBuf[sid].deixado;
  if (deB == null || deB === '' || parseFloat(deB) === 0) {
    stockBuf[sid].deixado = kg;
    ch = true;
  }
  return ch;
}

/** Nomes de quem registou presença no turno (equipa real), para o cartão Irregularidades. */
async function refreshIrregularidadesEquipaLine(show) {
  const el = document.getElementById('turno-irregularidades-equipa');
  if (!el) return;
  if (!show) {
    el.textContent = '';
    return;
  }
  const tid = S.turnoData?.id;
  if (!tid) {
    el.textContent = '';
    return;
  }
  try {
    const equipaReal = await api('GET', `/turnos/${tid}/equipa-real`);
    const names = (equipaReal || [])
      .map((r) => String(r.utilizador_nome || '').trim())
      .filter(Boolean);
    el.textContent = names.length
      ? `Trabalharam: ${names.join(', ')}`
      : 'Trabalharam: — (sem registo na aba Escala)';
  } catch (_) {
    el.textContent = '';
  }
}

/** Tolerância ao comparar quantidade ingrediente vs Σ menus (Batata, Coxa, …; ruído float). */
const KG_IRREG_COMPONENTE_EPS = 0.02;

/**
 * Quantidade (un. ou kg conforme receita) imputável a partir de vendas de **menu** com linha de receita
 * directa para o `componenteProdId` (sem venda avulsa nem expansão recursiva).
 */
function totalQtyComponenteFromMenusReceitaDirecta(vm, componenteProdId, receitasByProduto, produtos) {
  const compKey = prodIdKey(componenteProdId);
  if (!compKey) return 0;
  let total = 0;
  const menus = (produtos || []).filter((p) => p.categoria === 'menu');
  for (const p of menus) {
    const menuKey = prodIdKey(p.id);
    if (!menuKey) continue;
    const qtyMenu = parseFloat(vm[menuKey]) || 0;
    if (qtyMenu <= 0) continue;
    const rows = receitasByProduto[menuKey] || [];
    for (const r of rows) {
      if (prodIdKey(r.componente_id) !== compKey) continue;
      total += qtyMenu * parseFloat(r.quantidade);
    }
  }
  return total;
}

/**
 * Bloco HTML stock vs Σ menus para um ingrediente (Batata, Coxa, …).
 * @param {string} receitaLabel — texto curto em «Σ menus com … na receita»
 */
function buildIrregStockVsMenusHtml({ stockRow, stockBuf, vendasBuf, receitasIrreg, prodArr, receitaLabel }) {
  const pidB = prodIdKey(stockRow.produto_id);
  const b = stockBuf[pidB] || {};
  const enc = b.encontrado != null && b.encontrado !== '' ? b.encontrado : parseEncontradoFromRow(stockRow.encontrado);
  const ent = Number.isFinite(parseFloat(b.entrada)) ? parseFloat(b.entrada) : parseFloat(stockRow.entrada) || 0;
  const dei =
    b.deixado != null && b.deixado !== '' ? parseFloat(b.deixado) : parseEncontradoFromRow(stockRow.deixado);
  const qtyRaw = vendidoQtyFromStockParts(enc, ent, dei);
  const qtyStock = Number.isFinite(qtyRaw) ? Math.max(0, qtyRaw) : 0;
  const rbp = receitasByProdutoFromIrregBuf(receitasIrreg);
  const vm = vmFromVendasBufIrreg(vendasBuf);
  const qtyMenus = totalQtyComponenteFromMenusReceitaDirecta(vm, stockRow.produto_id, rbp, prodArr);
  const diff = qtyStock - qtyMenus;
  const um = medicaoSigla(stockRow.tipo_medicao || 'unidade');
  if (Math.abs(diff) < KG_IRREG_COMPONENTE_EPS) return '';
  const border = 'rgba(251,146,60,0.45)';
  const bg = 'rgba(251,146,60,0.1)';
  return `
    <div style="margin-top:10px;padding:8px 10px;border-radius:6px;border:1px solid ${border};background:${bg};font-size:12px;color:#cbd5e1;line-height:1.4">
      <div style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;color:#fb923c">${escapeHtml(stockRow.produto_nome)} (stock vs menus)</div>
      <div>Stock <span style="color:#94a3b8">(enc.+entr.−deix.)</span> <strong>${fmtNum(qtyStock)}</strong> ${um}</div>
      <div style="margin-top:4px">Total de menus com ${escapeHtml(receitaLabel)} na receita <span style="color:#64748b">(vendas × qtd. na receita)</span> <strong>${fmtNum(qtyMenus)}</strong> ${um}</div>
      <div style="margin-top:4px"><span style="color:#94a3b8">Diferença</span> <strong style="color:#fb923c">${fmtNum(Math.abs(diff))}</strong> ${um}</div>
    </div>`;
}

function receitasByProdutoFromIrregBuf(buf) {
  const o = {};
  if (!buf) return o;
  for (const [k, rows] of Object.entries(buf)) {
    const pid = prodIdKey(k);
    if (!pid) continue;
    if (!o[pid]) o[pid] = [];
    for (const r of rows) {
      o[pid].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
    }
  }
  return o;
}

function vmFromVendasBufIrreg(vb) {
  const vm = {};
  for (const [k, v] of Object.entries(vb || {})) {
    const key = prodIdKey(k);
    if (key) vm[key] = parseFloat(v) || 0;
  }
  return vm;
}

/**
 * Blocos HTML de irregularidades (caixa, stock vs T. anterior, Fino barril, Batata/Coxa stock vs Σ menus).
 * Fonte única: cartão no turno (`renderIrregularidadesTurno`) e página Irregularidades (lista).
 * @param {object} p
 * @param {object} p.turno — com `stock` e `caixa` (histórico)
 * @param {object} p.stockBuf — `{ [pid]: { encontrado, entrada, deixado, fechados? } }`
 * @param {object} p.vendasBuf — quantidades por produto (copos Fino 400/1000, etc.)
 * @param {number} p.totalVendasKz — mesma soma que `getTotalVendasTurnoKz` / resumo vendas
 * @param {number} p.totalGeradoKz — TPA+transf+din (turno: inputs caixa; histórico: `turno.caixa`)
 * @param {Array} [p.produtos] — catálogo para resolver Fino 400/1000 (fallback: stock + `S.produtos`)
 * @param {object} [p.receitasIrreg] — mapa `produto_id` → [{ componente_id, quantidade }] (receitas); sem isto não há check stock vs menus
 * @returns {{ hasAny: boolean, caixaHtml: string, stockHtml: string, finoHtml: string, batataHtml: string, coxaHtml: string }}
 */
function buildIrregularidadesHtmlParts({
  turno,
  stockBuf,
  vendasBuf,
  totalVendasKz,
  totalGeradoKz,
  produtos,
  receitasIrreg,
  depositosTurno
}) {
  const stock = turno?.stock || [];
  const prodArr = produtos && produtos.length ? produtos : (S.produtos || []);

  const tv = totalVendasKz;
  const tg = totalGeradoKz;
  const diffCaixa = Number.isFinite(tv) && Number.isFinite(tg) ? tv - tg : NaN;
  const caixaIrreg =
    Number.isFinite(tv) &&
    Number.isFinite(tg) &&
    Math.round(tv * 100) !== Math.round(tg * 100);
  let caixaHtml = '';
  if (caixaIrreg) {
    caixaHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
      <span style="color:#fb923c;font-weight:700">Caixa:</span> vendas <strong>${fmt(tv)}</strong> diferente de gerado <strong>${fmt(tg)}</strong>
      <span style="color:#94a3b8"> · diferença </span><strong style="color:#fb923c">${Number.isFinite(diffCaixa) ? fmt(Math.abs(diffCaixa)) : '—'}</strong>
    </div>`;
  }

  /** Banco: cruza o que devia ter ido para o banco (dinheiro do turno menos saídas de caixa)
   *  com o que foi efetivamente registado no depósito desse turno (valor bruto menos saídas
   *  do depósito para armazém). Considera "vendas TPA" do turno vs "TPA registado". */
  let bancoHtml = '';
  if (turno?.estado === 'fechado' && depositosTurno !== undefined) {
    const dep = depositosTurno;
    const din = parseFloat(turno.caixa?.dinheiro);
    const saidaCaixa = parseFloat(turno.caixa?.saida) || 0;
    const tpaCaixa = parseFloat(turno.caixa?.tpa);
    const dinDevido = Number.isFinite(din) ? Math.max(0, din - saidaCaixa) : NaN;
    if (!dep) {
      if (Number.isFinite(dinDevido) && dinDevido > 0) {
        bancoHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
          <span style="color:#fb923c;font-weight:700">Banco:</span> sem registo de depósito para este turno
          <span style="color:#94a3b8"> · esperado </span><strong>${fmt(dinDevido)}</strong>
        </div>`;
      }
    } else {
      const bruto = parseFloat(dep.valor) || 0;
      const saidaDep = parseFloat(dep.valor_saidas) || 0;
      const liquido = Math.max(0, bruto - saidaDep);
      const tpaDep = parseFloat(dep.valor_tpa);
      const diffDin = Number.isFinite(dinDevido) ? liquido - dinDevido : NaN;
      const diffTpa = Number.isFinite(tpaCaixa) && Number.isFinite(tpaDep) ? tpaDep - tpaCaixa : NaN;
      const dinIrreg = Number.isFinite(diffDin) && Math.round(diffDin * 100) !== 0;
      const tpaIrreg = Number.isFinite(diffTpa) && Math.round(diffTpa * 100) !== 0;
      if (dinIrreg || tpaIrreg) {
        const linhas = [];
        if (dinIrreg) {
          linhas.push(`<div>Dinheiro: caixa <strong>${fmt(dinDevido)}</strong> · banco <strong>${fmt(liquido)}</strong> · diferença <strong style="color:#fb923c">${fmt(Math.abs(diffDin))}</strong></div>`);
        }
        if (tpaIrreg) {
          linhas.push(`<div>TPA: caixa <strong>${fmt(tpaCaixa)}</strong> · banco <strong>${fmt(tpaDep)}</strong> · diferença <strong style="color:#fb923c">${fmt(Math.abs(diffTpa))}</strong></div>`);
        }
        bancoHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
          <div style="font-weight:700;color:#fb923c;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Banco</div>
          ${linhas.join('')}
          ${saidaDep > 0 ? `<div style="margin-top:3px;font-size:11px;color:#94a3b8">Líquido = bruto ${fmt(bruto)} − saída p/ armazém ${fmt(saidaDep)}</div>` : ''}
        </div>`;
      }
    }
  }

  let stockHtml = '';
  if (stock.length) {
    const rowsL = [];
    let temPrev = false;
    for (const s of stock) {
      const prev = s.prev_deixado;
      if (prev !== null && prev !== undefined) temPrev = true;
      const sid = prodIdKey(s.produto_id);
      const b = stockBuf[sid] || { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
      const encBuf = b.encontrado;
      let encN;
      if (encBuf != null && encBuf !== '' && Number.isFinite(parseFloat(encBuf))) {
        encN = parseFloat(encBuf);
      } else if (s.encontrado != null && s.encontrado !== '' && Number.isFinite(parseFloat(s.encontrado))) {
        encN = parseFloat(s.encontrado);
      } else {
        encN = NaN;
      }
      const med = medicaoSigla(s.tipo_medicao || 'unidade');
      let alertEnc = false;
      let prevNum = null;
      if (prev !== null && prev !== undefined && Number.isFinite(encN)) {
        prevNum = parseFloat(prev);
        if (Number.isFinite(prevNum) && Math.abs(encN - prevNum) >= 0.001) alertEnc = true;
      }
      rowsL.push({ s, encN, med, alertEnc, prevNum });
    }
    if (temPrev) {
      const irr = rowsL.filter((r) => r.alertEnc);
      if (irr.length > 0) {
        const bullets = irr
          .map((r) => {
            const diff = r.encN - r.prevNum;
            const abs = Math.abs(diff);
            const tipo = diff < 0 ? 'Falta' : 'Sobra';
            return `<span style="display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:6px;background:rgba(51,65,85,0.55);font-size:12px;line-height:1.35;max-width:100%;box-sizing:border-box">
            <span style="color:#fb923c;font-weight:700">${tipo} ${fmtNum(abs)} ${r.med}</span>
            <span style="color:#e2e8f0">${escapeHtml(r.s.produto_nome)}</span>
          </span>`;
          })
          .join('');
        stockHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.08);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.32)">
        <div style="font-weight:700;color:#fb923c;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Stock (${irr.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start">${bullets}</div>
      </div>`;
      }
    }
  }

  let finoHtml = '';
  const barrilRow = stock.find((s) => prodNomeNorm(s.produto_nome) === 'fino barril');
  if (barrilRow) {
    const pidB = prodIdKey(barrilRow.produto_id);
    const b = stockBuf[pidB] || { encontrado: null, entrada: 0, deixado: null };
    const kgVend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    const coposStock = Number.isFinite(kgVend) ? kgVend / KG_FINO_COPO : NaN;
    const id400 = resolveProdutoIdPorNomeFromLists(stock, prodArr, 'fino 400');
    const id1000 = resolveProdutoIdPorNomeFromLists(stock, prodArr, 'fino 1000');
    let v400 = 0;
    let v1000 = 0;
    if (id400) v400 = parseFloat(vendasBuf[prodIdKey(id400)]) || 0;
    if (id1000) v1000 = parseFloat(vendasBuf[prodIdKey(id1000)]) || 0;
    const coposVendas = v400 + v1000;
    const diff = Number.isFinite(coposStock) ? coposStock - coposVendas : NaN;
    const ok = Number.isFinite(diff) && Math.abs(diff) < 0.06;
    const missing = !id400 || !id1000;
    if (!ok || missing) {
      const border = 'rgba(251,146,60,0.45)';
      const bg = 'rgba(251,146,60,0.1)';
      const coposStockTxt = Number.isFinite(coposStock) ? fmtNum(Math.round(coposStock)) : '—';
      const diffTxt = Number.isFinite(diff) ? fmtNum(Math.abs(Math.round(diff))) : '—';
      const kgTxt = Number.isFinite(kgVend) ? `${fmtNum(kgVend)} kg` : '';
      finoHtml = `
    <div style="margin-top:10px;padding:8px 10px;border-radius:6px;border:1px solid ${border};background:${bg};font-size:12px;color:#cbd5e1;line-height:1.4">
      <div style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;color:#fb923c">Fino barril</div>
      <div>Stock <strong>${coposStockTxt}</strong> · Vendas <strong>${fmtNum(coposVendas)}</strong> · diferença <strong style="color:#fb923c">${diffTxt}</strong> copos</div>
      <div style="margin-top:3px;font-size:11px;color:#94a3b8">${kgTxt}${kgTxt ? ' · ' : ''}400: ${fmtNum(v400)} · 1000: ${fmtNum(v1000)}</div>
      ${missing ? '<div style="margin-top:4px;font-size:11px;color:#fbbf24">Faltam Fino 400/1000 no catálogo/stock.</div>' : ''}
    </div>`;
    }
  }

  if (stockHtml && finoHtml) {
    const stockInner = stockHtml.replace('margin-bottom:10px', 'margin-bottom:0');
    const finoInner = finoHtml.replace('margin-top:10px', 'margin-top:0');
    stockHtml = `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;width:100%;margin-bottom:10px">
      <div style="flex:1 1 260px;min-width:0">${stockInner}</div>
      <div style="flex:1 1 260px;min-width:0">${finoInner}</div>
    </div>`;
    finoHtml = '';
  }

  let batataHtml = '';
  let coxaHtml = '';
  const temReceitas = receitasIrreg && Object.keys(receitasIrreg).length;
  if (temReceitas) {
    const batataRow = stock.find((s) => isProdutoBatataIrreg(s.produto_nome));
    if (batataRow) {
      batataHtml = buildIrregStockVsMenusHtml({
        stockRow: batataRow,
        stockBuf,
        vendasBuf,
        receitasIrreg,
        prodArr,
        receitaLabel: 'Batata'
      });
    }
    const coxaRow = stock.find((s) => isProdutoCoxaIrreg(s.produto_nome));
    if (coxaRow) {
      coxaHtml = buildIrregStockVsMenusHtml({
        stockRow: coxaRow,
        stockBuf,
        vendasBuf,
        receitasIrreg,
        prodArr,
        receitaLabel: 'Coxa'
      });
    }
  }

  const hasAny = !!(caixaHtml || bancoHtml || stockHtml || finoHtml || batataHtml || coxaHtml);
  return { hasAny, caixaHtml, bancoHtml, stockHtml, finoHtml, batataHtml, coxaHtml };
}

/** Wrapa cada bloco do snap com footer de aceitar/rejeitar/pendente. decisoes = map categoria → row. */
function renderIrregularidadeBlocos(snap, turnoId, decisoesByCat) {
  const cats = [
    { key: 'caixa', html: snap.caixaHtml },
    { key: 'banco', html: snap.bancoHtml || '' },
    { key: 'stock', html: snap.stockHtml },
    { key: 'fino', html: snap.finoHtml },
    { key: 'batata', html: snap.batataHtml },
    { key: 'coxa', html: snap.coxaHtml }
  ];
  const podeDecidir = S.user?.role === 'admin';
  return cats.map(({ key, html }) => {
    if (!html) return '';
    const dec = decisoesByCat?.[key];
    let footer = '';
    if (dec) {
      const quando = dec.decidido_em ? new Date(dec.decidido_em).toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
      const nome = escapeHtml(dec.decidido_por_nome || 'utilizador');
      const just = dec.justificacao ? `<div style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.4">${escapeHtml(dec.justificacao)}</div>` : '';
      const aceite = !!dec.aceite;
      const bg = aceite ? 'rgba(34,197,94,0.08)' : 'rgba(248,113,113,0.08)';
      const bd = aceite ? 'rgba(34,197,94,0.32)' : 'rgba(248,113,113,0.32)';
      const cor = aceite ? '#86efac' : '#fca5a5';
      const label = aceite ? '✓ Aceite' : '✗ Rejeitada';
      footer = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:8px 10px;background:${bg};border:1px solid ${bd};border-radius:6px;margin:-6px 0 10px;font-size:12px;color:${cor}">
        <div style="flex:1;min-width:0">
          <strong>${label}</strong> · ${nome}${quando ? ` · ${quando}` : ''}
          ${just}
        </div>
        ${podeDecidir ? `<button type="button" class="btn btn-ghost btn-sm" onclick="runAction(event, () => reabrirIrregularidade(${turnoId}, '${key}'))">Reabrir</button>` : ''}
      </div>`;
    } else if (podeDecidir) {
      footer = `<div style="display:flex;justify-content:flex-end;gap:8px;margin:-6px 0 10px">
        <button type="button" class="btn btn-success btn-sm" onclick="runAction(event, () => decidirIrregularidade(${turnoId}, '${key}', true))">✓ Aceitar</button>
        <button type="button" class="btn btn-danger btn-sm" onclick="runAction(event, () => decidirIrregularidade(${turnoId}, '${key}', false))">✗ Rejeitar</button>
      </div>`;
    }
    return html + footer;
  }).join('');
}

async function decidirIrregularidade(turnoId, categoria, aceite) {
  const label = aceite ? 'Aceitar' : 'Rejeitar';
  const just = prompt(`${label} esta irregularidade. Justificação (opcional):`, '');
  if (just === null) return; // cancelado
  try {
    await api('POST', '/irregularidades/decisao', { turno_id: turnoId, categoria, aceite, justificacao: just });
    if (S.page === 'irregularidades') await loadIrregularidadesLista();
    else if (S.page === 'turno') await loadTurno();
  } catch (e) { alert(e.message); }
}

async function reabrirIrregularidade(turnoId, categoria) {
  if (!confirm('Reabrir esta irregularidade?')) return;
  try {
    await api('DELETE', `/irregularidades/decisao?turno_id=${turnoId}&categoria=${encodeURIComponent(categoria)}`);
    if (S.page === 'irregularidades') await loadIrregularidadesLista();
    else if (S.page === 'turno') await loadTurno();
  } catch (e) { alert(e.message); }
}

/**
 * Mesma lógica que o cartão Irregularidades no turno (sem DOM): constrói buffers a partir de
 * `vendasRows` + catálogo e delega em `buildIrregularidadesHtmlParts`.
 * @returns {{ hasAny: boolean, caixaHtml: string, stockHtml: string, finoHtml: string, batataHtml: string, coxaHtml: string }}
 */
function computeIrregularidadesSnapshot(turno, vendasRows, produtos, receitas, depositosTurno) {
  const stock = turno.stock || [];
  const stockBufL = {};
  stock.forEach((s) => {
    const sid = prodIdKey(s.produto_id);
    if (!sid) return;
    stockBufL[sid] = {
      encontrado: parseEncontradoFromRow(s.encontrado),
      entrada: parseFloat(s.entrada) || 0,
      deixado: parseEncontradoFromRow(s.deixado),
      fechados: parseFloat(s.fechados) || 0
    };
  });
  const vendasBufL = {};
  const vendasProdNomesL = {};
  produtos.forEach((p) => {
    const id = prodIdKey(p.id);
    if (id) vendasProdNomesL[id] = p.nome;
  });
  (vendasRows || []).forEach((v) => {
    const pid = prodIdKey(v.produto_id);
    if (!pid) return;
    vendasBufL[pid] = parseFloat(v.quantidade) || 0;
    if (v.produto_nome) vendasProdNomesL[pid] = v.produto_nome;
  });
  const receitasBufL = {};
  (receitas || []).forEach((r) => {
    const mk = prodIdKey(r.produto_id);
    if (!mk) return;
    if (!receitasBufL[mk]) receitasBufL[mk] = [];
    receitasBufL[mk].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
  });
  const menuProds = produtos.filter((p) => p.categoria === 'menu');
  const bebidaProds = produtos.filter((p) => p.categoria === 'bebida').filter((p) => !isFinoBarrilNome(p.nome));
  const avulsoProds = produtos.filter((p) => p.venda_avulso && p.categoria !== 'menu' && p.categoria !== 'bebida');
  const menuProdIdsL = menuProds.map((p) => p.id);
  const avulsoProdIdsL = avulsoProds.map((p) => p.id);
  const vendasProdPrecosL = {};
  [...menuProds, ...avulsoProds, ...bebidaProds].forEach((p) => {
    vendasProdPrecosL[p.id] = parseFloat(p.preco) || 0;
  });
  (vendasRows || []).forEach((v) => {
    const pid = prodIdKey(v.produto_id);
    if (!pid || v.preco == null || v.preco === '') return;
    const u = parseFloat(v.preco) || 0;
    vendasProdPrecosL[pid] = u;
    vendasProdPrecosL[v.produto_id] = u;
  });
  const bebidaCopoProds = bebidaProds.filter((p) => isBebidaProdutoPorCopo(p));
  const bebidaOutras = bebidaProds.filter((p) => !isBebidaProdutoPorCopo(p));
  const bebidaCopoProdIdsL = bebidaCopoProds.map((p) => prodIdKey(p.id)).filter(Boolean);
  const bebidaCopoCfgL = {};
  bebidaCopoProds.forEach((p) => {
    const pid = prodIdKey(p.id);
    if (!pid) return;
    const nomeJoin = vendasProdNomesL[pid];
    bebidaCopoCfgL[pid] = {
      nome: nomeVendaBebidaLegivel(pid, nomeJoin || p.nome),
      kgPorCopo: parseFloat(p.kg_por_copo) || 0,
      preco: parseFloat(p.preco) || 0,
      qtdPacote: parseInt(p.qtd_copos_pacote, 10) || 0,
      precoPacote: parseFloat(p.preco_copos_pacote) || 0
    };
  });
  for (const v of vendasRows || []) {
    const isCopo = !!v.venda_por_copo && parseFloat(v.kg_por_copo) > 0;
    if (!isCopo) continue;
    if (isFinoBarrilNome(v.produto_nome)) continue;
    const pid = prodIdKey(v.produto_id);
    if (!pid) continue;
    if (!bebidaCopoCfgL[pid]) {
      bebidaCopoCfgL[pid] = {
        nome: nomeVendaBebidaLegivel(pid, v.produto_nome),
        kgPorCopo: parseFloat(v.kg_por_copo) || 0,
        preco: 0,
        qtdPacote: 0,
        precoPacote: 0
      };
    }
    bebidaCopoCfgL[pid].preco = parseFloat(v.preco) || 0;
    bebidaCopoCfgL[pid].qtdPacote = parseInt(v.qtd_copos_pacote, 10) || 0;
    bebidaCopoCfgL[pid].precoPacote = parseFloat(v.preco_copos_pacote) || 0;
    if (!bebidaCopoProdIdsL.includes(pid)) bebidaCopoProdIdsL.push(pid);
  }
  const bebidaCopoProdIdSet = new Set(bebidaCopoProdIdsL);
  function getStockLineL(pid) {
    const k = prodIdKey(pid);
    if (!k) return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
    if (stockBufL[k] != null) return stockBufL[k];
    const row = stock.find((s) => prodIdKey(s.produto_id) === k);
    if (row) {
      return {
        encontrado: parseEncontradoFromRow(row.encontrado),
        entrada: parseFloat(row.entrada) || 0,
        deixado: parseEncontradoFromRow(row.deixado),
        fechados: parseFloat(row.fechados) || 0
      };
    }
    return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
  }
  function calcMenuQtyL(prodId) {
    const recipe = receitasBufL[prodIdKey(prodId)] || [];
    if (!recipe.length) return null;
    let min = Infinity;
    for (const comp of recipe) {
      const b = stockBufL[prodIdKey(comp.componente_id)] || { encontrado: null, entrada: 0, deixado: null };
      const vendido = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
      if (!Number.isFinite(vendido)) return null;
      min = Math.min(min, vendido / parseFloat(comp.quantidade));
    }
    return min === Infinity ? 0 : Math.floor(min);
  }
  function calcStandaloneQtyL(prodId) {
    const pk = prodIdKey(prodId);
    const b = stockBufL[pk] || { encontrado: null, entrada: 0, deixado: null };
    const total = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    if (!Number.isFinite(total)) return 0;
    const totalN = Math.max(0, total);
    let comboUsage = 0;
    for (const [menuProdId, recipe] of Object.entries(receitasBufL)) {
      const comp = recipe.find((r) => prodIdKey(r.componente_id) === pk);
      if (comp) comboUsage += (calcMenuQtyL(menuProdId) || 0) * comp.quantidade;
    }
    return Math.max(0, totalN - comboUsage);
  }
  function totalVendasKzL() {
    let total = 0;
    for (const prodId of menuProdIdsL) {
      const k = prodIdKey(prodId);
      total += (vendasBufL[k] || 0) * (vendasProdPrecosL[prodId] || 0);
    }
    for (const prodId of avulsoProdIdsL) {
      total += calcStandaloneQtyL(prodId) * (vendasProdPrecosL[prodId] || 0);
    }
    for (const prodId of bebidaCopoProdIdsL) {
      const cfg = bebidaCopoCfgL[prodId];
      if (!cfg) continue;
      const copos = vendasBufL[prodId] || 0;
      total += precoVendaCopos(copos, cfg.preco, cfg.qtdPacote, cfg.precoPacote);
    }
    for (const s of stock) {
      if (s.categoria !== 'bebida') continue;
      const pid = prodIdKey(s.produto_id);
      if (!pid) continue;
      if (isFinoBarrilNome(s.produto_nome)) continue;
      if (isFinoBarrilNome(vendasProdNomesL[pid])) continue;
      if (bebidaCopoProdIdSet.has(pid)) continue;
      const b = getStockLineL(pid);
      let vend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
      if (!Number.isFinite(vend)) continue;
      vend = Math.max(0, vend);
      if (vend <= 0 && parseFloat(s.vendido) > 0) vend = Math.max(0, parseFloat(s.vendido));
      if (vend <= 0) continue;
      const valSnap = s.valor != null && s.valor !== '' ? parseFloat(s.valor) : NaN;
      if (!Number.isNaN(valSnap)) {
        total += valSnap;
      } else {
        let unit = parseFloat(s.preco) || 0;
        if (!unit) unit = parseFloat(vendasProdPrecosL[s.produto_id]) || parseFloat(vendasProdPrecosL[pid]) || 0;
        total += vend * unit;
      }
    }
    return total;
  }
  const caixa = turno.caixa || {};
  const t1 = parseEncontradoFromRow(caixa.tpa);
  const t2 = parseEncontradoFromRow(caixa.transferencia);
  const t3 = parseEncontradoFromRow(caixa.dinheiro);
  const tg =
    t1 === null || t2 === null || t3 === null ? NaN : t1 + t2 + t3;
  const tv = totalVendasKzL();
  return buildIrregularidadesHtmlParts({
    turno,
    stockBuf: stockBufL,
    vendasBuf: vendasBufL,
    totalVendasKz: tv,
    totalGeradoKz: tg,
    produtos,
    receitasIrreg: receitasBufL,
    depositosTurno
  });
}

/** Só conteúdo quando há irregularidade real (caixa, stock vs T. anterior, Fino). Sem mensagens «está tudo ok». */
function renderIrregularidadesTurno() {
  const mount = document.getElementById('turno-irregularidades-list');
  const card = document.getElementById('turno-irregularidades-card');
  if (!mount) return;

  function setIrregCardVisible(show) {
    if (card) card.style.display = show ? '' : 'none';
    const meta = document.getElementById('turno-irregularidades-meta');
    if (meta) {
      if (show) {
        const nome = S.turnoData?.nome;
        meta.textContent = nome
          ? `${turnoLabel(nome)} — ${dateLabelWithWeekday(S.date)}`
          : dateLabelWithWeekday(S.date);
      } else {
        meta.textContent = '';
      }
    }
  }

  const snap = buildIrregularidadesHtmlParts({
    turno: S.turnoData,
    stockBuf,
    vendasBuf,
    totalVendasKz: getTotalVendasTurnoKz(),
    totalGeradoKz: getTotalGeradoCaixaKz(),
    produtos: S.produtos || [],
    receitasIrreg: receitasBuf,
    depositosTurno: S.turnoDeposito
  });
  const tid = S.turnoData?.id;
  const decisoesByCat = (S.turnoDecisoes && tid) ? S.turnoDecisoes : {};
  mount.innerHTML = renderIrregularidadeBlocos(snap, tid, decisoesByCat).trim();
  const showCard = snap.hasAny;
  setIrregCardVisible(showCard);
  void refreshIrregularidadesEquipaLine(showCard);
}

function autoSaveSchedule() {
  const turnoId = S.turnoData?.id;
  if (!turnoId) return;
  turnoMsgPending('A guardar…');
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => guardarStock(turnoId), 2000);
}

async function guardarStock(turnoId) {
  try {
    if (String(turnoId) !== String(S.turnoData?.id)) return;
    turnoMsgPending('A guardar…');
    const proms = Object.entries(stockBuf).map(([pid, v]) =>
      api('PUT', `/turnos/${turnoId}/stock`, {
        produto_id: pid,
        encontrado: v.encontrado,
        deixado: v.deixado,
        fechados: v.fechados
      })
    );
    await Promise.all(proms);
    turnoMsgOk('Guardado');
    setTimeout(() => turnoMsgIdle(), 1600);
  } catch(e) { turnoMsgErr(e.message); }
}

function calcCaixa() {
  const tg = parseCaixaTriploFromInputs();
  const saida = parseFloat(document.getElementById('c-saida')?.value) || 0;
  const tf = Number.isFinite(tg) ? tg - saida : NaN;
  const elTG = document.getElementById('c-total-gerado');
  const elTF = document.getElementById('c-total-final');
  if (elTG) elTG.textContent = Number.isFinite(tg) ? fmtKzOrEmpty(tg) : '—';
  if (elTF) elTF.textContent = Number.isFinite(tf) ? fmtKzOrEmpty(tf) : '—';
  renderIrregularidadesTurno();
  maybeClearTurnoStickyAfterStockCaixaOk();
  // Auto-save
  const turnoId = S.turnoData?.id;
  if (!turnoId) return;
  turnoMsgPending('A guardar…');
  clearTimeout(autoSaveCaixaTimer);
  autoSaveCaixaTimer = setTimeout(() => guardarCaixa(turnoId), 2000);
}

async function switchTurnoTab(name, btn) {
  S.turnoTab = name;
  try { persistUiState(); } catch (_) {}
  document.querySelectorAll('.turno-tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.turno-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name)?.classList.add('active');
  if (btn) btn.classList.add('active');
  else document.querySelector(`.turno-tab[data-turno-tab="${name}"]`)?.classList.add('active');
  if (name === 'escala') {
    await loadEscalaTurno();
  }
  if (name === 'stock') {
    const tid = S.turnoData?.id;
    const stock = S.turnoData?.stock || [];
    if (tid) await loadRegistosMovimentosSection(tid, stock, !!S.turnoCanEdit);
  }
  if (name === 'vendas' || name === 'pedidos') {
    const tid = S.turnoData?.id;
    if (tid) await loadVendasMenu(tid, !!S.turnoCanEdit);
  }
  if (name === 'registos') {
    const tid = S.turnoData?.id;
    if (tid) await loadTurnoResumoTab(tid);
    renderIrregularidadesTurno();
  }
}

function clearStockCaixaValidationHighlight() {
  turnoMsgStickyErr = null;
  document.querySelectorAll('.stock-caixa-required-missing').forEach((el) =>
    el.classList.remove('stock-caixa-required-missing')
  );
}

/** Se o aviso fixo era só stock/caixa e já está tudo preenchido, remove destaque e mensagem. */
function maybeClearTurnoStickyAfterStockCaixaOk() {
  if (!turnoMsgStickyErr) return;
  if (
    turnoMsgStickyErr.includes('Quem realmente trabalhou') ||
    turnoMsgStickyErr.includes('«Quem realmente trabalhou»')
  ) {
    return;
  }
  if (collectMissingStockCaixaObrigatorio().length > 0) return;
  document.querySelectorAll('.stock-caixa-required-missing').forEach((el) =>
    el.classList.remove('stock-caixa-required-missing')
  );
  turnoMsgStickyErr = null;
  turnoMsgIdle();
}

function collectMissingStockCaixaObrigatorio() {
  const missing = [];
  document.querySelectorAll('input[data-stock-req="1"]').forEach((el) => {
    if (el.disabled) return;
    if (String(el.value).trim() === '') missing.push(el);
  });
  document.querySelectorAll('input[data-caixa-req="1"]').forEach((el) => {
    if (el.disabled) return;
    if (String(el.value).trim() === '') missing.push(el);
  });
  return missing;
}

async function focusTurnoFieldParaValidacao(el) {
  if (!el) return;
  const panel = el.closest('.turno-tab-panel');
  const tabId = panel && panel.id;
  const name =
    tabId === 'tab-stock' ? 'stock' : tabId === 'tab-registos' ? 'registos' : null;
  if (name) {
    const btn = document.querySelector('.turno-tab[data-turno-tab="' + name + '"]');
    if (btn) await switchTurnoTab(name, btn);
  }
  requestAnimationFrame(() => {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    try {
      el.focus();
    } catch (_) {}
  });
}

async function guardarCaixa(turnoId) {
  try {
    if (String(turnoId) !== String(S.turnoData?.id)) return;
    turnoMsgPending('A guardar…');
    const tpa = parseCaixaInputRaw('c-tpa');
    const tr = parseCaixaInputRaw('c-transf');
    const d = parseCaixaInputRaw('c-din');
    await api('PUT', `/turnos/${turnoId}/caixa`, {
      tpa: tpa === null ? null : tpa,
      transferencia: tr === null ? null : tr,
      dinheiro: d === null ? null : d
    });
    turnoMsgOk('Guardado');
    setTimeout(() => turnoMsgIdle(), 1600);
  } catch(e) { turnoMsgErr(e.message); }
}

async function saveTurnoNotas(turnoId, notas) {
  try {
    await api('PUT', `/turnos/${turnoId}/notas`, { notas });
    turnoMsgOk('Observações guardadas');
    setTimeout(() => turnoMsgIdle(), 2000);
  } catch(e) { turnoMsgErr(e.message); }
}

async function fecharTurno(ev, id) {
  clearStockCaixaValidationHighlight();
  document.querySelectorAll('input[data-stock-req="1"][type="number"]').forEach((el) => {
    if (!el.disabled) stockNumberInputBlur(el);
  });
  const missing = collectMissingStockCaixaObrigatorio();
  if (missing.length) {
    missing.forEach((el) => el.classList.add('stock-caixa-required-missing'));
    turnoMsgErr(
      'Preenche todos os campos obrigatórios: em Stock (Encontrado e Deixado de cada produto) e em Caixa (TPA, Transferência e Dinheiro).',
      true
    );
    await focusTurnoFieldParaValidacao(missing[0]);
    return;
  }
  if (!confirm('Fechar este turno? Não poderá ser editado depois.')) return;
  await runAction(ev, async () => {
    try {
      await guardarStock(id);
      await guardarCaixa(id);
      await api('POST', `/turnos/${id}/fechar`);
      clearStockCaixaValidationHighlight();
      await loadTurno();
    } catch (e) {
      turnoMsgErr(e.message, true);
      if (e.message && e.message.includes('Quem realmente trabalhou')) {
        const btnEscala = document.querySelector('.turno-tab[data-turno-tab="escala"]');
        if (btnEscala) await switchTurnoTab('escala', btnEscala);
        requestAnimationFrame(() => {
          const sec = document.getElementById('turno-equipa-real-section');
          if (sec) {
            sec.classList.add('stock-caixa-required-missing');
            sec.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        });
      }
    }
  });
}

async function reabrirTurno(ev, id) {
  if (!confirm('Reabrir este turno? Voltará a poder editar stock, caixa e registos. Usar só para corrigir erros.')) return;
  await runAction(ev, async () => {
    try {
      await api('POST', `/turnos/${id}/reabrir`);
      turnoMsgOk('Turno reaberto.');
      setTimeout(() => turnoMsgIdle(), 2200);
      await loadTurno();
    } catch (e) {
      turnoMsgErr(e.message);
    }
  });
}

// ── REGISTOS: STOCK + SAÍDAS DE CAIXA (unificado) ──────────────
async function loadRegistosMovimentosSection(turnoId, stocks, canEdit) {
  const elE = document.getElementById('entradas-section');
  const elS = document.getElementById('saidas-section');
  if (!elE || !elS) return;
  elE.innerHTML = '<span style="color:#64748b">A carregar...</span>';
  elS.innerHTML = '<span style="color:#64748b">A carregar...</span>';
  try {
    const [entradas, saidas] = await Promise.all([
      api('GET', `/turnos/${turnoId}/entradas`),
      api('GET', `/turnos/${turnoId}/saidas`)
    ]);
    renderEntradasSection(turnoId, stocks, canEdit, entradas);
    renderSaidasSection(turnoId, canEdit, saidas, entradas);
  } catch (e) {
    const msg = `<div class="alert alert-error">${e.message}</div>`;
    elE.innerHTML = msg;
    elS.innerHTML = msg;
  }
}

function renderEntradasSection(turnoId, stocks, canEdit, entradas) {
  const el = document.getElementById('entradas-section');
  if (!el) return;
  try {
    const stockById = {};
    (stocks || []).forEach(s => { stockById[String(s.produto_id)] = s; });

    // Opções do select agrupadas por categoria
    const cats = ['ingredientes','bebida','outro'];
    const labels = { ingredientes:'Ingredientes', bebida:'Bebidas', outro:'Outros' };
    let opts = '<option value="">— Produto —</option>';
    cats.forEach(cat => {
      const items = stocks.filter(s => (s.categoria === cat || (!['ingredientes','bebida'].includes(s.categoria) && cat === 'outro')));
      if (!items.length) return;
      opts += `<optgroup label="${labels[cat] || cat}">`;
      items.forEach(s => { opts += `<option value="${s.produto_id}" data-medicao="${s.tipo_medicao || 'unidade'}">${s.produto_nome} (${medicaoSigla(s.tipo_medicao)})</option>`; });

    const formHtml = canEdit ? `
      <div class="entradas-form">
        <div class="entradas-tipo-toggle">
          <button id="e-tipo-entrada" class="tipo-btn tipo-btn-active-green" onclick="setTipo('entrada')">+ Entrada</button>
          <button id="e-tipo-tirar" class="tipo-btn" onclick="setTipo('tirar')">− Saída</button>

          <button id="e-orig-armazem" class="tipo-btn tipo-btn-active" onclick="setOrigem('armazem')">Armazém</button>

        <select id="e-produto" class="entradas-select">${opts}</select>
        <input id="e-qty" type="number" min="0.001" step="any" placeholder="Qtd (un)" class="entradas-qty"/>
        <input id="e-preco" type="number" min="0" step="any" placeholder="Preço" class="entradas-qty" style="display:none"/>

      </div>
      <div id="entrada-form-msg" style="margin-bottom:8px"></div>` : '';

    const listaHtml = entradas.length === 0
      ? '<div style="color:#475569;font-size:13px;padding:8px 0">Nenhum registo neste turno.</div>'
      : `<div class="table-wrap"><table>
          <thead><tr>
            <th style="text-align:left">Hora</th>
            <th style="text-align:left">Tipo</th>
            <th style="text-align:left">Origem</th>
            <th style="text-align:left">Produto</th>
            <th style="text-align:right">Qtd</th>
            <th style="text-align:right">Preço</th>
            <th style="text-align:left">Nota</th>
          </tr></thead>
          <tbody>${entradas.map(e => {
            const dt = new Date(e.criado_em).toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
            const tipoLabel = e.tipo === 'tirar'
              ? '<span style="color:#f87171;font-weight:600">− Saída</span>'
              : '<span style="color:#4ade80;font-weight:600">+ Entrada</span>';
            const origemLabel = e.origem === 'compra'
              ? '<span style="color:#fb923c">Compra</span>'
              : '<span style="color:#94a3b8">Armazém</span>';
            const precoLabel = e.origem === 'compra' && parseFloat(e.preco) > 0
              ? `<span style="color:#fbbf24">${fmt(e.preco)}</span>`
              : '—';
            return `<tr>
              <td style="color:#64748b;font-size:12px;white-space:nowrap">${dt}</td>
              <td style="font-size:12px">${tipoLabel}</td>
              <td style="font-size:12px">${origemLabel}</td>
              <td style="font-size:13px">${e.produto_nome}</td>
              <td style="text-align:right;font-weight:600;color:#e2e8f0">${fmtNum(e.quantidade)} ${medicaoSigla(e.tipo_medicao || stockById[String(e.produto_id)]?.tipo_medicao)}</td>
              <td style="text-align:right;font-size:12px">${precoLabel}</td>

    el.innerHTML = formHtml + listaHtml;

function setTipo(tipo) {
  window._entradaTipo = tipo;
  const btnE = document.getElementById('e-tipo-entrada');
  const btnT = document.getElementById('e-tipo-tirar');
  const origemWrap = document.getElementById('e-origem-wrap');
  if (btnE) btnE.className = tipo === 'entrada' ? 'tipo-btn tipo-btn-active-green' : 'tipo-btn';
  if (btnT) btnT.className = tipo === 'tirar'   ? 'tipo-btn tipo-btn-active-red'   : 'tipo-btn';
  // Origem só faz sentido em entradas
  if (origemWrap) origemWrap.style.display = tipo === 'tirar' ? 'none' : '';
  if (tipo === 'tirar') {
    const p = document.getElementById('e-preco');
    if (p) p.style.display = 'none';
  }
}

function setOrigem(origem) {
  window._entradaOrigem = origem;
  const btnA = document.getElementById('e-orig-armazem');
  const btnC = document.getElementById('e-orig-compra');
  const precoEl = document.getElementById('e-preco');
  if (btnA) btnA.className = origem === 'armazem' ? 'tipo-btn tipo-btn-active' : 'tipo-btn';
  if (btnC) btnC.className = origem === 'compra'  ? 'tipo-btn tipo-btn-active-orange' : 'tipo-btn';
  if (precoEl) precoEl.style.display = origem === 'compra' ? '' : 'none';
}

async function submitEntrada(turnoId) {
  const pidRaw = document.getElementById('e-produto')?.value;
  const pid = prodIdKey(pidRaw);
  const qty    = parseFloat(document.getElementById('e-qty')?.value);
  const notas  = document.getElementById('e-notas')?.value.trim() || '';
  const tipo   = window._entradaTipo   || 'entrada';
  const origem = window._entradaOrigem || 'armazem';
  const preco  = parseFloat(document.getElementById('e-preco')?.value) || 0;
  const msg    = document.getElementById('entrada-form-msg');
  if (!pidRaw || !pid)  { if (msg) { msg.className='alert alert-error'; msg.textContent='Selecciona um produto.'; } return; }
  if (!qty || qty <= 0) { if (msg) { msg.className='alert alert-error'; msg.textContent='Quantidade inválida.'; } return; }
  try {
    await api('POST', `/turnos/${turnoId}/entradas`, { produto_id: pidRaw, tipo, origem, preco, quantidade: qty, notas });
    document.getElementById('e-produto').value = '';
    document.getElementById('e-qty').value = '';
    document.getElementById('e-notas').value = '';
    document.getElementById('e-preco').value = '';
    const novaEntrada = await api('GET', `/turnos/${turnoId}/entradas`);
    const soma = novaEntrada.filter((e) => prodIdKey(e.produto_id) === pid)
                            .reduce((s, e) => s + parseFloat(e.quantidade) * (e.tipo === 'tirar' ? -1 : 1), 0);
    const cell = document.getElementById(`entrada-${pid}`);
    if (cell) cell.textContent = fmtQtyInput(soma);
    if (!stockBuf[pid]) stockBuf[pid] = { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
    stockBuf[pid].entrada = soma;
    updateStock(pidRaw, 'entrada', soma);
    const stocks = S.turnoData?.stock || [];
    await loadRegistosMovimentosSection(turnoId, stocks, true);
  } catch(e) {
    if (msg) { msg.className='alert alert-error'; msg.textContent=e.message; }
  }
}

/** Adiciona 1 barril novo de Fino (peso líquido = cheio − tara) à coluna Entrada. */
async function adicionarFinoBarrilNovo(produtoId) {
  const turnoId = S.turnoData?.id;
  if (!turnoId) {
    alert('Turno não está aberto.');
    return;
  }
  if (!produtoId) return;
  const ok = confirm(
    `Adicionar 1 barril novo de Fino?\n\n` +
      `+ ${fmtNum(KG_FINO_BARRIL_NET)} kg líquidos à Entrada\n` +
      `(barril cheio ${fmtNum(KG_FINO_BARRIL_CHEIO)} kg − tara ${fmtNum(
        KG_FINO_BARRIL_VAZIO
      )} kg)`
  );
  if (!ok) return;
  await api('POST', `/turnos/${turnoId}/entradas`, {
    produto_id: produtoId,
    tipo: 'entrada',
    origem: 'armazem',
    preco: 0,
    quantidade: KG_FINO_BARRIL_NET,
    notas: `Barril novo (${fmtNum(KG_FINO_BARRIL_CHEIO)} kg − tara ${fmtNum(
      KG_FINO_BARRIL_VAZIO
    )} kg)`
  });
  const pid = prodIdKey(produtoId);
  const entradasRows = await api('GET', `/turnos/${turnoId}/entradas`);
  const soma = entradasRows
    .filter((e) => prodIdKey(e.produto_id) === pid)
    .reduce(
      (s, e) =>
        s + parseFloat(e.quantidade) * (e.tipo === 'tirar' ? -1 : 1),
      0
    );
  const cell = document.getElementById(`entrada-${pid}`);
  if (cell) cell.textContent = fmtQtyInput(soma);
  if (!stockBuf[pid])
    stockBuf[pid] = { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
  stockBuf[pid].entrada = soma;
  updateStock(produtoId, 'entrada', soma);
  const stocks = S.turnoData?.stock || [];
  await loadRegistosMovimentosSection(turnoId, stocks, true);
}

/** Preenche, no cartão «Áreas de trabalho», quem está escalado para cada área (1–3). */
async function loadTurnoAreasEscalados() {
  const container = document.querySelector('.turno-areas-card');
  if (!container) return;
  const turnoNome = S.turnoData?.nome;
  if (!turnoNome || !S.date) return;
  try {
    const escalaPack = await api(
      'GET',
      `/escala/semana?data_inicio=${encodeURIComponent(S.date)}&data_fim=${encodeURIComponent(S.date)}`
    ).catch(() => ({ semana: [], template: [] }));
    const rowsDia = escalaPack?.semana || [];
    const rowsTemplate = escalaPack?.template || [];
    const listaDia = rowsDia.filter((r) => r.turno === turnoNome);
    const d = new Date(S.date + 'T12:00:00Z');
    const day = d.getUTCDay();
    const diaSemana = day === 0 ? 6 : day - 1;
    const listaTpl = rowsTemplate.filter(
      (r) => Number(r.dia_semana) === diaSemana && r.turno === turnoNome
    );
    const lista = listaDia.length ? listaDia : listaTpl;
    const origem = listaDia.length
      ? 'Escala do dia'
      : (listaTpl.length ? 'Escala template' : '');
    const origEl = document.getElementById('turno-areas-origem');
    if (origEl) origEl.textContent = origem;

    const porArea = { 1: [], 2: [], 3: [], 0: [] };
    lista.forEach((r) => {
      const a = r.area_trabalho != null && r.area_trabalho !== ''
        ? parseInt(r.area_trabalho, 10)
        : NaN;
      const key = Number.isFinite(a) && a >= 1 && a <= 3 ? a : 0;
      porArea[key].push(r);
    });

    AREAS_TRABALHO_META.forEach((area) => {
      const slot = document.getElementById(`turno-area-people--${area.id}`);
      if (!slot) return;
      const pessoas = porArea[area.id] || [];
      if (!pessoas.length) {
        slot.innerHTML = '<span class="turno-area-empty">sem escalados</span>';
        return;
      }
      slot.innerHTML = pessoas.map((r) => {
        const nome = r.utilizador_nome || 'Sem nome';
        const role = r.utilizador_role ? String(r.utilizador_role).toUpperCase() : '';
        const tipParts = [];
        if (role) tipParts.push(role);
        if (r.notas) tipParts.push(String(r.notas));
        const tip = tipParts.join(' · ');
        return `<span class="turno-area-person"${tip ? ` title="${escapeHtml(tip)}"` : ''}>${escapeHtml(nome)}</span>`;
      }).join('');
    });
    bebidaCopoProdIds.forEach((pid) => {
      const copos = vendasBuf[pid] || 0;
      if (copos <= 0) return;
      const cfg = bebidaCopoCfg[pid];
      if (!cfg) return;
      const val = precoVendaCopos(copos, cfg.preco, cfg.qtdPacote, cfg.precoPacote);
      totalVendasVal += val;
      const si = stocks.find((s) => String(s.produto_id) === String(pid));
      vendasLines.push({
        nome: si?.produto_nome || `Produto ${pid}`,
        qty: copos,
        preco: cfg.preco,
        total: val,
        copo: true
      });
    });

    const semAreaCount = (porArea[0] || []).length;
    if (semAreaCount > 0 && origEl) {
      const nomes = porArea[0]
        .map((r) => r.utilizador_nome || 'Sem nome')
        .join(', ');
      origEl.textContent = `${origem ? origem + ' · ' : ''}Sem área: ${nomes}`;
    }

    // 6. Compras registadas mas caixa não preenchida
    if (totalCompras > 0 && totalGerado === 0) {
      irr.push({ level:'warn', msg:`Compras de stock registadas (${fmt(totalCompras)}) mas caixa com valor zero` });
    }

    // 7. Possível desconto: valor do stock consumido > vendas registadas
    if (totalValStock > 0 && totalVendasVal > 0 && totalValStock > totalVendasVal) {
      const desconto = totalValStock - totalVendasVal;
      const pct = desconto / totalValStock * 100;
      irr.push({ level:'warn', msg:`Possível desconto aplicado: stock consumido (${fmt(totalValStock)}) superior às vendas registadas (${fmt(totalVendasVal)}) — diferença de ${fmt(desconto)} (${pct.toFixed(1)}%)` });
    }

    // — Helpers de render —
    const icon  = { error:'🔴', warn:'🟡', info:'🔵' };
    const color = { error:'#f87171', warn:'#fbbf24', info:'#60a5fa' };

    const chip = (label, value, valueColor, bold) => `
      <div style="background:#1e293b;border-radius:8px;padding:10px 12px">
        <div style="color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px">${label}</div>
        <div style="font-weight:${bold?'700':'600'};font-size:${bold?'1.05rem':'0.95rem'};color:${valueColor||'#e2e8f0'}">${value}</div>
      </div>`;

    const financCard = `
      <div class="card">
        <div class="card-title">💰 Resumo Financeiro</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
          ${chip('TPA / Máquina', fmt(tpa))}
          ${chip('Transferência', fmt(transf))}
          ${chip('Dinheiro', fmt(din))}
          ${chip('Total Gerado', fmt(totalGerado), '#4ade80', true)}
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
          ${chip('Compras', fmt(totalCompras), '#fb923c')}
          ${chip('Despesas', fmt(totalDespesas), '#f87171')}
          ${chip('Total Saídas', fmt(totalSaidas), '#f87171', true)}
        </div>
        <div style="padding:12px 14px;background:#0f172a;border-radius:8px;display:flex;justify-content:space-between;align-items:center;border:1px solid #334155">
          <span style="color:#94a3b8;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:.05em">Total Final</span>
          <span style="font-size:1.25rem;font-weight:700;color:${totalFinal >= 0 ? '#4ade80' : '#f87171'}">${fmt(totalFinal)}</span>
        </div>
      </div>`;

    const stockCard = `
      <div class="card mt-16">
        <div class="card-title">📦 Resumo de Stock</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          ${chip('Total Vendido (und.)', fmtNum(totalVend))}
          ${chip('Valor de Stock', fmt(totalValStock), '#4ade80', true)}
        </div>
      </div>`;

    const vendasCard = vendasLines.length > 0 ? `
      <div class="card mt-16">
        <div class="card-title">🍽️ Resumo de Vendas</div>
        ${vendasLines.map(v => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #1e293b">
            <span style="font-size:13px;color:#cbd5e1">${v.nome}</span>
            <span style="display:flex;gap:14px;align-items:center">
              <span style="color:#64748b;font-size:12px">${v.copo ? v.qty + ' copos' : v.qty + ' × ' + fmt(v.preco)}</span>
              <span style="font-weight:600;color:#e2e8f0;min-width:72px;text-align:right">${fmt(v.total)}</span>
            </span>
          </div>`).join('')}
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:2px solid #334155">
          <span style="font-weight:600;color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:.05em">Total Vendas</span>
          <span style="font-weight:700;color:#4ade80">${fmt(totalVendasVal)}</span>
        </div>
      </div>` : '';

    const irrCard = `
      <div class="card mt-16">
        <div class="card-title">⚠️ Irregularidades</div>
        ${irr.length === 0
          ? '<div style="color:#4ade80;font-size:14px;padding:6px 0">✓ Nenhuma irregularidade detectada</div>'
          : irr.map(i => `
              <div style="display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #1e293b">
                <span style="flex-shrink:0;font-size:14px">${icon[i.level]}</span>
                <span style="color:${color[i.level]};font-size:13px;line-height:1.45">${i.msg}</span>
              </div>`).join('')}
      </div>`;

    el.innerHTML = financCard + stockCard + vendasCard + irrCard;
  } catch(e) {
    el.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

    }
    const [escalaPack, equipaReal, pessoas, faltasReg] = await Promise.all([
      api('GET', `/escala/semana?data_inicio=${encodeURIComponent(S.date)}&data_fim=${encodeURIComponent(S.date)}`).catch(() => ({ semana: [], template: [] })),
      api('GET', `/turnos/${S.turnoData.id}/equipa-real`),
      api('GET', '/equipa/pessoas'),
      api('GET', `/turnos/${S.turnoData.id}/faltas`)
    ]);
    const rowsDia = escalaPack.semana || [];
    const rowsTemplate = escalaPack.template || [];
    const listaDia = rowsDia.filter(r => r.turno === turnoNome);
    const d = new Date(S.date + 'T12:00:00Z');
    const day = d.getUTCDay();
    const diaSemana = day === 0 ? 6 : day - 1; // 0=Seg ... 6=Dom
    const listaTpl = rowsTemplate.filter(r => Number(r.dia_semana) === diaSemana && r.turno === turnoNome);
    const lista = listaDia.length ? listaDia : listaTpl;
    const origem = listaDia.length ? 'escala do dia' : 'escala template';
    const canEdit = !!S.turnoCanEdit;
    const escaladosIds = new Set(lista.map(r => String(r.utilizador_id || '')).filter(Boolean));
    const reaisIds = new Set(equipaReal.map(r => String(r.utilizador_id || '')).filter(Boolean));
    const faltas = lista.filter(r => r.utilizador_id && !reaisIds.has(String(r.utilizador_id)));
    const coberturas = equipaReal.filter(r => r.utilizador_id && !escaladosIds.has(String(r.utilizador_id)));
    const motivoPorFalta = {};
    equipaReal.forEach(r => {
      if (r.cobrindo_utilizador_id && r.motivo_falta) motivoPorFalta[String(r.cobrindo_utilizador_id)] = r.motivo_falta;
    });
    faltasReg.forEach(f => {
      if (f.utilizador_id && f.motivo_falta) motivoPorFalta[String(f.utilizador_id)] = f.motivo_falta;
    });

    const info = `<div style="font-size:11px;color:#64748b;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em">${origem}</div>
      <div style="font-size:12px;color:#94a3b8;margin-bottom:12px">Horário: <strong style="color:#cbd5e1">${turnoHorarioLabel(turnoNome)}</strong></div>`;
    const escaladosHtml = lista.length
      ? lista.map((r, i) => {
        const a = r.area_trabalho != null && r.area_trabalho !== '' ? parseInt(r.area_trabalho, 10) : NaN;
        const areaLine = Number.isFinite(a) && a >= 1 && a <= 3
          ? `<div style="font-size:11px;color:#a78bfa;margin-top:3px">${areaTrabalhoAbbr(a)} — ${areaTrabalhoLabel(a)}</div>`
          : '';
        return `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;${i < lista.length - 1 ? 'border-bottom:1px solid #334155;' : ''}">
        <div>
          <div style="font-weight:600;color:#e2e8f0">${r.utilizador_nome || 'Sem nome'}</div>
          <div style="font-size:12px;color:#64748b">${(r.utilizador_role || 'operador').toUpperCase()}</div>
          ${areaLine}
        </div>
        ${r.notas ? `<div style="font-size:12px;color:#94a3b8;text-align:right;max-width:55%">${r.notas}</div>` : '<div style="font-size:12px;color:#475569">—</div>'}
      </div>`;
      }).join('')
      : '<span style="color:#64748b">Sem funcionários escalados para este turno.</span>';

    const reaisHtml = equipaReal.length
      ? equipaReal.map((r, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;${i < equipaReal.length - 1 ? 'border-bottom:1px solid #334155;' : ''}">
        <div>
          <div style="font-weight:600;color:#e2e8f0">${r.utilizador_nome || 'Sem nome'}</div>
          <div style="font-size:12px;color:#64748b">${(r.utilizador_role || 'operador').toUpperCase()}</div>
          ${r.cobrindo_utilizador_nome ? `<div style="font-size:12px;color:#60a5fa;margin-top:2px">Cobrindo: ${r.cobrindo_utilizador_nome}</div>` : ''}
          ${r.motivo_falta ? `<div style="font-size:12px;color:#fbbf24;margin-top:2px">Motivo da falta: ${r.motivo_falta}</div>` : ''}
          ${r.hora_extra ? `<div style="font-size:12px;color:#fbbf24;margin-top:2px">Hora extra aplicada</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${r.notas ? `<div style="font-size:12px;color:#94a3b8;max-width:240px;text-align:right">${r.notas}</div>` : '<div style="font-size:12px;color:#475569">—</div>'}
          ${canEdit ? `<button type="button" class="btn btn-danger btn-sm" onclick="runAction(event, () => removeTurnoPresenca('${S.turnoData.id}','${encodeURIComponent(r.utilizador_id)}'))">Remover</button>` : ''}
        </div>
      </div>
    `).join('')
      : '<span style="color:#64748b">Nenhum funcionário registado como presente.</span>';

    const alertaHtml = `
      <div style="margin-top:10px;font-size:12px">
        <div style="color:${faltas.length ? '#fbbf24' : '#4ade80'}">${faltas.length ? `⚠ Faltas: ${faltas.map(f => {
          const motivo = motivoPorFalta[String(f.utilizador_id)];
          const nome = f.utilizador_nome || 'Sem nome';
          return motivo
            ? `${nome} (${motivo})`
            : `${nome}${canEdit ? ` <button type="button" class="btn btn-danger btn-sm" style="margin-left:6px" onclick="registarMotivoFalta(event, '${S.turnoData.id}','${encodeURIComponent(f.utilizador_id)}','${(nome||'').replace(/'/g, "\\'")}')">Registar motivo</button>` : ''}`;
        }).join(', ')}` : '✓ Sem faltas nos escalados'}</div>
        <div style="color:${coberturas.length ? '#60a5fa' : '#64748b'};margin-top:4px">${coberturas.length ? `↺ Coberturas: ${coberturas.map(c => c.utilizador_nome || 'Sem nome').join(', ')}` : 'Sem coberturas registadas'}</div>
      </div>`;

    const addForm = canEdit ? `
      <div class="card mt-16">
        <div class="card-title">➕ Registar quem trabalhou</div>
        <div id="turno-presenca-msg"></div>
        <div class="entradas-form">
          <select id="tp-user" class="entradas-select">
            <option value="">— Funcionário —</option>
            ${pessoas.map(p => `<option value="${p.id}">${p.nome} (${p.role})</option>`).join('')}
          </select>
          <select id="tp-cobrindo" class="entradas-select" style="display:none">
            <option value="">— Está cobrindo quem? —</option>
            ${lista.filter(r => r.utilizador_id).map(r => `<option value="${r.utilizador_id}">${r.utilizador_nome || r.utilizador_id}</option>`).join('')}
          </select>
          <input id="tp-motivo-falta" class="entradas-notas" type="text" placeholder="Motivo da falta" style="display:none"/>
          <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#94a3b8">
            <input id="tp-he" type="checkbox" style="width:14px;height:14px"/>
            Aplicar hora extra
          </label>
          <input id="tp-notas" class="entradas-notas" type="text" placeholder="Nota opcional (falta, cobertura, etc.)"/>
          <button type="button" class="btn btn-success btn-sm" onclick="runAction(event, () => addTurnoPresenca('${S.turnoData.id}'))">Registar</button>
        </div>
      </div>` : '';

    el.innerHTML = `
      ${info}
      <div class="card-title" style="margin-bottom:6px">📅 Escalados</div>
      ${escaladosHtml}
      <div id="turno-equipa-real-section">
        <div class="card-title" style="margin:16px 0 6px">✅ Quem realmente trabalhou</div>
        ${reaisHtml}
      </div>
      ${alertaHtml}
      ${addForm}
    `;
    if (canEdit) {
      const userSel = document.getElementById('tp-user');
      const cobSel = document.getElementById('tp-cobrindo');
      const motEl = document.getElementById('tp-motivo-falta');
      const heEl = document.getElementById('tp-he');
      const toggleExtra = () => {
        if (!userSel || !cobSel || !heEl || !motEl) return;
        const uid = userSel.value;
        const naoEscalado = !!uid && !escaladosIds.has(String(uid));
        cobSel.style.display = naoEscalado ? '' : 'none';
        motEl.style.display = naoEscalado ? '' : 'none';
        if (!naoEscalado) motEl.value = '';
      };
      if (userSel) userSel.onchange = toggleExtra;
      toggleExtra();
    }
    renderIrregularidadesTurno();
    loadTurnoAreasEscalados();
  } catch (e) {
    el.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
  }
}

async function addTurnoPresenca(turnoId) {
  const utilizador_id = val('tp-user');
  const cobrindo_utilizador_id = val('tp-cobrindo');
  const hora_extra = !!document.getElementById('tp-he')?.checked;
  const motivo_falta = val('tp-motivo-falta');
  const notas = val('tp-notas');
  if (!utilizador_id) return err('turno-presenca-msg', 'Seleciona um funcionário');
  const turnoNome = S.turnoData?.nome;
  const d = new Date(S.date + 'T12:00:00Z');
  const day = d.getUTCDay();
  const diaSemana = day === 0 ? 6 : day - 1;
  const template = await api('GET', '/escala/template');
  const escaladosIds = new Set(template.filter(r => Number(r.dia_semana) === diaSemana && r.turno === turnoNome).map(r => String(r.utilizador_id || '')).filter(Boolean));
  const naoEscalado = !escaladosIds.has(String(utilizador_id));
  if (naoEscalado && !cobrindo_utilizador_id) return err('turno-presenca-msg', 'Seleciona quem este funcionário está cobrindo');
  if (naoEscalado && !motivo_falta.trim()) return err('turno-presenca-msg', 'Regista o motivo da falta');
  if (naoEscalado && !hora_extra) return err('turno-presenca-msg', 'Confirma se deve aplicar pagamento de hora extra');
  try {
    await api('POST', `/turnos/${turnoId}/equipa-real`, { utilizador_id, cobrindo_utilizador_id: naoEscalado ? cobrindo_utilizador_id : null, hora_extra, motivo_falta: naoEscalado ? motivo_falta.trim() : '', notas });
    show('turno-presenca-msg', '');
    if (document.getElementById('tp-notas')) document.getElementById('tp-notas').value = '';
    await loadEscalaTurno();
  } catch (e) { err('turno-presenca-msg', e.message); }
}

async function removeTurnoPresenca(turnoId, utilizadorIdEncoded) {
  try {
    await api('DELETE', `/turnos/${turnoId}/equipa-real/${utilizadorIdEncoded}`);
    await loadEscalaTurno();
  } catch (e) { alert(e.message); }
}

async function registarMotivoFalta(ev, turnoId, utilizadorIdEncoded, nome) {
  const motivo = prompt(`Motivo da falta de ${nome}:`);
  if (!motivo || !motivo.trim()) return;
  await runAction(ev, async () => {
    try {
      await api('POST', `/turnos/${turnoId}/faltas`, {
        utilizador_id: decodeURIComponent(utilizadorIdEncoded),
        motivo_falta: motivo.trim()
      });
      await loadEscalaTurno();
    } catch (e) { alert(e.message); }
  });
}

async function submitSaida(turnoId) {
  const desc  = document.getElementById('s-desc')?.value.trim() || '';
  const valor = parseFloat(document.getElementById('s-valor')?.value);
  const notas = document.getElementById('s-notas')?.value.trim() || '';
  const msg   = document.getElementById('saida-form-msg');
  if (!desc)  { if (msg) { msg.className='alert alert-error'; msg.textContent='Descrição obrigatória.'; } return; }
  if (!valor || valor <= 0) { if (msg) { msg.className='alert alert-error'; msg.textContent='Valor inválido.'; } return; }
  try {
    await api('POST', `/turnos/${turnoId}/saidas`, { descricao: desc, valor, notas });
    document.getElementById('s-desc').value  = '';
    document.getElementById('s-valor').value = '';
    document.getElementById('s-notas').value = '';
    await loadRegistosMovimentosSection(turnoId, S.turnoData?.stock || [], true);
  } catch(e) {
    if (msg) { msg.className='alert alert-error'; msg.textContent=e.message; }
  }
}

/** Categorias conhecidas para agrupar o card «Quantidade vendida por produto». */
const HIST_CAT_LABEL = {
  menu: 'Menu',
  bebida_copo: 'Bebidas (por copo)',
  bebida: 'Bebidas (unidade)',
  ingredientes: 'Ingredientes',
  outro: 'Outros'
};

function histVendasProdutosCardHtml(rows) {
  const list = Array.isArray(rows) ? rows.filter((r) => {
    const q = parseFloat(r.qtd_vendida) || 0;
    const v = parseFloat(r.valor_vendas) || 0;
    return q > 0 || v > 0;
  }) : [];
  const porCat = {};
  let totalQtd = 0;
  let totalValor = 0;
  for (const r of list) {
    let cat = r.categoria || 'outro';
    if (cat === 'bebida' && r.venda_por_copo === true) cat = 'bebida_copo';
    if (!porCat[cat]) porCat[cat] = [];
    porCat[cat].push(r);
    totalQtd += parseFloat(r.qtd_vendida) || 0;
    totalValor += parseFloat(r.valor_vendas) || 0;
  }
  const ordemCats = ['menu', 'bebida_copo', 'bebida', 'ingredientes', 'outro'];
  // Garantir que «Menu» e «Bebidas (por copo)» aparecem sempre, mesmo sem vendas.
  const catsSempre = ['menu', 'bebida_copo'];
  for (const c of catsSempre) if (!porCat[c]) porCat[c] = [];
  const catsOrdenadas = Object.keys(porCat).sort((a, b) => {
    const ia = ordemCats.indexOf(a);
    const ib = ordemCats.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  const secoes = catsOrdenadas.map((cat) => {
    const rowsCat = porCat[cat].sort((a, b) => {
      const qa = parseFloat(a.qtd_vendida) || 0;
      const qb = parseFloat(b.qtd_vendida) || 0;
      if (qb !== qa) return qb - qa;
      return String(a.produto_nome || '').localeCompare(String(b.produto_nome || ''));
    });
    let qCat = 0;
    let vCat = 0;
    const trs = rowsCat.map((r) => {
      const q = parseFloat(r.qtd_vendida) || 0;
      const v = parseFloat(r.valor_vendas) || 0;
      qCat += q;
      vCat += v;
      const sigla = r.venda_por_copo === true ? 'copos' : medicaoSigla(r.tipo_medicao || 'unidade');
      return `
      <tr>
        <td style="padding:6px 8px;color:#e2e8f0">${escapeHtml(r.produto_nome || 'Sem nome')}</td>
        <td style="padding:6px 8px;text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums">${fmtNum(q)} <span style="color:#64748b;font-size:11px">${escapeHtml(sigla)}</span></td>
        <td style="padding:6px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums">${fmt(v)}</td>
        <td style="padding:6px 8px;text-align:right;color:#64748b;font-size:11px">${r.turnos || 0}</td>
      </tr>`;
    }).join('');
    const label = HIST_CAT_LABEL[cat] || cat;
    const trsRender = rowsCat.length ? trs : `
      <tr>
        <td colspan="4" style="padding:8px 10px;color:#475569;font-size:12px;font-style:italic">Sem vendas no período</td>
      </tr>`;
    return `
      <tr><td colspan="4" class="section-header" style="background:#0f172a;color:#94a3b8;font-size:11px;padding:8px 10px;text-transform:uppercase;letter-spacing:0.06em">${escapeHtml(label)}</td></tr>
      ${trsRender}
      <tr>
        <td style="padding:6px 8px;color:#64748b;font-size:11px;text-transform:uppercase;letter-spacing:0.04em">Subtotal ${escapeHtml(label.toLowerCase())}</td>
        <td style="padding:6px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;font-weight:600">${fmtNum(qCat)}</td>
        <td style="padding:6px 8px;text-align:right;color:#cbd5e1;font-variant-numeric:tabular-nums;font-weight:600">${fmt(vCat)}</td>
        <td></td>
      </tr>`;
  }).join('');
  return `
    <div class="card" style="margin-bottom:16px;padding:0;overflow:hidden">
      <div style="padding:14px 16px 8px">
        <div class="card-title" style="margin-bottom:4px">🍽️ Quantidade vendida por produto</div>
        <div style="font-size:12px;color:#64748b">Soma de «vendido» por produto em todos os turnos do período (encontrado + entrada − deixado).</div>
      </div>
      <div class="table-wrap">
        <table style="width:100%;border-collapse:collapse">
          <thead>
            <tr>
              <th style="text-align:left;padding:8px;color:#94a3b8;font-size:12px">Produto</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Quantidade</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Valor</th>
              <th style="text-align:right;padding:8px;color:#94a3b8;font-size:12px">Turnos</th>
            </tr>
          </thead>
          <tbody>${secoes}</tbody>
          <tfoot>
            <tr style="border-top:2px solid #334155">
              <td style="padding:10px 8px;color:#f1f5f9;font-weight:700">Total do período</td>
              <td style="padding:10px 8px;text-align:right;color:#a5b4fc;font-variant-numeric:tabular-nums;font-weight:700">${fmtNum(totalQtd)}</td>
              <td style="padding:10px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums;font-weight:700">${fmt(totalValor)}</td>
              <td></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>`;
}

    if (!rows.length) { show('hist-content','<div class="alert alert-error">Sem dados neste período</div>'); return; }
