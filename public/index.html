async function deltaVenda(turnoId, prodId, delta) {
  const prev = vendasBuf[prodId] || 0;
  vendasBuf[prodId] = Math.max(0, prev + delta);
  const el = document.getElementById(`venda-qty-${prodId}`);
  if (el) el.textContent = vendasBuf[prodId];
  refreshVendasTotal();
  try {
    await apiEscrita('POST', `/turnos/${turnoId}/vendas`, { produto_id: prodId, quantidade: vendasBuf[prodId] },
      { tid: turnoId, chave: `vendas:${turnoId}:${prodId}`, desc: 'Venda registada' });
    const cfg = bebidaCopoCfg[prodId];
    if (cfg && cfg.kgPorCopo > 0) {
      if (!stockBuf[prodId]) stockBuf[prodId] = { encontrado:0, entrada:0, deixado:0, fechados:0 };
      const kgAdj = -delta * cfg.kgPorCopo;
      stockBuf[prodId].deixado = Math.max(0, (parseFloat(stockBuf[prodId].deixado) || 0) + kgAdj);
      updateStock(prodId, 'deixado', fmtNum(stockBuf[prodId].deixado));
    }
  } catch(e) {
    vendasBuf[prodId] = prev;
    if (el) el.textContent = vendasBuf[prodId];
    refreshVendasTotal();
    alert('Erro ao registar venda: ' + e.message);
  }
}

async function vendaQtyInputBlur(inp) {
  const prodId = inp.dataset.vendaPid;
  const turnoId = inp.dataset.vendaTurno;
  if (!prodId || !turnoId) return;
  const novaQty = Math.max(0, Math.floor(parseFloat(inp.value) || 0));
  inp.value = novaQty;
  const prev = vendasBuf[prodId] || 0;
  if (novaQty === prev) return;
  const delta = novaQty - prev;
  vendasBuf[prodId] = novaQty;
  refreshVendasTotal();
  try {
    await apiEscrita('POST', `/turnos/${turnoId}/vendas`, { produto_id: prodId, quantidade: novaQty },
      { tid: turnoId, chave: `vendas:${turnoId}:${prodId}`, desc: 'Venda registada' });
    const cfg = bebidaCopoCfg[prodId];
    if (cfg && cfg.kgPorCopo > 0) {
      if (!stockBuf[prodId]) stockBuf[prodId] = { encontrado:0, entrada:0, deixado:0, fechados:0 };
      const kgAdj = -delta * cfg.kgPorCopo;
      stockBuf[prodId].deixado = Math.max(0, (parseFloat(stockBuf[prodId].deixado) || 0) + kgAdj);
      updateStock(prodId, 'deixado', fmtNum(stockBuf[prodId].deixado));
    }
  } catch(e) {
    vendasBuf[prodId] = prev;
    inp.value = prev;
    refreshVendasTotal();
    alert('Erro ao registar venda: ' + e.message);
  }
}

function updateStock(pid, field, value) {
  const k = prodIdKey(pid);
  if (!k) return;
  if (!stockBuf[k]) stockBuf[k] = { encontrado: null, entrada: 0, deixado: null, fechados: 0, encontrado_caixa: null, deixado_caixa: null };
  if (field === 'encontrado' || field === 'deixado' || field === 'encontrado_caixa' || field === 'deixado_caixa') {
    const t = String(value ?? '').trim();
    stockBuf[k][field] = t === '' ? null : parseRaw(value);
  } else {
    stockBuf[k][field] = parseRaw(value);
  }
  const inp = document.querySelector(`input[type="number"][data-stock-pid="${k}"][data-stock-field="${field}"]`);
  if (inp && document.activeElement !== inp) {
    const n = stockBuf[k][field];
    inp.value =
      field === 'encontrado' || field === 'deixado' ? fmtStockEncontradoAttr(n) : fmtStockNumberAttr(n);
  }
  const { encontrado: enc, entrada: ent, deixado: dei } = stockBuf[k];
  const prod = S.turnoData?.stock?.find((s) => prodIdKey(s.produto_id) === k);
  const vend = vendidoQtyFromStockParts(enc, ent, dei);
  const ve = document.getElementById(`vend-${k}`);
  const tipoM = prod?.tipo_medicao || 'unidade';
  if (ve) ve.textContent = Number.isFinite(vend) && vend > 0 ? `${fmtNum(vend)} ${medicaoSigla(tipoM)}` : '';
  if (field === 'encontrado_caixa') refreshCompCaixa(k);
  refreshMenuQtys();
  renderIrregularidadesTurno();
  maybeClearTurnoStickyAfterStockCaixaOk();
  // Auto-save
  autoSaveSchedule();
}

/** Recalcula em tempo real a comparação da Enc. caixa vs Deix. caixa do turno anterior. */
function refreshCompCaixa(k) {
  const el = document.getElementById(`comp-caixa-${k}`);
  if (!el) return;
  const inp = document.querySelector(`input[data-stock-pid="${k}"][data-stock-field="encontrado_caixa"]`);
  const prevRaw = inp ? inp.getAttribute('data-prev-caixa') : '';
  const prev = prevRaw === '' || prevRaw === null ? NaN : parseFloat(prevRaw);
  const encC = stockBuf[k]?.encontrado_caixa;
  el.className = 'stock-comp-caixa comp-null';
  if (!Number.isFinite(prev)) {
    el.textContent = '';
    return;
  }
  // Antes do registo dos encontrados fechado só mostra o valor anterior
  // (sem falta/sobra) — a comparação faz-se depois do registo.
  if (!compGatesForTurno(S.turnoData).enc) {
    el.textContent = `T. ant.: ${fmtNum(prev)}`;
    return;
  }
  if (!Number.isFinite(encC)) {
    el.textContent = `T. ant.: ${fmtNum(prev)}`;
    return;
  }
  const diff = encC - prev;
  if (Math.abs(diff) < 0.001) {
    el.textContent = `T. ant.: ${fmtNum(prev)}`;
  } else if (diff < 0) {
    el.className = 'stock-comp-caixa comp-falta';
    el.textContent = `⚠ falta ${fmtNum(Math.abs(diff))}`;
  } else {
    el.className = 'stock-comp-caixa comp-sobra';
    el.textContent = `↑ sobra ${fmtNum(diff)}`;
  }
}

/**
 * Quantidade «vendida» como na aba Vendas: menu/copos/avulso em vendasBuf; resto = enc+entrada−deixado (stock).
 */
function getVendidoRegistadoEmVendas(s) {
  const pid = prodIdKey(s.produto_id);
  if (!pid) return 0;
  if (menuProdIds.length && menuProdIds.some((id) => prodIdKey(id) === pid)) {
    return Math.max(0, parseFloat(vendasBuf[pid]) || 0);
  }
  if (bebidaCopoProdIds.length && bebidaCopoProdIds.includes(pid)) {
    return Math.max(0, parseFloat(vendasBuf[pid]) || 0);
  }
  if (avulsoProdIds.length && avulsoProdIds.some((id) => prodIdKey(id) === pid)) {
    return calcStandaloneQty(pid);
  }
  const b = getStockLineForProduto(pid);
  let vend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
  if (!Number.isFinite(vend)) return 0;
  vend = Math.max(0, vend);
  if (vend <= 0 && parseFloat(s.vendido) > 0) vend = Math.max(0, parseFloat(s.vendido));
  return vend;
}

/** 1 copo Fino = 0,270 kg (barril → copos em irregularidades). */
const KG_FINO_COPO = 0.27;
/** Pesos de referência do barril de Fino. */
const KG_FINO_BARRIL_CHEIO = 61.05; // peso bruto na balança
const KG_FINO_BARRIL_VAZIO = 12.9;  // tara
const KG_FINO_BARRIL_NET = KG_FINO_BARRIL_CHEIO - KG_FINO_BARRIL_VAZIO; // 48,15 kg líquidos por barril novo
function prodNomeNorm(n) {
  return String(n || '').trim().toLowerCase();
}
/** Filtro por campo do bloco «Validação — diferenças detectadas».
 *  filtro[key] === false → campo escondido; ausente/true → visível.
 *  Guardado por dispositivo em localStorage. */
/** Campos SEMPRE activos — não podem ser escondidos pelo filtro. */
const DIF_CAMPOS_FIXOS = ['vend-balcao', 'enc-ant', 'deix-prox'];

function difCampoFiltroGet() {
  try {
    const v = JSON.parse(localStorage.getItem('stockos.difCampoFiltro') || '{}');
    const f = v && typeof v === 'object' ? v : {};
    DIF_CAMPOS_FIXOS.forEach((k) => { delete f[k]; });
    return f;
  } catch (_) {
    return {};
  }
}

function difCampoFiltroToggle(btn) {
  if (!btn) return;
  const key = btn.getAttribute('data-dif-campo');
  if (!key || DIF_CAMPOS_FIXOS.includes(key)) return;
  const f = difCampoFiltroGet();
  f[key] = f[key] === false;
  try { localStorage.setItem('stockos.difCampoFiltro', JSON.stringify(f)); } catch (_) {}
  difCampoFiltroApply();
}

/** Aplica o filtro ao DOM: chips, linhas, contagens e totais por grupo. */
function difCampoFiltroApply() {
  const wrap = document.getElementById('dif-detectadas-wrap');
  if (!wrap) return;
  const f = difCampoFiltroGet();
  wrap.querySelectorAll('button[data-dif-campo]').forEach((b) => {
    b.classList.toggle('pedido-filter--on', f[b.getAttribute('data-dif-campo')] !== false);
  });
  wrap.querySelectorAll('tr[data-dif-row]').forEach((tr) => {
    tr.style.display = f[tr.getAttribute('data-dif-row')] === false ? 'none' : '';
  });
  ['falta', 'sobra'].forEach((tipo) => {
    const rows = [...wrap.querySelectorAll(`tr[data-dif-tipo="${tipo}"]`)].filter((tr) => tr.style.display !== 'none');
    const head = wrap.querySelector(`tr[data-dif-grupo="${tipo}"]`);
    const tot = wrap.querySelector(`tr[data-dif-total="${tipo}"]`);
    const kz = rows.reduce((s, tr) => s + (parseFloat(tr.getAttribute('data-dif-kz')) || 0), 0);
    if (head) {
      head.style.display = rows.length ? '' : 'none';
      const c = head.querySelector('[data-dif-count]');
      if (c) c.textContent = rows.length;
    }
    if (tot) {
      tot.style.display = rows.length && kz > 0 ? '' : 'none';
      const v = tot.querySelector('[data-dif-kz-val]');
      if (v) v.textContent = fmt(kz);
    }
  });
  const vazio = wrap.querySelector('#dif-detectadas-vazio');
  if (vazio) {
    const any = [...wrap.querySelectorAll('tr[data-dif-row]')].some((tr) => tr.style.display !== 'none');
    vazio.style.display = any ? 'none' : '';
  }
}

/** Comparações de validação/irregularidades só são fiáveis depois dos
 *  registos estarem fechados: encontrados → comparações com o turno
 *  anterior; deixados → comparações com o próximo turno e vendido.
 *  Turno fechado (fiscalização) mostra sempre tudo. */
function compGatesForTurno(t) {
  const tt = t || S.turnoData || {};
  const fech = tt.estado === 'fechado';
  return {
    enc: fech || !!tt.encontrados_fechados_em,
    deix: fech || !!tt.deixados_fechados_em
  };
}
/** Chave estável para mapas `produto_id` / `componente_id` (SERIAL ou UUID). Evita `parseInt` em UUIDs. */
function prodIdKey(id) {
  if (id == null || id === '') return '';
  const s = String(id).trim();
  if (/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s)) return s.toLowerCase();
  return s;
}
/** Bloco irregularidades Batata: nome legado ou prefixo `Batata Pré-frita …` (ex.: "… stock"). NBSP → espaço. */
function isProdutoBatataIrreg(nome) {
  let bn = String(nome || '')
    .trim()
    .toLowerCase()
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return bn === 'batata pré-frita' || bn.startsWith('batata pré-frita ');
}
/** Ingrediente Coxa nas irregularidades: nome exacto «Coxa» ou prefixo «Coxa …» (ex.: «Coxa stock»). */
function isProdutoCoxaIrreg(nome) {
  let bn = String(nome || '')
    .trim()
    .toLowerCase()
    .replace(/\u00a0/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  return bn === 'coxa' || bn.startsWith('coxa ');
}
function resolveProdutoIdPorNomeFromLists(stockArr, produtosArr, nomeNorm) {
  const row = stockArr.find((s) => prodNomeNorm(s.produto_nome) === nomeNorm);
  if (row) return String(row.produto_id);
  const pr = (produtosArr || []).find((p) => prodNomeNorm(p.nome) === nomeNorm);
  return pr ? String(pr.id) : null;
}
/** Peso do recipiente vazio (barril): usa `peso_tara_kg` ou 12,9 kg. */
function getFinoBarrilRecipienteKgFromRow(stockRow) {
  if (!stockRow || prodNomeNorm(stockRow.produto_nome) !== 'fino barril') return null;
  const t = parseFloat(stockRow.peso_tara_kg);
  return Number.isFinite(t) && t > 0 ? t : 12.9;
}
/** Encontrado/Deixado a 0 → peso do recipiente (só turno aberto). */
function aplicarFinoBarrilZeroParaRecipienteKg(turno, canEdit) {
  if (!canEdit || !turno?.stock?.length) return false;
  const row = turno.stock.find((s) => prodNomeNorm(s.produto_nome) === 'fino barril');
  if (!row) return false;
  const kg = getFinoBarrilRecipienteKgFromRow(row);
  if (kg == null) return false;
  const sid = prodIdKey(row.produto_id);
  if (!sid || !stockBuf[sid]) return false;
  let ch = false;
  const encB = stockBuf[sid].encontrado;
  if (encB == null || encB === '' || parseFloat(encB) === 0) {
    stockBuf[sid].encontrado = kg;
    ch = true;
  }
  const deB = stockBuf[sid].deixado;
  if (deB == null || deB === '' || parseFloat(deB) === 0) {
    stockBuf[sid].deixado = kg;
    ch = true;
  }
  return ch;
}

/** Nomes de quem registou presença no turno (equipa real), para o cartão Irregularidades. */
async function refreshIrregularidadesEquipaLine(show) {
  const el = document.getElementById('turno-irregularidades-equipa');
  if (!el) return;
  if (!show) {
    el.textContent = '';
    return;
  }
  const tid = S.turnoData?.id;
  if (!tid) {
    el.textContent = '';
    return;
  }
  try {
    const equipaReal = await api('GET', `/turnos/${tid}/equipa-real`);
    const names = (equipaReal || [])
      .map((r) => String(r.utilizador_nome || '').trim())
      .filter(Boolean);
    el.textContent = names.length
      ? `Trabalharam: ${names.join(', ')}`
      : 'Trabalharam: — (sem registo na aba Escala)';
  } catch (_) {
    el.textContent = '';
  }
}

/** Tolerância ao comparar quantidade ingrediente vs Σ menus (Batata, Coxa, …; ruído float). */
const KG_IRREG_COMPONENTE_EPS = 0.02;

/**
 * Expande recursivamente a receita de um produto: devolve `{ id_ingrediente_final: qtd_total }`.
 * Acompanha a função `expandIngredientes` no backend (api/server.js).
 */
function expandReceitaRecursiveClient(prodId, fator, receitasByProduto, seen) {
  const key = prodIdKey(prodId);
  if (!key) return {};
  if (seen && seen.has(key)) return {};
  const rows = receitasByProduto[key] || [];
  if (!rows.length) return { [key]: fator };
  const nextSeen = new Set(seen || []);
  nextSeen.add(key);
  const out = {};
  for (const r of rows) {
    const sub = expandReceitaRecursiveClient(r.componente_id, fator * parseFloat(r.quantidade), receitasByProduto, nextSeen);
    for (const [k, v] of Object.entries(sub)) {
      out[k] = (out[k] || 0) + v;
    }
  }
  return out;
}

/**
 * Para todos os menus vendidos, calcula consumo esperado por ingrediente final (recursivo)
 * com breakdown por menu. Devolve `{ ingId: { total, byMenu: [{menu_nome, qtd}] } }`.
 */
function computeIngredientesEsperadosPorMenu(vm, receitasByProduto, produtos) {
  const out = {};
  const menus = (produtos || []).filter((p) => p.categoria === 'menu');
  for (const m of menus) {
    const menuKey = prodIdKey(m.id);
    if (!menuKey) continue;
    const qtyMenu = parseFloat(vm[menuKey]) || 0;
    if (qtyMenu <= 0) continue;
    const exp = expandReceitaRecursiveClient(m.id, qtyMenu, receitasByProduto, new Set());
    for (const [ingId, qtd] of Object.entries(exp)) {
      if (ingId === menuKey) continue;
      if (!out[ingId]) out[ingId] = { total: 0, byMenu: [] };
      out[ingId].total += qtd;
      out[ingId].byMenu.push({ menu_nome: m.nome, qtd });
    }
  }
  return out;
}

/**
 * Quantidade (un. ou kg conforme receita) imputável a partir de vendas de **menu** com linha de receita
 * directa para o `componenteProdId` (sem venda avulsa nem expansão recursiva).
 */
function totalQtyComponenteFromMenusReceitaDirecta(vm, componenteProdId, receitasByProduto, produtos) {
  const compKey = prodIdKey(componenteProdId);
  if (!compKey) return 0;
  let total = 0;
  const menus = (produtos || []).filter((p) => p.categoria === 'menu');
  for (const p of menus) {
    const menuKey = prodIdKey(p.id);
    if (!menuKey) continue;
    const qtyMenu = parseFloat(vm[menuKey]) || 0;
    if (qtyMenu <= 0) continue;
    const rows = receitasByProduto[menuKey] || [];
    for (const r of rows) {
      if (prodIdKey(r.componente_id) !== compKey) continue;
      total += qtyMenu * parseFloat(r.quantidade);
    }
  }
  return total;
}

/**
 * Bloco HTML stock vs Σ menus para um ingrediente (Batata, Coxa, …).
 * @param {string} receitaLabel — texto curto em «Σ menus com … na receita»
 */
function buildIrregStockVsMenusHtml({ stockRow, stockBuf, vendasBuf, receitasIrreg, prodArr, receitaLabel }) {
  const pidB = prodIdKey(stockRow.produto_id);
  const b = stockBuf[pidB] || {};
  const enc = b.encontrado != null && b.encontrado !== '' ? b.encontrado : parseEncontradoFromRow(stockRow.encontrado);
  const ent = Number.isFinite(parseFloat(b.entrada)) ? parseFloat(b.entrada) : parseFloat(stockRow.entrada) || 0;
  const dei =
    b.deixado != null && b.deixado !== '' ? parseFloat(b.deixado) : parseEncontradoFromRow(stockRow.deixado);
  const qtyRaw = vendidoQtyFromStockParts(enc, ent, dei);
  const qtyStock = Number.isFinite(qtyRaw) ? Math.max(0, qtyRaw) : 0;
  const rbp = receitasByProdutoFromIrregBuf(receitasIrreg);
  const vm = vmFromVendasBufIrreg(vendasBuf);
  const qtyMenus = totalQtyComponenteFromMenusReceitaDirecta(vm, stockRow.produto_id, rbp, prodArr);
  const diff = qtyStock - qtyMenus;
  const um = medicaoSigla(stockRow.tipo_medicao || 'unidade');
  if (Math.abs(diff) < KG_IRREG_COMPONENTE_EPS) return '';
  const border = 'rgba(251,146,60,0.45)';
  const bg = 'rgba(251,146,60,0.1)';
  return `
    <div style="margin-top:10px;padding:8px 10px;border-radius:6px;border:1px solid ${border};background:${bg};font-size:12px;color:#cbd5e1;line-height:1.4">
      <div style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;color:#fb923c">${escapeHtml(stockRow.produto_nome)} (stock vs menus)</div>
      <div>Stock <span style="color:#94a3b8">(enc.+entr.−deix.)</span> <strong>${fmtNum(qtyStock)}</strong> ${um}</div>
      <div style="margin-top:4px">Total de menus com ${escapeHtml(receitaLabel)} na receita <span style="color:#64748b">(vendas × qtd. na receita)</span> <strong>${fmtNum(qtyMenus)}</strong> ${um}</div>
      <div style="margin-top:4px"><span style="color:#94a3b8">Diferença</span> <strong style="color:#fb923c">${fmtNum(Math.abs(diff))}</strong> ${um}</div>
    </div>`;
}

function receitasByProdutoFromIrregBuf(buf) {
  const o = {};
  if (!buf) return o;
  for (const [k, rows] of Object.entries(buf)) {
    const pid = prodIdKey(k);
    if (!pid) continue;
    if (!o[pid]) o[pid] = [];
    for (const r of rows) {
      o[pid].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
    }
  }
  return o;
}

function vmFromVendasBufIrreg(vb) {
  const vm = {};
  for (const [k, v] of Object.entries(vb || {})) {
    const key = prodIdKey(k);
    if (key) vm[key] = parseFloat(v) || 0;
  }
  return vm;
}

/**
 * Blocos HTML de irregularidades (caixa, stock vs T. anterior, Fino barril, Batata/Coxa stock vs Σ menus).
 * Fonte única: cartão no turno (`renderIrregularidadesTurno`) e página Irregularidades (lista).
 * @param {object} p
 * @param {object} p.turno — com `stock` e `caixa` (histórico)
 * @param {object} p.stockBuf — `{ [pid]: { encontrado, entrada, deixado, fechados? } }`
 * @param {object} p.vendasBuf — quantidades por produto (copos Fino 400/1000, etc.)
 * @param {number} p.totalVendasKz — mesma soma que `getTotalVendasTurnoKz` / resumo vendas
 * @param {number} p.totalGeradoKz — TPA+transf+din (turno: inputs caixa; histórico: `turno.caixa`)
 * @param {Array} [p.produtos] — catálogo para resolver Fino 400/1000 (fallback: stock + `S.produtos`)
 * @param {object} [p.receitasIrreg] — mapa `produto_id` → [{ componente_id, quantidade }] (receitas); sem isto não há check stock vs menus
 * @returns {{ hasAny: boolean, caixaHtml: string, bancoHtml: string, stockHtml: string, finoHtml: string, ingredientesItems: Array<{produto_id:string,produto_nome:string,html:string}> }}
 */
function buildIrregularidadesHtmlParts({
  turno,
  stockBuf,
  vendasBuf,
  totalVendasKz,
  totalGeradoKz,
  totalPedidosKz,
  produtos,
  receitasIrreg,
  depositosTurno
}) {
  const stock = turno?.stock || [];
  const prodArr = produtos && produtos.length ? produtos : (S.produtos || []);

  // Caixa: referência são os pedidos ao balcão (quando existem).
  // Fallback para totalVendasKz (legacy) se totalPedidosKz não vier definido.
  const usaPedidos = Number.isFinite(totalPedidosKz);
  const tv = usaPedidos ? totalPedidosKz : totalVendasKz;
  const refLabel = usaPedidos ? 'pedidos' : 'vendas';
  const tg = totalGeradoKz;
  const diffCaixa = Number.isFinite(tv) && Number.isFinite(tg) ? tv - tg : NaN;
  const caixaIrreg =
    Number.isFinite(tv) &&
    Number.isFinite(tg) &&
    Math.round(tv * 100) !== Math.round(tg * 100);
  let caixaHtml = '';
  if (caixaIrreg) {
    caixaHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
      <span style="color:#fb923c;font-weight:700">Caixa:</span> ${refLabel} <strong>${fmt(tv)}</strong> diferente de gerado <strong>${fmt(tg)}</strong>
      <span style="color:#94a3b8"> · diferença </span><strong style="color:#fb923c">${Number.isFinite(diffCaixa) ? fmt(Math.abs(diffCaixa)) : '—'}</strong>
    </div>`;
  }

  /** Banco: cruza o que devia ter ido para o banco (dinheiro do turno menos saídas de caixa)
   *  com o que foi efetivamente registado no depósito desse turno (valor bruto menos saídas
   *  do depósito para armazém). Considera "vendas TPA" do turno vs "TPA registado". */
  let bancoHtml = '';
  if (turno?.estado === 'fechado' && depositosTurno !== undefined) {
    const dep = depositosTurno;
    const din = parseFloat(turno.caixa?.dinheiro);
    const saidaCaixa = parseFloat(turno.caixa?.saida) || 0;
    const tpaCaixa = parseFloat(turno.caixa?.tpa);
    const dinDevido = Number.isFinite(din) ? Math.max(0, din - saidaCaixa) : NaN;
    if (!dep) {
      if (Number.isFinite(dinDevido) && dinDevido > 0) {
        bancoHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
          <span style="color:#fb923c;font-weight:700">Banco:</span> sem registo de depósito para este turno
          <span style="color:#94a3b8"> · esperado </span><strong>${fmt(dinDevido)}</strong>
        </div>`;
      }
    } else {
      const bruto = parseFloat(dep.valor) || 0;
      const saidaDep = parseFloat(dep.valor_saidas) || 0;
      const liquido = Math.max(0, bruto - saidaDep);
      const tpaDep = parseFloat(dep.valor_tpa);
      const diffDin = Number.isFinite(dinDevido) ? liquido - dinDevido : NaN;
      const diffTpa = Number.isFinite(tpaCaixa) && Number.isFinite(tpaDep) ? tpaDep - tpaCaixa : NaN;
      const dinIrreg = Number.isFinite(diffDin) && Math.round(diffDin * 100) !== 0;
      const tpaIrreg = Number.isFinite(diffTpa) && Math.round(diffTpa * 100) !== 0;
      if (dinIrreg || tpaIrreg) {
        const linhas = [];
        if (dinIrreg) {
          linhas.push(`<div>Dinheiro: caixa <strong>${fmt(dinDevido)}</strong> · banco <strong>${fmt(liquido)}</strong> · diferença <strong style="color:#fb923c">${fmt(Math.abs(diffDin))}</strong></div>`);
        }
        if (tpaIrreg) {
          linhas.push(`<div>TPA: caixa <strong>${fmt(tpaCaixa)}</strong> · banco <strong>${fmt(tpaDep)}</strong> · diferença <strong style="color:#fb923c">${fmt(Math.abs(diffTpa))}</strong></div>`);
        }
        bancoHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.1);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.45);font-size:12px;color:#cbd5e1;line-height:1.4">
          <div style="font-weight:700;color:#fb923c;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Banco</div>
          ${linhas.join('')}
          ${saidaDep > 0 ? `<div style="margin-top:3px;font-size:11px;color:#94a3b8">Líquido = bruto ${fmt(bruto)} − saída p/ armazém ${fmt(saidaDep)}</div>` : ''}
        </div>`;
      }
    }
  }

  let stockHtml = '';
  let stockIrrCount = 0;
  if (stock.length) {
    const rowsL = [];
    let temPrev = false;
    for (const s of stock) {
      const prev = s.prev_deixado;
      if (prev !== null && prev !== undefined) temPrev = true;
      const sid = prodIdKey(s.produto_id);
      const b = stockBuf[sid] || { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
      const encBuf = b.encontrado;
      let encN;
      if (encBuf != null && encBuf !== '' && Number.isFinite(parseFloat(encBuf))) {
        encN = parseFloat(encBuf);
      } else if (s.encontrado != null && s.encontrado !== '' && Number.isFinite(parseFloat(s.encontrado))) {
        encN = parseFloat(s.encontrado);
      } else {
        encN = NaN;
      }
      const med = medicaoSigla(s.tipo_medicao || 'unidade');
      let alertEnc = false;
      let prevNum = null;
      if (prev !== null && prev !== undefined && Number.isFinite(encN)) {
        prevNum = parseFloat(prev);
        if (Number.isFinite(prevNum) && Math.abs(encN - prevNum) >= 0.001) alertEnc = true;
      }
      rowsL.push({ s, encN, med, alertEnc, prevNum });
    }
    if (temPrev) {
      const irr = rowsL.filter((r) => r.alertEnc);
      stockIrrCount = irr.length;
      if (irr.length > 0) {
        const bullets = irr
          .map((r) => {
            const diff = r.encN - r.prevNum;
            const abs = Math.abs(diff);
            const tipo = diff < 0 ? 'Falta' : 'Sobra';
            return `<span style="display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:6px;background:rgba(51,65,85,0.55);font-size:12px;line-height:1.35;max-width:100%;box-sizing:border-box">
            <span style="color:#fb923c;font-weight:700">${tipo} ${fmtNum(abs)} ${r.med}</span>
            <span style="color:#e2e8f0">${escapeHtml(r.s.produto_nome)}</span>
          </span>`;
          })
          .join('');
        stockHtml = `<div style="padding:8px 10px;background:rgba(251,146,60,0.08);border-radius:6px;margin-bottom:10px;border:1px solid rgba(251,146,60,0.32)">
        <div style="font-weight:700;color:#fb923c;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Stock (${irr.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start">${bullets}</div>
      </div>`;
      }
    }
  }

  let finoHtml = '';
  let finoDiffCopos = NaN;
  const barrilRow = stock.find((s) => prodNomeNorm(s.produto_nome) === 'fino barril');
  if (barrilRow) {
    const pidB = prodIdKey(barrilRow.produto_id);
    const b = stockBuf[pidB] || { encontrado: null, entrada: 0, deixado: null };
    const kgVend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    const coposStock = Number.isFinite(kgVend) ? kgVend / KG_FINO_COPO : NaN;
    const id400 = resolveProdutoIdPorNomeFromLists(stock, prodArr, 'fino 400');
    const id1000 = resolveProdutoIdPorNomeFromLists(stock, prodArr, 'fino 1000');
    let v400 = 0;
    let v1000 = 0;
    if (id400) v400 = parseFloat(vendasBuf[prodIdKey(id400)]) || 0;
    if (id1000) v1000 = parseFloat(vendasBuf[prodIdKey(id1000)]) || 0;
    const coposVendas = v400 + v1000;
    const diff = Number.isFinite(coposStock) ? coposStock - coposVendas : NaN;
    finoDiffCopos = diff;
    const ok = Number.isFinite(diff) && Math.abs(diff) < 0.06;
    const missing = !id400 || !id1000;
    if (!ok || missing) {
      const border = 'rgba(251,146,60,0.45)';
      const bg = 'rgba(251,146,60,0.1)';
      const coposStockTxt = Number.isFinite(coposStock) ? fmtNum(Math.round(coposStock)) : '—';
      const diffTxt = Number.isFinite(diff) ? fmtNum(Math.abs(Math.round(diff))) : '—';
      const kgTxt = Number.isFinite(kgVend) ? `${fmtNum(kgVend)} kg` : '';
      finoHtml = `
    <div style="margin-top:10px;padding:8px 10px;border-radius:6px;border:1px solid ${border};background:${bg};font-size:12px;color:#cbd5e1;line-height:1.4">
      <div style="font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px;color:#fb923c">Fino barril</div>
      <div>Stock <strong>${coposStockTxt}</strong> · Vendas <strong>${fmtNum(coposVendas)}</strong> · diferença <strong style="color:#fb923c">${diffTxt}</strong> copos</div>
      <div style="margin-top:3px;font-size:11px;color:#94a3b8">${kgTxt}${kgTxt ? ' · ' : ''}400: ${fmtNum(v400)} · 1000: ${fmtNum(v1000)}</div>
      ${missing ? '<div style="margin-top:4px;font-size:11px;color:#fbbf24">Faltam Fino 400/1000 no catálogo/stock.</div>' : ''}
    </div>`;
    }
  }

  if (stockHtml && finoHtml) {
    const stockInner = stockHtml.replace('margin-bottom:10px', 'margin-bottom:0');
    const finoInner = finoHtml.replace('margin-top:10px', 'margin-top:0');
    stockHtml = `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;width:100%;margin-bottom:10px">
      <div style="flex:1 1 260px;min-width:0">${stockInner}</div>
      <div style="flex:1 1 260px;min-width:0">${finoInner}</div>
    </div>`;
    finoHtml = '';
  }

  const ingredientesItems = [];
  const temReceitas = receitasIrreg && Object.keys(receitasIrreg).length;
  if (temReceitas) {
    const rbp = receitasByProdutoFromIrregBuf(receitasIrreg);
    const vm = vmFromVendasBufIrreg(vendasBuf);
    const esperado = computeIngredientesEsperadosPorMenu(vm, rbp, prodArr);
    for (const s of stock) {
      const sid = prodIdKey(s.produto_id);
      if (!sid) continue;
      const cat = String(s.categoria || s.produto_categoria || '').toLowerCase();
      const exp = esperado[sid];
      const expectedTotal = exp ? exp.total : 0;
      if (cat !== 'ingredientes' && expectedTotal <= 0) continue;
      const b = stockBuf[sid] || {};
      const encRaw = (b.encontrado != null && b.encontrado !== '') ? b.encontrado : s.encontrado;
      const encN = encRaw == null || encRaw === '' ? NaN : parseFloat(encRaw);
      const entN = Number.isFinite(parseFloat(b.entrada)) ? parseFloat(b.entrada) : (parseFloat(s.entrada) || 0);
      const deiRaw = (b.deixado != null && b.deixado !== '') ? b.deixado : s.deixado;
      const deiN = deiRaw == null || deiRaw === '' ? NaN : parseFloat(deiRaw);
      if (!Number.isFinite(encN) || !Number.isFinite(deiN)) continue;
      const consumed = Math.max(0, encN + entN - deiN);
      if (consumed < 1e-6 && expectedTotal < 1e-6) continue;
      const diff = consumed - expectedTotal;
      if (Math.abs(diff) < KG_IRREG_COMPONENTE_EPS) continue;
      const um = medicaoSigla(s.tipo_medicao || 'unidade');
      const byMenuLine = (exp && exp.byMenu.length)
        ? exp.byMenu
            .sort((a, b2) => b2.qtd - a.qtd)
            .map((bm) => `${escapeHtml(bm.menu_nome)} <strong>${fmtNum(bm.qtd)}</strong>`)
            .join(' · ')
        : '';
      const html = `
        <div style="margin-top:4px;padding:6px 10px;border-radius:6px;border:1px solid rgba(251,146,60,0.45);background:rgba(251,146,60,0.1);font-size:12px;color:#cbd5e1;line-height:1.35">
          <div style="display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline">
            <span style="font-weight:700;color:#fb923c;font-size:11px;text-transform:uppercase;letter-spacing:0.05em">${escapeHtml(s.produto_nome)}</span>
            <span>stock <strong>${fmtNum(consumed)}</strong></span>
            <span>vendas <strong>${fmtNum(expectedTotal)}</strong></span>
            <span>dif <strong style="color:#fb923c">${fmtNum(Math.abs(diff))}</strong> ${um}</span>
            ${exp && exp.byMenu.length ? `<span style="color:#94a3b8;font-size:11px">${byMenuLine}</span>` : ''}
          </div>
        </div>`;
      ingredientesItems.push({ produto_id: sid, produto_nome: s.produto_nome, html });
    }
  }

  const hasAny = !!(caixaHtml || bancoHtml || stockHtml || finoHtml || ingredientesItems.length);
  const numIrr = (caixaHtml ? 1 : 0) + (bancoHtml ? 1 : 0) + stockIrrCount + (finoHtml ? 1 : 0) + ingredientesItems.length;
  return { hasAny, numIrr, finoDiffCopos, caixaHtml, bancoHtml, stockHtml, finoHtml, ingredientesItems };
}

/** Wrapa cada bloco do snap com footer de aceitar/rejeitar/pendente + comentários.
 *  decisoes = map categoria → row. comentariosByCat = map categoria → array de comentários.
 *  opts.filtroTipos = objecto {caixa,banco,stock,fino,ing} com flags; falso oculta o tipo.
 *  opts.filtroEstado = objecto {aceite,rejeitado,pendente}; falso oculta o estado. */
function renderIrregularidadeBlocos(snap, turnoId, decisoesByCat, comentariosByCat, opts) {
  const filtro = opts && opts.filtroTipos;
  const filtroEstado = opts && opts.filtroEstado;
  const tipoDe = (key) => key.startsWith('ing:') ? 'ing' : key;
  const estadoDe = (dec) => !dec ? 'pendente' : (dec.aceite ? 'aceite' : 'rejeitado');
  const cats = [
    { key: 'caixa', html: snap.caixaHtml },
    { key: 'banco', html: snap.bancoHtml || '' },
    { key: 'stock', html: snap.stockHtml },
    { key: 'fino', html: snap.finoHtml }
  ];
  for (const it of (snap.ingredientesItems || [])) {
    cats.push({ key: 'ing:' + it.produto_id, html: it.html });
  }
  const podeDecidir = S.user?.role === 'admin';
  return cats.map(({ key, html }) => {
    if (!html) return '';
    if (filtro && filtro[tipoDe(key)] === false) return '';
    const dec = decisoesByCat?.[key];
    if (filtroEstado && filtroEstado[estadoDe(dec)] === false) return '';
    let footer = '';
    if (dec) {
      const quando = dec.decidido_em ? new Date(dec.decidido_em).toLocaleDateString('pt-PT', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '';
      const nome = escapeHtml(dec.decidido_por_nome || 'utilizador');
      const just = dec.justificacao ? `<div style="font-size:11px;color:#cbd5e1;margin-top:4px;line-height:1.4">${escapeHtml(dec.justificacao)}</div>` : '';
      const aceite = !!dec.aceite;
      const bg = aceite ? 'rgba(34,197,94,0.08)' : 'rgba(248,113,113,0.08)';
      const bd = aceite ? 'rgba(34,197,94,0.32)' : 'rgba(248,113,113,0.32)';
      const cor = aceite ? '#86efac' : '#fca5a5';
      const label = aceite ? '✓ Aceite' : '✗ Rejeitada';
      footer = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:4px 8px;background:${bg};border:1px solid ${bd};border-radius:6px;margin:-2px 0 4px;font-size:11px;color:${cor}">
        <div style="flex:1;min-width:0">
          <strong>${label}</strong> · ${nome}${quando ? ` · ${quando}` : ''}
          ${just}
        </div>
        ${podeDecidir ? `<button type="button" class="btn btn-ghost" style="padding:3px 10px;font-size:11px" onclick="runAction(event, () => reabrirIrregularidade(${turnoId}, '${key}'))">Reabrir</button>` : ''}
      </div>`;
    } else if (podeDecidir) {
      footer = `<div style="display:flex;justify-content:flex-end;gap:6px;margin:-2px 0 4px">
        <button type="button" class="btn btn-success" style="padding:3px 10px;font-size:11px" onclick="runAction(event, () => decidirIrregularidade(${turnoId}, '${key}', true))">✓</button>
        <button type="button" class="btn btn-danger" style="padding:3px 10px;font-size:11px" onclick="runAction(event, () => decidirIrregularidade(${turnoId}, '${key}', false))">✗</button>
      </div>`;
    }
    const coms = (comentariosByCat && comentariosByCat[key]) || [];
    footer += renderIrregularidadeComentariosBox(turnoId, key, coms);
    return html + footer;
  }).join('');
}

/** Caixa colapsável com lista de comentários + input para novo. */
function renderIrregularidadeComentariosBox(turnoId, categoria, comentarios) {
  const n = comentarios.length;
  const myId = String(S.user?.id || '');
  const ehAdmin = S.user?.role === 'admin';
  const escKey = String(categoria).replace(/'/g, "\\'");
  const lista = comentarios.map((c) => {
    const podeApagar = ehAdmin || String(c.autor_id) === myId;
    const data = c.criado_em ? new Date(c.criado_em).toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '';
    const autor = escapeHtml(c.autor_nome || 'utilizador');
    const texto = escapeHtml(c.comentario || '').replace(/\n/g, '<br>');
    const delBtn = podeApagar
      ? `<button type="button" title="Apagar comentário" style="background:none;border:0;color:#fca5a5;cursor:pointer;font-size:12px;padding:0 4px" onclick="runAction(event, () => apagarComentarioIrregularidade(${c.id}, ${turnoId}))">✕</button>`
      : '';
    return `<div style="padding:6px 8px;background:rgba(148,163,184,0.06);border:1px solid rgba(148,163,184,0.18);border-radius:6px;margin-bottom:4px;font-size:11px;line-height:1.4">
      <div style="display:flex;justify-content:space-between;gap:8px;color:#94a3b8">
        <span><strong style="color:#e2e8f0">${autor}</strong> · ${data}</span>
        ${delBtn}
      </div>
      <div style="color:#cbd5e1;margin-top:3px;white-space:pre-wrap;word-break:break-word">${texto}</div>
    </div>`;
  }).join('');
  const inputId = `cmt-input-${turnoId}-${categoria.replace(/[^a-z0-9]/gi, '_')}`;
  return `<div style="margin:4px 0 12px;padding:8px 10px;background:rgba(30,41,59,0.55);border:1px solid rgba(148,163,184,0.18);border-radius:8px">
    <div style="font-size:11px;color:#94a3b8;margin-bottom:6px">💬 Comentários${n ? ` (${n})` : ''}</div>
    ${lista}
    <div style="display:flex;gap:6px;margin-top:4px">
      <input type="text" id="${inputId}" placeholder="Escrever comentário…" maxlength="2000" style="flex:1;font-size:12px;padding:5px 8px;background:rgba(15,23,42,0.6);border:1px solid rgba(148,163,184,0.25);border-radius:6px;color:#e2e8f0" onkeydown="if(event.key==='Enter'){event.preventDefault();runAction(event, () => adicionarComentarioIrregularidade(${turnoId}, '${escKey}', '${inputId}'))}">
      <button type="button" class="btn btn-primary" style="padding:5px 12px;font-size:11px" onclick="runAction(event, () => adicionarComentarioIrregularidade(${turnoId}, '${escKey}', '${inputId}'))">Enviar</button>
    </div>
  </div>`;
}

async function adicionarComentarioIrregularidade(turnoId, categoria, inputId) {
  const el = document.getElementById(inputId);
  const texto = String(el?.value || '').trim();
  if (!texto) return;
  try {
    const r = await apiEscrita('POST', '/irregularidades/comentario', { turno_id: turnoId, categoria, comentario: texto },
      { tid: turnoId, desc: 'Comentário de irregularidade' });
    const row = r && r._offline
      ? { id: 'off:' + r.ref, turno_id: turnoId, categoria, comentario: texto, criado_em: r.criado_em, utilizador_nome: (S.user && S.user.nome) || '', utilizador_id: (S.user && S.user.id) || null, _offline: true }
      : r;
    if (el) el.value = '';
    if (S.page === 'irregularidades') {
      if (S.irregCache) {
        const map = S.irregCache.comentariosPorTurno;
        if (!map[turnoId]) map[turnoId] = {};
        if (!map[turnoId][categoria]) map[turnoId][categoria] = [];
        map[turnoId][categoria].push(row);
        renderIrregularidadesListaFromCache();
      } else {
        await loadIrregularidadesLista();
      }
    } else if (S.page === 'turno') {
      if (!S.turnoComentarios) S.turnoComentarios = {};
      if (!S.turnoComentarios[categoria]) S.turnoComentarios[categoria] = [];
      S.turnoComentarios[categoria].push(row);
      renderIrregularidadesTurno();
    }
    if (S.calModal && String(S.calModal.turnoId) === String(turnoId)) {
      if (!S.calModal.comentarios[categoria]) S.calModal.comentarios[categoria] = [];
      S.calModal.comentarios[categoria].push(row);
      renderCalModalBody();
    }
  } catch (e) { alert(e.message); }
}

async function apagarComentarioIrregularidade(comId, turnoId) {
  if (!confirm('Apagar este comentário?')) return;
  try {
    if (String(comId).startsWith('off:')) {
      // Ainda na fila offline — basta retirá-lo da fila.
      const refCom = String(comId).slice(4);
      escritasOfflineGravar(escritasOfflineLer().filter((x) => x.ref !== refCom));
    } else {
      await apiEscrita('DELETE', `/irregularidades/comentario?id=${encodeURIComponent(comId)}`, {},
        { tid: turnoId, desc: 'Apagar comentário' });
    }
    const idNum = Number(comId);
    const removerDe = (mapPorCat) => {
      if (!mapPorCat) return;
      for (const cat of Object.keys(mapPorCat)) {
        mapPorCat[cat] = (mapPorCat[cat] || []).filter((c) => String(c.id) !== String(comId) && Number(c.id) !== idNum);
      }
    };
    if (S.page === 'irregularidades') {
      if (S.irregCache?.comentariosPorTurno) {
        removerDe(S.irregCache.comentariosPorTurno[turnoId]);
        renderIrregularidadesListaFromCache();
      } else {
        await loadIrregularidadesLista();
      }
    } else if (S.page === 'turno') {
      removerDe(S.turnoComentarios);
      renderIrregularidadesTurno();
    }
    if (S.calModal && String(S.calModal.turnoId) === String(turnoId)) {
      removerDe(S.calModal.comentarios);
      renderCalModalBody();
    }
  } catch (e) { alert(e.message); }
}

async function decidirIrregularidade(turnoId, categoria, aceite) {
  const label = aceite ? 'Aceitar' : 'Rejeitar';
  if (!confirm(`${label} esta irregularidade?`)) return;
  try {
    const r = await apiEscrita('POST', '/irregularidades/decisao', { turno_id: turnoId, categoria, aceite, justificacao: '' },
      { tid: turnoId, chave: `irrdec:${turnoId}:${categoria}`, desc: 'Decisão de irregularidade' });
    const row = r && r._offline
      ? { id: 'off:' + r.ref, turno_id: turnoId, categoria, aceite: !!aceite, justificacao: '', criado_em: r.criado_em, decidido_por_nome: (S.user && S.user.nome) || '', _offline: true }
      : r;
    if (S.page === 'irregularidades') {
      if (S.irregCache) {
        const map = S.irregCache.decisoesPorTurno;
        if (!map[turnoId]) map[turnoId] = {};
        map[turnoId][categoria] = row;
        renderIrregularidadesListaFromCache();
      } else {
        await loadIrregularidadesLista();
      }
    } else if (S.page === 'turno') {
      if (!S.turnoDecisoes) S.turnoDecisoes = {};
      S.turnoDecisoes[categoria] = row;
      renderIrregularidadesTurno();
    }
    if (S.calModal && String(S.calModal.turnoId) === String(turnoId)) {
      S.calModal.decisoes[categoria] = row;
      renderCalModalBody();
      refreshCalPillBadgeFromModal();
    }
  } catch (e) { alert(e.message); }
}

async function reabrirIrregularidade(turnoId, categoria) {
  if (!confirm('Reabrir esta irregularidade?')) return;
  try {
    // Decisão ainda na fila offline → basta retirá-la da fila.
    const filaDec = escritasOfflineLer();
    const chaveDec = `irrdec:${turnoId}:${categoria}`;
    if (filaDec.some((x) => x.chave === chaveDec)) {
      escritasOfflineGravar(filaDec.filter((x) => x.chave !== chaveDec));
    } else {
      await apiEscrita('DELETE', `/irregularidades/decisao?turno_id=${turnoId}&categoria=${encodeURIComponent(categoria)}`, {},
        { tid: turnoId, desc: 'Reabrir irregularidade' });
    }
    if (S.page === 'irregularidades') {
      if (S.irregCache?.decisoesPorTurno?.[turnoId]) {
        delete S.irregCache.decisoesPorTurno[turnoId][categoria];
        renderIrregularidadesListaFromCache();
      } else {
        await loadIrregularidadesLista();
      }
    } else if (S.page === 'turno') {
      if (S.turnoDecisoes) delete S.turnoDecisoes[categoria];
      renderIrregularidadesTurno();
    }
    if (S.calModal && String(S.calModal.turnoId) === String(turnoId)) {
      delete S.calModal.decisoes[categoria];
      renderCalModalBody();
      refreshCalPillBadgeFromModal();
    }
  } catch (e) { alert(e.message); }
}

/**
 * Mesma lógica que o cartão Irregularidades no turno (sem DOM): constrói buffers a partir de
 * `vendasRows` + catálogo e delega em `buildIrregularidadesHtmlParts`.
 * @returns {{ hasAny: boolean, caixaHtml: string, bancoHtml: string, stockHtml: string, finoHtml: string, ingredientesItems: Array<{produto_id:string,produto_nome:string,html:string}> }}
 */
function computeIrregularidadesSnapshot(turno, vendasRows, produtos, receitas, depositosTurno) {
  const stock = turno.stock || [];
  const stockBufL = {};
  stock.forEach((s) => {
    const sid = prodIdKey(s.produto_id);
    if (!sid) return;
    stockBufL[sid] = {
      encontrado: parseEncontradoFromRow(s.encontrado),
      entrada: parseFloat(s.entrada) || 0,
      deixado: parseEncontradoFromRow(s.deixado),
      fechados: parseFloat(s.fechados) || 0
    };
  });
  const vendasBufL = {};
  const vendasProdNomesL = {};
  produtos.forEach((p) => {
    const id = prodIdKey(p.id);
    if (id) vendasProdNomesL[id] = p.nome;
  });
  (vendasRows || []).forEach((v) => {
    const pid = prodIdKey(v.produto_id);
    if (!pid) return;
    vendasBufL[pid] = parseFloat(v.quantidade) || 0;
    if (v.produto_nome) vendasProdNomesL[pid] = v.produto_nome;
  });
  const receitasBufL = {};
  (receitas || []).forEach((r) => {
    const mk = prodIdKey(r.produto_id);
    if (!mk) return;
    if (!receitasBufL[mk]) receitasBufL[mk] = [];
    receitasBufL[mk].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
  });
  const menuProds = produtos.filter((p) => p.categoria === 'menu');
  const bebidaProds = produtos.filter((p) => p.categoria === 'bebida').filter((p) => !isFinoBarrilNome(p.nome));
  const avulsoProds = produtos.filter((p) => p.venda_avulso && p.categoria !== 'menu' && p.categoria !== 'bebida');
  const menuProdIdsL = menuProds.map((p) => p.id);
  const avulsoProdIdsL = avulsoProds.map((p) => p.id);
  const vendasProdPrecosL = {};
  [...menuProds, ...avulsoProds, ...bebidaProds].forEach((p) => {
    vendasProdPrecosL[p.id] = parseFloat(p.preco) || 0;
  });
  (vendasRows || []).forEach((v) => {
    const pid = prodIdKey(v.produto_id);
    if (!pid || v.preco == null || v.preco === '') return;
    const u = parseFloat(v.preco) || 0;
    vendasProdPrecosL[pid] = u;
    vendasProdPrecosL[v.produto_id] = u;
  });
  const bebidaCopoProds = bebidaProds.filter((p) => isBebidaProdutoPorCopo(p));
  const bebidaOutras = bebidaProds.filter((p) => !isBebidaProdutoPorCopo(p));
  const bebidaCopoProdIdsL = bebidaCopoProds.map((p) => prodIdKey(p.id)).filter(Boolean);
  const bebidaCopoCfgL = {};
  bebidaCopoProds.forEach((p) => {
    const pid = prodIdKey(p.id);
    if (!pid) return;
    const nomeJoin = vendasProdNomesL[pid];
    bebidaCopoCfgL[pid] = {
      nome: nomeVendaBebidaLegivel(pid, nomeJoin || p.nome),
      kgPorCopo: parseFloat(p.kg_por_copo) || 0,
      preco: parseFloat(p.preco) || 0,
      qtdPacote: parseInt(p.qtd_copos_pacote, 10) || 0,
      precoPacote: parseFloat(p.preco_copos_pacote) || 0
    };
  });
  for (const v of vendasRows || []) {
    const isCopo = !!v.venda_por_copo && parseFloat(v.kg_por_copo) > 0;
    if (!isCopo) continue;
    if (isFinoBarrilNome(v.produto_nome)) continue;
    const pid = prodIdKey(v.produto_id);
    if (!pid) continue;
    if (!bebidaCopoCfgL[pid]) {
      bebidaCopoCfgL[pid] = {
        nome: nomeVendaBebidaLegivel(pid, v.produto_nome),
        kgPorCopo: parseFloat(v.kg_por_copo) || 0,
        preco: 0,
        qtdPacote: 0,
        precoPacote: 0
      };
    }
    bebidaCopoCfgL[pid].preco = parseFloat(v.preco) || 0;
    bebidaCopoCfgL[pid].qtdPacote = parseInt(v.qtd_copos_pacote, 10) || 0;
    bebidaCopoCfgL[pid].precoPacote = parseFloat(v.preco_copos_pacote) || 0;
    if (!bebidaCopoProdIdsL.includes(pid)) bebidaCopoProdIdsL.push(pid);
  }
  const bebidaCopoProdIdSet = new Set(bebidaCopoProdIdsL);
  function getStockLineL(pid) {
    const k = prodIdKey(pid);
    if (!k) return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
    if (stockBufL[k] != null) return stockBufL[k];
    const row = stock.find((s) => prodIdKey(s.produto_id) === k);
    if (row) {
      return {
        encontrado: parseEncontradoFromRow(row.encontrado),
        entrada: parseFloat(row.entrada) || 0,
        deixado: parseEncontradoFromRow(row.deixado),
        fechados: parseFloat(row.fechados) || 0
      };
    }
    return { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
  }
  function calcMenuQtyL(prodId) {
    const recipe = receitasBufL[prodIdKey(prodId)] || [];
    if (!recipe.length) return null;
    let min = Infinity;
    for (const comp of recipe) {
      const b = stockBufL[prodIdKey(comp.componente_id)] || { encontrado: null, entrada: 0, deixado: null };
      const vendido = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
      if (!Number.isFinite(vendido)) return null;
      min = Math.min(min, vendido / parseFloat(comp.quantidade));
    }
    return min === Infinity ? 0 : Math.floor(min);
  }
  function calcStandaloneQtyL(prodId) {
    const pk = prodIdKey(prodId);
    const b = stockBufL[pk] || { encontrado: null, entrada: 0, deixado: null };
    const total = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
    if (!Number.isFinite(total)) return 0;
    const totalN = Math.max(0, total);
    let comboUsage = 0;
    for (const [menuProdId, recipe] of Object.entries(receitasBufL)) {
      const comp = recipe.find((r) => prodIdKey(r.componente_id) === pk);
      if (comp) comboUsage += (calcMenuQtyL(menuProdId) || 0) * comp.quantidade;
    }
    return Math.max(0, totalN - comboUsage);
  }
  function totalVendasKzL() {
    let total = 0;
    for (const prodId of menuProdIdsL) {
      const k = prodIdKey(prodId);
      total += (vendasBufL[k] || 0) * (vendasProdPrecosL[prodId] || 0);
    }
    for (const prodId of avulsoProdIdsL) {
      total += calcStandaloneQtyL(prodId) * (vendasProdPrecosL[prodId] || 0);
    }
    for (const prodId of bebidaCopoProdIdsL) {
      const cfg = bebidaCopoCfgL[prodId];
      if (!cfg) continue;
      const copos = vendasBufL[prodId] || 0;
      total += precoVendaCopos(copos, cfg.preco, cfg.qtdPacote, cfg.precoPacote);
    }
    for (const s of stock) {
      if (s.categoria !== 'bebida') continue;
      const pid = prodIdKey(s.produto_id);
      if (!pid) continue;
      if (isFinoBarrilNome(s.produto_nome)) continue;
      if (isFinoBarrilNome(vendasProdNomesL[pid])) continue;
      if (bebidaCopoProdIdSet.has(pid)) continue;
      const b = getStockLineL(pid);
      let vend = vendidoQtyFromStockParts(b.encontrado, b.entrada, b.deixado);
      if (!Number.isFinite(vend)) continue;
      vend = Math.max(0, vend);
      if (vend <= 0 && parseFloat(s.vendido) > 0) vend = Math.max(0, parseFloat(s.vendido));
      if (vend <= 0) continue;
      const valSnap = s.valor != null && s.valor !== '' ? parseFloat(s.valor) : NaN;
      if (!Number.isNaN(valSnap)) {
        total += valSnap;
      } else {
        let unit = parseFloat(s.preco) || 0;
        if (!unit) unit = parseFloat(vendasProdPrecosL[s.produto_id]) || parseFloat(vendasProdPrecosL[pid]) || 0;
        total += vend * unit;
      }
    }
    return total;
  }
  const caixa = turno.caixa || {};
  const t1 = parseEncontradoFromRow(caixa.tpa);
  const t2 = parseEncontradoFromRow(caixa.transferencia);
  const t3 = parseEncontradoFromRow(caixa.dinheiro);
  const tg =
    t1 === null || t2 === null || t3 === null ? NaN : t1 + t2 + t3;
  const tv = totalVendasKzL();
  return buildIrregularidadesHtmlParts({
    turno,
    stockBuf: stockBufL,
    vendasBuf: vendasBufL,
    totalVendasKz: tv,
    totalGeradoKz: tg,
    produtos,
    receitasIrreg: receitasBufL,
    depositosTurno
  });
}

/** Só conteúdo quando há irregularidade real (caixa, stock vs T. anterior, Fino). Sem mensagens «está tudo ok». */
function renderIrregularidadesTurno() {
  const mount = document.getElementById('turno-irregularidades-list');
  const card = document.getElementById('turno-irregularidades-card');
  if (!mount) return;

  function setIrregCardVisible(show) {
    if (card) card.style.display = show ? '' : 'none';
    const meta = document.getElementById('turno-irregularidades-meta');
    if (meta) {
      if (show) {
        const nome = S.turnoData?.nome;
        meta.textContent = nome
          ? `${turnoLabel(nome)} — ${dateLabelWithWeekday(S.date)}`
          : dateLabelWithWeekday(S.date);
      } else {
        meta.textContent = '';
      }
    }
  }

  // Irregularidades só depois dos registos fechados: antes do registo dos
  // encontrados não há comparações fiáveis; entre encontrados e deixados só
  // as de encontrados (stock vs turno anterior).
  const gates = compGatesForTurno(S.turnoData);
  if (!gates.enc) {
    mount.innerHTML = '';
    setIrregCardVisible(false);
    void refreshIrregularidadesEquipaLine(false);
    return;
  }

  const snap = buildIrregularidadesHtmlParts({
    turno: S.turnoData,
    stockBuf,
    vendasBuf,
    totalVendasKz: getTotalVendasTurnoKz(),
    totalGeradoKz: getTotalGeradoCaixaKz(),
    totalPedidosKz: getTotalPedidosBalcaoKz(),
    produtos: S.produtos || [],
    receitasIrreg: receitasBuf,
    depositosTurno: S.turnoDeposito
  });
  if (!gates.deix) {
    // Vendido/caixa/Fino/ingredientes dependem do Deixado final — suprimir
    // até o registo dos deixados fechar. Fica só stock vs turno anterior
    // (encontrados) e banco.
    snap.caixaHtml = '';
    snap.finoHtml = '';
    snap.ingredientesItems = [];
    snap.hasAny = !!(snap.stockHtml || snap.bancoHtml);
  }
  const tid = S.turnoData?.id;
  const decisoesByCat = (S.turnoDecisoes && tid) ? S.turnoDecisoes : {};
  const comentariosByCat = (S.turnoComentarios && tid) ? S.turnoComentarios : {};
  mount.innerHTML = renderIrregularidadeBlocos(snap, tid, decisoesByCat, comentariosByCat).trim();
  const showCard = snap.hasAny;
  setIrregCardVisible(showCard);
  void refreshIrregularidadesEquipaLine(showCard);
}

/** Banner no topo das abas Stock e Caixas com o estado do registo inicial
 *  de encontrados + CTA para fechar (ou reabrir, se admin/gestor). */
function encontradosBannerHtml(turno, fechado, canEdit, isAdmin) {
  if (!turno) return '';
  if (fechado) {
    const ts = turno.encontrados_fechados_em
      ? new Date(turno.encontrados_fechados_em).toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })
      : '';
    const reabrir = isAdmin
      ? `<button type="button" class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="runAction(event, () => reabrirEncontrados('${turno.id}'))">🔓 Reabrir</button>`
      : '';
    return `
      <div class="card encontrados-banner encontrados-banner-ok mb-12" style="display:flex;align-items:center;gap:10px">
        <span style="font-size:18px">✓</span>
        <div style="flex:1">
          <div style="font-weight:600;color:#86efac">Registo inicial fechado</div>
          <div style="font-size:11px;color:#94a3b8">${ts}${ts ? ' · ' : ''}Encontrado e Enc. caixa estão bloqueados.</div>
        </div>
        ${reabrir}
      </div>`;
  }
  const btn = canEdit
    ? `<button type="button" class="btn btn-primary btn-sm" style="margin-left:auto" onclick="runAction(event, () => fecharEncontrados('${turno.id}'))">🔒 Fechar registo inicial</button>`
    : '';
  return `
    <div class="card encontrados-banner encontrados-banner-pend mb-12" style="display:flex;align-items:center;gap:10px">
      <span style="font-size:18px">⚠</span>
      <div style="flex:1">
        <div style="font-weight:600;color:#fbbf24">Regista os encontrados iniciais</div>
        <div style="font-size:11px;color:#cbd5e1">Preenche o Encontrado (Stock) e o Enc. caixa (Caixas) e depois fecha o registo. Enquanto não fechares, vais ser avisado a cada navegação.</div>
      </div>
      ${btn}
    </div>`;
}

/** Popup bloqueante quando o utilizador navega com encontrados ainda por
 *  fechar. Mostrado sempre — só para de aparecer depois de o registo
 *  inicial ficar fechado. */
function notifyEncontradosPendente() {
  const t = S.turnoData;
  if (!t || t.estado !== 'aberto' || t.encontrados_fechados_em) return;
  const titulo = t.nome ? `turno “${t.nome}”` : `turno desta data`;
  alert(`⚠ Tens encontrados por registar no ${titulo}.\n\nVai à aba Stock e/ou Caixas, preenche os valores em Encontrado / Enc. caixa e clica em «🔒 Fechar registo inicial».\n\nEnquanto não fechares o registo, este aviso vai aparecer sempre que mudares de aba ou de página.`);
}

async function guardarStock(turnoId) {
  try {
    if (String(turnoId) !== String(S.turnoData?.id)) return;
    turnoMsgPending('A guardar…');
    const resultados = await Promise.all(Object.entries(stockBuf).map(([pid, v]) =>
      apiEscrita('PUT', `/turnos/${turnoId}/stock`, {
        produto_id: pid,
        encontrado: v.encontrado,
        deixado: v.deixado,
        fechados: v.fechados,
        encontrado_caixa: v.encontrado_caixa,
        deixado_caixa: v.deixado_caixa
      }, { tid: turnoId, chave: `stock:${turnoId}:${pid}`, desc: 'Stock do turno' })
    ));
    const emFila = resultados.some((r) => r && r._offline);
    turnoMsgOk(emFila ? 'Guardado neste aparelho (sincroniza sozinho)' : 'Guardado');
    setTimeout(() => turnoMsgIdle(), 1600);
  } catch(e) { turnoMsgErr(e.message); }
}

function calcCaixa() {
  const tg = parseCaixaTriploFromInputs();
  const saida = parseFloat(document.getElementById('c-saida')?.value) || 0;
  const entradasExtra = parseFloat(window.__turnoEntradasExtraTotal) || 0;
  const tf = Number.isFinite(tg) ? tg - saida + entradasExtra : NaN;
  const elTG = document.getElementById('c-total-gerado');
  const elTF = document.getElementById('c-total-final');
  if (elTG) elTG.textContent = Number.isFinite(tg) ? fmtKzOrEmpty(tg) : '—';
  if (elTF) elTF.textContent = Number.isFinite(tf) ? fmtKzOrEmpty(tf) : '—';
  renderCaixaEsperadoPedidos();
  renderIrregularidadesTurno();
  maybeClearTurnoStickyAfterStockCaixaOk();
  // Auto-save
  const turnoId = S.turnoData?.id;
  if (!turnoId) return;
  turnoMsgPending('A guardar…');
  clearTimeout(autoSaveCaixaTimer);
  autoSaveCaixaTimer = setTimeout(() => guardarCaixa(turnoId), 2000);
}

async function switchTurnoTab(name, btn) {
  // Aviso se o registo inicial de encontrados ainda está por fechar e o
  // utilizador vai para uma aba que não é Stock nem Caixas.
  if (name !== 'stock' && name !== 'caixas') notifyEncontradosPendente();
  S.turnoTab = name;
  try { persistUiState(); } catch (_) {}
  document.querySelectorAll('.turno-tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.turno-tab').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + name)?.classList.add('active');
  if (btn) btn.classList.add('active');
  else document.querySelector(`.turno-tab[data-turno-tab="${name}"]`)?.classList.add('active');
  if (name === 'escala') {
    await loadEscalaTurno();
  }
  if (name === 'stock' || name === 'caixa' || name === 'movimentos') {
    // Entradas de stock e Caixa — movimentos vivem agora na aba Movimentos,
    // mas o loader partilhado continua a correr também ao entrar em Stock/
    // Caixa (mantém dados frescos; os mounts existem sempre no DOM).
    const tid = S.turnoData?.id;
    const stock = S.turnoData?.stock || [];
    if (tid) await loadRegistosMovimentosSection(tid, stock, !!S.turnoCanEdit);
  }
  if (name === 'vendas' || name === 'pedidos' || name === 'caixa') {
    const tid = S.turnoData?.id;
    if (tid) await loadVendasMenu(tid, !!S.turnoCanEdit);
  }
  if (name === 'registos') {
    const tid = S.turnoData?.id;
    if (tid) await loadTurnoResumoTab(tid);
    renderIrregularidadesTurno();
  }
  if (name === 'diferencas') {
    renderIrregularidadesTurno();
  }
}

function clearStockCaixaValidationHighlight() {
  turnoMsgStickyErr = null;
  document.querySelectorAll('.stock-caixa-required-missing').forEach((el) =>
    el.classList.remove('stock-caixa-required-missing')
  );
}

/** Se o aviso fixo era só stock/caixa e já está tudo preenchido, remove destaque e mensagem. */
function maybeClearTurnoStickyAfterStockCaixaOk() {
  if (!turnoMsgStickyErr) return;
  if (
    turnoMsgStickyErr.includes('Quem realmente trabalhou') ||
    turnoMsgStickyErr.includes('«Quem realmente trabalhou»')
  ) {
    return;
  }
  if (collectMissingStockCaixaObrigatorio().length > 0) return;
  document.querySelectorAll('.stock-caixa-required-missing').forEach((el) =>
    el.classList.remove('stock-caixa-required-missing')
  );
  turnoMsgStickyErr = null;
  turnoMsgIdle();
}

function collectMissingStockCaixaObrigatorio() {
  const missing = [];
  document.querySelectorAll('input[data-stock-req="1"]').forEach((el) => {
    if (el.disabled) return;
    if (String(el.value).trim() === '') missing.push(el);
  });
  document.querySelectorAll('input[data-caixa-req="1"]').forEach((el) => {
    if (el.disabled) return;
    if (String(el.value).trim() === '') missing.push(el);
  });
  return missing;
}

async function focusTurnoFieldParaValidacao(el) {
  if (!el) return;
  const panel = el.closest('.turno-tab-panel');
  const tabId = panel && panel.id;
  const name =
    tabId === 'tab-stock' ? 'stock' : tabId === 'tab-registos' ? 'registos' : null;
  if (name) {
    const btn = document.querySelector('.turno-tab[data-turno-tab="' + name + '"]');
    if (btn) await switchTurnoTab(name, btn);
  }
  requestAnimationFrame(() => {
    el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    try {
      el.focus();
    } catch (_) {}
  });
}

/** Upload da foto do recibo de fecho do TPA (aba Caixa). */
async function tpaFotoOnFile(inp) {
  const turnoId = S.turnoData?.id;
  const st = document.getElementById('c-tpa-foto-status');
  if (!turnoId || !inp || !inp.files || !inp.files[0]) return;
  try {
    if (st) { st.style.color = '#94a3b8'; st.textContent = 'A enviar foto…'; }
    const files = Array.from(inp.files);
    const b64Raw = await fileToDataUrl(files[0]);
    // Reduz a foto: envia mais depressa e cabe na fila offline.
    const b64 = await comprimirFotoDataUrl(b64Raw, 1280, 0.72);
    const r = await apiEscrita('POST', `/turnos/${turnoId}/caixa/tpa-foto`, { foto_base64: b64 },
      { tid: turnoId, chave: `tpafoto:${turnoId}`, desc: 'Foto do fecho TPA', timeoutMs: 12000 });
    if (S.turnoData) {
      if (!S.turnoData.caixa) S.turnoData.caixa = {};
      S.turnoData.caixa.tpa_foto_url = (r && r.tpa_foto_url) || b64;
    }
    // Fotos adicionais (recibo em várias partes) → galeria multi-foto.
    for (const f of files.slice(1, 12)) {
      const bx = await comprimirFotoDataUrl(await fileToDataUrl(f), 1280, 0.72);
      await apiEscrita('POST', '/fotos', { chave: `tpa:${turnoId}`, foto_base64: bx },
        { tid: turnoId, desc: 'Foto adicional do TPA', timeoutMs: 10000 });
    }
    if (files.length > 1) fotosAnexosRefresh(`tpa:${turnoId}`);
    if (st) {
      st.style.color = '#86efac';
      const n = files.length;
      st.textContent = r && r._offline
        ? `✓ ${n > 1 ? n + ' fotos guardadas' : 'Foto guardada'} neste aparelho (sincroniza sozinha)`
        : `✓ ${n > 1 ? n + ' fotos do fecho TPA anexadas' : 'Foto do fecho TPA anexada'}`;
    }
    inp.value = '';
  } catch (e) {
    if (st) { st.style.color = '#ef4444'; st.textContent = 'Falha ao enviar: ' + (e.message || e); }
  }
}

async function fecharTurno(ev, id) {
  clearStockCaixaValidationHighlight();
  document.querySelectorAll('input[data-stock-req="1"][type="number"]').forEach((el) => {
    if (!el.disabled) stockNumberInputBlur(el);
  });
  const missing = collectMissingStockCaixaObrigatorio();
  if (missing.length) {
    missing.forEach((el) => el.classList.add('stock-caixa-required-missing'));
    turnoMsgErr(
      'Preenche todos os campos obrigatórios: em Stock (Encontrado e Deixado de cada produto) e em Caixa (TPA, Transferência e Dinheiro).',
      true
    );
    await focusTurnoFieldParaValidacao(missing[0]);
    return;
  }
  // Pedidos offline por sincronizar deste turno: o fecho pode avançar —
  // entra na fila DEPOIS dos pedidos (a sincronização respeita a ordem:
  // primeiro os pedidos, só depois o fecho).
  const filaOffTurno = pedidosOfflineLer().filter((it) => String(it.tid) === String(id));
  // TPA com valor exige a foto do recibo de fecho do TPA (o servidor
  // também valida ao fechar). Foto na fila offline conta como anexada.
  const tpaValFechar = parseFloat(document.getElementById('c-tpa')?.value) || 0;
  const tpaFotoNaFila = escritasOfflineLer().some((x) => x.chave === `tpafoto:${id}`);
  if (tpaValFechar > 0 && !(S.turnoData?.caixa?.tpa_foto_url) && !tpaFotoNaFila) {
    turnoMsgErr('Registaste valor no TPA — anexa a foto do recibo de fecho do TPA (por baixo do campo TPA) antes de fechar o turno.', true);
    document.getElementById('c-tpa-foto')?.scrollIntoView({ block: 'center', behavior: 'smooth' });
    return;
  }
  // Equipa real: o servidor exige pelo menos uma pessoa ao fechar — valida
  // já aqui (com cache + fila offline) para o fecho não ser rejeitado na
  // sincronização.
  try {
    const eqReal = await api('GET', `/turnos/${encodeURIComponent(id)}/equipa-real`);
    if (Array.isArray(eqReal) && eqReal.length === 0) {
      turnoMsgErr('Regista pelo menos uma pessoa em «Quem realmente trabalhou» (separador Escala) antes de fechar o turno.', true);
      const btnEscala = document.querySelector('.turno-tab[data-turno-tab="escala"]');
      if (btnEscala) await switchTurnoTab('escala', btnEscala);
      return;
    }
  } catch (_) { /* sem rede e sem cache — o servidor valida ao sincronizar */ }
  if (!confirm('Fechar este turno? Não poderá ser editado depois.')) return;
  await runAction(ev, async () => {
    try {
      await guardarStock(id);
      await guardarCaixa(id);
      const rF = await apiEscrita('POST', `/turnos/${id}/fechar`, {}, {
        tid: id,
        tipo: 'fechar',
        desc: 'Fechar turno',
        // Com pedidos deste turno ainda em fila, o fecho vai directo para a
        // fila — garante a ordem pedidos → fecho.
        forcarFila: filaOffTurno.length > 0
      });
      clearStockCaixaValidationHighlight();
      if (rF && rF._offline) {
        turnoMsgOk('Turno fechado neste aparelho — sincroniza sozinho quando a rede voltar.');
        setTimeout(() => turnoMsgIdle(), 3200);
        sincronizarEscritasOffline().catch(() => {});
      }
      await loadTurno();
    } catch (e) {
      turnoMsgErr(e.message, true);
      if (e.message && e.message.includes('Quem realmente trabalhou')) {
        const btnEscala = document.querySelector('.turno-tab[data-turno-tab="escala"]');
        if (btnEscala) await switchTurnoTab('escala', btnEscala);
        requestAnimationFrame(() => {
          const sec = document.getElementById('turno-equipa-real-section');
          if (sec) {
            sec.classList.add('stock-caixa-required-missing');
            sec.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
        });
      }
    }
  });
}

async function reabrirTurno(ev, id) {
  if (!confirm('Reabrir este turno? Voltará a poder editar stock, caixa e registos. Usar só para corrigir erros.')) return;
  await runAction(ev, async () => {
    try {
      // Fecho ainda na fila offline → basta retirá-lo (o turno nunca chegou
      // a fechar no servidor).
      const filaR = escritasOfflineLer();
      const fechoPendente = filaR.find((x) => x.tipo === 'fechar' && String(x.tid) === String(id));
      if (fechoPendente) {
        escritasOfflineGravar(filaR.filter((x) => x.ref !== fechoPendente.ref));
      } else {
        await apiEscrita('POST', `/turnos/${id}/reabrir`, {}, { tid: id, desc: 'Reabrir turno' });
      }
      turnoMsgOk('Turno reaberto.');
      setTimeout(() => turnoMsgIdle(), 2200);
      await loadTurno();
    } catch (e) {
      turnoMsgErr(e.message);
    }
  });
}

// ── REGISTOS: STOCK + SAÍDAS DE CAIXA (unificado) ──────────────
async function loadRegistosMovimentosSection(turnoId, stocks, canEdit) {
  const elE = document.getElementById('entradas-section');             // stock (aba Stock)
  const elM = document.getElementById('caixa-movimentos-section');     // dinheiro (aba Caixa)
  if (!elE && !elM) return;
  if (elE) elE.innerHTML = '<span style="color:#64748b">A carregar...</span>';
  if (elM) elM.innerHTML = '<span style="color:#64748b">A carregar...</span>';
  try {
    // Offline sem cache: as listas caem para vazio + registos em fila —
    // o FORMULÁRIO renderiza sempre (registar entradas/saídas funciona
    // offline; a lista completa aparece quando houver rede/cache).
    const listaOffline = (p) => {
      try { return aplicarEscritasOffline(comLojaNoPath(p), []); } catch (_) { return []; }
    };
    const [entradas, saidas, caixaEntradas] = await Promise.all([
      api('GET', `/turnos/${turnoId}/entradas`).catch(() => listaOffline(`/turnos/${turnoId}/entradas`)),
      api('GET', `/turnos/${turnoId}/saidas`).catch(() => listaOffline(`/turnos/${turnoId}/saidas`)),
      api('GET', `/turnos/${turnoId}/caixa-entradas`).catch(() => [])
    ]);
    if (elE) renderEntradasSection(turnoId, stocks, canEdit, entradas);
    if (elM) renderCaixaMovimentos(turnoId, canEdit, saidas, entradas, caixaEntradas);
  } catch (e) {
    const msg = `<div class="alert alert-error">${e.message}</div>`;
    if (elE) elE.innerHTML = msg;
    if (elM) elM.innerHTML = msg;
  }
}

          </tr></thead>
          <tbody>${entradas.map(e => {
            const dt = new Date(e.criado_em).toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
            const tipoLabel = e.tipo === 'tirar'

function setTipo(tipo) {
  window._entradaTipo = tipo;
  const btnE = document.getElementById('e-tipo-entrada');
  const btnT = document.getElementById('e-tipo-tirar');
  const origemWrap = document.getElementById('e-origem-wrap');

  if (btnT) btnT.className = tipo === 'tirar'   ? 'tipo-btn tipo-btn-active-red'   : 'tipo-btn';
  // Origem só faz sentido em entradas
  if (origemWrap) origemWrap.style.display = tipo === 'tirar' ? 'none' : '';
  if (tipo === 'tirar') {
    const p = document.getElementById('e-preco');
    if (p) p.style.display = 'none';
  }
}

function setOrigem(origem) {
  window._entradaOrigem = origem;
  const btnA = document.getElementById('e-orig-armazem');
  const btnC = document.getElementById('e-orig-compra');
  const precoEl = document.getElementById('e-preco');
  if (btnA) btnA.className = origem === 'armazem' ? 'tipo-btn tipo-btn-active' : 'tipo-btn';
  if (btnC) btnC.className = origem === 'compra'  ? 'tipo-btn tipo-btn-active-orange' : 'tipo-btn';

}

async function submitEntrada(turnoId) {
  const pidRaw = document.getElementById('e-produto')?.value;
  const pid = prodIdKey(pidRaw);
  const qty    = parseFloat(document.getElementById('e-qty')?.value);
  const notas  = document.getElementById('e-notas')?.value.trim() || '';
  const tipo   = window._entradaTipo   || 'entrada';
  const origem = window._entradaOrigem || 'armazem';
  const preco  = parseFloat(document.getElementById('e-preco')?.value) || 0;
  const msg    = document.getElementById('entrada-form-msg');
  if (!pidRaw || !pid)  { if (msg) { msg.className='alert alert-error'; msg.textContent='Selecciona um produto.'; } return; }
  if (!qty || qty <= 0) { if (msg) { msg.className='alert alert-error'; msg.textContent='Quantidade inválida.'; } return; }
  try {
    const selEl = document.getElementById('e-produto');
    const nomeProd = selEl && selEl.selectedOptions && selEl.selectedOptions[0] ? selEl.selectedOptions[0].textContent : '';
    await apiEscrita('POST', `/turnos/${turnoId}/entradas`, { produto_id: pidRaw, tipo, origem, preco, quantidade: qty, notas },
      { tid: turnoId, desc: 'Entrada/saída de stock', extra: { produto_nome: nomeProd } });
    document.getElementById('e-produto').value = '';
    document.getElementById('e-qty').value = '';
    document.getElementById('e-notas').value = '';
    document.getElementById('e-preco').value = '';
  } catch(e) {
    if (msg) { msg.className='alert alert-error'; msg.textContent=e.message; }
    return;
  }
  // Refrescar é «melhor esforço» — offline, o GET vem do cache + fila.
  try {
    const novaEntrada = await api('GET', `/turnos/${turnoId}/entradas`).catch(() => {
      try { return aplicarEscritasOffline(comLojaNoPath(`/turnos/${turnoId}/entradas`), []); } catch (_) { return []; }
    });
    const soma = novaEntrada.filter((e) => prodIdKey(e.produto_id) === pid)
                            .reduce((s, e) => s + parseFloat(e.quantidade) * (e.tipo === 'tirar' ? -1 : 1), 0);
    const cell = document.getElementById(`entrada-${pid}`);
    if (cell) cell.textContent = fmtQtyInput(soma);
    if (!stockBuf[pid]) stockBuf[pid] = { encontrado: null, entrada: 0, deixado: null, fechados: 0 };
    stockBuf[pid].entrada = soma;
    updateStock(pidRaw, 'entrada', soma);
    const stocks = S.turnoData?.stock || [];
    await loadRegistosMovimentosSection(turnoId, stocks, true);
  } catch (_) { /* sem cache deste GET — o registo ficou na fila na mesma */ }
}
