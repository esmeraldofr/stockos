// ── Gestor da fila offline (toca na pastilha) ─────────────────
// Mostra o que está por sincronizar, deixa remover registos um a um e
// limpar «presos» (itens de turnos locais de versões antigas cujo «abrir»
// já não existe — nunca conseguiriam sincronizar).
function filaOfflinePresos() {
  const fila = escritasOfflineLer();
  const abrires = new Set(fila.filter((x) => x.tipo === 'abrir').map((x) => String(x.localId || x.tid || '')));
  const presosEscritas = fila.filter((x) => x.tid && turnoIdEhLocal(x.tid) && !abrires.has(String(x.tid)));
  const presosPedidos = pedidosOfflineLer().filter((x) => turnoIdEhLocal(x.tid) && !abrires.has(String(x.tid)));
  return { presosEscritas, presosPedidos };
}
function abrirGestorFilaOffline() {
  fecharGestorFilaOffline();
  const fila = escritasOfflineLer();
  const pedidos = pedidosOfflineLer();
  if (!fila.length && !pedidos.length) return;
  const { presosEscritas, presosPedidos } = filaOfflinePresos();
  const presosRefs = new Set(presosEscritas.map((x) => x.ref));
  const linhaHtml = (titulo, quando, preso, onRemove) => `
    <div style="display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid rgba(148,163,184,0.12)">
      <span style="flex:1;font-size:12px;color:${preso ? '#f87171' : '#e2e8f0'};line-height:1.35">${titulo}${preso ? ' <span style="font-size:10px">(preso — turno local sem abertura)</span>' : ''}<br><span style="font-size:10px;color:#64748b">${quando || ''}</span></span>
      <button type="button" class="btn btn-ghost btn-sm" style="color:#f87171;padding:2px 8px" onclick="${onRemove}">✕</button>
    </div>`;
  const itens = fila.map((x) =>
    linhaHtml(escapeHtml(x.desc || (x.method + ' ' + x.path)), x.quando, presosRefs.has(x.ref), `gestorFilaRemover('escrita','${x.ref}')`)
  ).join('') + pedidos.map((x) =>
    linhaHtml(`Pedido ao balcão ${escapeHtml(x.ref || '')}`, x.quando, turnoIdEhLocal(x.tid) && presosPedidos.includes(x), `gestorFilaRemover('pedido','${escapeHtml(String(x.ref))}')`)
  ).join('');
  const nPresos = presosEscritas.length + presosPedidos.length;
  const modal = document.createElement('div');
  modal.id = 'gestor-fila-offline';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,0.8);z-index:1400;display:flex;align-items:flex-end;justify-content:center';
  modal.innerHTML = `
    <div style="background:#0f172a;border:1px solid #334155;border-radius:14px 14px 0 0;max-width:520px;width:100%;max-height:75vh;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #1e293b">
        <strong style="flex:1;color:#e2e8f0;font-size:14px">⏳ Registos por sincronizar</strong>
        <button type="button" class="btn btn-ghost btn-sm" onclick="fecharGestorFilaOffline()">Fechar</button>
      </div>
      <div style="overflow-y:auto;padding:6px 14px;flex:1">${itens || '<div style="color:#64748b;font-size:12px;padding:12px 0">Fila vazia.</div>'}</div>
      <div style="display:flex;gap:8px;padding:12px 14px;border-top:1px solid #1e293b;flex-wrap:wrap;align-items:center">
        <button type="button" class="btn btn-primary btn-sm" onclick="runAction(event, async () => { await sincronizarEscritasOffline(); await sincronizarPedidosOffline(); abrirGestorFilaOffline(); })">↻ Sincronizar agora</button>
        ${nPresos ? `<button type="button" class="btn btn-ghost btn-sm" style="color:#f87171" onclick="runAction(event, limparRegistosPresos)">🗑 Limpar ${nPresos} preso${nPresos === 1 ? '' : 's'}</button>` : ''}
        <span id="gestor-fila-espaco" style="margin-left:auto;font-size:10px;color:#64748b"></span>
      </div>
    </div>`;
  modal.addEventListener('click', (ev) => { if (ev.target === modal) fecharGestorFilaOffline(); });
  document.body.appendChild(modal);
  // Espaço real disponível para offline neste aparelho (varia por telemóvel).
  try {
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then((est) => {
        const el = document.getElementById('gestor-fila-espaco');
        if (!el || !est) return;
        const mb = (v) => {
          const m = (v || 0) / (1024 * 1024);
          return m >= 1024 ? (m / 1024).toFixed(1) + ' GB' : Math.round(m) + ' MB';
        };
        el.textContent = `Fila: ${mbTxt(bytesFilaOffline())} de 30 MB (limite) · aparelho: ${mb(est.quota)} disponíveis`;
      }).catch(() => {});
    }
  } catch (_) {}
}
function fecharGestorFilaOffline() {
  document.getElementById('gestor-fila-offline')?.remove();
}
function gestorFilaRemover(tipo, ref) {
  if (!confirm('Remover este registo da fila? Não será enviado ao servidor.')) return;
  if (tipo === 'escrita') {
    escritasOfflineGravar(escritasOfflineLer().filter((x) => x.ref !== ref));
  } else {
    pedidosOfflineGravar(pedidosOfflineLer().filter((x) => String(x.ref) !== String(ref)));
  }
  abrirGestorFilaOffline();
}
async function limparRegistosPresos() {
  const { presosEscritas, presosPedidos } = filaOfflinePresos();
  const n = presosEscritas.length + presosPedidos.length;
  if (!n) { abrirGestorFilaOffline(); return; }
  if (!confirm(`Remover ${n} registo${n === 1 ? '' : 's'} preso${n === 1 ? '' : 's'}? São de turnos locais de versões antigas, sem abertura na fila — nunca conseguiriam sincronizar.`)) return;
  const refs = new Set(presosEscritas.map((x) => x.ref));
  escritasOfflineGravar(escritasOfflineLer().filter((x) => !refs.has(x.ref)));
  const pedRefs = new Set(presosPedidos.map((x) => String(x.ref)));
  pedidosOfflineGravar(pedidosOfflineLer().filter((x) => !pedRefs.has(String(x.ref))));
  // Turnos locais órfãos também saem.
  const filaT = escritasOfflineLer();
  turnosLocaisGravar(turnosLocaisLer().filter((t) =>
    filaT.some((x) => x.tipo === 'abrir' && String(x.localId || x.tid) === String(t.id))
  ));
  abrirGestorFilaOffline();
}

/**
 * Escrita LOCAL-FIRST TOTAL: mesmo com internet, o registo entra SEMPRE
 * primeiro na fila local (zero espera — como os pedidos ao balcão) e a
 * sincronização corre em fundo pela ordem original. Nunca duplica: cada
 * escrita leva client_ref e o servidor devolve a resposta original nas
 * repetições.
 *  opts: { tid, desc, tipo ('abrir'|'fechar'), chave (dedupe última-ganha),
 *          extra (dados só para o overlay) }
 */
async function apiEscrita(method, path, body, opts) {
  opts = opts || {};
  // Loja fixada JÁ no caminho: se o utilizador mudar de loja antes de a
  // fila sincronizar, o registo vai para a loja certa.
  path = comLojaNoPath(path);
  const ref = novoClientRef();
  const b = Object.assign({}, body || {}, { client_ref: ref });
  const item = {
    ref, method, path, body: b,
    desc: opts.desc || `${method} ${path}`,
    tid: opts.tid != null ? String(opts.tid) : null,
    tipo: opts.tipo || null,
    chave: opts.chave || null,
    extra: opts.extra || null,
    localId: opts.localId || null,
    criado_em: new Date().toISOString(),
    quando: new Date().toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' })
  };
  // Abrir turno: nasce já com o id local para as escritas seguintes.
  if (item.tipo === 'abrir') {
    item.localId = 'off-' + ref;
    item.tid = item.localId;
  }
  // LIMITE: a fila offline (registos + fotos) não passa dos 30 MB.
  const tamanhoNovo = JSON.stringify(item).length;
  if (bytesFilaOffline() + tamanhoNovo > LIMITE_OFFLINE_BYTES) {
    throw new Error(`Limite de 30 MB de registos offline atingido (${mbTxt(bytesFilaOffline())} em fila). Liga à internet para sincronizar antes de continuar a registar.`);
  }
  // Fotos grandes vão para o IndexedDB — a fila no localStorage fica leve.
  await descarregarFotosParaIDB(item).catch(() => {});
  let fila = escritasOfflineLer();
  if (item.chave) fila = fila.filter((x) => x.chave !== item.chave);
  fila.push(item);
  if (!escritasOfflineGravar(fila)) {
    throw new Error('Sem espaço local — não foi possível guardar o registo neste aparelho.');
  }
  limparFotosOrfasIDB().catch(() => {});
  // Sincronização em fundo — não bloqueia quem está a registar.
  if (navigator.onLine !== false) sincronizarEscritasOffline().catch(() => {});
  return { _offline: true, ref, criado_em: item.criado_em };
}

// ── FOTOS DA FILA NO INDEXEDDB ────────────────────────────────
// O localStorage tem ~5 MB — pouco para dias de fotos em fila. As fotos
// grandes saem da fila para o IndexedDB (quota de centenas de MB/GB) e a
// fila guarda só uma referência «@idb:chave»; ao sincronizar, a foto é
// recarregada e enviada. Uma limpeza automática apaga fotos órfãs.
const IDB_NOME = 'stockos-offline';
const IDB_STORE = 'fotos';
function idbAbrir() {
  return new Promise((resolve, reject) => {
    const rq = indexedDB.open(IDB_NOME, 1);
    rq.onupgradeneeded = () => {
      if (!rq.result.objectStoreNames.contains(IDB_STORE)) rq.result.createObjectStore(IDB_STORE);
    };
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function idbOp(modo, fn) {
  return idbAbrir().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, modo);
    const st = tx.objectStore(IDB_STORE);
    const rq = fn(st);
    tx.oncomplete = () => { db.close(); resolve(rq && rq.result); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  }));
}
const idbGuardarFoto = (k, v) => idbOp('readwrite', (st) => st.put(v, k));
const idbLerFoto = (k) => idbOp('readonly', (st) => st.get(k));
const idbApagarFoto = (k) => idbOp('readwrite', (st) => st.delete(k)).catch(() => {});
const idbListarChaves = () => idbOp('readonly', (st) => st.getAllKeys()).catch(() => []);

const FOTO_IDB_LIMIAR = 60000; // ~45 KB binário — abaixo disto fica inline

// ── LIMITE DA FILA OFFLINE: 30 MB ─────────────────────────────
// Tecto rígido para os registos por sincronizar (fila + fotos). Ao
// atingir, novos registos são recusados com aviso claro — sincronizar
// liberta o espaço. O consumo das fotos no IndexedDB é contabilizado num
// livro-razão (chave→bytes) para a soma ser instantânea.
const LIMITE_OFFLINE_BYTES = 30 * 1024 * 1024;
const IDB_BYTES_KEY = 'stockos.idbBytes';
function idbBytesLedger() {
  try {
    const v = JSON.parse(localStorage.getItem(IDB_BYTES_KEY) || '{}');
    return v && typeof v === 'object' ? v : {};
  } catch (_) { return {}; }
}
function idbBytesGravar(ledger) {
  try { localStorage.setItem(IDB_BYTES_KEY, JSON.stringify(ledger)); } catch (_) {}
}
function bytesFilaOffline() {
  let total = 0;
  try { total += (localStorage.getItem(ESCRITAS_OFFLINE_KEY) || '').length; } catch (_) {}
  try { total += (localStorage.getItem(PEDIDOS_OFFLINE_KEY) || '').length; } catch (_) {}
  const ledger = idbBytesLedger();
  for (const k in ledger) total += ledger[k] || 0;
  return total;
}
function mbTxt(bytes) {
  return (bytes / (1024 * 1024)).toFixed(1).replace('.', ',') + ' MB';
}

/** Move as fotos grandes do body para o IndexedDB (referência @idb:…). */
async function descarregarFotosParaIDB(item) {
  const ehFotoGrande = (v) => typeof v === 'string' && v.startsWith('data:image') && v.length > FOTO_IDB_LIMIAR;
  const b = item.body || {};
  let n = 0;
  for (const campo of Object.keys(b)) {
    try {
      if (ehFotoGrande(b[campo])) {
        const k = `foto:${item.ref}:${n++}`;
        await idbGuardarFoto(k, b[campo]);
        const lg = idbBytesLedger(); lg[k] = b[campo].length; idbBytesGravar(lg);
        b[campo] = '@idb:' + k;
      } else if (Array.isArray(b[campo])) {
        for (let i = 0; i < b[campo].length; i++) {
          if (ehFotoGrande(b[campo][i])) {
            const k = `foto:${item.ref}:${n++}`;
            await idbGuardarFoto(k, b[campo][i]);
            const lg = idbBytesLedger(); lg[k] = b[campo][i].length; idbBytesGravar(lg);
            b[campo][i] = '@idb:' + k;
          }
        }
      }
    } catch (_) { /* IDB indisponível → a foto segue inline (limite antigo) */ }
  }
}
/** Devolve o body com as referências @idb resolvidas (para enviar). */
async function resolverFotosDoIDB(body) {
  const ehRef = (v) => typeof v === 'string' && v.startsWith('@idb:');
  const precisa = Object.keys(body || {}).some((c) => ehRef(body[c]) || (Array.isArray(body[c]) && body[c].some(ehRef)));
  if (!precisa) return body;
  const out = JSON.parse(JSON.stringify(body));
  for (const campo of Object.keys(out)) {
    if (ehRef(out[campo])) out[campo] = (await idbLerFoto(out[campo].slice(5)).catch(() => '')) || '';
    else if (Array.isArray(out[campo])) {
      for (let i = 0; i < out[campo].length; i++) {
        if (ehRef(out[campo][i])) out[campo][i] = (await idbLerFoto(out[campo][i].slice(5)).catch(() => '')) || '';
      }
    }
  }
  return out;
}
/** Limpeza: apaga do IndexedDB fotos cujo item já saiu da fila. */
async function limparFotosOrfasIDB() {
  try {
    const chaves = await idbListarChaves();
    if (!chaves || !chaves.length) return;
    const refs = new Set(escritasOfflineLer().map((x) => x.ref));
    const lg = idbBytesLedger();
    let mudou = false;
    for (const k of chaves) {
      const m = String(k).match(/^foto:([^:]+):/);
      if (m && !refs.has(m[1])) {
        await idbApagarFoto(k);
        if (lg[k] != null) { delete lg[k]; mudou = true; }
      }
    }
    // Entradas do razão sem chave no IDB (limpeza dupla) também saem.
    const setChaves = new Set((chaves || []).map(String));
    for (const k in lg) {
      const m = String(k).match(/^foto:([^:]+):/);
      if ((m && !refs.has(m[1])) || !setChaves.has(k)) { delete lg[k]; mudou = true; }
    }
    if (mudou) idbBytesGravar(lg);
  } catch (_) {}
}

async function apiEscritaComTimeout(item, ms) {
  const body = await resolverFotosDoIDB(item.body);
  return Promise.race([
    api(item.method, item.path, body),
    new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms || 25000))
  ]);
}

/** Depois do «abrir» sincronizar: troca o id local pelo id real em toda a
 *  fila (paths, tids, bodies), nos pedidos offline e no estado da página. */
function remapTurnoLocal(localId, realId) {
  const lid = String(localId);
  const rid = String(realId);
  const subst = (s) => String(s).split(lid).join(rid);
  escritasOfflineGravar(escritasOfflineLer().map((x) => {
    const y = Object.assign({}, x);
    y.path = subst(y.path);
    if (y.tid === lid) y.tid = rid;
    if (y.chave) y.chave = subst(y.chave);
    if (y.body) { try { y.body = JSON.parse(subst(JSON.stringify(y.body))); } catch (_) {} }
    return y;
  }));
  pedidosOfflineGravar(pedidosOfflineLer().map((x) =>
    String(x.tid) === lid ? Object.assign({}, x, { tid: rid }) : x
  ));
  turnosLocaisGravar(turnosLocaisLer().filter((t) => String(t.id) !== lid));
  if (String(S.turnoId) === lid) {
    S.turnoId = rid;
    if (S.turnoData && String(S.turnoData.id) === lid) S.turnoData.id = realId;
  }
}

/** Abrir falhou definitivamente → descarta o turno local e tudo o que lhe
 *  estava pendurado (escritas e pedidos em fila). */
function limparTurnoLocal(localId) {
  const lid = String(localId);
  escritasOfflineGravar(escritasOfflineLer().filter((x) => String(x.tid) !== lid && x.localId !== lid));
  pedidosOfflineGravar(pedidosOfflineLer().filter((x) => String(x.tid) !== lid));
  turnosLocaisGravar(turnosLocaisLer().filter((t) => String(t.id) !== lid));
}

let __syncEscritasEmCurso = false;
async function sincronizarEscritasOffline() {
  if (__syncEscritasEmCurso || !S.token) return;
  __syncEscritasEmCurso = true;
  let precisaRefrescar = false;
  try {
    let guard = 0;
    let idx = 0; // avança por cima de itens que não podem sincronizar já
    while (guard++ < 500) {
      const fila = escritasOfflineLer();
      if (!fila.length || idx >= fila.length) break;
      const item = fila[idx];
      const removeDaFila = () => {
        escritasOfflineGravar(escritasOfflineLer().filter((x) => x.ref !== item.ref));
      };
      try {
        if (item.tipo === 'abrir') {
          const turno = await apiEscritaComTimeout(item, 25000);
          removeDaFila();
          if (turno && turno.id != null && item.localId) {
            const viaLocal = String(S.turnoId) === String(item.localId) || S.page === 'dia';
            remapTurnoLocal(item.localId, turno.id);
            precisaRefrescar = precisaRefrescar || viaLocal;
          }
          idx = 0; // remap pode ter destravado itens anteriores
          continue;
        }
        // Escritas de um turno ainda local: esperam pelo respectivo «abrir».
        // Se o «abrir» já não está na fila (item órfão de versões antigas),
        // NÃO bloqueia os restantes — salta e segue.
        if (item.tid && turnoIdEhLocal(item.tid)) { idx++; continue; }
        if (item.tipo === 'fechar') {
          // Pedidos deste turno têm de entrar antes do fecho (vendas/caixa).
          try { await sincronizarPedidosOffline(); } catch (_) {}
          if (pedidosOfflineLer().some((x) => String(x.tid) === String(item.tid))) { idx++; continue; }
        }
        await apiEscritaComTimeout(item, 25000);
        removeDaFila();
      } catch (e) {
        if (ehErroDeRede(e)) break; // sem rede — tenta mais tarde
        removeDaFila();
        if (item.tipo === 'abrir' && item.localId) limparTurnoLocal(item.localId);
        alert(`⚠ Um registo offline (${item.desc}, de ${item.quando || '—'}) foi REJEITADO ao sincronizar: ${e.message}`);
      }
    }
  } finally {
    __syncEscritasEmCurso = false;
    renderOfflinePendentesBadge();
    limparFotosOrfasIDB().catch(() => {});
  }
  if (precisaRefrescar) {
    try {
      if (S.page === 'turno') await loadTurno();
      else if (S.page === 'dia') await loadDia();
    } catch (_) {}
  }
}

// ── OVERLAY: escritas pendentes reflectidas em TODOS os ecrãs ──
/** Aplica a fila offline por cima das respostas GET — os valores por
 *  sincronizar aparecem em todas as abas como se já estivessem gravados. */
function aplicarEscritasOffline(path, data) {
  try {
    const fila = escritasOfflineLer();
    const locais = turnosLocaisLer();
    if (!fila.length && !locais.length) return data;
    const [p, qs] = String(path).split('?');
    const params = new URLSearchParams(qs || '');
    if (p === '/dia' && Array.isArray(data)) {
      const dataDia = String(params.get('data') || '').slice(0, 10);
      const resumo = params.get('resumo');
      const turnoIdQ = params.get('turno_id');
      const out = data.map((t) => aplicarEscritasAoTurno(t, fila));
      const nomesExistentes = new Set(out.map((t) => t.nome));
      const lojaQ = params.get('loja');
      for (const tl of locais) {
        if (String(tl.data).slice(0, 10) !== dataDia) continue;
        if (lojaQ && String(tl.loja || 1) !== String(lojaQ)) continue;
        if (turnoIdQ && String(tl.id) !== String(turnoIdQ)) continue;
        if (!turnoIdQ && nomesExistentes.has(tl.nome)) {
          // Já existe o turno real com este nome — turno local órfão (sem
          // fila pendente) pode ser descartado.
          if (!fila.some((x) => String(x.tid) === String(tl.id))) {
            turnosLocaisGravar(turnosLocaisLer().filter((t) => String(t.id) !== String(tl.id)));
          }
          continue;
        }
        out.push(aplicarEscritasAoTurno(turnoLocalBase(tl, !resumo), fila));
      }
      return out;
    }
    const m = p.match(/^\/turnos\/([^/]+)\/(entradas|saidas|vendas|equipa-real|faltas|pedidos)$/);
    if (m && Array.isArray(data)) {
      return overlayListaTurno(decodeURIComponent(m[1]), m[2], data, fila);
    }
    if (p === '/depositos' && Array.isArray(data)) {
      return overlayDepositos(params.get('data') || '', data, fila);
    }
    if (p === '/fotos' && Array.isArray(data)) {
      const chaveQ = params.get('chave') || '';
      let out = data.slice();
      for (const it of fila) {
        if (it.method === 'POST' && String(it.path).split('?')[0] === '/fotos' && it.body && it.body.chave === chaveQ) {
          out = out.concat([{ id: 'off:' + it.ref, chave: chaveQ, foto: it.body.foto_base64, criado_em: it.criado_em, _offline: true }]);
        } else if (it.method === 'DELETE' && /^\/fotos\/[^/]+$/.test(String(it.path).split('?')[0])) {
          const did = decodeURIComponent(String(it.path).split('?')[0].split('/')[2]);
          out = out.filter((r) => String(r.id) !== did);
        }
      }
      return out;
    }
    if (p === '/face-descriptors' && Array.isArray(data)) {
      // Faces registadas/removidas offline contam já para o reconhecimento.
      let out = data.slice();
      for (const it of fila) {
        const mm = String(it.path || '').split('?')[0].match(/^\/utilizadores\/([^/]+)\/face-descriptor$/);
        if (!mm) continue;
        const uid = decodeURIComponent(mm[1]);
        if (it.method === 'PUT' && it.body && Array.isArray(it.body.descriptor)) {
          const row = { id: uid, nome: (it.extra && it.extra.nome) || uid, descriptor: it.body.descriptor, _offline: true };
          const j = out.findIndex((r) => String(r.id) === String(uid));
          if (j >= 0) out[j] = row; else out.push(row);
        } else if (it.method === 'DELETE') {
          out = out.filter((r) => String(r.id) !== String(uid));
        }
      }
      return out;
    }
    if ((p === '/irregularidades/comentarios' || p === '/irregularidades/decisoes') && Array.isArray(data)) {
      return overlayIrregularidades(p, params.get('turno_id'), data, fila);
    }
    return data;
  } catch (_) { return data; }
}

function aplicarEscritasAoTurno(t, fila) {
  if (!t || t.id == null) return t;
  const tid = String(t.id);
  const itens = fila.filter((it) => String(it.tid) === tid);
  if (!itens.length) return t;
  let out;
  try { out = JSON.parse(JSON.stringify(t)); } catch (_) { return t; }
  if (!out.caixa) out.caixa = {};
  for (const it of itens) {
    const b = it.body || {};
    const p = String(it.path || '').split('?')[0];
    if (it.method === 'PUT' && p.endsWith('/stock')) {
      const row = (out.stock || []).find((s) => String(s.produto_id) === String(b.produto_id));
      if (row) {
        row.encontrado = b.encontrado;
        row.deixado = b.deixado;
        row.fechados = b.fechados;
        row.encontrado_caixa = b.encontrado_caixa;
        row.deixado_caixa = b.deixado_caixa;
        row._offline = true;
      }
    } else if (it.method === 'PUT' && p.endsWith('/caixa')) {
      out.caixa.tpa = b.tpa;
      out.caixa.transferencia = b.transferencia;
      out.caixa.dinheiro = b.dinheiro;
      out.caixa._offline = true;
    } else if (it.method === 'PUT' && p.endsWith('/notas')) {
      out.notas = b.notas || '';
    } else if (p.endsWith('/caixa/tpa-foto')) {
      out.caixa.tpa_foto_url = (typeof b.foto_base64 === 'string' && b.foto_base64.startsWith('data:')) ? b.foto_base64 : 'offline-pendente';
    } else if (p.endsWith('/encontrados/fechar')) { out.encontrados_fechados_em = it.criado_em; }
    else if (p.endsWith('/encontrados/reabrir')) { out.encontrados_fechados_em = null; }
    else if (p.endsWith('/deixados/fechar')) { out.deixados_fechados_em = it.criado_em; }
    else if (p.endsWith('/deixados/reabrir')) { out.deixados_fechados_em = null; }
    else if (it.tipo === 'fechar' && p.endsWith('/fechar')) {
      out.estado = 'fechado';
      out.fechado_em = it.criado_em;
      out._offline_fechado = true;
    } else if (it.method === 'POST' && p.endsWith('/reabrir') && !p.includes('/encontrados/') && !p.includes('/deixados/')) {
      out.estado = 'aberto';
      out.fechado_em = null;
    } else if (it.method === 'POST' && p.endsWith('/entradas')) {
      const row = (out.stock || []).find((s) => String(s.produto_id) === String(b.produto_id));
      if (row) {
        const sinal = b.tipo === 'tirar' ? -1 : 1;
        row.entrada = (parseFloat(row.entrada) || 0) + sinal * (parseFloat(b.quantidade) || 0);
      }
      if (b.origem === 'compra' && b.tipo !== 'tirar') {
        out.caixa.saida = (parseFloat(out.caixa.saida) || 0) + (parseFloat(b.preco) || 0);
      }
    } else if (it.method === 'POST' && p.endsWith('/saidas')) {
      if (!String(b.notas || '').startsWith('ENTRADA::')) {
        out.caixa.saida = (parseFloat(out.caixa.saida) || 0) + (parseFloat(b.valor) || 0);
      }
    }
  }
  const partes = [out.caixa.tpa, out.caixa.transferencia, out.caixa.dinheiro].map((v) => parseFloat(v));
  if (partes.every((v) => Number.isFinite(v))) {
    const tg = partes[0] + partes[1] + partes[2];
    out.caixa.total_gerado = tg;
    out.caixa.total_final = tg - (parseFloat(out.caixa.saida) || 0);
  }
  return out;
}

function overlayListaTurno(tid, tipoLista, rows, fila) {
  const itens = fila.filter((it) => String(it.tid) === String(tid));
  if (!itens.length) return rows;
  let out = rows.slice();
  const prodMap = {};
  (window.__produtosCacheOffline || []).forEach((pr) => { prodMap[String(pr.id)] = pr; });
  for (const it of itens) {
    const b = it.body || {};
    const p = String(it.path || '').split('?')[0];
    if (tipoLista === 'entradas' && it.method === 'POST' && p.endsWith('/entradas')) {
      out = out.concat([{
        id: 'off:' + it.ref,
        turno_id: tid,
        produto_id: b.produto_id,
        produto_nome: (prodMap[String(b.produto_id)] || {}).nome || (it.extra && it.extra.produto_nome) || 'Produto',
        tipo: b.tipo === 'tirar' ? 'tirar' : 'entrada',
        origem: b.origem === 'compra' ? 'compra' : 'armazem',
        preco: b.preco || 0,
        quantidade: b.quantidade,
        notas: b.notas || '',
        criado_em: it.criado_em,
        _offline: true
      }]);
    } else if (tipoLista === 'saidas' && it.method === 'POST' && p.endsWith('/saidas')) {
      out = [{
        id: 'off:' + it.ref, turno_id: tid, descricao: b.descricao || '',
        valor: b.valor || 0, notas: b.notas || '', criado_em: it.criado_em, _offline: true
      }].concat(out);
    } else if (tipoLista === 'vendas' && it.method === 'POST' && p.endsWith('/vendas')) {
      const i = out.findIndex((r) => String(r.produto_id) === String(b.produto_id));
      if (i >= 0) out[i] = Object.assign({}, out[i], { quantidade: b.quantidade, _offline: true });
      else out.push({ turno_id: tid, produto_id: b.produto_id, quantidade: b.quantidade, _offline: true });
    } else if (tipoLista === 'equipa-real') {
      if (it.method === 'POST' && p.endsWith('/equipa-real')) {
        const uid = String(b.utilizador_id || '');
        const nome = (it.extra && it.extra.nome) || (uid.startsWith('ext:') ? uid.slice(4) : uid);
        const row = {
          id: 'off:' + it.ref, turno_id: tid, utilizador_id: uid,
          cobrindo_utilizador_id: b.cobrindo_utilizador_id || null,
          hora_extra: !!b.hora_extra, motivo_falta: b.motivo_falta || '',
          notas: b.notas || '', criado_em: it.criado_em,
          utilizador_nome: nome,
          utilizador_role: uid.startsWith('ext:') ? 'externo' : ((it.extra && it.extra.role) || null),
          cobrindo_utilizador_nome: (it.extra && it.extra.cobrindo_nome) || null,
          _offline: true
        };
        const i = out.findIndex((r) => String(r.utilizador_id) === uid);
        if (i >= 0) out[i] = row; else out.push(row);
      } else if (it.method === 'DELETE' && p.includes('/equipa-real/')) {
        const uid = decodeURIComponent(p.split('/equipa-real/')[1] || '');
        out = out.filter((r) => String(r.utilizador_id) !== uid);
      }
    } else if (tipoLista === 'faltas' && it.method === 'POST' && p.endsWith('/faltas')) {
      out = out.concat([{
        id: 'off:' + it.ref, turno_id: tid, utilizador_id: b.utilizador_id,
        motivo_falta: b.motivo_falta || '', criado_em: it.criado_em, _offline: true
      }]);
    } else if (tipoLista === 'pedidos' && it.method === 'POST' && /\/devolver$/.test(p)) {
      const mm = p.match(/\/pedidos\/([^/]+)\/devolver$/);
      if (mm) {
        out = out.map((ped) => {
          if (String(ped.id) !== String(mm[1])) return ped;
          let cl;
          try { cl = JSON.parse(JSON.stringify(ped)); } catch (_) { return ped; }
          const ln = (cl.linhas || []).find((l) => String(l.linha_id) === String(b.linha_id));
          if (ln) ln.quantidade_devolvida = (parseFloat(ln.quantidade_devolvida) || 0) + 1;
          cl._offline_devolucao = true;
          return cl;
        });
      }
    }
  }
  return out;
}

/** Depósitos no banco: os registos em fila offline aparecem na página como

function overlayDepositos(dataQ, rows, fila) {

          turno_nome: nomes[String(x.turno_id)] || '',
          turno_data: dExtra || dataQ,
          _offline: true
        };
        const j = out.findIndex((r) => String(r.turno_id) === String(x.turno_id));
        if (j >= 0) out[j] = Object.assign({}, out[j], row); else out.push(row);
      });
    } else if (it.method === 'POST' && p === '/depositos/bordero-dia') {
      if (!dataQ || String(b.data || '').slice(0, 10) === dataQ) {
        out = out.map((r) => Object.assign({}, r, { bordero_foto_url: (typeof b.foto_base64 === 'string' && b.foto_base64.startsWith('data:')) ? b.foto_base64 : r.bordero_foto_url }));
      }
    } else if (it.method === 'DELETE' && p.startsWith('/depositos/bordero-dia')) {
      const q2 = new URLSearchParams(String(it.path).split('?')[1] || '');
      if (!dataQ || q2.get('data') === dataQ) {
        out = out.map((r) => Object.assign({}, r, { bordero_foto_url: '' }));
      }

      if (!dataQ || q2.get('data') === dataQ) {
        out = out.map((r) => Object.assign({}, r, { fechado: false }));
      }

  }
  return out;
}

function fotosAnexosRefresh(chave) {

async function fotosAnexosRender(el) {
  const chave = el.getAttribute('data-chave');

  let fotos = [];
  try {
    fotos = await api('GET', `/fotos?chave=${encodeURIComponent(chave)}`);
  } catch (_) {
    // Sem rede e sem cache deste GET: mostra pelo menos as fotos em fila.
    try { fotos = aplicarEscritasOffline(`/fotos?chave=${encodeURIComponent(chave)}`, []); } catch (_2) { fotos = []; }
  }
  // Fotos em fila cujo conteúdo vive no IndexedDB → carrega p/ pré-visualizar.
  if (Array.isArray(fotos)) {
    for (const f of fotos) {
      if (typeof f.foto === 'string' && f.foto.startsWith('@idb:')) {
        f.foto = (await idbLerFoto(f.foto.slice(5)).catch(() => '')) || '';
      }
    }
  }
  const thumbs = (Array.isArray(fotos) ? fotos : []).map((f) => `
    <span style="position:relative;display:inline-block">
      <a href="${attrUrl(f.foto)}" target="_blank" rel="noopener noreferrer"><img src="${attrUrl(f.foto)}" alt="" style="height:56px;width:56px;object-fit:cover;border-radius:8px;border:1px solid #334155;vertical-align:top${f._offline ? ';opacity:.85' : ''}"/></a>
      ${f._offline ? '<span title="Por sincronizar" style="position:absolute;left:2px;bottom:2px;font-size:10px">⏳</span>' : ''}
      ${canEdit ? `<button type="button" title="Remover esta foto" onclick="fotosAnexosApagar('${chave}', '${String(f.id)}')" style="position:absolute;top:-6px;right:-6px;background:#7f1d1d;color:#fecaca;border:1px solid #ef4444;border-radius:50%;width:18px;height:18px;font-size:10px;line-height:1;cursor:pointer;padding:0">✕</button>` : ''}
    </span>`).join('');
  el.innerHTML = `
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">
      ${thumbs}
      ${canEdit ? `<label style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#94a3b8;border:1px dashed #475569;border-radius:8px;padding:6px 10px;cursor:pointer">📷 + foto
        <input type="file" accept="image/jpeg,image/png,image/webp" multiple style="display:none" onchange="fotosAnexosAdicionar(this, '${chave}')"/>
      </label>` : (thumbs ? '' : '<span style="font-size:11px;color:#475569">Sem fotos adicionais.</span>')}
    </div>`;
}
async function fotosAnexosAdicionar(inp, chave) {
  const files = Array.from((inp && inp.files) || []);
  if (!files.length) return;
  try {
    for (const f of files.slice(0, 12)) {
      const b64 = await comprimirFotoDataUrl(await fileToDataUrl(f), 1600, 0.8);
      await apiEscrita('POST', '/fotos', { chave, foto_base64: b64 },
        { desc: 'Foto adicional', timeoutMs: 10000, tid: (chave.match(/^tpa:(.+)$/) || [])[1] || null });
    }
    if (inp) inp.value = '';
  } catch (e) { alert(e.message || String(e)); }
  fotosAnexosRefresh(chave);
}
async function fotosAnexosApagar(chave, id) {
  if (!confirm('Remover esta foto?')) return;
  try {
    if (String(id).startsWith('off:')) {
      // Ainda na fila offline — basta retirá-la da fila.
      const refF = String(id).slice(4);
      escritasOfflineGravar(escritasOfflineLer().filter((x) => x.ref !== refF));
    } else {
      await apiEscrita('DELETE', `/fotos/${encodeURIComponent(id)}`, {}, { desc: 'Remover foto adicional' });
    }
  } catch (e) { alert(e.message || String(e)); }
  fotosAnexosRefresh(chave);
}
/** Abre todas as fotos de um contexto (ex.: fatura) numa página própria. */
async function verFotosAnexos(chave, legacyUrl) {
  let fotos = [];
  try { fotos = await api('GET', `/fotos?chave=${encodeURIComponent(chave)}`); } catch (_) {}
  const urls = [];
  if (legacyUrl) urls.push(legacyUrl);
  (Array.isArray(fotos) ? fotos : []).forEach((f) => { if (f.foto) urls.push(f.foto); });
  if (!urls.length) { alert('Sem fotos.'); return; }
  const w = window.open('', '_blank');
  if (!w) return;
  w.document.write(`<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fotos</title><body style="margin:0;background:#000;padding:12px;text-align:center">${urls.map((u) => `<img src="${u}" style="max-width:100%;margin:8px 0;border-radius:8px;display:block"/>`).join('')}</body>`);
  w.document.close();
}

/** Reduz a foto (lado maior ~1280 px, JPEG) — cabe na fila offline e envia
 *  mais depressa em rede fraca. */
function comprimirFotoDataUrl(dataUrl, maxLado, qualidade) {
  return new Promise((resolve) => {
    try {
      const img = new Image();
      img.onload = () => {
        try {
          const esc = Math.min(1, (maxLado || 1280) / Math.max(img.width || 1, img.height || 1));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round((img.width || 1) * esc));
          c.height = Math.max(1, Math.round((img.height || 1) * esc));
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', qualidade || 0.72));
        } catch (_) { resolve(dataUrl); }
      };
      img.onerror = () => resolve(dataUrl);
      img.src = dataUrl;
    } catch (_) { resolve(dataUrl); }
  });
}

async function pedidoBalcaoConfirmarRegisto() {
  const p = window.__pedidoBalcaoPendente;
  closePedidoPreviewModal();
  if (!p) return;
  window.__pedidoBalcaoPendente = null;
  const { tid, linhas, cliente, tipoPag, comEntrega, valorEntrega, promotorId } = p;

  // LOCAL-FIRST: o pedido entra SEMPRE primeiro na fila local — zero
  // espera pela rede, mesmo quando ela está boa. O talão imprime na hora
  // com a referência local e a sincronização corre em fundo (o client_ref
  // único garante que o servidor nunca duplica).
  const clientRef = 'cr-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
  const payload = {
    cliente_nome: cliente,
    tipo_pagamento: tipoPag,
    com_entrega: comEntrega,
    valor_entrega: valorEntrega,
    promotor_id: promotorId || null,
    linhas,
    client_ref: clientRef
  };
  const refLocal = 'P-' + clientRef.slice(-4).toUpperCase();
  const fila = pedidosOfflineLer();
  fila.push({ tid: String(tid), payload, ref: refLocal, criado_em: new Date().toISOString(), quando: new Date().toLocaleString('pt-PT', { dateStyle: 'short', timeStyle: 'short' }) });
  pedidosOfflineGravar(fila);
  const pedidoSalvo = { id: refLocal, offline: true };
  // Sincronização em fundo — não bloqueia o operador.
  sincronizarPedidosOffline().catch(() => {});

  // Print só depois do save bem sucedido, usando o ID devolvido pelo servidor.
  if (pedidoBalcaoAutoPrintEnabled() && pedidoSalvo && pedidoSalvo.id) {
    try {
      const catalog = window.__pedidoProdutosOpts || [];
      const map = {};
      catalog.forEach((o) => { map[String(o.id)] = o; });
      const linhasTalao = linhas.map((ln) => {
        const o = map[String(ln.produto_id)] || {};
        return {
          produto_nome: o.nome || 'Item',
          quantidade: ln.quantidade,
          preco: o.preco,
          venda_por_copo: o.venda_por_copo,
          kg_por_copo: o.kg_por_copo,
          qtd_copos_pacote: o.qtd_copos_pacote,
          preco_copos_pacote: o.preco_copos_pacote
        };
      });
      const pedidoParaTalao = {
        id: pedidoSalvo.id,
        cliente_nome: cliente,
        tipo_pagamento: tipoPag,
        com_entrega: comEntrega,
        criado_em: new Date().toISOString(),
        linhas: linhasTalao
      };
      pedidoBalcaoImprimirTalao(pedidoParaTalao);
    } catch (e) {
      console.warn('Auto-print falhou:', e);
      // O pedido está guardado, só a impressão falhou — o utilizador pode
      // imprimir manualmente no botão "🖨️ Talão" do pedido na lista.
    }
  }
  window.__pedidoBalcaoDraft = {};
  window.__pedidoBalcaoDraftTurnoId = tid;
  // Re-render imediato: o pedido local entra já em todas as abas (lista,
  // Produtos vendidos, Comissões, Esperado, Validação). Funciona offline —
  // o Service Worker serve os GETs do cache. Se mesmo assim falhar, o
  // banner e o rascunho limpo garantem que nada se perde.
  try {
    await loadVendasMenu(tid, !!S.turnoCanEdit);
  } catch (_) {
    renderPedidosOfflineBanner();
    pedidoBalcaoSyncDraftUI();
  }
}

  let saidasTurno = [];

  // "Resumo do turno" removido — os totais de caixa já estão no card 💰 Caixa.
  const resumoProdutosHtml = (() => {

    const porCat = new Map();
    for (const p of pedidos) {
      for (const ln of (p.linhas || [])) {
        const key = String(ln.produto_id);
        // Na BD a categoria é 'outro' (singular) — normalizar para 'outros'
        // senão o bloco desta categoria nunca aparece na listagem.
        let cat = String(ln.produto_categoria || 'outros').toLowerCase();
        if (cat === 'outro') cat = 'outros';
        const isCopo = ln.venda_por_copo === true && (parseFloat(ln.kg_por_copo) || 0) > 0;
        const qtd = parseFloat(ln.quantidade) || 0;
        const u = parseFloat(ln.preco) || 0;
        const n = parseInt(ln.qtd_copos_pacote, 10) || 0;
        const pp = parseFloat(ln.preco_copos_pacote) || 0;
        const pct = parseFloat(ln.comissao_pct) || 0;
        let subtotal;
        if (isCopo) {
          const c = Math.floor(qtd);
          subtotal = (n >= 2 && pp > 0) ? Math.floor(c / n) * pp + (c % n) * u : c * u;
        } else {
          subtotal = qtd * u;
        }
        if (!porCat.has(cat)) porCat.set(cat, new Map());
        const byProd = porCat.get(cat);
        if (!byProd.has(key)) {
          byProd.set(key, {
            nome: ln.produto_nome || 'Sem nome',
            qtd: 0,
            valor: 0,
            comissao: 0,
            pct,
            unidade: isCopo ? 'copos' : 'un.',
            isCopo,
            pacoteN: n,
            pacotePreco: pp,
            pacotes: 0,
            avulsos: 0
          });
        }
        const e = byProd.get(key);
        e.qtd += qtd;
        e.valor += subtotal;
        e.comissao += subtotal * pct / 100;

        // acumular aqui (e não recalcular sobre o total agregado, que

        if (isCopo && n >= 2 && pp > 0) {
          const c = Math.floor(qtd);
          e.pacotes += Math.floor(c / n);
          e.avulsos += c % n;

          const pT = `${r.pacotes} pacote${r.pacotes !== 1 ? 's' : ''}`;

        }
        const pctTxt = r.pct > 0 ? `<span style="color:#64748b;font-size:11px">(${r.pct.toFixed(1)}%)</span> ` : '';
        return `
        <tr>

    };
    const ordemCats = ['menu', 'ingredientes', 'bebida', 'outros'];

    // Total geral no MESMO layout de colunas das tabelas de categoria —

  const temDivergVendidoBalcao = (() => {

      const vend = vendidoQtyFromStockParts(

      const balcao = balcaoMapVB[pid] || null;

      const balNativo = balcao.isCopo ? balcao.kg : balcao.unidades;
      if (!(balNativo > 0)) continue;
      const tol = (s.tipo_medicao === 'peso' || balcao.isCopo) ? 0.001 : 0.5;
      if (Math.abs(vend - balNativo) > tol) return true;

  // Motivos que bloqueiam o pagamento de comissões a quem trabalhou:

  const motivosBloqueioComissao = (() => {

    const br = (typeof getPedidosBalcaoBreakdown === 'function') ? getPedidosBalcaoBreakdown() : null;
    const totalGeralArt = br ? (br.total - (br.entregaFees || 0)) : NaN;
    const totalGerado = (typeof getTotalGeradoCaixaKz === 'function') ? getTotalGeradoCaixaKz() : NaN;

      motivos.push(`o <strong>Total geral</strong> dos produtos vendidos (${fmt(totalGeralArt)}) é maior do que o <strong>Total gerado</strong> na caixa (${fmt(totalGerado)}) — falta dinheiro na caixa`);
    }
    return motivos;
  })();
  const comissaoTrabalhadorBloqueada = motivosBloqueioComissao.length > 0;
  const resumoComissoesHtml = (() => {
    if (!pedidos.length) return '';
    const porProm = new Map();
    let comTotal = 0, semPromTotal = 0, semPromN = 0;
    for (const p of pedidos) {
      const promId = p.promotor_id ? String(p.promotor_id) : '';
      const promNome = p.promotor_nome || '— Sem promotor —';
      const modo = p.promotor_modo === 'total' ? 'total' : 'produto';
      const pct = p.promotor_pct_total == null ? null : parseFloat(p.promotor_pct_total) || 0;
      const com = parseFloat(p.comissao_valor) || 0;
      const subtotal = (p.linhas || []).reduce((s, ln) => {
        const isCopo = ln.venda_por_copo === true && (parseFloat(ln.kg_por_copo) || 0) > 0;
        const qtd = parseFloat(ln.quantidade) || 0;
        const u = parseFloat(ln.preco) || 0;
        const n = parseInt(ln.qtd_copos_pacote, 10) || 0;
        const pp = parseFloat(ln.preco_copos_pacote) || 0;
        if (isCopo) {
          const c = Math.floor(qtd);
          return s + ((n >= 2 && pp > 0) ? Math.floor(c / n) * pp + (c % n) * u : c * u);
        }
        return s + qtd * u;
      }, 0);
      if (!promId) {
        // Sem promotor: comissão potencial — não atribuída.
        const pot = parseFloat(p.comissao_valor_potencial) || 0;
        semPromTotal += pot;
        semPromN += 1;
        continue;
      }
      // Regra: quem REALMENTE TRABALHOU (escalado + clock-in à hora do
      // pedido) recebe metade da comissão (a outra metade fica para a casa).
      const aTrabalhar = p.promotor_a_trabalhar === true;
      const comEfetiva = aTrabalhar ? com / 2 : com;
      comTotal += comEfetiva;
      if (!porProm.has(promId)) {
        porProm.set(promId, { nome: promNome, modo, pct, n: 0, vendido: 0, comissao: 0, comissaoOriginal: 0, nTrabalhados: 0 });
      }
      const a = porProm.get(promId);
      a.n += 1;
      a.vendido += subtotal;
      a.comissao += comEfetiva;
      a.comissaoOriginal += com;
      if (aTrabalhar) a.nTrabalhados += 1;
      a.modo = modo;
      a.pct = pct;
    }
    if (!porProm.size && !semPromN) return '';
    const arr = [...porProm.values()].sort((a, b) => b.comissao - a.comissao);
    const linhasProm = arr.map((r) => {
      const modoTxt = r.modo === 'total' && r.pct != null
        ? `${r.pct.toFixed(1)}% do total`
        : '% por produto';
      const pago = comissaoPagaPorNome[r.nome] || 0;
      const porPagar = Math.max(0, Math.round((r.comissao - pago) * 100) / 100);
      let acaoHtml = '';
      if (pago > 0 && porPagar <= 0.009) {
        // Tudo pago — fica em frente do valor.
        acaoHtml = `<span title="Comissão já paga (${fmt(pago)})" style="margin-right:6px;font-size:10px;color:#86efac;font-weight:700">✓ Pago</span>`;
      } else if (porPagar > 0.009 && comissaoTrabalhadorBloqueada && r.nTrabalhados > 0) {
        // Quem trabalhou no turno não recebe enquanto a validação tiver
        // problemas — ver motivos no aviso por baixo da tabela.
        acaoHtml = `<span title="Pagamento bloqueado — ver aviso por baixo da tabela. Corrige o stock/pedidos/caixa primeiro." style="margin-right:6px;font-size:10px;color:#f87171;font-weight:700;cursor:help">🔒 Bloqueada</span>`;
      } else if (canEdit && porPagar > 0.009) {
        const parcial = pago > 0 ? `<span style="font-size:9px;color:#64748b;margin-right:6px">(pago ${fmt(pago)})</span>` : '';
        acaoHtml = `${parcial}<button type="button" class="btn btn-ghost btn-sm pagar-comissao-btn" title="Registar saída de caixa para pagar ${pago > 0 ? 'o que falta' : 'esta comissão'} (${fmt(porPagar)})" style="padding:2px 8px;font-size:11px;margin-right:6px" data-pc-turno="${escapeHtml(String(turnoId))}" data-pc-nome="${escapeHtml(String(r.nome))}" data-pc-valor="${porPagar}" onclick="runAction(event, () => pagarComissaoFromBtn(this))">💸 Pagar</button>`;
      }

      const reducaoTag = reducao
        ? `<span title="Recebe metade (${r.nTrabalhados}/${r.n} pedido${r.n===1?'':'s'} com o promotor a trabalhar — outra metade fica para a casa). Total original ${fmt(r.comissaoOriginal)}." style="font-size:9px;color:#fb923c;font-weight:700;margin-right:4px;cursor:help">½</span>`

      return `
        <tr>
          <td style="padding:5px 8px;color:#e2e8f0">${escapeHtml(r.nome)} <span style="color:#64748b;font-size:11px">(${escapeHtml(modoTxt)})</span></td>

          <td style="padding:5px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums">${fmt(r.vendido)}</td>
          <td style="padding:5px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap">${acaoHtml}${reducaoTag}${fmt(r.comissao)}</td>
        </tr>`;
    }).join('');
    const semPromHtml = semPromN > 0
      ? `<div style="margin-top:8px;padding:6px 10px;background:#0b1322;border:1px dashed #334155;border-radius:6px;font-size:11px;color:#94a3b8;line-height:1.5">
          ⚠ <strong>${semPromN}</strong> pedido${semPromN === 1 ? '' : 's'} sem promotor — comissão potencial <strong style="color:#fbbf24">${fmt(semPromTotal)}</strong> (não atribuída).
        </div>`

    const avisoBloqueioHtml = comissaoTrabalhadorBloqueada && arr.some((r) => r.nTrabalhados > 0)
      ? `<div style="margin-top:8px;padding:6px 10px;background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.4);border-radius:6px;font-size:11px;color:#fca5a5;line-height:1.5">

        </div>`

    const tabela = porProm.size
      ? `<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr>
                <th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Promotor</th>
                <th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Pedidos</th>
                <th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Vendido</th>
                <th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Comissão</th>
              </tr>
            </thead>
            <tbody>${linhasProm}</tbody>
            <tfoot>
              <tr style="border-top:1px solid #334155">
                <td style="padding:6px 8px;color:#cbd5e1;font-weight:700">Total atribuído</td>
                <td style="padding:6px 8px;text-align:right;color:#94a3b8;font-variant-numeric:tabular-nums;font-weight:700">${arr.reduce((s,r)=>s+r.n,0)}</td>
                <td style="padding:6px 8px;text-align:right;color:#4ade80;font-variant-numeric:tabular-nums;font-weight:700">${fmt(arr.reduce((s,r)=>s+r.vendido,0))}</td>
                <td style="padding:6px 8px;text-align:right;color:#fbbf24;font-variant-numeric:tabular-nums;font-weight:700">${fmt(comTotal)}</td>

      : '';
    const regraNota = `<div style="margin-top:6px;font-size:10px;color:#64748b;line-height:1.4">Regra: promotores que estão a <strong style="color:#cbd5e1">trabalhar no turno</strong> (escalados + clock-in à hora do pedido) recebem <strong style="color:#fb923c">metade</strong> da comissão; a outra metade fica para a casa. Marcado com <span style="color:#fb923c;font-weight:700">½</span>.</div>`;
    return `
      <div class="pedidos-balcao-lista-turno" style="border-top:0;padding-top:0;margin-top:14px">
        <div style="font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px">🪙 Comissões do turno</div>
        ${tabela}
        ${avisoBloqueioHtml}
        ${regraNota}
        ${semPromHtml}
      </div>`;
  })();
  // Aba "Pedidos ao balcão": formulário POS + lista Pedidos do turno
  // (montados mais abaixo, depois de listHtml e dos resumos estarem prontos).
  // Aba "Caixa": Validação + Produtos vendidos + Comissões + Pedidos do turno.
  // Bloco de validação — lista as divergências detectadas entre stock,
  // balcão e próximo turno (mesma lógica da aba 🧪 Validação, em formato
  // de lista resumida).
  const resumoValidacaoHtml = (() => {
    const stocks = (S.turnoData && Array.isArray(S.turnoData.stock)) ? S.turnoData.stock : [];
    if (!stocks.length) return '';
    // Comparações só depois dos registos fechados: encontrados → vs turno
    // anterior; deixados → vs próximo turno e vendido vs balcão.
    const gates = compGatesForTurno(S.turnoData);
    if (!gates.enc) {
      return `
        <div class="pedidos-balcao-lista-turno" style="border-top:0;padding-top:0;margin-top:14px">
          <div style="font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px">🧪 Validação — diferenças detectadas</div>
          <div style="padding:8px 10px;background:#0b1322;border:1px dashed #334155;border-radius:6px;font-size:12px;color:#94a3b8">🔒 As comparações aparecem depois de fechares o <strong style="color:#cbd5e1">registo inicial de encontrados</strong> (aba Stock).</div>
        </div>`;
    }
    const balcaoMap = (typeof getVendasBalcaoPorProduto === 'function')
      ? getVendasBalcaoPorProduto()
      : {};
    const items = [];
    /** Converte uma quantidade em "nativo do stock" (kg para bebida por
     *  copo, unidades para os outros) para Kz, usando os preços do produto. */
    function valorKzPorDiff(s, diffNativo) {
      const preco = parseFloat(s.preco) || 0;
      if (!preco || !Number.isFinite(diffNativo)) return 0;
      const kgPorCopo = parseFloat(s.kg_por_copo) || 0;
      // Bebidas por copo: stock em kg → converter para copos antes de
      // multiplicar pelo preço do copo.
      if (s.venda_por_copo === true && kgPorCopo > 0) {
        const copos = diffNativo / kgPorCopo;
        return copos * preco;
      }
      return diffNativo * preco;
    }
    for (const s of stocks) {
      const pid = prodIdKey(s.produto_id);
      if (!pid) continue;
      const nome = s.produto_nome || 'Sem nome';
      const isPeso = s.tipo_medicao === 'peso';
      const tolKg = 0.001;
      const tolUn = 0.5;
      // Vendido (stock) — usa buffer editável (estado actual).
      const buf = (typeof stockBuf !== 'undefined' && stockBuf) ? stockBuf[pid] : null;
      const enc = buf ? buf.encontrado : s.encontrado;
      const ent = buf ? buf.entrada : s.entrada;
      const dei = buf ? buf.deixado : s.deixado;
      const vend = vendidoQtyFromStockParts(enc, ent, dei);
      const balcao = balcaoMap[pid] || null;
      const isCopo = balcao && balcao.isCopo;
      // 1) Vendido vs Balcão — precisa do Deixado final (registo fechado).
      if (gates.deix && Number.isFinite(vend) && balcao) {
        const balNativo = isCopo ? balcao.kg : balcao.unidades;
        const tol = (isPeso || isCopo) ? tolKg : tolUn;
        if (balNativo > 0) {
          const diff = vend - balNativo;
          if (Math.abs(diff) > tol) {
            const isFalta = diff > 0; // saiu stock a mais do que o balcão registou
            const cor = isFalta ? '#f87171' : '#fb923c';
            items.push({
              cor,
              tipo: isFalta ? 'falta' : 'sobra',
              campoKey: 'vend-balcao',
              tag: '📊 Stock',
              produto: nome,
              campo: 'Vendido vs Balcão',
              valor: `${isFalta ? '⚠ falta' : '↑ sobra'} ${fmtNum(Math.abs(diff))}`,
              valorKz: Math.abs(valorKzPorDiff(s, diff)),
              dica: isFalta
                ? `FALTA: saíram ${fmtNum(Math.abs(diff))} do stock sem registo no balcão (possível venda não registada, desperdício ou Deixado contado a menos).`
                : `SOBRA: o balcão registou ${fmtNum(Math.abs(diff))} a mais do que o stock indica (provável erro de contagem em Encontrado/Deixado).`
            });
          }
        }
      }
      // 2) Deixado vs Próx. Enc.
      const dNum = dei === null || dei === undefined || dei === '' ? NaN : parseFloat(dei);
      const nx = s.next_encontrado;
      if (gates.deix && Number.isFinite(dNum) && nx !== null && nx !== undefined) {
        const nxV = parseFloat(nx);
        const tol = isPeso ? tolKg : tolUn;
        const diff = nxV - dNum;
        if (Math.abs(diff) > tol) {
          const isFalta = diff < 0;
          const cor = isFalta ? '#f87171' : '#fb923c';
          items.push({
            cor,
            tipo: isFalta ? 'falta' : 'sobra',
            campoKey: 'deix-prox',
            tag: '🔁 Próximo turno',
            produto: nome,
            campo: 'Deixado vs Próx. Enc.',
            valor: `${isFalta ? '⚠ falta' : '↑ sobra'} ${fmtNum(Math.abs(diff))}`,
            valorKz: Math.abs(valorKzPorDiff(s, diff)),
            dica: isFalta
              ? `FALTA: o próximo turno encontrou ${fmtNum(Math.abs(diff))} a menos do que ficou deixado — sumiu stock entre turnos, possível erro de contagem.`
              : `SOBRA: o próximo turno encontrou ${fmtNum(Math.abs(diff))} a mais do que ficou deixado — entrou stock entre turnos?`
          });
        }
      }
      // 3) Deix. caixa vs Próx. Enc. caixa
      const deiCxRaw = buf ? buf.deixado_caixa : s.deixado_caixa;
      const dCx = deiCxRaw === null || deiCxRaw === undefined || deiCxRaw === '' ? NaN : parseFloat(deiCxRaw);
      const nxCx = s.next_encontrado_caixa;
      if (gates.deix && Number.isFinite(dCx) && nxCx !== null && nxCx !== undefined) {
        const nxVCx = parseFloat(nxCx);
        const diff = nxVCx - dCx;
        if (Math.abs(diff) > 0.5) {
          const isFalta = diff < 0;
          const cor = isFalta ? '#f87171' : '#fb923c';
          items.push({
            cor,
            tipo: isFalta ? 'falta' : 'sobra',
            campoKey: 'deixcx-prox',
            tag: '🏬 Armazém',
            produto: nome,
            campo: 'Deix. caixa vs Próx. Enc. caixa',
            valor: `${isFalta ? '⚠ falta' : '↑ sobra'} ${fmtNum(Math.abs(diff))} caixa${Math.abs(diff) === 1 ? '' : 's'}`,
            dica: isFalta
              ? `FALTA: o próximo turno encontrou ${fmtNum(Math.abs(diff))} caixa(s) a menos do que ficou deixado — sumiu entre turnos.`
              : `SOBRA: o próximo turno encontrou ${fmtNum(Math.abs(diff))} caixa(s) a mais do que ficou deixado — entrou stock entre turnos?`
          });
        }
      }
      // 4) Comparação com o turno anterior (falta/sobra no Encontrado).
      const comp = s.comparacao;
      if (comp && (comp.startsWith('falta') || comp.startsWith('sobra'))) {
        const isFalta = comp.startsWith('falta');
        const qtdComp = parseFloat(String(comp).replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
        const diffComp = isFalta ? -qtdComp : qtdComp;
        items.push({
          cor: isFalta ? '#f87171' : '#fb923c',
          tipo: isFalta ? 'falta' : 'sobra',
          campoKey: 'enc-ant',
          tag: '⬅ Turno anterior',
          produto: nome,
          campo: 'Encontrado vs Deixado anterior',
          valor: `${isFalta ? '⚠' : '↑'} ${comp}`,
          valorKz: Math.abs(valorKzPorDiff(s, diffComp)),
          dica: isFalta
            ? 'Encontrado está abaixo do Deixado do turno anterior — possível falta.'
            : 'Encontrado está acima do Deixado do turno anterior — possível sobra ou reposição não registada.'
        });
      }
      // 5) Comparação caixa com o turno anterior.
      const compCx = s.comparacao_caixa;
      if (compCx && (compCx.startsWith('falta') || compCx.startsWith('sobra'))) {
        const isFalta = compCx.startsWith('falta');
        items.push({
          cor: isFalta ? '#f87171' : '#fb923c',
          tipo: isFalta ? 'falta' : 'sobra',
          campoKey: 'enccx-ant',
          tag: '⬅ Armazém anterior',
          produto: nome,
          campo: 'Enc. caixa vs Deix. caixa anterior',
          valor: `${isFalta ? '⚠' : '↑'} ${compCx}`,
          dica: isFalta
            ? 'Caixas encontradas abaixo do que ficou no turno anterior.'
            : 'Caixas encontradas acima do que ficou no turno anterior.'
        });
      }
    }
    const titulo = `<div style="font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px">🧪 Validação — diferenças detectadas</div>`;
    const notaDeix = !gates.deix
      ? `<div style="margin-top:8px;padding:6px 10px;background:#0b1322;border:1px dashed #334155;border-radius:6px;font-size:11px;color:#94a3b8">🔒 As comparações dos <strong style="color:#cbd5e1">deixados</strong> (próx. turno, vendido vs balcão) aparecem depois de fechares o registo dos deixados.</div>`
      : '';
    if (!items.length) {
      return `
        <div class="pedidos-balcao-lista-turno" style="border-top:0;padding-top:0;margin-top:14px">
          ${titulo}
          <div style="padding:8px 10px;background:#0b1322;border:1px dashed #334155;border-radius:6px;font-size:12px;color:#86efac">✓ Nenhuma divergência detectada.</div>
          ${notaDeix}
        </div>`;
    }
    const renderLinha = (it) => {
      const kz = parseFloat(it.valorKz) || 0;
      const kzTxt = kz > 0 ? `<span style="color:${it.cor};font-weight:700">${fmt(kz)}</span>` : '<span style="color:#475569">—</span>';
      return `
      <tr title="${escapeHtml(it.dica)}" data-dif-row="${it.campoKey}" data-dif-tipo="${it.tipo}" data-dif-kz="${kz}">
        <td style="padding:5px 8px;color:#64748b;font-size:11px;white-space:nowrap">${it.tag}</td>
        <td style="padding:5px 8px;color:#e2e8f0">${escapeHtml(it.produto)}</td>
        <td style="padding:5px 8px;color:#94a3b8;font-size:11px">${escapeHtml(it.campo)}</td>
        <td style="padding:5px 8px;text-align:right;color:${it.cor};font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums">${escapeHtml(it.valor)}</td>
        <td style="padding:5px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">${kzTxt}</td>
      </tr>`;
    };
    // Secções separadas: primeiro as FALTAS (vermelho), depois as SOBRAS
    // (laranja), cada uma com o seu total estimado em Kz.
    const grupoHtml = (tipo, tituloGrupo, corGrupo) => {
      const list = items.filter((it) => it.tipo === tipo);
      if (!list.length) return '';
      const totKz = list.reduce((s2, it) => s2 + (parseFloat(it.valorKz) || 0), 0);
      const totRow = `<tr style="border-top:1px solid #334155${totKz > 0 ? '' : ';display:none'}" data-dif-total="${tipo}">
            <td colspan="4" style="padding:6px 8px;color:#cbd5e1;font-weight:700;text-align:right">Total ${tipo === 'falta' ? 'faltas' : 'sobras'}</td>
            <td style="padding:6px 8px;text-align:right;color:${corGrupo};font-weight:700;font-variant-numeric:tabular-nums"><span data-dif-kz-val>${fmt(totKz)}</span></td>
          </tr>`;
      return `
        <tr data-dif-grupo="${tipo}"><td colspan="5" style="padding:8px;background:#0f172a;color:${corGrupo};font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">${tituloGrupo} (<span data-dif-count>${list.length}</span>)</td></tr>
        ${list.map(renderLinha).join('')}
        ${totRow}`;
    };
    const linhasHtml = grupoHtml('falta', '⚠ Faltas', '#f87171') + grupoHtml('sobra', '↑ Sobras', '#fb923c');
    // Chips de filtro por campo (só os campos com divergências neste turno).
    const CAMPO_DEFS = [
      { key: 'vend-balcao', label: 'Vendido vs Balcão' },
      { key: 'enc-ant', label: 'Enc. vs Deix. anterior' },
      { key: 'deix-prox', label: 'Deixado vs Próx. Enc.' },
      { key: 'enccx-ant', label: 'Enc. caixa vs anterior' },
      { key: 'deixcx-prox', label: 'Deix. caixa vs Próx.' }
    ];
    const countByKey = {};
    items.forEach((it) => { countByKey[it.campoKey] = (countByKey[it.campoKey] || 0) + 1; });
    const chipsHtml = CAMPO_DEFS
      .filter((c) => countByKey[c.key])
      .map((c) => {
        const fixo = DIF_CAMPOS_FIXOS.includes(c.key);
        return `<button type="button" data-dif-campo="${c.key}" ${fixo ? 'style="cursor:default;opacity:.95" title="Sempre activo"' : `onclick="difCampoFiltroToggle(this)" title="Mostrar/esconder ${escapeHtml(c.label)}"`}>${escapeHtml(c.label)} (${countByKey[c.key]})</button>`;
      })
      .join('');
    return `
      <div class="pedidos-balcao-lista-turno" style="border-top:0;padding-top:0;margin-top:14px" id="dif-detectadas-wrap">
        ${titulo}
        <div class="pedidos-balcao-filters" style="margin:0 0 8px">${chipsHtml}</div>
        <div style="overflow-x:auto;-webkit-overflow-scrolling:touch">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr>
                <th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Fonte</th>
                <th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Produto</th>
                <th style="text-align:left;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Campo</th>
                <th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em">Diferença</th>
                <th style="text-align:right;padding:6px 8px;color:#94a3b8;font-size:11px;text-transform:uppercase;letter-spacing:.04em" title="Valor estimado em Kz da diferença (preço × diff). Caixas/fardos não têm preço unitário, ficam «—».">Valor (Kz)</th>
              </tr>
            </thead>
            <tbody>${linhasHtml}</tbody>
          </table>
        </div>
        <div id="dif-detectadas-vazio" style="display:none;padding:8px 10px;background:#0b1322;border:1px dashed #334155;border-radius:6px;font-size:12px;color:#94a3b8">Nenhuma divergência nos campos seleccionados.</div>
        <div style="margin-top:6px;font-size:10px;color:#64748b;line-height:1.4">${items.length} divergência${items.length === 1 ? '' : 's'} — toca nos filtros para escolher os campos; passa o rato em cada linha para ler a explicação.</div>
        ${notaDeix}
      </div>`;
  })();
  // Aba "Pedidos ao balcão": lista Pedidos do turno por baixo do POS.
  mount.innerHTML = formHtml +
    `<div class="pedidos-balcao-lista-turno" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 8px"><div style="font-size:0.75rem;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.05em">Pedidos do turno (${pedidos.length})</div><button type="button" id="ver-pedidos-turno-btn" class="btn btn-ghost btn-sm" onclick="togglePedidosTurnoLista()">Mostrar pedidos do turno</button></div><div id="pedidos-turno-lista" style="display:none">${listHtml}</div></div>`;
  // Aba "Caixa": Produtos vendidos + Comissões.
  const resumoMount = document.getElementById('pedidos-resumo-mount');
  if (resumoMount) {
    const semDados = !resumoProdutosHtml && !resumoComissoesHtml;
    resumoMount.innerHTML = semDados
      ? '<span style="color:#64748b">Ainda não há pedidos neste turno.</span>'
      : resumoProdutosHtml + resumoComissoesHtml;
  }
  // Aba "⚠️ Diferenças": bloco Validação — diferenças detectadas.
  const difMount = document.getElementById('dif-validacao-mount');
  if (difMount) {
    difMount.innerHTML = resumoValidacaoHtml || '<span style="color:#64748b">Sem dados de validação neste turno.</span>';
    try { difCampoFiltroApply(); } catch (_) {}
  }
  pedidoBalcaoSyncDraftUI();
  pedidoBalcaoLogoRefreshUI();
  renderPedidosOfflineBanner();
  aquecerCacheOffline();
  if (pedidosOfflineLer().length) sincronizarPedidosOffline().catch(() => {});
  if (canEdit) { pedidoBalcaoLoadPromotores().catch(() => {}); }
}

/** Cache local (stale-while-revalidate) para acelerar o POS: o catálogo de
 *  produtos traz as imagens em base64 dentro do JSON (centenas de KB) e a
 *  popularidade agrega todos os pedidos de sempre — nenhum dos dois muda a
 *  cada minuto. 1º render usa o cache do dispositivo; a rede actualiza em
 *  fundo e re-renderiza só se algo mudou. */
function posCacheRead(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || 'null');
    return v && Array.isArray(v.data) ? v.data : null;
  } catch (_) {
    return null;
  }
}
function posCacheWrite(key, data) {
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), data })); } catch (_) {}
}

async function loadVendasMenu(turnoId, canEdit, opts) {
  try {
    const PRODS_KEY = 'stockos.cache.produtosPos';
    const POP_KEY = 'stockos.cache.popularidade';
    // Produtos: usa preload (refresh em fundo) → cache → rede.
    let prodsPromise;
    if (opts && Array.isArray(opts.produtosPreload)) {
      prodsPromise = Promise.resolve(opts.produtosPreload);
    } else {
      const cachedProds = posCacheRead(PRODS_KEY);
      const freshProds = api('GET', '/produtos?todos=0').then((data) => {
        const mudou = !cachedProds || JSON.stringify(data) !== JSON.stringify(cachedProds);
        posCacheWrite(PRODS_KEY, data);
        // Cache desactualizado → re-render silencioso com os dados novos.
        if (cachedProds && mudou && S.page === 'turno' && String(S.turnoData?.id) === String(turnoId)) {
          loadVendasMenu(turnoId, canEdit, { produtosPreload: data }).catch(() => {});
        }
        return data;
      });
      prodsPromise = cachedProds ? Promise.resolve(cachedProds) : freshProds;
      if (cachedProds) freshProds.catch(() => {});
    }
    // Popularidade: cache imediato; rede actualiza para a próxima abertura
    // (só afecta a ordem dos tiles — não justifica esperar nem re-render).
    const cachedPop = posCacheRead(POP_KEY);
    const freshPop = api('GET', '/pedidos/popularidade')
      .then((d) => { posCacheWrite(POP_KEY, d); return d; })
      .catch(() => (cachedPop || []));
    const popPromise = cachedPop ? Promise.resolve(cachedPop) : freshPop;
    if (cachedPop) freshPop.catch(() => {});

    const [prods, vendas, todasReceitas, popularidade] = await Promise.all([
      prodsPromise,
      api('GET', `/turnos/${turnoId}/vendas`),
      api('GET', '/receitas'),
      popPromise
    ]);
    lastVendasApiRows = Array.isArray(vendas) ? vendas : [];
    // Mapa produto_id → total pedido (todos os turnos), para ordenar os tiles.
    pedidoPopularidade = {};
    (Array.isArray(popularidade) ? popularidade : []).forEach((p) => {
      const k = prodIdKey(p.produto_id);
      if (k) pedidoPopularidade[k] = parseFloat(p.total_qtd) || 0;
    });
    const menuProds   = prods.filter(p => p.categoria === 'menu');
    const bebidaProds = prods.filter(p => p.categoria === 'bebida').filter((p) => !isFinoBarrilNome(p.nome));
    const avulsoProds = prods.filter(p => p.venda_avulso && p.categoria !== 'menu' && p.categoria !== 'bebida');
    vendasProdNomes = {};
    prods.forEach((p) => {
      const id = prodIdKey(p.id);
      if (id) vendasProdNomes[id] = p.nome;
    });
    vendasBuf = {};
    vendas.forEach((v) => {
      const pid = prodIdKey(v.produto_id);
      if (!pid) return;
      vendasBuf[pid] = parseFloat(v.quantidade);
      if (v.produto_nome) vendasProdNomes[pid] = v.produto_nome;
    });

    receitasBuf = {};
    todasReceitas.forEach((r) => {
      const mk = prodIdKey(r.produto_id);
      if (!mk) return;
      if (!receitasBuf[mk]) receitasBuf[mk] = [];
      receitasBuf[mk].push({ componente_id: r.componente_id, quantidade: parseFloat(r.quantidade) });
    });

    avulsoProdIds = avulsoProds.map(p => p.id);

    if (!menuProds.length && !bebidaProds.length && !avulsoProds.length) {
      show('vendas-menu-list', '<span style="color:#64748b">Nenhum produto de menu configurado. Adicione produtos com categoria "Menu".</span>');
      await renderPedidosBalcao(turnoId, canEdit, []);
      return;
    }

    const groupHeader = label => `<div style="font-weight:600;color:#64748b;font-size:0.8rem;text-transform:uppercase;letter-spacing:.05em;margin:12px 0 6px">${label}</div>`;

    vendasProdPrecos = {};
    [...menuProds, ...avulsoProds, ...bebidaProds].forEach(p => {
      vendasProdPrecos[p.id] = parseFloat(p.preco) || 0;
    });
    vendas.forEach((v) => {
      const pid = prodIdKey(v.produto_id);
      if (!pid || v.preco == null || v.preco === '') return;
      const u = parseFloat(v.preco) || 0;
      vendasProdPrecos[pid] = u;
      vendasProdPrecos[v.produto_id] = u;
    });

    const btnStyle = 'width:28px;height:28px;border-radius:6px;border:none;font-size:1.1rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;';

    bebidaCopoCfg = {};
    const bebidaCopoProds = bebidaProds.filter(
      (p) => p.venda_por_copo && parseFloat(p.kg_por_copo) > 0
    );
    const bebidaOutras = bebidaProds.filter(
      (p) => !(p.venda_por_copo && parseFloat(p.kg_por_copo) > 0)
    );
    bebidaCopoProdIds = bebidaCopoProds.map((p) => p.id);
    bebidaProdIds = bebidaOutras.map((p) => p.id);
    bebidaCopoProds.forEach((p) => {
      bebidaCopoCfg[p.id] = {
        nome: nomeVendaBebidaLegivel(String(p.id), p.nome),
        kgPorCopo: parseFloat(p.kg_por_copo) || 0,
        preco: parseFloat(p.preco) || 0,
        qtdPacote: parseInt(p.qtd_copos_pacote, 10) || 0,
        precoPacote: parseFloat(p.preco_copos_pacote) || 0
      };
    });

    menuProdIds = menuProds.map(p => p.id);
    const menuRows = menuProds.map(p => {
      const qty = vendasBuf[prodIdKey(p.id)] || 0;
      const precoEf = (vendasProdPrecos[prodIdKey(p.id)] ?? parseFloat(p.preco)) || 0;
      const qtyCtrl = canEdit
        ? `<input type="number" min="0" step="1" inputmode="numeric" autocomplete="off" class="venda-qty-input" id="venda-qty-${p.id}" data-venda-pid="${p.id}" data-venda-turno="${turnoId}" value="${qty}" onblur="vendaQtyInputBlur(this)"/>`
        : `<span id="venda-qty-${p.id}" style="min-width:28px;text-align:center;font-weight:700">${qty}</span>`;
      return `<div class="produto-row">
        <div class="produto-info"><div class="produto-nome">${p.nome}</div>
          ${precoEf > 0 ? `<div class="produto-meta">${fmt(precoEf)}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:2px">${qtyCtrl}</div>
      </div>`;
    }).join('');

    bebidaProdPrecos = {};
    bebidaOutras.forEach((p) => {
      bebidaProdPrecos[p.id] = parseFloat(p.preco) || 0;
    });
    const bebidaCopoRows = bebidaCopoProds.map((p) => {
      const cfg = bebidaCopoCfg[p.id];
      const copos = vendasBuf[p.id] || 0;
      const kgStock = (() => {
        const b = stockBuf[p.id] || { encontrado:0, entrada:0, deixado:0 };
        return Math.max(0, b.encontrado + b.entrada - b.deixado);
      })();
      const precoLinha =
        cfg.qtdPacote >= 2 && cfg.precoPacote > 0
          ? `${fmt(cfg.preco)}/copo · ${cfg.qtdPacote} copos ${fmt(cfg.precoPacote)}`
          : `${fmt(cfg.preco)}/copo`;
      const copoCtrl = canEdit
