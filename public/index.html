<!DOCTYPE html>
<html lang="pt" data-stockos-ui="2026-05-16-print-fix-spaces">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<title>StockOS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;width:100%}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;width:100%;position:relative}
#env-banner{position:fixed;top:0;left:0;right:0;z-index:9999;text-align:center;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 0;display:none}
body.env-develop #env-banner{display:block;background:#d97706;color:#fff}
body.env-qualidade #env-banner{display:block;background:#7c3aed;color:#fff}
body.env-develop #app,body.env-qualidade #app{padding-top:22px}
input,select,button,textarea{font-family:inherit}

/* Layout */
#app{display:flex;flex-direction:column;min-height:100vh}
#content{flex:1;padding:16px;padding-bottom:80px;max-width:900px;margin:0 auto;width:100%}
#navbar{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;display:flex;z-index:100}
.nav-btn{flex:1;padding:12px 4px;background:none;border:none;color:#94a3b8;cursor:pointer;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s}
.nav-btn.active{color:#3b82f6}
.nav-btn svg{width:22px;height:22px}

/* Header */
#header{background:#1e293b;border-bottom:1px solid #334155;padding:12px 16px 12px 58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
#header h1{font-size:18px;font-weight:700;color:#f1f5f9}
.header-sub{font-size:12px;color:#64748b}

/* Botão de menu (hamburger) + drawer lateral */
body:not(.has-auth) #menu-toggle,body:not(.has-auth) #menu-drawer,body:not(.has-auth) #menu-overlay{display:none!important}
#menu-toggle{position:fixed;top:10px;left:10px;z-index:60;width:40px;height:40px;border-radius:10px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;box-shadow:0 2px 6px rgba(0,0,0,0.3)}
#menu-toggle:hover{background:#1e293b;border-color:#475569}
#menu-toggle svg{width:20px;height:20px}
body.env-develop #menu-toggle,body.env-qualidade #menu-toggle{top:32px}
#menu-overlay{position:fixed;inset:0;background:rgba(2,6,23,0.55);z-index:190;opacity:0;pointer-events:none;transition:opacity .18s}
#menu-drawer{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:85vw;background:#0f172a;border-right:1px solid #334155;z-index:200;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s ease;box-shadow:6px 0 18px rgba(0,0,0,0.35)}
body.menu-open #menu-overlay{opacity:1;pointer-events:auto}
body.menu-open #menu-drawer{transform:translateX(0)}
body.menu-open{overflow:hidden}
.menu-header{padding:16px 16px 12px;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu-header-title{font-size:15px;font-weight:700;color:#f1f5f9}
.menu-header-sub{font-size:11px;color:#64748b;margin-top:2px}
.menu-close{background:none;border:none;color:#94a3b8;font-size:22px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.menu-close:hover{color:#e2e8f0;background:#1e293b}
.menu-items{flex:1;overflow-y:auto;padding:8px}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:2px;background:none;border:none;color:#cbd5e1;font-size:14px;border-radius:8px;cursor:pointer;text-align:left;transition:.15s}
.menu-item:hover{background:#1e293b;color:#f1f5f9}
.menu-item.active{background:rgba(59,130,246,0.14);color:#93c5fd}
.menu-item svg{width:20px;height:20px;flex-shrink:0}
.menu-item.menu-item-logout{color:#f87171;margin-top:8px;border-top:1px solid #334155;border-radius:0;padding-top:14px}
.menu-item.menu-item-logout:hover{background:rgba(239,68,68,0.08);color:#fca5a5}

/* Cards */
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;border:none;cursor:pointer;font-size:14px;font-weight:600;transition:.2s}
.btn:disabled{opacity:.5;cursor:default}
button.is-action-busy{cursor:wait!important}
.date-nav button:disabled{opacity:.55;cursor:wait}
.turno-card.is-action-busy,.js-busy-click.is-action-busy{cursor:wait;position:relative}
.turno-card.is-action-busy::after,.js-busy-click.is-action-busy::after{
  content:'A processar…';
  position:absolute;inset:auto 8px 8px 8px;font-size:11px;font-weight:600;color:#94a3b8;
  text-align:center;padding:4px 8px;background:rgba(15,23,42,.92);border-radius:6px;border:1px solid #334155
}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover:not(:disabled){background:#2563eb}
.btn-success{background:#22c55e;color:#fff}
.btn-success:hover:not(:disabled){background:#16a34a}
.btn-danger{background:#ef4444;color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-ghost{background:#334155;color:#e2e8f0}
.btn-ghost:hover:not(:disabled){background:#475569}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-full{width:100%}

/* Inputs */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#94a3b8;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px 12px;color:#f1f5f9;font-size:14px}
.field textarea{min-height:72px;resize:vertical;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:#3b82f6}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:#14532d;color:#4ade80}
.badge-red{background:#450a0a;color:#f87171}
.badge-amber{background:#451a03;color:#fb923c}
.badge-blue{background:#172554;color:#60a5fa}
.badge-grey{background:#1e293b;color:#64748b}

/* Turno cards */
.turno-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media(max-width:500px){.turno-cards{grid-template-columns:1fr}}
.turno-card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;cursor:pointer;transition:.2s}
.turno-card:hover{border-color:#3b82f6;background:#172554}
.turno-card.aberto{border-color:#22c55e}
.turno-card.turno-card--antecipado.aberto{border-color:#d97706}
.turno-card.fechado{border-color:#475569;opacity:.8}
.turno-card.turno-card--locked{cursor:not-allowed;opacity:.85}
.turno-card.turno-card--locked:hover{border-color:#334155;background:#1e293b}
.turno-card-nome{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#94a3b8;margin-bottom:6px}
.turno-card-status{margin-bottom:8px}
.turno-card-value{font-size:20px;font-weight:700;color:#f1f5f9}
.turno-card-label{font-size:11px;color:#64748b}
.turno-card-abrir{margin-top:10px}

/* Áreas de trabalho (referência por turno) */
.turno-areas-card{margin-bottom:16px}
.turno-areas-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:900px){.turno-areas-grid{grid-template-columns:1fr}}
.turno-area{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;background:#0f172a;border:1px solid #334155;border-radius:8px;font-size:12px;line-height:1.45;color:#cbd5e1}
.turno-area-num{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:rgba(59,130,246,0.22);color:#93c5fd;font-size:11px;font-weight:700}
.turno-area-body{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.turno-area-label{color:#cbd5e1}
.turno-area-people{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.turno-area-person{display:inline-block;padding:2px 8px;border-radius:999px;background:rgba(96,165,250,0.12);border:1px solid rgba(96,165,250,0.25);color:#bfdbfe;font-size:11px;font-weight:600;line-height:1.4}
.turno-area-empty{color:#475569;font-size:11px;font-style:italic}
.turno-area-origem{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;white-space:normal;word-break:break-word;overflow-wrap:anywhere;line-height:1.35}

/* Tabela de stock */
.table-wrap{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 180px);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:580px}
th{background:#0f172a;color:#64748b;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;text-align:left;position:sticky;top:0}
th:first-child{left:0;z-index:2}
td{padding:6px 10px;border-bottom:1px solid #1e293b}
tr:hover td{background:#1e293b}
.td-name{position:sticky;left:0;background:#0f172a;z-index:1;vertical-align:middle;padding-top:8px;padding-bottom:8px}
.td-name .stock-prod-nome{font-weight:500;line-height:1.25;white-space:nowrap;color:#f1f5f9}
.td-name .stock-prod-meta{font-size:11px;color:#64748b;font-weight:400;line-height:1.2;margin-top:3px;white-space:nowrap}
tr:hover .td-name{background:#1e293b}
tr:hover .td-name .stock-prod-nome{color:#f1f5f9}
#tab-stock tbody tr.stock-row--active td{background:rgba(59,130,246,.1)}
#tab-stock tbody tr.stock-row--active .td-name{background:rgba(30,64,175,.28)}
#tab-stock tbody tr.stock-row--active .td-name .stock-prod-nome{color:#e0f2fe}
#tab-stock tbody tr.stock-row--active td:first-child{box-shadow:inset 3px 0 0 #3b82f6}
#tab-stock tbody tr.stock-row--active:hover td{background:rgba(59,130,246,.14)}
#tab-stock tbody tr.stock-row--active:hover .td-name{background:rgba(30,64,175,.34)}
.section-header{position:sticky;left:0}
.td-cat{font-size:10px;color:#64748b}
.td-input{width:90px;text-align:right}
.td-input input{width:65px;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:5px 6px;color:#f1f5f9;font-size:13px;text-align:right}
.td-input input:focus{outline:none;border-color:#3b82f6}
.td-calc{color:#94a3b8;text-align:right;font-variant-numeric:tabular-nums}
.entradas-form{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.entradas-tipo-toggle{display:flex;border-radius:8px;overflow:hidden;border:1px solid #334155}
.tipo-btn{background:#0f172a;border:none;color:#94a3b8;padding:7px 14px;font-size:13px;cursor:pointer;font-weight:600}
.tipo-btn-active,.tipo-btn-active-green{background:#14532d;color:#4ade80}
.tipo-btn-active-red{background:#450a0a;color:#f87171}
.tipo-btn-active-orange{background:#431407;color:#fb923c}
.entradas-select{flex:1.5;min-width:140px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;color:#f1f5f9;font-size:13px}
.entradas-qty{width:80px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;color:#f1f5f9;font-size:13px;text-align:right}
.entradas-notas{flex:2;min-width:120px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:8px 10px;color:#f1f5f9;font-size:13px}
.comp-falta{color:#f87171;font-size:12px}
.comp-sobra{color:#fb923c;font-size:12px}
.comp-null{color:#334155;font-size:12px}
.section-header{background:#0f172a;color:#3b82f6;font-size:11px;font-weight:700;text-transform:uppercase;padding:6px 10px;letter-spacing:.5px}

/* Caixa grid */
.caixa-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:400px){.caixa-grid{grid-template-columns:1fr}}
.caixa-item label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
.caixa-item input{width:100%;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:9px 12px;color:#f1f5f9;font-size:16px;text-align:right}
.caixa-item input:focus{outline:none;border-color:#3b82f6}
.caixa-total{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid #334155}
.caixa-total-label{font-size:13px;color:#94a3b8}
.caixa-total-value{font-size:18px;font-weight:700;color:#4ade80}

/* Dashboard totals */
.total-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:400px){.total-grid{grid-template-columns:1fr}}
.total-item{background:#0f172a;border-radius:8px;padding:12px}
.total-item-label{font-size:11px;color:#64748b;margin-bottom:4px}
.total-item-value{font-size:20px;font-weight:700;color:#f1f5f9}

/* Date nav */
.date-nav{display:flex;align-items:center;gap:10px;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px 12px;margin-bottom:16px}
.date-nav button{background:none;border:none;color:#94a3b8;cursor:pointer;padding:2px 6px;font-size:18px;border-radius:4px}
.date-nav button:hover{background:#334155;color:#f1f5f9}
.date-nav > span{flex:1;min-width:0;text-align:center;font-weight:600;font-size:15px}
#date-label{display:block;line-height:1.35;white-space:normal;word-break:break-word}

/* Login */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-box{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px;width:100%;max-width:380px}
.login-logo{font-size:28px;font-weight:800;color:#3b82f6;margin-bottom:4px}
.login-sub{color:#64748b;font-size:14px;margin-bottom:28px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:center;justify-content:center}
.modal{background:#1e293b;border-radius:16px;width:90%;max-width:600px;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:#64748b;cursor:pointer;font-size:22px;line-height:1}

/* Setup */

/* Produto list */
.produto-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #334155}
.produto-row:last-child{border-bottom:none}
.produto-info{flex:1}
.produto-nome{font-size:14px;font-weight:500}
.produto-meta{font-size:12px;color:#64748b}
.produto-actions{display:flex;gap:6px}

/* Vendas (turno): grid em vez de CSS columns — evita sobreposição com linhas altas (bebidas por copo) */
.vendas-menu-2col{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:16px;
  align-items:start;
}
.vendas-menu-2col .produto-row{
  align-items:flex-start;
  min-width:0;
}
@media(max-width:540px){
  .vendas-menu-2col{grid-template-columns:1fr}
}

/* Pedidos ao balcão — layout tipo POS (grelha + painel lateral) */
.pedidos-balcao-pos{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(260px,300px);
  gap:14px;
  align-items:start;
  width:100%;
  max-width:min(1180px,100%);
}
@media(max-width:900px){
  .pedidos-balcao-pos{grid-template-columns:1fr}
}
.pedidos-balcao-tiles-wrap{
  background:linear-gradient(165deg,#0a1628 0%,#1a3a5c 42%,#0f172a 100%);
  border-radius:12px;
  padding:12px 10px 14px;
  border:1px solid #1e3a5f;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
  min-width:0;
}
.pedidos-balcao-filters{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:12px;
}
.pedidos-balcao-filters button{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid #334155;
  background:#0f172a;
  color:#cbd5e1;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.pedidos-balcao-filters button:hover{border-color:#475569;background:#1e293b}
.pedidos-balcao-filters button.pedido-filter--on{
  background:#0ea5e9;
  border-color:#38bdf8;
  color:#0f172a;
}
.pedidos-balcao-tiles{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}
@media(max-width:720px){
  .pedidos-balcao-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:400px){
  .pedidos-balcao-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.pedido-prod-tile{
  min-height:92px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(30,64,120,.55) 0%,rgba(15,23,42,.92) 100%);
  padding:8px 5px 10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  text-align:center;
  cursor:pointer;
  transition:transform .1s,border-color .12s,box-shadow .12s;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}
.pedido-prod-tile:hover{
  transform:translateY(-1px);
  border-color:rgba(56,189,248,.65);
  box-shadow:0 4px 14px rgba(0,0,0,.25);
}
.pedido-prod-tile:active{transform:translateY(0)}
.pedido-prod-tile.pedido-tile--hidden{display:none}
.pedido-prod-tile__emoji{font-size:26px;line-height:1;margin-bottom:5px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pedido-prod-tile__nome{
  font-size:11px;
  font-weight:600;
  color:#f8fafc;
  line-height:1.2;
  max-height:3.6em;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
}
.pedido-prod-tile__preco{font-size:10px;color:#94a3b8;margin-top:5px;font-weight:500}
.pedidos-balcao-side{
  background:#0f172a;
  border:1px solid #334155;
  border-radius:12px;
  padding:12px;
  position:sticky;
  top:6px;
  min-width:0;
}
.pedidos-balcao-side .pedido-side-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.pedido-draft-table-wrap{
  max-height:min(42vh,320px);
  overflow:auto;
  border:1px solid #334155;
  border-radius:8px;
  margin-bottom:10px;
}
.pedido-draft-table-wrap table{width:100%;border-collapse:collapse;font-size:12px}
.pedido-draft-table-wrap th,.pedido-draft-table-wrap td{padding:6px 8px;border-bottom:1px solid #1e293b;text-align:left}
.pedido-draft-table-wrap th{background:#1e293b;color:#94a3b8;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.pedido-draft-table-wrap td:last-child,.pedido-draft-table-wrap th:last-child{text-align:center;width:36px}
.pedido-draft-qty{
  width:52px;
  text-align:right;
  padding:4px 6px;
  border-radius:6px;
  border:1px solid #334155;
  background:#0f172a;
  color:#e2e8f0;
  font-size:12px;
  font-weight:600;
}
.pedido-total-bar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 12px;
  background:linear-gradient(90deg,#0369a1,#0ea5e9);
  border-radius:8px;
  margin-bottom:10px;
  font-weight:800;
  font-size:15px;
  color:#fff;
  letter-spacing:.02em;
}
.pedido-keypad{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-top:8px;
}
.pedido-keypad button{
  padding:9px 0;
  font-size:15px;
  font-weight:700;
  border-radius:8px;
  border:1px solid #0284c7;
  background:#0ea5e9;
  color:#fff;
  cursor:pointer;
  transition:filter .1s;
}
.pedido-keypad button:hover{filter:brightness(1.08)}
.pedido-keypad button:active{filter:brightness(.92)}

<script>
(function(){
  var h = location.hostname;
  var banner = document.getElementById('env-banner');
  function setEnvBanner(env, detail) {
    document.body.classList.remove('env-develop','env-qualidade');
    if (!env) {
      banner.textContent = '';
      banner.removeAttribute('title');
      return;
    }
    document.body.classList.add('env-' + env);
    if (env === 'develop') {
      banner.textContent = '⚠ Ambiente de Desenvolvimento' + (detail ? ' · ' + detail : '');
    } else {
      banner.textContent = '🔵 Ambiente de Qualidade' + (detail ? ' · ' + detail : '');
    }
  }
  if (h.includes('localhost')) setEnvBanner('develop', 'local');
  else if (h.includes('develop')) setEnvBanner('develop');
  else if (h.includes('qualidade')) setEnvBanner('qualidade');

  fetch('/api/health', { cache: 'no-store' })
    .then(function (r) { return r.json().catch(function () { return {}; }); })
    .then(function (d) {
      if (!d || typeof d !== 'object') return;
      if (d.develop_only) {
        setEnvBanner('develop', d.build || '');
        if (d.build) banner.setAttribute('title', 'Build API: ' + d.build + ' · /api/dev/info');
        return;
      }
      if (d.tier === 'qualidade' || (d.read_only && d.tier !== 'production')) {
        setEnvBanner('qualidade');
        return;
      }
      if (!h.includes('localhost') && !h.includes('develop') && !h.includes('qualidade')) {
        setEnvBanner(null);
      }
    })
    .catch(function () {});
})();
</script>

<script>
// ── STATE ─────────────────────────────────────────────────────
function _lsGet(k) {
  try {
    return localStorage.getItem(k);
  } catch (_) {
    return null;
  }
}
function _parseUserLs() {
  try {
    const raw = _lsGet('user');
    if (!raw || raw === 'null') return null;
    return JSON.parse(raw);
  } catch (_) {
    return null;
  }
}
const S = {
  token: _lsGet('token') || null,
  user: _parseUserLs(),
  page: 'dia',
  date: new Date().toISOString().split('T')[0],
  turnoId: null,
  turnoData: null,
  turnoCanEdit: false,
  /** Aba ativa do turno (persistida ao mudar de turno). */
  turnoTab: 'stock',
  produtos: [],
  utilizadores: [],
  turnosDia: [],
  /** YYYY-MM do mês visível na página Calendário */
  calYM: null,
  /** Contador de avisos «em falta» pendentes, para o badge do menu. */
  faltasPendentes: 0
};

/** localStorage: sobrevive a F5 e nova aba no mesmo domínio (sessionStorage falhava em alguns browsers / modos). */
const UI_STATE_KEYS = { page: 'stockos_page', date: 'stockos_date', turnoId: 'stockos_turnoId', calYM: 'stockos_calYM', turnoTab: 'stockos_turnoTab' };
const ALLOWED_TURNO_TABS = ['stock', 'vendas', 'pedidos', 'registos', 'escala'];
const ALLOWED_PAGES = ['dia', 'calendario', 'depositos', 'turno', 'historico', 'irregularidades', 'assiduidade', 'armazem', 'produtos', 'fornecedores', 'escala', 'admin', 'auditoria'];

function _storageGet(key) {
  try {
    return localStorage.getItem(key) || sessionStorage.getItem(key);
  } catch (_) {
    return null;
  }
}
function _storageSet(key, val) {
  try {
    if (val == null || val === '') localStorage.removeItem(key);
    else localStorage.setItem(key, val);
  } catch (_) {}
  try {
    sessionStorage.removeItem(key);
  } catch (_) {}
}

(function restoreSessionUi() {
  try {
    const hashRaw = typeof location !== 'undefined' && location.hash ? String(location.hash).replace(/^#/, '').trim() : '';
    if (hashRaw) {
      const p = decodeURIComponent(hashRaw.split(/[/?]/)[0]).trim();
      if (p && ALLOWED_PAGES.includes(p)) S.page = p;
    } else {
      const p = _storageGet(UI_STATE_KEYS.page);
      if (p && ALLOWED_PAGES.includes(p)) S.page = p;
    }
    const d = _storageGet(UI_STATE_KEYS.date);
    const tid = _storageGet(UI_STATE_KEYS.turnoId);
    const cy = _storageGet(UI_STATE_KEYS.calYM);
    const tt = _storageGet(UI_STATE_KEYS.turnoTab);
    if (d && /^\d{4}-\d{2}-\d{2}$/.test(d)) S.date = d;
    if (S.page === 'turno' && tid) S.turnoId = tid;
    if (cy && /^\d{4}-\d{2}$/.test(cy)) S.calYM = cy;
    if (tt && ALLOWED_TURNO_TABS.includes(tt)) S.turnoTab = tt;
  } catch (_) {}
})();

function syncUrlHashToPage() {
  try {
    if (!S.token || typeof history === 'undefined' || !history.replaceState) return;
    const h = '#' + S.page;
    if ((location.hash || '') !== h) {
      history.replaceState(null, '', location.pathname + (location.search || '') + h);
    }
  } catch (_) {}
}

function persistUiState() {
  try {
    if (!S.token) return;
    _storageSet(UI_STATE_KEYS.page, S.page);
    _storageSet(UI_STATE_KEYS.date, S.date);
    if (S.page === 'turno' && S.turnoId != null && S.turnoId !== '') {
      _storageSet(UI_STATE_KEYS.turnoId, String(S.turnoId));
    } else {
      _storageSet(UI_STATE_KEYS.turnoId, null);
    }
    if (S.calYM) _storageSet(UI_STATE_KEYS.calYM, S.calYM);
    else _storageSet(UI_STATE_KEYS.calYM, null);
    if (S.page === 'turno' && S.turnoTab && ALLOWED_TURNO_TABS.includes(S.turnoTab)) {
      _storageSet(UI_STATE_KEYS.turnoTab, S.turnoTab);
    }
    syncUrlHashToPage();
  } catch (_) {}
}

function clearSessionUiState() {
  try {
    Object.values(UI_STATE_KEYS).forEach((k) => {
      try {
        localStorage.removeItem(k);
      } catch (_) {}
      try {
        sessionStorage.removeItem(k);
      } catch (_) {}
    });
    if (typeof history !== 'undefined' && history.replaceState) {
      history.replaceState(null, '', location.pathname + (location.search || ''));
    }
  } catch (_) {}
}

/** Destaca a linha de stock em edição (foco nos inputs Encontrado/Deixado). */
(function stockRowHighlightInit() {
  function clearStockRowHighlight() {
    document.querySelectorAll('#tab-stock tr.stock-row--active').forEach((r) => r.classList.remove('stock-row--active'));
  }
  document.addEventListener(
    'focusin',
    function (ev) {
      const t = ev.target;
      if (!t || !t.matches || !t.matches('#tab-stock input[data-stock-pid]')) return;
      clearStockRowHighlight();
      const tr = t.closest('tr.stock-row');
      if (tr) tr.classList.add('stock-row--active');
    },
    true
  );
  document.addEventListener(
    'focusout',
    function (ev) {
      const t = ev.target;
      if (!t || !t.matches || !t.matches('#tab-stock input[data-stock-pid]')) return;
      const tr = t.closest('tr.stock-row');
      requestAnimationFrame(() => {
        const ae = document.activeElement;
        if (ae && tr && tr.contains(ae)) return;
        clearStockRowHighlight();
      });
    },
    true
  );
})();

// ── API ───────────────────────────────────────────────────────
const API = '/api';

/** Mensagens cruas do Postgres na UI de login (API antiga ou cache de HTML sem sanitizeLoginErr). */
function sanitizeAuthLoginResponseErro(raw) {
  const m = String(raw || '').toLowerCase();
  if (
    m.includes('must be owner') ||
    m.includes('owner of table') ||
    m.includes('42501') ||
    (m.includes('utilizadores') && (m.includes('owner') || m.includes('permission'))) ||
    m.includes('postgresql')
  ) {
    return 'Não foi possível autenticar. Usa o email completo (ex.: admin@stockos.ao). Confirma o deploy na Vercel e GRANT em public.utilizadores para o user da DATABASE_URL.';
  }
  return raw;
}

async function api(method, path, body) {
  const opts = {
    method,
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${S.token}` },
    cache: 'no-store'
  };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  let data = {};
  try {
    data = await r.json();
  } catch (_) {}
  const msg = String(data.erro || '').trim();
  if (r.status === 401 && msg === 'Não autenticado') {
    doLogout();
    throw new Error('Sessão expirou. Entra de novo.');
  }
  if (!r.ok) {
    const raw = data.erro || 'Erro';
    const out = path.includes('/auth/login') ? sanitizeAuthLoginResponseErro(raw) : raw;
    throw new Error(typeof out === 'string' ? out : 'Erro');
  }
  return data;
}

// ── HELPERS ───────────────────────────────────────────────────
function fmt(v) {
  const n = parseFloat(v) || 0;
  return n.toLocaleString('pt-AO') + ' Kz';
}
function fmtNum(v) {
  const n = parseFloat(v) || 0;
  return n.toLocaleString('pt-AO', { maximumFractionDigits: 2 });
}
/** Formato compacto para pills em espaços apertados (1k, 19.4k, 1.2M). Sem unidade. */
function fmtCompact(v) {
  const n = Math.abs(parseFloat(v) || 0);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1).replace('.', ',') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace('.', ',').replace(/,0$/, '') + 'k';
  return String(Math.round(n));
}
/**
 * Quantidade/número a partir de string (API PostgreSQL ou texto).
 * Com vírgula → pt-AO (1.234,5). Sem vírgula → ponto é decimal ("16.000" = 16, não 16000).
 */
function parsePtOrIsoNumberString(s) {
  const t = String(s ?? '').trim().replace(/[\s\u00a0\u202f\u2007]/g, '');
  if (t === '' || t === '-') return NaN;
  if (t.includes(',')) {
    const x = parseFloat(t.replace(/\./g, '').replace(',', '.'));
    return Number.isFinite(x) ? x : NaN;
  }
  const x = parseFloat(t);
  return Number.isFinite(x) ? x : NaN;
}

/** Quantidade em inputs/células: vazio só sem valor; zero mostra sempre «0» (sem toLocaleString — evita casos raros de string vazia). */
function fmtQtyInput(v) {
  if (v === '' || v === null || v === undefined) return '';
  const n = typeof v === 'number' && Number.isFinite(v) ? v : parsePtOrIsoNumberString(String(v));
  if (!Number.isFinite(n)) return '';
  if (Math.abs(n) < 1e-12) return '0';
  return fmtNum(n);
}
/** Valor em Kz para totais da caixa: vazio quando zero; «—» quando indefinido (totais incompletos). */
function fmtKzOrEmpty(v) {
  if (typeof v === 'number' && !Number.isFinite(v)) return '—';

function precoVendaCopos(copos, precoUnit, qtdPacote, precoPacote) {
  const c = Math.max(0, Math.floor(parseFloat(copos) || 0));
  const u = parseFloat(precoUnit) || 0;
  const n = parseInt(qtdPacote, 10) || 0;

/** Horário oficial por turno (referência na escala). */
const TURNO_HORARIO = {
  manha: '07:00 – 16:00',
  tarde: '15:00 – 00:00',
  noite: '23:00 – 08:00'
};
/** Minutos desde meia-noite (início oficial); mesmo critério que a API — Luanda. */
const TURNO_INICIO_MINUTES = { manha: 7 * 60, tarde: 15 * 60, noite: 23 * 60 };
const TZ_STOCKOS = 'Africa/Luanda';
/** Garante YYYY-MM-DD com zeros — evita comparar "2026-04-06" com "2026-4-6" (ordem lexicográfica errada). */
function normalizeIsoDateStr(s) {
  const m = String(s || '').trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return '';
  return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
}
function luandaTodayStr() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ_STOCKOS, year: 'numeric', month: '2-digit', day: '2-digit' });
  const parts = fmt.formatToParts(new Date());
  const y = parts.find((p) => p.type === 'year').value;
  const mo = parts.find((p) => p.type === 'month').value;
  const da = parts.find((p) => p.type === 'day').value;
  return `${y}-${mo}-${da}`;
}
function luandaMinutesNow() {
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: TZ_STOCKOS, hour: '2-digit', minute: '2-digit', hour12: false });
  const parts = fmt.formatToParts(new Date());
  const h = parseInt(parts.find((p) => p.type === 'hour').value, 10);
  const m = parseInt(parts.find((p) => p.type === 'minute').value, 10);
  return h * 60 + m;
}
/** { ok, msg? } — bloqueia data futura e, no dia de hoje, antes do horário de início do turno. */
function podeAbrirTurnoAgora(dataIso, nome) {
  const day = normalizeIsoDateStr(String(dataIso || '').slice(0, 10));
  if (!day) return { ok: false, msg: 'Data inválida.' };
  const today = normalizeIsoDateStr(luandaTodayStr());
  if (day > today) return { ok: false, msg: 'Não é possível abrir turno para uma data futura.' };
  if (day < today) return { ok: true };
  const start = TURNO_INICIO_MINUTES[nome];
  if (start === undefined) return { ok: true };
  if (luandaMinutesNow() < start) {
    const hh = Math.floor(start / 60);
    const mm = start % 60;
    return {
      ok: false,
      msg: `Só é possível abrir ${turnoLabel(nome)} após ${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')} (Angola).`
    };
  }
  return { ok: true };
}
/** Hoje (Luanda) e ainda antes do início oficial — registo «aberto» não devia existir (abertura antecipada). */
function turnoAbertoAntesDoHorarioOficial(dataIso, nome) {
  const day = normalizeIsoDateStr(String(dataIso || '').slice(0, 10));
  const today = normalizeIsoDateStr(luandaTodayStr());
  if (day !== today) return false;
  const start = TURNO_INICIO_MINUTES[nome];
  if (start === undefined) return false;
  return luandaMinutesNow() < start;
}
function turnoHorarioLabel(nome) {

function dateLabel(d) {
  if (d == null || d === '') return '—';
  const raw = String(d).trim();
  const dayPart = raw.includes('T') ? raw.split('T')[0] : raw.slice(0, 10);
  const [y, m, dd] = dayPart.split('-');
  if (!y || !m || !dd) return raw;
  return `${dd}/${m}/${y}`;
}
/** Nome do dia da semana (pt-AO), ex.: terça-feira */
function weekdayLabel(d) {
  if (d == null || d === '') return '';
  const raw = String(d).trim();
  const dayPart = raw.includes('T') ? raw.split('T')[0] : raw.slice(0, 10);
  const [y, mo, dd] = dayPart.split('-');
  if (!y || !mo || !dd) return '';
  const dt = new Date(parseInt(y, 10), parseInt(mo, 10) - 1, parseInt(dd, 10));
  if (isNaN(dt.getTime())) return '';
  const w = dt.toLocaleDateString('pt-AO', { weekday: 'long' });
  return w.charAt(0).toUpperCase() + w.slice(1);
}
/** Data DD/MM/AAAA · dia da semana */
function dateLabelWithWeekday(d) {
  const dl = dateLabel(d);
  const wd = weekdayLabel(d);
  return wd ? `${dl} · ${wd}` : dl;
}
/** Data e hora local (DD/MM/AAAA HH:mm:ss) a partir de ISO ou timestamp. */
function dateTimeLabel(d) {
  if (d == null || d === '') return '—';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return dateLabel(d);
  const datePart = dt.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  const timePart = dt.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  return `${datePart} ${timePart}`;
}
function addDays(d, n) {
  const dt = new Date(d + 'T12:00:00Z');

  return dt.toISOString().split('T')[0];
}
/** Segunda-feira (ISO YYYY-MM-DD) da semana que contém dateStr. */
function mondayOfWeekIso(dateStr) {
  const dt = new Date(dateStr + 'T12:00:00Z');
  const day = dt.getUTCDay();
  const daysBack = day === 0 ? 6 : day - 1;
  dt.setUTCDate(dt.getUTCDate() - daysBack);
  return dt.toISOString().split('T')[0];
}

/**
 * Evita duplo clique: desactiva o controlo e mostra «A processar…» até a Promise terminar.
 * No onclick usar: runAction(event, () => minhaFuncAsync()).
 */
async function runAction(ev, work) {
  if (typeof work !== 'function') return;
  let ctrl = ev && ev.currentTarget;
  if (ctrl && ctrl.closest) ctrl = ctrl.closest('button, .turno-card, .js-busy-click') || ctrl;
  if (!ctrl || (ctrl.tagName !== 'BUTTON' && !ctrl.classList?.contains('turno-card') && !ctrl.classList?.contains('js-busy-click'))) {
    await work(ev);
    return;
  }
  if (ctrl.dataset.actionBusy === '1') return;
  ctrl.dataset.actionBusy = '1';
  let savedHtml = null;
  let restore = () => {};
  let wasDisabled = false;
  try {
    if (ctrl.tagName === 'BUTTON') {
      wasDisabled = ctrl.disabled;
      ctrl.disabled = true;
      const isNav = ctrl.classList.contains('nav-btn');
      const inDateNav = ctrl.closest && ctrl.closest('.date-nav');
      if (isNav || inDateNav) {
        ctrl.classList.add('is-action-busy');
        const prevOp = ctrl.style.opacity;
        ctrl.style.opacity = '0.55';
        restore = () => {
          ctrl.style.opacity = prevOp;
          ctrl.classList.remove('is-action-busy');
        };
      } else {
        savedHtml = ctrl.innerHTML;
        ctrl.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;flex-shrink:0"></span><span>A processar…</span>';
        restore = () => { if (savedHtml != null) ctrl.innerHTML = savedHtml; };
      }
    } else if (ctrl.classList.contains('turno-card') || ctrl.classList.contains('js-busy-click')) {
      ctrl.classList.add('is-action-busy');
      const pe = ctrl.style.pointerEvents;
      const op = ctrl.style.opacity;
      ctrl.style.pointerEvents = 'none';
      ctrl.style.opacity = '0.72';
      restore = () => {
        ctrl.style.pointerEvents = pe;
        ctrl.style.opacity = op;
        ctrl.classList.remove('is-action-busy');
      };
    }
    await work(ev);
  } finally {
    ctrl.dataset.actionBusy = '0';
    if (ctrl.tagName === 'BUTTON') ctrl.disabled = wasDisabled;
    restore();
  }
}

// ── ROUTER ────────────────────────────────────────────────────
async function navigate(page, params) {
  S.page = page;
  if (params) Object.assign(S, params);
  if (page !== 'turno') S.turnoId = null;
  if (document.body.classList.contains('menu-open')) toggleMenuDrawer(false);
  await draw();
}

async function draw() {
  document.body.classList.toggle('has-auth', !!S.token);
  if (!S.token) { document.body.classList.remove('menu-open'); drawLogin(); return; }
  if (S.user?.role === 'compras' && !['dia', 'turno', 'armazem', 'produtos', 'fornecedores', 'depositos', 'calendario', 'irregularidades', 'assiduidade', 'equipa', 'presenca', 'perfil', 'faltas'].includes(S.page)) {
    S.page = 'dia';
  }
  if (S.page === 'admin' && S.user?.role !== 'admin') {
    S.page = 'dia';
  }
  if (S.page === 'escala' && !(S.user?.role === 'admin' || S.user?.role === 'gestor')) {
    S.page = 'dia';
  }
  try {
    switch (S.page) {
      case 'dia':      await drawDia(); break;
      case 'calendario': await drawCalendario(); break;
      case 'depositos':
        if (!['admin', 'gestor', 'compras'].includes(S.user?.role)) { await navigate('dia'); return; }
        await drawDepositos();
        break;
      case 'turno':
        if (!S.turnoId) { S.page = 'dia'; await drawDia(); break; }
        await drawTurno();
        break;
      case 'historico':
        if (S.user?.role === 'compras') {
          await navigate('dia');
          break;
        }
        await drawHistorico();
        break;
      case 'irregularidades':
        await drawIrregularidades();
        break;
      case 'assiduidade':
        if (!['admin','gestor','compras'].includes(S.user?.role)) { await navigate('dia'); return; }
        await drawAssiduidade();
        break;
      case 'auditoria':
        if (!['admin','gestor'].includes(S.user?.role)) { await navigate('dia'); return; }
        await drawAuditoria();
        break;
      case 'armazem':  await drawArmazem(); break;
      case 'fornecedores':
        if (!['admin', 'gestor', 'compras'].includes(S.user?.role)) { await navigate('dia'); return; }
        await drawFornecedores();
        break;
      case 'produtos': await drawProdutos(); break;
      case 'escala':   await drawEscala(); break;
      case 'admin':    await drawAdmin(); break;
      case 'equipa':   await drawEquipa(); break;
      case 'presenca': await drawPresenca(); break;
      case 'perfil':   await drawPerfil(); break;
      case 'faltas':   await drawFaltas(); break;
      default:         await drawDia();
    }
  } finally {
    if (S.token) persistUiState();
  }
}

function drawLogin() {
  render(`
    <div id="login-screen">
      <div class="login-box">
        <div class="login-logo">StockOS</div>
        <div class="login-sub">Sistema de gestão de turnos</div>
        <div id="login-msg"></div>
        <div class="field">
          <label>Nome de utilizador</label>
          <input id="l-login" type="text" placeholder="ex.: admin" autocomplete="username" autocapitalize="off"/>
        </div>
        <div class="field">
          <label>Senha</label>
          <input id="l-pass" type="password" placeholder="••••••" autocomplete="current-password"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="runAction(event, doLogin)">Entrar</button>
        <button class="btn btn-ghost btn-full" style="margin-top:8px;font-size:13px;color:#94a3b8" onclick="openPresencaModal()">📷 Registo de Presença</button>
      </div>
    </div>
  `);
  const enterLogin = e => {
    if (e.key === 'Enter')
      runAction({ currentTarget: document.querySelector('#login-screen .btn-primary') }, doLogin);
  };
  document.getElementById('l-login').addEventListener('keydown', enterLogin);
  document.getElementById('l-pass').addEventListener('keydown', enterLogin);
}

function sanitizeLoginErr(msg) {
  return sanitizeAuthLoginResponseErro(msg);
}

async function doLogin() {
  const login = val('l-login'), password = val('l-pass');
  try {
    const data = await api('POST', '/auth/login', { login, password });
    S.token = data.token; S.user = data.user;
    localStorage.setItem('token', S.token);
    localStorage.setItem('user', JSON.stringify(S.user));
    // Não await: navigate → drawDia → loadDia espera dbReady no servidor (cold start longo);
    // se await, o botão «Entrar» fica em «A processar…» até a BD terminar o init.
    navigate('dia').catch((e) =>
      err('login-msg', sanitizeLoginErr(e && e.message != null ? e.message : String(e)))
    );
    refreshFaltasBadge();
  } catch (e) { err('login-msg', sanitizeLoginErr(e && e.message != null ? e.message : String(e))); }
}

function doLogout() {
  S.token = null; S.user = null;
  localStorage.removeItem('token'); localStorage.removeItem('user');
  clearSessionUiState();
  drawLogin();
}

  entries.push({ page: 'equipa', label: 'Equipa',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>' });
  entries.push({ page: 'presenca', label: 'Presença',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>' });
  entries.push({ page: 'perfil', label: 'Perfil',
      svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' });
  return entries;
}

function toggleMenuDrawer(open) {
  const willOpen = typeof open === 'boolean' ? open : !document.body.classList.contains('menu-open');
  document.body.classList.toggle('menu-open', willOpen);
  const drawer = document.getElementById('menu-drawer');
  if (drawer) drawer.setAttribute('aria-hidden', willOpen ? 'false' : 'true');
  if (willOpen) renderMenuDrawer();
}

function menuDrawerNavigate(page) {
  if (page === 'perfil') S.perfilUid = null; // ver o próprio perfil
  toggleMenuDrawer(false);
  navigate(page);
}

function menuDrawerLogout() {
  toggleMenuDrawer(false);
  doLogout();
}

function renderMenuDrawer() {
  const cont = document.getElementById('menu-drawer-items');
  const userEl = document.getElementById('menu-drawer-user');
  if (!cont) return;
  if (!S.token || !S.user) {
    cont.innerHTML = '';
    if (userEl) userEl.textContent = '';
    return;
  }
  const nome = S.user?.nome || '';
  const role = S.user?.role ? String(S.user.role).toUpperCase() : '';
  if (userEl) userEl.textContent = nome ? `${nome}${role ? ` · ${role}` : ''}` : (role || '');
  const items = menuEntries().map((e) => {
    const n = (typeof e.badge === 'function') ? (parseInt(e.badge(), 10) || 0) : 0;
    const badge = n > 0 ? ` <span style="display:inline-block;min-width:18px;padding:1px 6px;border-radius:9px;background:#dc2626;color:#fff;font-size:11px;font-weight:700;margin-left:auto">${n > 99 ? '99+' : n}</span>` : '';
    return `
    <button type="button" class="menu-item${S.page === e.page ? ' active' : ''}" onclick="menuDrawerNavigate('${e.page}')">
      ${e.svg}<span style="flex:1">${e.label}</span>${badge}
    </button>`;
  }).join('');
  cont.innerHTML = `${items}
    <button type="button" class="menu-item menu-item-logout" onclick="menuDrawerLogout()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      <span>Sair</span>
    </button>`;
}

// ── PÁGINA DIA ────────────────────────────────────────────────
async function drawDia() {
  render(`
    <div id="header">
      <div>
        <div id="header-h1" style="font-size:18px;font-weight:700;color:#f1f5f9">StockOS</div>
        <div class="header-sub">${S.user?.nome}${S.user?.username ? ` · @${S.user.username}` : ''}</div>
      </div>
    </div>
    <div id="content">
      <div class="date-nav">
        <button type="button" onclick="runAction(event, () => changeDate(-1))">‹</button>
        <span style="position:relative;cursor:pointer">
          <span id="date-label" style="text-decoration:underline dotted #475569">${dateLabelWithWeekday(S.date)}</span>
          <input type="date" id="date-picker" value="${S.date}" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer" onchange="pickDate(this.value)">
        </span>
        <button type="button" onclick="runAction(event, () => changeDate(1))">›</button>
      </div>
      <div id="dia-content"><div class="text-center" style="padding:40px;color:#64748b"><div class="spinner"></div></div></div>
    </div>
    ${navBar()}
  `);
  await loadDia();
}

function syncDatePickersAcrossPages() {
  const dl = document.getElementById('date-label');
  if (dl) dl.textContent = dateLabelWithWeekday(S.date);
  const dp = document.getElementById('date-picker');
  if (dp) dp.value = S.date;
  const armSub = document.getElementById('armazem-registo-dia');
  if (armSub) armSub.textContent = 'Registo diário · ' + dateLabelWithWeekday(S.date);
}

async function changeDate(n) {
  S.date = addDays(S.date, n);
  syncDatePickersAcrossPages();
  if (S.page === 'depositos') await loadDepositos();
  else if (S.page === 'armazem') {
    await refreshArmazemFundos();
    await loadArmazemData();
  } else await loadDia();
  persistUiState();
}
async function pickDate(val) {
  if (!val) return;
  S.date = val;
  syncDatePickersAcrossPages();
  if (S.page === 'depositos') await loadDepositos();
  else if (S.page === 'armazem') {
    await refreshArmazemFundos();
    await loadArmazemData();
  } else await loadDia();
  persistUiState();
}

async function reloadDepositsView() {
  if (S.page === 'depositos') await loadDepositos();
  else await loadDia();
}

function renderDepositosSection(turnos, depositos, depositosErro) {
  const depositosByTurno = {};
  (depositos || []).forEach(d => {
    if (d.turno_id != null) depositosByTurno[String(d.turno_id)] = d;
  });
  const sumDinheiro = (depositos || []).reduce((s, d) => s + (parseFloat(d.valor) || 0), 0);
  const totalSaidasNoDeposito = (depositos || []).reduce((s, d) => s + (parseFloat(d.valor_saidas) || 0), 0);
  const totalDepositos = Math.max(0, sumDinheiro - totalSaidasNoDeposito);
  const totalTpaRegistado = (depositos || []).reduce((s, d) => s + (parseFloat(d.valor_tpa) || 0), 0);
  const totalTransferenciasRegistado = (depositos || []).reduce((s, d) => s + (parseFloat(d.valor_transferencia) || 0), 0);
  let destinoSaidasComum = '';
  for (const d of depositos || []) {
    if ((parseFloat(d.valor_saidas) || 0) > 0 && String(d.saidas_destino || '').trim()) {
      destinoSaidasComum = String(d.saidas_destino || '').trim();
      break;
    }
  }
  let borderoDiaUrl = '';
  for (const t of [...turnos].sort((a, b) => (({ manha: 1, tarde: 2, noite: 3 }[a.nome]) || 9) - (({ manha: 1, tarde: 2, noite: 3 }[b.nome]) || 9))) {
    const d = depositosByTurno[String(t.id)];
    if (d && String(d.bordero_foto_url || '').trim()) {
      borderoDiaUrl = String(d.bordero_foto_url).trim();
      break;
    }
  }
  const ordemTurno = { manha: 1, tarde: 2, noite: 3 };
  const turnosOrdenados = [...turnos].sort((a, b) => (ordemTurno[a.nome] || 9) - (ordemTurno[b.nome] || 9));
  const hoje = new Date().toISOString().split('T')[0];
  return `
      <div class="card" id="sec-depositos">
        <div class="card-title">🏦 Depósitos no banco</div>
        <p style="font-size:13px;color:#94a3b8;margin:0 0 10px">Por turno: <strong>Dinheiro</strong>, <strong>Transferência</strong> e <strong>TPA</strong> (cada um deve bater com o caixa do turno). As <strong>saídas no depósito</strong> são valores retirados do dinheiro depositado para <strong>compras de stock / armazém</strong> (não são outras despesas genéricas). Esse montante e a <strong>foto do borderô</strong> são <strong>únicos</strong> para todo o registo do dia. <strong>Referência</strong>, <strong>notas</strong> e <strong>data</strong> são comuns.</p>
        ${depositosErro ? `<div class="alert alert-error" style="margin-bottom:10px">Não foi possível carregar os depósitos: ${depositosErro}</div>` : ''}
        ${!turnos.length ? `<div class="alert alert-error" style="margin-bottom:10px">Não há turnos neste dia — abre turnos antes de registar depósitos.</div>` : ''}
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px">
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px 16px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Líquido em dinheiro</div>
            <div style="font-size:26px;font-weight:700;color:#4ade80;line-height:1.15">${fmt(totalDepositos)}</div>
            <div style="font-size:11px;color:#64748b;margin-top:6px">dinheiro − compras de armazém</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px 16px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Transferências</div>
            <div style="font-size:20px;font-weight:700;color:#e2e8f0;line-height:1.15">${fmt(totalTransferenciasRegistado)}</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px 16px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">TPA registado</div>
            <div style="font-size:20px;font-weight:700;color:#e2e8f0;line-height:1.15">${fmt(totalTpaRegistado)}</div>
          </div>
          <div style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px 16px;text-align:center">
            <div style="font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">Saídas p/ armazém</div>
            <div style="font-size:20px;font-weight:700;color:#f87171;line-height:1.15">${fmt(totalSaidasNoDeposito)}</div>
            ${destinoSaidasComum ? `<div style="font-size:11px;color:#cbd5e1;margin-top:6px;line-height:1.35"><span style="color:#94a3b8">Compra:</span> ${escapeHtml(destinoSaidasComum)}</div>` : ''}
          </div>
        </div>
        <div style="margin-bottom:14px;padding:10px 14px;background:rgba(34,197,94,0.07);border:1px solid rgba(34,197,94,0.22);border-radius:8px;font-size:13px;color:#cbd5e1">
          Pré-visualização <strong>líquido em dinheiro depositado</strong> (dinheiro − compras de armazém): <span id="dep-total-preview" style="color:#4ade80;font-weight:700;font-size:17px">${fmt(0)}</span>
        </div>
        ${(() => {
          let dataDepComum = hoje;
          for (const t of turnosOrdenados) {
            const d = depositosByTurno[String(t.id)];
            if (d && d.data_deposito) {
              dataDepComum = String(d.data_deposito).slice(0, 10);
              break;
            }
          }
          const temTurnoFechado = turnosOrdenados.some(t => t.estado === 'fechado');
          let refComum = '';
          let notasComum = '';
          for (const t of turnosOrdenados) {
            const d = depositosByTurno[String(t.id)];
            if (!d) continue;
            if (!refComum && String(d.referencia || '').trim()) refComum = String(d.referencia);
            if (!notasComum && String(d.notas || '').trim()) notasComum = String(d.notas);
          }
          const saidasUnicaVal = (depositos || []).length ? String(totalSaidasNoDeposito) : '';
          return `
        ${turnosOrdenados.map(t => {
          const dep = depositosByTurno[String(t.id)];
          const pode = t.estado === 'fechado';
          const dinId = `dep-dinheiro-${t.id}`;
          const trfId = `dep-transf-${t.id}`;

          const caixaTransf = parseFloat(t.caixa?.transferencia) || 0;
          const caixaDin = parseFloat(t.caixa?.dinheiro) || 0;
          const caixaBruto = caixaTpa + caixaTransf + caixaDin;
          const dinNum = dep ? (parseFloat(dep.valor) || 0) : 0;
          const dinVal = dep ? String(dinNum) : '';
          const trfVal = dep && dep.valor_transferencia != null && dep.valor_transferencia !== ''
            ? String(parseFloat(dep.valor_transferencia) || 0)
            : (dep ? '0' : String(caixaTransf));
          const tpaVal = dep && dep.valor_tpa != null && dep.valor_tpa !== ''

            </div>
            ${pode ? `<div style="font-size:11px;color:#94a3b8;margin-bottom:8px;padding:6px 8px;background:#0f172a;border:1px solid #1e293b;border-radius:6px;line-height:1.5">

              TPA <strong style="color:#86efac">${fmt(caixaTpa)}</strong> ·
              <span style="color:#64748b">Total</span> <strong style="color:#cbd5e1">${fmt(caixaBruto)}</strong>
            </div>` : ''}
            ${!pode ? `<div class="alert alert-error" style="margin-bottom:8px;padding:8px;font-size:12px">Fecha este turno para incluir no registo.</div>` : ''}
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
              <div class="field">
                <label>Dinheiro (Kz) <span style="font-size:10px;color:#64748b;font-weight:400">(esperado: ${fmt(caixaDin)})</span></label>
                <input id="${dinId}" type="number" min="0" step="any" placeholder="0" value="${dinVal.replace(/"/g, '&quot;')}" data-caixa-din="${caixaDin}" oninput="validateDepCaixa(${t.id});updateDepPreviewTotal()" ${!pode ? 'disabled' : ''}/>
                <div id="${dinId}-diff" style="font-size:11px;margin-top:4px;min-height:14px"></div>
              </div>
              <div class="field">
                <label>Transferência (Kz) <span style="font-size:10px;color:#64748b;font-weight:400">(esperado: ${fmt(caixaTransf)})</span></label>
                <input id="${trfId}" type="number" min="0" step="any" placeholder="0" value="${trfVal.replace(/"/g, '&quot;')}" data-caixa-transf="${caixaTransf}" oninput="validateDepCaixa(${t.id});updateDepPreviewTotal()" ${!pode ? 'disabled' : ''}/>

              </div>
              <div class="field">

                <input id="${tpaId}" type="number" min="0" step="any" placeholder="0" value="${tpaVal.replace(/"/g, '&quot;')}" data-caixa-tpa="${caixaTpa}" oninput="validateDepCaixa(${t.id});updateDepPreviewTotal()" ${!pode ? 'disabled' : ''}/>
                <div id="${tpaId}-diff" style="font-size:11px;margin-top:4px;min-height:14px"></div>
              </div>
            </div>
          </div>`;
        }).join('')}
        <div class="field" style="margin-top:8px">

          <input id="dep-saidas-dia" type="number" min="0" step="any" placeholder="0" value="${saidasUnicaVal.replace(/"/g, '&quot;')}" oninput="updateDepSaidasDestinoRequired();updateDepPreviewTotal()" ${!temTurnoFechado ? 'disabled' : ''}/>

/** Escala da semana na página Dia: grelha dias × turnos (só leitura; chips como referência visual). */
function htmlEscalaSemanaReadonly(rowsWeek, rowsTemplate, anchorDateStr) {
  const week = Array.isArray(rowsWeek) ? rowsWeek : [];
  const tpl = Array.isArray(rowsTemplate) ? rowsTemplate : [];
  const mon = mondayOfWeekIso(anchorDateStr);
  const dom = addDays(mon, 6);
  const turnos = [
    { nome: 'manha', label: 'Manhã', horario: turnoHorarioLabel('manha'), cls: 'dia-escala-shift--manha' },
    { nome: 'tarde', label: 'Tarde', horario: turnoHorarioLabel('tarde'), cls: 'dia-escala-shift--tarde' },
    { nome: 'noite', label: 'Noite', horario: turnoHorarioLabel('noite'), cls: 'dia-escala-shift--noite' }
  ];
  function listaCell(dayIdx, turnoNome) {
    const dateStr = addDays(mon, dayIdx);
    const listaDia = week.filter(r => escalaRowDataStr(r) === dateStr && r.turno === turnoNome);
    const listaTpl = tpl.filter(r => Number(r.dia_semana) === dayIdx && r.turno === turnoNome);
    return listaDia.length ? listaDia : listaTpl;
  }
  function chipsHtml(lista) {
    if (!lista.length) return '<span class="dia-escala-empty">—</span>';
    return lista.map(r => {
      const tipParts = [];
      if (r.utilizador_role) tipParts.push(String(r.utilizador_role).toUpperCase());
      const a = r.area_trabalho != null && r.area_trabalho !== '' ? parseInt(r.area_trabalho, 10) : NaN;
      if (Number.isFinite(a) && a >= 1 && a <= 3) tipParts.push(`Área ${areaTrabalhoAbbr(a)}: ${areaTrabalhoLabel(a)}`);
      if (r.notas) tipParts.push(String(r.notas));
      const tip = tipParts.join(' · ');
      const abbr = Number.isFinite(a) && a >= 1 && a <= 3 ? ` <span class="dia-escala-area-badge">${areaTrabalhoAbbr(a)}</span>` : '';
      return `<span class="dia-escala-chip" ${tip ? `title="${escapeHtml(tip)}"` : ''}>${escapeHtml(r.utilizador_nome || 'Sem nome')}${abbr}</span>`;
    }).join('');
  }
  const parts = ['<div class="dia-escala-corner"></div>'];
  for (let i = 0; i < 7; i++) {
    const dateStr = addDays(mon, i);
    const anchor = dateStr === anchorDateStr;
    parts.push(`<div class="dia-escala-colhead${anchor ? ' dia-escala-colhead--anchor' : ''}">${ESCALA_DIA_ABREV[i]}<span class="dia-escala-colhead-date">${dateLabel(dateStr)}</span></div>`);
  }
  for (const t of turnos) {
    parts.push(`<div class="dia-escala-rowhead ${t.cls}"><span>${t.label}</span><span class="dia-escala-rowhead-time">${t.horario}</span></div>`);
    for (let i = 0; i < 7; i++) {
      const dateStr = addDays(mon, i);
      const anchor = dateStr === anchorDateStr;
      const lista = listaCell(i, t.nome);
      parts.push(`<div class="dia-escala-cell${anchor ? ' dia-escala-cell--anchor' : ''}"><div class="dia-escala-chips">${chipsHtml(lista)}</div></div>`);
    }
  }
  return `
    <div class="card" id="dia-escala-readonly">
      <div class="card-title">👥 Escala da semana</div>
      <p class="dia-escala-intro">Semana de <strong style="color:#cbd5e1">${dateLabel(mon)}</strong> a <strong style="color:#cbd5e1">${dateLabel(dom)}</strong>. Apenas consulta. Onde não há escala para a data, usa-se o modelo semanal. Coluna realçada: dia seleccionado. <strong style="color:#94a3b8">Horários:</strong> Manhã ${turnoHorarioLabel('manha')} · Tarde ${turnoHorarioLabel('tarde')} · Noite ${turnoHorarioLabel('noite')}.</p>
      <div class="dia-escala-scroll">
        <div class="dia-escala-grid">
          ${parts.join('')}
        </div>
      </div>
    </div>`;
}

async function loadDia() {

    const turnos = await api('GET', `/dia?data=${S.date}&resumo=1`);

    turnos.forEach(t => { turnoMap[t.nome] = t; });

      const t = turnoMap[nome];

        const pr = podeAbrirTurnoAgora(S.date, nome);
        if (!pr.ok) {
          return `
          <div class="turno-card turno-card--locked">
            <div class="turno-card-nome">${turnoLabel(nome)}</div>

        return `
          <div class="turno-card" onclick="runAction(event, () => abrirTurno('${nome}'))">
            <div class="turno-card-nome">${turnoLabel(nome)}</div>
            <div class="badge badge-grey" style="margin-bottom:8px">Não iniciado</div>
            <div class="turno-card-abrir">
              <button class="btn btn-primary btn-sm btn-full">Abrir Turno</button>
            </div>
          </div>`;
      }
      const totalVendas = t.total_vendas || 0;
      const totalCaixa  = t.caixa?.total_final || 0;
      const cls = t.estado === 'aberto' ? 'aberto' : 'fechado';
      const antecipado = t.estado === 'aberto' && turnoAbertoAntesDoHorarioOficial(S.date, nome);
      const startM = TURNO_INICIO_MINUTES[nome];
      const hi = startM != null ? `${String(Math.floor(startM / 60)).padStart(2, '0')}:${String(startM % 60).padStart(2, '0')}` : '';
      const badge = t.estado === 'aberto'
        ? (antecipado

          : '<span class="badge badge-green">Aberto</span>')
        : '<span class="badge badge-grey">Fechado</span>';

        ? `<div style="font-size:11px;color:#fb923c;margin-top:6px;line-height:1.35">Início oficial ${hi}. Fecha o turno e volta a abrir após essa hora se for erro.</div>`
        : '';
      return `
        <div class="turno-card ${cls}${antecipado ? ' turno-card--antecipado' : ''}" onclick="runAction(event, () => navigate('turno',{turnoId:'${t.id}'}))">
          <div class="turno-card-nome">${turnoLabel(nome)}</div>
          <div class="turno-card-status">${badge}</div>
          <div class="turno-card-value">${fmt(totalCaixa)}</div>
          <div class="turno-card-label">Total Caixa</div>
          <div style="font-size:12px;color:#64748b;margin-top:4px">Vendas: ${fmt(totalVendas)}</div>
          ${avisoAnt}
        </div>`;
    }).join('');

    const pendentesLoading = `<div id="dia-pendentes-slot" class="card"><div class="text-center" style="padding:28px;color:#64748b"><div class="spinner"></div><div style="margin-top:10px;font-size:12px">A carregar avisos…</div></div></div>`;

    show('dia-content', `
      <div class="turno-cards">${cards}</div>
      ${pendentesLoading}
    `);

    api('GET', '/faltas?status=pendentes')
      .catch(() => [])
      .then((lista) => {
        if (S.page !== 'dia') return;
        try {
          S.faltasPendentes = (lista || []).length;
          const slot = document.getElementById('dia-pendentes-slot');
          if (slot) slot.outerHTML = htmlPendentesDia(lista || []);
        } catch (err) {
          const slot = document.getElementById('dia-pendentes-slot');
          if (slot) slot.innerHTML = `<div class="alert alert-error" style="margin:12px">${err && err.message ? err.message : String(err)}</div>`;
        }
      }).catch((e) => {
        if (S.page !== 'dia') return;
        const slot = document.getElementById('dia-pendentes-slot');
        if (slot) slot.innerHTML = `<div class="alert alert-error" style="margin:12px">${e.message}</div>`;
      });
  } catch(e) {
    show('dia-content', `<div class="alert alert-error">${e.message}</div>`);
  }
}

function calMonthTitle(ym) {
  const parts = String(ym || '').split('-');
  if (parts.length < 2) return ym;
  const y = parseInt(parts[0], 10);
  const mo = parseInt(parts[1], 10);
  if (!Number.isFinite(y) || !Number.isFinite(mo)) return ym;
  const d = new Date(y, mo - 1, 1);
  const raw = d.toLocaleDateString('pt-AO', { month: 'long', year: 'numeric' });
  return raw.charAt(0).toUpperCase() + raw.slice(1);
}

  if (!Number.isFinite(y) || !Number.isFinite(m)) return;

async function loadCalendarioTurnos() {
  const wrap = document.getElementById('cal-content');
  const lab = document.getElementById('cal-month-label');
  if (lab) lab.textContent = calMonthTitle(S.calYM);
  if (!wrap) return;
  wrap.innerHTML = '<div class="text-center" style="padding:32px;color:#64748b"><div class="spinner"></div></div>';
  try {
    const parts = String(S.calYM || '').split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    const rows = await api('GET', `/calendario-turnos?ano=${y}&mes=${m}`);
    const byDay = {};
    for (const r of rows) {
      const dk = String(r.data).slice(0, 10);
      if (!byDay[dk]) byDay[dk] = {};
      const caixa = (r.caixa_dinheiro || 0) + (r.caixa_transferencia || 0) + (r.caixa_tpa || 0);
      const dep = (r.dep_dinheiro || 0) + (r.dep_transferencia || 0) + (r.dep_tpa || 0);
      const diff = dep - caixa;
      let status = null;
      if (r.estado === 'fechado') {
        if (!r.tem_deposito) status = 'sem';
        else if (Math.abs(diff) < 1) status = 'ok';
        else status = 'diff';
      }
      byDay[dk][r.nome] = { estado: r.estado, id: r.id, status, caixa, dep, diff };
    }
    const pad = (n) => String(n).padStart(2, '0');
    const lastDay = new Date(y, m, 0).getDate();
    const today = new Date().toISOString().split('T')[0];
    const weekHtml = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom']
      .map((w) => `<div class="cal-wd">${w}</div>`)
      .join('');
    const jsDow1 = new Date(y, m - 1, 1).getDay();
    const lead = (jsDow1 + 6) % 7;
    let cells = '';
    let cntOk = 0, cntDiff = 0, cntSem = 0;
    for (let i = 0; i < lead; i++) cells += '<div class="cal-cell cal-cell--empty"></div>';
    for (let d = 1; d <= lastDay; d++) {
      const iso = `${y}-${pad(m)}-${pad(d)}`;
      const map = byDay[iso] || {};
      const isToday = iso === today;
      const pills = ['manha', 'tarde', 'noite'].map((nome) => {
        const t = map[nome];
        const L = nome === 'manha' ? 'M' : nome === 'tarde' ? 'T' : 'N';
        if (!t) return `<span class="cal-pill cal-pill--livre" title="${turnoLabel(nome)}: não iniciado">${L}</span>`;
        const cls = t.estado === 'aberto' ? 'cal-pill--aberto' : 'cal-pill--fechado';
        const st = t.estado === 'aberto' ? 'aberto' : 'fechado';
        return `<span class="cal-pill ${cls}" title="${turnoLabel(nome)}: ${st}">${L}</span>`;
      }).join('');

      const diffPills = ['manha', 'tarde', 'noite'].map((nome) => {
        const t = map[nome];
        if (!t || !t.status) return '';
        const L = nome === 'manha' ? 'M' : nome === 'tarde' ? 'T' : 'N';
        if (t.status === 'ok') {
          cntOk++;
          return `<span class="cal-dep cal-dep--ok" title="${turnoLabel(nome)}: Caixa ${fmt(t.caixa)} = Depósito ${fmt(t.dep)}">${L} ✓</span>`;
        }
        if (t.status === 'sem') {
          cntSem++;
          return `<span class="cal-dep cal-dep--sem" title="${turnoLabel(nome)}: sem depósito (caixa ${fmt(t.caixa)})">${L} ⏳</span>`;
        }
        cntDiff++;
        const sinal = t.diff > 0 ? '+' : '−';
        return `<span class="cal-dep cal-dep--diff" title="${turnoLabel(nome)}: Caixa ${fmt(t.caixa)} vs Depósito ${fmt(t.dep)} (${sinal}${fmt(Math.abs(t.diff))})">${L} ${sinal}${fmtCompact(Math.abs(t.diff))}</span>`;
      }).join('');

      const depRow = diffPills ? `<div class="cal-deps">${diffPills}</div>` : '';

      cells += `
        <div class="cal-cell${isToday ? ' cal-cell--today' : ''}" role="button" tabindex="0"
          onclick="runAction(event, () => goDiaFromCal('${iso}'))"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();runAction(event, () => goDiaFromCal('${iso}'))}">
          <div class="cal-daynum">${d}</div>
          <div class="cal-shifts">${pills}</div>
          ${depRow}
        </div>`;
    }
    const totalLine = (cntOk + cntDiff + cntSem) > 0
      ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding:8px 12px;background:#0f172a;border-radius:8px;border:1px solid #334155;font-size:12px">
          ${cntOk   ? `<span style="color:#86efac"><strong>${cntOk}</strong> turno(s) ✓ batem</span>` : ''}
          ${cntDiff ? `<span style="color:#fb923c"><strong>${cntDiff}</strong> turno(s) ⚠ divergem</span>` : ''}
          ${cntSem  ? `<span style="color:#fcd34d"><strong>${cntSem}</strong> turno(s) ⏳ sem depósito</span>` : ''}
        </div>`
      : '';
    wrap.innerHTML = `
      <div class="card">
        <p class="cal-legend-intro">Cada dia: <strong>M</strong> manhã, <strong>T</strong> tarde, <strong>N</strong> noite.
        <span class="cal-pill cal-pill--livre" style="margin:0 4px">M</span> não iniciado ·
        <span class="cal-pill cal-pill--aberto" style="margin:0 4px">M</span> aberto ·
        <span class="cal-pill cal-pill--fechado" style="margin:0 4px">M</span> fechado.
        Caixa vs Depósito por turno:
        <span class="cal-dep cal-dep--ok" style="display:inline-block;margin:0 4px">M ✓</span> bate ·
        <span class="cal-dep cal-dep--diff" style="display:inline-block;margin:0 4px">M ±diff</span> diverge ·
        <span class="cal-dep cal-dep--sem" style="display:inline-block;margin:0 4px">M ⏳</span> sem depósito.
        Toque num dia para ver a vista <strong>Dia</strong>.</p>
        <div class="cal-grid">${weekHtml}${cells}</div>
        ${totalLine}
      </div>`;
  } catch (e) {
    wrap.innerHTML = `<div class="alert alert-error">${escapeHtml(e.message)}</div>`;
  }
}

/** Valida dinheiro/transf/TPA do depósito contra o caixa registado no turno. */
function validateDepCaixa(turnoId) {
  function fmtDiff(actual, expected) {
    const a = parseFloat(actual) || 0;
    const e = parseFloat(expected) || 0;
    const d = a - e;
    if (Math.abs(d) < 1) return { ok: true, html: a > 0 || e > 0 ? '<span style="color:#4ade80">✓ bate com a caixa</span>' : '' };
    const sinal = d > 0 ? '+' : '−';
    const cor = '#fb923c';
    const msg = d > 0
      ? `<span style="color:${cor}">⚠ ${sinal}${fmt(Math.abs(d))} acima da caixa</span>`
      : `<span style="color:${cor}">⚠ ${sinal}${fmt(Math.abs(d))} abaixo da caixa</span>`;
    return { ok: false, html: msg };
  }
  const trios = [
    { id: `dep-dinheiro-${turnoId}`, attr: 'data-caixa-din' },
    { id: `dep-transf-${turnoId}`,   attr: 'data-caixa-transf' },
    { id: `dep-tpa-${turnoId}`,      attr: 'data-caixa-tpa' }
  ];
  for (const { id, attr } of trios) {
    const inp = document.getElementById(id);
    const diff = document.getElementById(`${id}-diff`);
    if (!inp || !diff) continue;
    const expected = parseFloat(inp.getAttribute(attr)) || 0;
    const r = fmtDiff(inp.value, expected);
    inp.style.borderColor = r.ok ? '' : '#fb923c';
    diff.innerHTML = r.html;
  }
}

function updateDepSaidasDestinoRequired() {
  const inp = document.getElementById('dep-saidas-dia');
  const ta = document.getElementById('dep-saidas-destino-dia');

  if (!inp || !ta || !hint) return;
  const s = parseRaw(inp.value);
  const need = s > 0;
  ta.required = need;
  hint.style.display = need ? 'inline' : 'none';
}

function updateDepPreviewTotal() {
  const el = document.getElementById('dep-total-preview');
  if (!el) return;

  for (const t of (S.turnosDia || [])) {

async function submitDepositosDia() {
  try {
    const dataDep = val('dep-data-dia');
    const refDia = val('dep-ref-dia');
    const notasDia = val('dep-notas-dia');
    const saidasUnica = parseRaw(val('dep-saidas-dia'));
    const destinoSaidas = val('dep-saidas-destino-dia').trim();
    if (saidasUnica < 0) {
      alert('O valor para compras de armazém (saída no depósito) não pode ser negativo.');
      return;
    }
    if (saidasUnica > 0 && !destinoSaidas) {
      alert('Indica o que foi comprado para o armazém / stock (descrição obrigatória quando há valor retirado do depósito).');
      return;
    }
    const rows = [];
    const turnos = S.turnosDia || [];
    for (const t of turnos) {
      if (t.estado !== 'fechado') continue;
      const id = t.id;
      const din = parseRaw(val('dep-dinheiro-' + id));
      const vtransf = parseRaw(val('dep-transf-' + id)) || 0;
      const vtpa = parseRaw(val('dep-tpa-' + id)) || 0;
      if ((!din || din <= 0) && vtransf <= 0 && vtpa <= 0) continue;
      if (Number.isNaN(vtpa) || vtpa < 0) {
        alert('Indica o valor TPA (≥ 0) para ' + turnoLabel(t.nome) + '.');
        return;
      }
      if (Number.isNaN(vtransf) || vtransf < 0) {
        alert('Indica o valor de Transferência (≥ 0) para ' + turnoLabel(t.nome) + '.');
        return;
      }
      rows.push({ turno_id: id, dinheiro: din || 0, valor_transferencia: vtransf, valor_tpa: vtpa });
    }
    if (!rows.length) {
      const temFechado = (S.turnosDia || []).some(t => t.estado === 'fechado');
      alert(
        temFechado
          ? 'Indica valor (Dinheiro, Transferência ou TPA) em pelo menos um turno fechado.'
          : 'Não há turnos fechados neste dia — fecha um turno antes de registar o depósito.'
      );
      return;
    }
    const sumDin = rows.reduce((s, r) => s + r.dinheiro, 0);
    if (saidasUnica > sumDin) {
      alert('O valor para armazém não pode ser maior que a soma do dinheiro (' + fmt(sumDin) + ').');
      return;
    }
    if (sumDin > 0 && sumDin - saidasUnica < 0) {
      alert('O líquido depositado (dinheiro menos compras de armazém) não pode ser negativo.');
      return;
    }
    // Validação caixa vs depósito
    const divergencias = [];
    for (const t of turnos) {
      if (t.estado !== 'fechado') continue;
      const dinInp = document.getElementById('dep-dinheiro-' + t.id);
      const trfInp = document.getElementById('dep-transf-' + t.id);
      const tpaInp = document.getElementById('dep-tpa-' + t.id);
      if (!dinInp || dinInp.disabled) continue;
      const cmp = (inp, attr, lbl) => {
        if (!inp) return;
        const atual = parseRaw(inp.value) || 0;
        const esp = parseFloat(inp.getAttribute(attr)) || 0;
        const d = Math.abs(atual - esp);
        if (d >= 1) divergencias.push(`${turnoLabel(t.nome)}: ${lbl} ${fmt(atual)} ≠ caixa ${fmt(esp)} (diff ${fmt(d)})`);
      };
      cmp(dinInp, 'data-caixa-din', 'Dinheiro');
      cmp(trfInp, 'data-caixa-transf', 'Transferência');
      cmp(tpaInp, 'data-caixa-tpa', 'TPA');
    }
    if (divergencias.length) {
      const ok = confirm('⚠️ Divergências entre o caixa do turno e o depósito:\n\n' + divergencias.join('\n') + '\n\nConfirmar mesmo assim?');
      if (!ok) return;
    }
    const itens = rows.map((r) => ({
      turno_id: r.turno_id,
      data_deposito: dataDep,
      valor_bruto: r.dinheiro,
      valor_transferencia: r.valor_transferencia,
      valor_tpa: r.valor_tpa,
      referencia: refDia,
      notas: notasDia
    }));
    const borderoInp = document.getElementById('dep-bordero-dia');
    let borderoB64 = '';
    if (borderoInp && borderoInp.files && borderoInp.files[0]) {
      borderoB64 = await fileToDataUrl(borderoInp.files[0]);
    }
    const payload = { itens, valor_saidas_total: saidasUnica, saidas_destino: destinoSaidas };
    if (borderoB64) payload.bordero_foto_base64 = borderoB64;
    await api('POST', '/depositos/lote', payload);
    await reloadDepositsView();
  } catch (e) {
    alert(e.message || String(e));
  }
}

async function uploadBorderoDia(inputEl) {
  if (!inputEl || !inputEl.files || !inputEl.files[0]) return;
  inputEl.disabled = true;
  try {

let menuProdIds   = []; // ids dos produtos de menu (inserção manual)

/** Fino Barril só na folha de stock (kg), não na aba Vendas nem nos totais de vendas. */
function isFinoBarrilNome(nome) {
  return String(nome || '').trim().toLowerCase() === 'fino barril';
