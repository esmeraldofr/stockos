/** Campos da ficha do funcionário lidos do formulário. Os campos
 *  FINANCEIROS (salário, IBAN) só existem no DOM para admins — só entram
 *  no payload quando presentes (o servidor também os restringe a admins). */
function fichaFuncionarioBody() {
  const body = {
    telefone: val('u-telefone'),
    bi: val('u-bi'),
    morada: val('u-morada'),
    data_nascimento: val('u-data-nascimento'),
    data_admissao: val('u-data-admissao'),
    contacto_emergencia: val('u-emergencia'),
    notas_funcionario: val('u-notas-func')
  };
  if (document.getElementById('u-salario')) body.salario_base = val('u-salario');
  if (document.getElementById('u-iban')) body.iban = val('u-iban');
  return body;
}

/** Emails placeholder @stockos.local (funcionários sem email) não se mostram. */
function emailVisivel(email) {
  const e = String(email || '');
  return e.endsWith('@stockos.local') ? '' : e;
}

async function createUser() {
  try {
    const passInicial = val('u-pass-inicial');
    if (!passInicial || passInicial.length < 6) {
      err('user-form-msg', 'Define a password inicial (mínimo 6 caracteres) — não existe password padrão.');
      return;
    }
    const body = {nome:val('u-nome'),email:val('u-email'),username:val('u-username'),role:val('u-role'),password:passInicial,loja_id:val('u-loja'),...fichaFuncionarioBody()};
    if (['operador','compras'].includes(body.role) && !body.loja_id) {
      err('user-form-msg', 'Operador e operador de sistema trabalham numa loja fixa — escolhe a loja.');
      return;
    }
    const resp = await apiEscrita('POST','/utilizadores',body, { desc: 'Novo utilizador' });
    show('admin-form','');
    const extras = [resp && resp.aviso_login, resp && resp.aviso].filter(Boolean).map((a) => ' ⚠ ' + a).join('');
    suc('admin-msg', resp && resp._offline
      ? 'Utilizador guardado neste aparelho — a conta é criada quando a rede voltar.'
      : 'Utilizador criado com a password definida.' + extras);
    await loadUtilizadores().catch(() => {});
  } catch(e) { err('user-form-msg',e.message); }
}

async function saveUser(id) {
  try {
    const body = {nome:val('u-nome'),username:val('u-username'),role:val('u-role'),ativo:val('u-ativo')==='true',loja_id:val('u-loja'),...fichaFuncionarioBody()};
    if (['operador','compras'].includes(body.role) && !body.loja_id) {
      err('user-form-msg', 'Operador e operador de sistema trabalham numa loja fixa — escolhe a loja.');
      return;
    }
    const p = val('u-pass');
    if (p) body.password = p;
    const promChk = document.getElementById('u-promotor');
    if (promChk) {
      body.promotor = !!promChk.checked;
      body.comissao_modo = val('u-comissao-modo') || 'produto';
      body.comissao_pct_total = parseFloat(val('u-pct-total')) || 0;
    }
    const resp = await apiEscrita('PUT',`/utilizadores/${id}`,body, { chave: `user:${id}`, desc: 'Actualizar utilizador' });
    show('admin-form','');
    suc('admin-msg', resp && resp._offline
      ? 'Utilizador actualizado neste aparelho — sincroniza quando a rede voltar.'
      : (resp && resp.aviso ? 'Utilizador actualizado. ⚠ ' + resp.aviso : 'Utilizador actualizado!'));
    setTimeout(()=>show('admin-msg',''),4000);
    await loadUtilizadores().catch(() => {});
  } catch(e) { err('user-form-msg',e.message); }
}

async function loadFaltasProdutosSelect() {
  try {
    const produtos = S.produtos && S.produtos.length ? S.produtos : (await api('GET', '/produtos'));
    S.produtos = produtos;
    const dl = document.getElementById('falta-produtos-datalist');
    if (!dl) return;
    // O datalist aceita qualquer texto livre; só os <option> alimentam o autocomplete.
    dl.innerHTML = produtos.filter(p => p.ativo)
      .map(p => `<option value="${escapeHtml(p.nome)}" data-id="${p.id}"></option>`).join('');
    const inp = document.getElementById('falta-produto-nome');
    const hint = document.getElementById('falta-produto-hint');
    if (inp && hint) {
      inp.addEventListener('input', () => {
        const v = inp.value.trim();
        if (!v) { hint.textContent = 'Escolhe da lista ou escreve um nome livre se não estiver registado.'; hint.style.color = '#64748b'; return; }
        const match = (S.produtos || []).find(p => p.ativo && String(p.nome).toLowerCase() === v.toLowerCase());
        if (match) { hint.textContent = '✓ Produto encontrado: ' + match.nome; hint.style.color = '#4ade80'; }
        else { hint.textContent = '✏️ Será reportado como nome livre (não existe na lista)'; hint.style.color = '#fbbf24'; }
      });
    }
  } catch (e) { /* ignora — o input fica sem autocomplete mas continua a aceitar texto livre */ }
}

async function loadFaltas() {
  try {
    const [pend, hist, pessoas] = await Promise.all([
      api('GET', '/faltas?status=pendentes'),
      api('GET', '/faltas?status=resolvidas'),
      api('GET', '/equipa/pessoas').catch(() => [])
    ]);
    S.faltasPessoas = Array.isArray(pessoas) ? pessoas : [];
    S.faltasPendentes = pend.length;
    const titulo = document.getElementById('faltas-pendentes-title');
    if (titulo) titulo.textContent = `Pendentes (${pend.length})`;
    const pCont = document.getElementById('faltas-pendentes');
    if (pCont) pCont.innerHTML = pend.length ? pend.map(faltaRowHtml).join('') :
      '<div style="color:#64748b;font-size:13px;padding:8px 0">Sem avisos pendentes 🎉</div>';
    const hCont = document.getElementById('faltas-historico');
    if (hCont) hCont.innerHTML = hist.length ? hist.map(faltaRowHtml).join('') :
      '<div style="color:#64748b;font-size:13px;padding:8px 0">Sem registos nos últimos 30 dias.</div>';
  } catch (e) { err('faltas-msg', e.message); }
}

function faltaRowHtml(f) {
  const pendente = !f.resolvido_em;
  const quando = new Date(f.reportado_em);
  const dataStr = quando.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' }) + ' ' + quando.toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' });
  const resolvidoStr = !pendente
    ? `<div style="font-size:11px;color:#4ade80;margin-top:2px">✓ Resolvido ${new Date(f.resolvido_em).toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit' })} por ${escapeHtml(f.resolvido_por_nome || '—')}${f.tem_foto ? ` · <a href="javascript:void(0)" onclick="runAction(event, () => verFotoFaltaResolvida(${f.id}))" style="color:#60a5fa">ver foto</a>` : ''}</div>`
    : '';
  const notasStr = f.notas ? `<div style="font-size:12px;color:#94a3b8;margin-top:4px">${escapeHtml(f.notas)}</div>` : '';
  const livreBadge = f.produto_livre ? ' <span style="font-size:10px;padding:1px 6px;border-radius:8px;background:#451a03;color:#fb923c;vertical-align:middle">não listado</span>' : '';
  let atribLine = '';
  if (pendente) {
    const pessoas = S.faltasPessoas || [];
    const opts = ['<option value="">— sem atribuição —</option>']
      .concat(pessoas.map((p) => `<option value="${escapeHtml(String(p.id))}"${String(p.id) === String(f.atribuido_a || '') ? ' selected' : ''}>${escapeHtml(p.nome)}</option>`))
      .join('');
    atribLine = `<div style="font-size:11px;color:#94a3b8;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap"><span>Atribuído a:</span><select onchange="runAction(event, () => atribuirFalta(${f.id}, this.value))" style="font-size:11px;padding:3px 6px;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:6px;max-width:200px">${opts}</select></div>`;
  } else if (f.atribuido_a_nome) {
    atribLine = `<div style="font-size:11px;color:#64748b;margin-top:2px">Era atribuído a ${escapeHtml(f.atribuido_a_nome)}</div>`;
  }
  return `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b">
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;color:${pendente ? '#fbbf24' : '#94a3b8'}">${pendente ? '🚨 ' : '✓ '}${escapeHtml(f.produto_nome || '—')}${livreBadge}</div>
        <div style="font-size:11px;color:#64748b;margin-top:2px">Reportado por ${escapeHtml(f.reportado_por_nome || '—')} · ${dataStr}</div>
        ${notasStr}
        ${atribLine}
        ${resolvidoStr}
      </div>

function getMondayOf(dateStr) {
  const d = new Date(dateStr + 'T12:00:00Z');
  const day = d.getUTCDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setUTCDate(d.getUTCDate() + diff);
  return d.toISOString().split('T')[0];
}

const FACEAPI_CDN = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js';
const MODELS_URL  = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
let faceApiLoaded = false;
let faceApiLoading = false;
let presencaStream = null;
let presencaLoop = null;
let presencaFaceApi = null;
let presencaDescriptors = [];   // [{id, nome, descriptor: Float32Array}]
let presencaLocked = false;     // evita processar frames enquanto animação de confirmação

async function loadFaceApi() {
  if (faceApiLoaded) return presencaFaceApi;
  if (faceApiLoading) { await new Promise(r => setTimeout(r, 200)); return loadFaceApi(); }
  faceApiLoading = true;
  await new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = FACEAPI_CDN;
    s.onload = resolve;
    s.onerror = () => reject(new Error('Falha ao carregar face-api.js'));
    document.head.appendChild(s);
  });
  presencaFaceApi = window.faceapi;
  const fa = presencaFaceApi;
  if (fa.tf?.setBackend) await fa.tf.setBackend('webgl').catch(() => fa.tf.setBackend('cpu').catch(() => {}));
  if (fa.tf?.ready) await fa.tf.ready();
  await Promise.all([
    fa.nets.tinyFaceDetector.loadFromUri(MODELS_URL),
    fa.nets.faceLandmark68Net.loadFromUri(MODELS_URL),
    fa.nets.faceRecognitionNet.loadFromUri(MODELS_URL),
  ]);
  faceApiLoaded = true;
  faceApiLoading = false;
  return fa;
}

      return { id: u.id, nome: u.nome, descriptor: new Float32Array(raw) };
    });
  } catch(e) { console.warn('[presenca] descritores:', e.message); }
}

async function carregarPerfilAssiduidade(targetUid) {

  const inicio = `${y}-${String(m+1).padStart(2,'0')}-01`;
  const fim = `${y}-${String(m+1).padStart(2,'0')}-${String(new Date(y,m+1,0).getDate()).padStart(2,'0')}`;
  const mesLabel = new Date(y, m, 1).toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' });

    const d = await api('GET', `/me/assiduidade?inicio=${inicio}&fim=${fim}${qs}`);

      `<div style="font-size:12px;color:#94a3b8;padding:2px 0">${f.data} · ${f.turno}</div>`

      <div class="card">
        <div class="card-title">📊 Assiduidade — ${mesLabel}</div>
        <div style="display:flex;gap:16px;margin-bottom:12px">
          <div style="flex:1;text-align:center">
            <div style="font-size:28px;font-weight:700;color:${cor}">${taxa}%</div>
            <div style="font-size:11px;color:#64748b">Taxa</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-size:22px;font-weight:700;color:#f1f5f9">${trab}/${esp}</div>
            <div style="font-size:11px;color:#64748b">Turnos</div>
          </div>
          <div style="flex:1;text-align:center">
            <div style="font-size:22px;font-weight:700;color:${faltas>0?'#f87171':'#4ade80'}">${faltas}</div>

async function iniciarPresencaCamera() {
  pararPresencaCamera();
  const statusEl = () => document.getElementById('presenca-status');
  try {
    const fa = await loadFaceApi();
    if (statusEl()) statusEl().textContent = 'A aceder à câmara…';
    presencaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: 640, height: 480 } });
    const video = document.getElementById('presenca-video');
    if (!video) { pararPresencaCamera(); return; }
    video.srcObject = presencaStream;
    await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    const canvas = document.getElementById('presenca-canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    await loadPresencaDescriptors();
    if (statusEl()) statusEl().textContent = presencaDescriptors.length
      ? 'Coloca o rosto em frente à câmara…'
      : '⚠️ Nenhuma face registada. Vai a Admin → Gerir Faces.';
    const opts = new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.3 });
    presencaLoop = setInterval(async () => {
      const v = document.getElementById('presenca-video');
      if (!v || !presencaDescriptors.length || presencaLocked) return;
      const st = statusEl();
      try {
        const det = await fa.detectSingleFace(v, opts).withFaceLandmarks().withFaceDescriptor();
        if (!det) { if (st) st.textContent = 'Coloca o rosto em frente à câmara…'; return; }
        if (st) st.textContent = '🔍 A identificar…';
        const matcher = new fa.FaceMatcher(
          presencaDescriptors.map(u => new fa.LabeledFaceDescriptors(u.id + '|' + u.nome, [u.descriptor])),
          0.6
        );
        const match = matcher.findBestMatch(det.descriptor);
        if (match.label !== 'unknown') {
          const [uid, nome] = match.label.split('|');
          mostrarResultadoPresenca(uid, nome, match.distance);
        } else {
          if (st) st.textContent = '❓ Rosto não reconhecido';
        }
      } catch(e) { if (st) st.textContent = '⚠️ ' + e.message; }
    }, 900);
  } catch(e) {
    if (statusEl()) statusEl().textContent = '⚠️ Câmara não disponível: ' + e.message;
  }
}

function mostrarResultadoPresenca(uid, nome, distancia) {
  presencaLocked = true;
  clearInterval(presencaLoop);
  const result = document.getElementById('presenca-result');
  const statusEl = document.getElementById('presenca-status');
  if (!result) return;
  document.getElementById('p-nome').textContent = nome;
  document.getElementById('p-sub').textContent = `Reconhecido (${Math.round((1 - distancia) * 100)}% confiança)`;
  result.style.display = 'block';
  if (statusEl) statusEl.textContent = '';
  result._uid = uid;
  result._nome = nome;
}

async function registarPresenca(tipo) {
  const result = document.getElementById('presenca-result');
  if (!result) return;
  const uid = result._uid;
  const nome = result._nome;
  try {
    // Fila offline + hora do aparelho: mesmo sem rede a presença fica
    // registada já, com a hora certa — sincroniza sozinha depois.
    const rP = await apiEscrita('POST', '/presencas',
      { utilizador_id: uid, tipo, criado_em_cliente: new Date().toISOString() },
      { desc: `Presença (${tipo}) — ${nome}`, timeoutMs: 5000 });
    const label = tipo === 'entrada' ? '✅ Entrada registada' : '🚪 Saída registada';
    const offNota = rP && rP._offline
      ? '<div style="color:#fdba74;font-size:12px;margin-top:4px">Guardada neste aparelho — sincroniza sozinha</div>'
      : '';
    const confirm = document.getElementById('presenca-confirm');
    result.style.display = 'none';
    if (confirm) {
      confirm.style.display = 'block';
      confirm.innerHTML = `<div style="font-size:20px;font-weight:700;color:#4ade80">${label}</div>
        <div style="color:#94a3b8;margin-top:4px">${nome}</div>
        <div style="color:#475569;font-size:12px;margin-top:4px">${new Date().toLocaleTimeString('pt-PT')}</div>${offNota}`;
    }
    setTimeout(() => retomarPresencaCamera(), 3000);
  } catch(e) {
    alert('Erro: ' + e.message);
    retomarPresencaCamera();
  }
}

function retomarPresencaCamera() {
  presencaLocked = false;
  const result = document.getElementById('presenca-result');
  const confirm = document.getElementById('presenca-confirm');
  const statusEl = document.getElementById('presenca-status');
  if (result) result.style.display = 'none';
  if (confirm) { confirm.style.display = 'none'; confirm.innerHTML = ''; }
  if (statusEl) statusEl.textContent = 'Coloca o rosto em frente à câmara…';
  const fa = presencaFaceApi;
  if (!fa || !presencaStream) return;
  const opts = new fa.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 });
  presencaLoop = setInterval(async () => {
    const v = document.getElementById('presenca-video');
    if (!v || !presencaDescriptors.length || presencaLocked) return;
    try {
      const det = await fa.detectSingleFace(v, opts).withFaceLandmarks().withFaceDescriptor();
      if (!det) return;
      const matcher = new fa.FaceMatcher(
        presencaDescriptors.map(u => new fa.LabeledFaceDescriptors(u.id + '|' + u.nome, [u.descriptor]))
      );
      const match = matcher.findBestMatch(det.descriptor);
      if (match.distance < 0.5) mostrarResultadoPresenca(match.label.split('|')[0], match.label.split('|')[1], match.distance);
    } catch(e) { /* silent */ }
  }, 900);
}

function pararPresencaCamera() {
  clearInterval(presencaLoop);
  if (presencaStream) { presencaStream.getTracks().forEach(t => t.stop()); presencaStream = null; }
  presencaLocked = false;
}

let enrollStream = null;
let enrollCapturing = false;

async function enrollFace(uid, nome) {
  window._enrollNome = nome;
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px';
  modal.innerHTML = `
    <div style="color:#f1f5f9;font-size:18px;font-weight:700">Registar face — ${escapeHtml(nome)}</div>
    <div class="face-enroll-wrap">
      <video id="enroll-video" autoplay muted playsinline></video>
    </div>
    <div id="enroll-status" style="color:#94a3b8;font-size:14px">A carregar câmara…</div>
    <div style="display:flex;gap:12px">
      <button class="btn btn-primary" id="enroll-capture-btn" disabled onclick="captureEnrollFace('${uid}')">📸 Capturar</button>
      <button class="btn btn-ghost" onclick="closeEnrollModal()">Cancelar</button>
    </div>`;
  document.body.appendChild(modal);
  window._enrollModal = modal;
  try {
    const fa = await loadFaceApi();
    enrollStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    const video = document.getElementById('enroll-video');
    video.srcObject = enrollStream;
    await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    document.getElementById('enroll-status').textContent = 'Posiciona o rosto no centro e clica Capturar.';
    document.getElementById('enroll-capture-btn').disabled = false;
  } catch(e) {
    document.getElementById('enroll-status').textContent = 'Erro: ' + e.message;
  }
}

async function captureEnrollFace(uid) {
  if (enrollCapturing) return;
  enrollCapturing = true;
  const statusEl = document.getElementById('enroll-status');
  const btn = document.getElementById('enroll-capture-btn');
  if (btn) btn.disabled = true;
  if (statusEl) statusEl.textContent = 'A processar…';
  try {
    const fa = presencaFaceApi;
    const video = document.getElementById('enroll-video');
    const opts = new fa.TinyFaceDetectorOptions({ inputSize: 416, scoreThreshold: 0.4 });
    const det = await fa.detectSingleFace(video, opts).withFaceLandmarks().withFaceDescriptor();
    if (!det) {
      if (statusEl) statusEl.textContent = '⚠️ Nenhuma face detectada. Ajusta a posição.';
      if (btn) btn.disabled = false;
      enrollCapturing = false;
      return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 320;
    canvas.height = video.videoHeight || 240;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const foto_base64 = await comprimirFotoDataUrl(canvas.toDataURL('image/jpeg', 0.85), 640, 0.8);
    const rFace = await apiEscrita('PUT', `/utilizadores/${uid}/face-descriptor`,
      { descriptor: Array.from(det.descriptor), foto_base64 },
      { chave: `face:${uid}`, desc: `Registar face — ${window._enrollNome || uid}`,
        extra: { nome: window._enrollNome || '' }, timeoutMs: 8000 });
    if (statusEl) statusEl.textContent = rFace && rFace._offline
      ? '✅ Face registada neste aparelho — já funciona na Presença; sincroniza sozinha.'
      : '✅ Face registada com sucesso!';
    setTimeout(() => { closeEnrollModal(); navigate('perfil'); }, 1600);
  } catch(e) {
    if (statusEl) statusEl.textContent = 'Erro: ' + e.message;
    if (btn) btn.disabled = false;
    enrollCapturing = false;
  }
}

async function removeFace(uid) {
  if (!confirm('Remover face registada?')) return;
  try {
    // Registo de face ainda em fila offline → retira-o da fila; a remoção
    // no servidor segue na mesma (o DELETE é idempotente).
    const filaF = escritasOfflineLer();
    if (filaF.some((x) => x.chave === `face:${uid}`)) {
      escritasOfflineGravar(filaF.filter((x) => x.chave !== `face:${uid}`));
    }
    await apiEscrita('DELETE', `/utilizadores/${uid}/face-descriptor`, {},
      { chave: `facedel:${uid}`, desc: 'Remover face registada' });
    navigate('perfil');
  } catch(e) { alert('Erro: ' + e.message); }
}

function closeEnrollModal() {
  if (enrollStream) { enrollStream.getTracks().forEach(t => t.stop()); enrollStream = null; }
  enrollCapturing = false;
  if (window._enrollModal) { window._enrollModal.remove(); window._enrollModal = null; }
}

</script>
</body>
